components:
  schemas:
    CollectiveCommunications.MixOfCollectives.WorkloadIteration.Metrics.Request:
      description: >-
        Request for workload iteration metrics. Contains timing and throughput statistics for each collective
        in each workload iteration.
      type: object
      properties:
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              workload:
                x-field-uid: 2
              operation:
                x-field-uid: 3
              process_group:
                x-field-uid: 4
              data_size_bytes:
                x-field-uid: 5
              collective:
                x-field-uid: 6
              workload_set_iteration:
                x-field-uid: 7
              workload_iteration:
                x-field-uid: 8
              operation_iterations:
                x-field-uid: 9
              min_collective_time_ms:
                x-field-uid: 10
              avg_collective_time_ms:
                x-field-uid: 11
              max_collective_time_ms:
                x-field-uid: 12
              min_algo_bw_gbps:
                x-field-uid: 13
              avg_algo_bw_gbps:
                x-field-uid: 14
              max_algo_bw_gbps:
                x-field-uid: 15
              min_bus_bw_gbps:
                x-field-uid: 16
              avg_bus_bw_gbps:
                x-field-uid: 17
              max_bus_bw_gbps:
                x-field-uid: 18
              min_ideal_percentage:
                x-field-uid: 19
              avg_ideal_percentage:
                x-field-uid: 20
              max_ideal_percentage:
                x-field-uid: 21
              workload_iteration_start_time_ms:
                x-field-uid: 22
              workload_iteration_end_time_ms:
                x-field-uid: 23
              total_time_s:
                x-field-uid: 24
              duty_cycle_percentage:
                x-field-uid: 25
          x-field-uid: 1
    CollectiveCommunications.MixOfCollectives.WorkloadIteration.Metric:
      description: >-
        One row of workload iteration metrics.
      type: object
      properties:
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        workload:
          description: >-
            The name of the workload, within the workload set, that owns this collective.
          type: string
          x-field-uid: 2
        operation:
          description: >-
            The name of the operation aggregated in this row.
          type: string
          x-field-uid: 3
        process_group:
          description: >-
            The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 4
        data_size_bytes:
          description: >-
            Total data size in bytes of the collective across ranks.
          type: integer
          format: uint64
          x-field-uid: 5
        collective:
          description: >-
            The collective algorithm type of the operation aggregated in this row.
          type: string
          x-field-uid: 6
        workload_set_iteration:
          description: >-
            The workload set iteration in which this workload iteration was executed.
          type: integer
          format: uint32
          x-field-uid: 7
        workload_iteration:
          description: >-
            The workload iteration aggregated in this row.
          type: integer
          format: uint32
          x-field-uid: 8
        operation_iterations:
          description: >-
            Number of iterations of the operation within this workload iteration.
          type: integer
          format: uint32
          x-field-uid: 9
        min_collective_time_ms:
          description: >-
            Minimum collective completion time (ms) observed across operation
            iterations of this workload iteration.
          type: number
          x-field-uid: 10
        avg_collective_time_ms:
          description: >-
            Average collective completion time (ms) across operation iterations
            of this workload iteration.
          type: number
          x-field-uid: 11
        max_collective_time_ms:
          description: >-
            Maximum collective completion time (ms) observed across operation
            iterations of this workload iteration.
          type: number
          x-field-uid: 12
        min_algo_bw_gbps:
          description: >-
            Minimum algorithmic bandwidth (GB/s) observed across operation
            iterations of this workload iteration.
          type: number
          x-field-uid: 13
        avg_algo_bw_gbps:
          description: >-
            Average algorithmic bandwidth (GB/s) across operation iterations of
            this workload iteration.
          type: number
          x-field-uid: 14
        max_algo_bw_gbps:
          description: >-
            Maximum algorithmic bandwidth (GB/s) observed across operation
            iterations of this workload iteration.
          type: number
          x-field-uid: 15
        min_bus_bw_gbps:
          description: >-
            Minimum bus bandwidth in GB/s. Equals min_algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 16
        avg_bus_bw_gbps:
          description: >-
            Average bus bandwidth in GB/s. Equals avg_algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 17
        max_bus_bw_gbps:
          description: >-
            Maximum bus bandwidth in GB/s. Equals max_algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 18
        min_ideal_percentage:
          description: >-
            Minimum achieved bus bandwidth as a percentage of the ideal goodput,
            across operation iterations of this workload iteration.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 19
        avg_ideal_percentage:
          description: >-
            Average achieved bus bandwidth as a percentage of the ideal goodput,
            across operation iterations of this workload iteration.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 20
        max_ideal_percentage:
          description: >-
            Maximum achieved bus bandwidth as a percentage of the ideal goodput,
            across operation iterations of this workload iteration.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 21
        workload_iteration_start_time_ms:
          description: >-
            Start time of the workload iteration expressed in ms.
            The time is expressed relative to the moment when test traffic starts
            (the earliest send/receive, which has a time of 0).
          type: number
          x-field-uid: 22
        workload_iteration_end_time_ms:
          description: >-
            End time of the workload iteration expressed in ms.
            The time is expressed relative to the moment when test traffic starts
            (the earliest send/receive, which has a time of 0).
          type: number
          x-field-uid: 23
        total_time_s:
          description: >-
            Wall-clock time (s) the collective was active during this workload
            iteration.
          type: number
          x-field-uid: 24
        duty_cycle_percentage:
          description: >-
            Fraction of workload iteration time the collective was actively
            transferring data (as percentage).
          type: number
          x-field-uid: 25
