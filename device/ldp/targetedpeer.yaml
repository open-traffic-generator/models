components:
  schemas:
    Ldp.TargetedPeer:
      description: >-
        A non-directly connected LDP peer reached by extended discovery:
        targeted Hellos are unicast to the peer address, UDP port 646
        (RFC 5036 Section 2.4.2).
      type: object
      required: [name, ipv4_name, peer_address]
      properties:
        name:
          x-include: ../../common/common.yaml#/components/schemas/Named.Object/properties/name
          x-field-uid: 1
        ipv4_name:
          description: >-
            The globally unique name of the local IPv4 interface or IPv4
            loopback from which targeted Hellos are sent. The LSR ID is derived
            from this address.
          type: string
          x-constraint:
          - '/components/schemas/Device.Ipv4/properties/name'
          - '/components/schemas/Device.Ipv4Loopback/properties/name'
          x-field-uid: 2
        peer_address:
          description: >-
            IPv4 address of the targeted LDP peer.
          type: string
          format: ipv4
          x-field-uid: 3
        initiate_hello:
          description: >-
            When true, this router actively sends targeted Hellos to
            peer_address (T bit set, RFC 5036 Section 3.5.2). When false, the
            peer is expected to initiate.
          type: boolean
          default: true
          x-field-uid: 4
        hello_interval:
          description: >-
            Interval in seconds between targeted Hello messages.
          type: integer
          format: uint32
          default: 15
          minimum: 1
          maximum: 65535
          x-field-uid: 5
        hello_hold_time:
          description: >-
            Hold Time in seconds carried in the Common Hello Parameters TLV
            (RFC 5036 Section 3.5.2). A value of 0 on the wire selects the
            protocol default of 45 seconds for targeted Hellos.
          type: integer
          format: uint32
          default: 45
          minimum: 1
          maximum: 65534
          x-field-uid: 6
        label_space_id:
          description: >-
            See Ldp.Ipv4Interface.label_space_id. Peers sharing an ipv4_name
            must use the same value.
          type: integer
          format: uint32
          default: 0
          maximum: 65535
          x-field-uid: 7
        label_advertisement_mode:
          description: >-
            See Ldp.Ipv4Interface.label_advertisement_mode. Peers sharing an
            ipv4_name must use the same value.
          type: string
          default: downstream_unsolicited
          x-enum:
            downstream_unsolicited:
              x-field-uid: 1
            downstream_on_demand:
              x-field-uid: 2
          x-field-uid: 8
        authentication:
          description: >-
            When present, the session is authenticated. Omit for no
            authentication.
          $ref: './authentication.yaml#/components/schemas/Ldp.Authentication'
          x-field-uid: 9
