components:
  schemas:
    Device.Ldp:
      description: >-
        Configuration for an LDP router (LSR) and its children. Covers LDP over
        IPv4 as per RFC 5036. The LSR ID is derived from the IPv4 address of the
        interface the session runs on (RFC 5036 Section 2.2.2); it is not a
        separate property.
      type: object
      required: [name]
      properties:
        name:
          x-include: ../../common/common.yaml#/components/schemas/Named.Object/properties/name
          x-field-uid: 1
        keepalive_hold_time:
          description: >-
            Keep Alive Time in seconds advertised in the Initialization message
            (RFC 5036 Section 3.5.3). The peer declares the session down if no
            LDP PDU is received within this time. Applies to every session of
            this router.
          type: integer
          format: uint32
          default: 180
          minimum: 1
          maximum: 65535
          x-field-uid: 2
        keepalive_interval:
          description: >-
            Interval in seconds at which KeepAlive messages are sent when no
            other LDP PDU is sent (RFC 5036 Section 3.5.4). Typically one third
            of keepalive_hold_time.
          type: integer
          format: uint32
          default: 60
          minimum: 1
          maximum: 65535
          x-field-uid: 3
        graceful_restart:
          description: >-
            LDP graceful restart as per RFC 3478. When present, the FT Session
            TLV is advertised in the Initialization message. Omit to disable.
          $ref: './gracefulrestart.yaml#/components/schemas/Ldp.GracefulRestart'
          x-field-uid: 4
        ipv4_interfaces:
          description: >-
            IPv4 interfaces on which basic (link) Hellos are exchanged with a
            directly connected LSR (RFC 5036 Section 2.4.1).
          type: array
          items:
            $ref: './interface.yaml#/components/schemas/Ldp.Ipv4Interface'
          x-field-uid: 5
        targeted_peers:
          description: >-
            Non-directly connected LDP peers reached by extended (targeted)
            discovery (RFC 5036 Section 2.4.2). All targeted_peers that share an
            ipv4_name must carry identical label_space_id and
            label_advertisement_mode values; a configuration that violates this
            is rejected.
          type: array
          items:
            $ref: './targetedpeer.yaml#/components/schemas/Ldp.TargetedPeer'
          x-field-uid: 6
        ipv4_fec_ranges:
          description: >-
            IPv4 prefix FECs (FEC element type 2, RFC 5036 Section 3.4.1)
            advertised to all sessions of this router in Label Mapping messages.
          type: array
          items:
            $ref: './fecrange.yaml#/components/schemas/Ldp.Ipv4FecRange'
          x-field-uid: 7
