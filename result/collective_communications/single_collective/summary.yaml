components:
  schemas:
    CollectiveCommunications.SingleCollective.Summary.Metrics.Request:
      description: >-
        Request for summary metrics. Summarizes the completion times and throughput rates per collective datasize.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              data_size:
                x-field-uid: 1
              collective:
                x-field-uid: 2
              iterations:
                x-field-uid: 3
              completion_time:
                x-field-uid: 4
              algo_bw:
                x-field-uid: 5
              bus_bw:
                x-field-uid: 6
              ideal:
                x-field-uid: 7
              pfc_rx:
                x-field-uid: 8
              ecn_ce_rx:
                x-field-uid: 9
              frames_retx:
                x-field-uid: 10
              total_time:
                x-field-uid: 11
              duty_cycle:
                x-field-uid: 12
              total_bytes_tx:
                x-field-uid: 13
              total_bytes_rx:
                x-field-uid: 14
              cnp_tx:
                x-field-uid: 15
              cnp_rx:
                x-field-uid: 16
          x-field-uid: 2
    CollectiveCommunications.SingleCollective.Summary.Metric:
      description: >-
        One row of summary metrics.
      type: object
      properties:
        data_size:
          description: >-
            Collective operation data size (in Bytes).
          type: integer
          format: uint64
          x-field-uid: 2
        collective:
          description: >-
            Collective operation name.
          type: string
          x-field-uid: 3
        iterations:
          description: >-
            Number of benchmark runs per data size.
          type: integer
          format: uint64
          x-field-uid: 4
        completion_time:
          description: >-
            Time to complete collective operation, in milliseconds.
          type: number
          x-field-uid: 5
        algo_bw:
          description: >-
            Algorithm bandwidth, calculated as Collective Size / Time (in 1e9 Bytes/sec).
          type: number
          x-field-uid: 6
        bus_bw:
          description: >-
            Bus bandwidth, calculated as `algo_bw` multiplied by a
            collective-dependent compensation factor (in GB/s).
          type: number
          x-field-uid: 7
        ideal:
          description: >-
            Bus bandwidth divided by ideal goodput (as percentage).
          type: number
          x-field-uid: 8
        pfc_rx:
          description: >-
            Total number of Priority Flow Control frames received.
          type: number
          x-field-uid: 9
        ecn_ce_rx:
          description: >-
            Total number of frames received with ECN congestion encountered.
          type: number
          x-field-uid: 10
        frames_retx:
          description: >-
            Frames Retransmitted count.
          type: number
          x-field-uid: 11
        total_time:
          description: >-
            Time to complete all iterations, in seconds.
          type: number
          x-field-uid: 12
        duty_cycle:
          description: >-
            Ratio of total execution time utilized for actual collective
            operation (as percentage).
          type: number
          x-field-uid: 13
        total_bytes_tx:
          description: >-
            Total number of bytes transmitted.
          type: integer
          format: uint64
          x-field-uid: 14
        total_bytes_rx:
          description: >-
            Total number of bytes received.
          type: integer
          format: uint64
          x-field-uid: 15
        cnp_tx:
          description: >-
            Total number of Congestion Notification Packets transmitted.
          type: number
          x-field-uid: 16
        cnp_rx:
          description: >-
            Total number of Congestion Notification Packets received.
          type: number
          x-field-uid: 17
