components:
  schemas:
    Flow.Icmpv6:
      description: ICMPv6 packet header
      type: object
      properties:
        choice:
          type: string
          default: echo
          x-field-uid: 1
          x-enum:
            echo:
              x-field-uid: 1
            neighbor_solicitation:
              x-field-uid: 2
        echo:
          $ref: '#/components/schemas/Flow.Icmpv6.Echo'
          x-field-uid: 2
        neighbor_solicitation:
          $ref: '#/components/schemas/Flow.Icmpv6.NeighborSolicitation'
          x-field-uid: 3
    Flow.Icmpv6.Echo:
      description: Packet Header for ICMPv6 Echo
      type: object
      properties:
        type:
          x-field-pattern:
            x-constants:
              request: 128
              reply: 129
            description: >-
              ICMPv6 echo type
            format: integer
            length: 8
            default: 128
            features: [count, metric_tags]
          x-field-uid: 1
        code:
          x-field-pattern:
            description: >-
              ICMPv6 echo sub type
            format: integer
            length: 8
            default: 0
            features: [count, metric_tags]
          x-field-uid: 2
        identifier:
          x-field-pattern:
            description: >-
              ICMPv6 echo identifier
            format: integer
            length: 16
            default: 0
            features: [count, metric_tags]
          x-field-uid: 3
        sequence_number:
          x-field-pattern:
            description: >-
              ICMPv6 echo sequence number
            format: integer
            length: 16
            default: 0
            features: [count, metric_tags]
          x-field-uid: 4
        checksum:
          x-include: '#/components/schemas/Flow.Icmpv6.Common/properties/checksum'
          x-field-uid: 5
    Flow.Icmpv6.NeighborSolicitation:
      description: >-
        Packet Header for ICMPv6 NDP Neighbor Solicitation (Type 135, RFC 4861
        Section 4.3). A conforming NS is sent with IPv6 Hop Limit 255 (RFC 4861
        Section 7.1.1).

        RFC requirements described for this header (MUST / MUST NOT) apply to
        a conforming packet. The model does not enforce them, so any value the
        fields can encode may be configured for conformance and negative
        testing.

        The IPv6 and Ethernet destinations are set in their own headers. Use
        these values, where T is target_address and "low 24 bits" are the last
        3 octets of T (RFC 4291 Section 2.7.1, RFC 2464 Section 7):

        Multicast NS (address resolution, duplicate address detection):
          IPv6 dst     = ff02::1:ff + low 24 bits of T
          Ethernet dst = 33:33:ff + low 24 bits of T
          Example: T = 2001:db8::5 gives IPv6 dst ff02::1:ff00:5 and
          Ethernet dst 33:33:ff:00:00:05.

        Unicast NS (neighbor reachability check):
          IPv6 dst     = T
          Ethernet dst = MAC address of the target

        In a conforming duplicate address detection packet the IPv6 source is
        :: and the Source Link-Layer Address option is omitted.
      type: object
      properties:
        type:
          x-field-pattern:
            description: >-
              ICMPv6 message type. Default 135 for Neighbor Solicitation.
            format: integer
            length: 8
            default: 135
            features: [count]
          x-field-uid: 1
        code:
          x-field-pattern:
            description: >-
              ICMPv6 message code. Default 0 for Neighbor Solicitation.
            format: integer
            length: 8
            default: 0
            features: [count]
          x-field-uid: 2
        checksum:
          x-include: '#/components/schemas/Flow.Icmpv6.Common/properties/checksum'
          x-field-uid: 3
        reserved:
          x-field-pattern:
            description: >-
              Reserved (RFC 4861 Section 4.3). Zero in a conforming packet:
              the sender initializes it to zero and the receiver ignores it.
            format: integer
            length: 32
            default: 0
            features: [count]
          x-field-uid: 4
        target_address:
          x-field-pattern:
            description: >-
              The IPv6 address of the target of the solicitation (RFC 4861
              Section 4.3). In a conforming packet it is not a multicast
              address.
            format: ipv6
            default: '::1'
            features: [count]
          x-field-uid: 5
        options:
          description: >-
            Optional list of NDP options (RFC 4861 Section 4.6). In a
            conforming packet (RFC 4861 Section 4.3) the Source Link-Layer
            Address option is omitted when the IPv6 source is the unspecified
            address (DAD), is included in multicast solicitations and should
            be included in unicast solicitations. It is the only option RFC
            4861 defines for Neighbor Solicitation. Other option types, and
            combinations that differ from the above, can be configured for
            conformance and negative testing; a conforming receiver silently
            ignores options not defined for the message (RFC 4861
            Section 4.6).
          type: array
          items:
            $ref: '#/components/schemas/Flow.Icmpv6.NdpOption'
          x-field-uid: 6
    Flow.Icmpv6.NdpOption:
      description: >-
        NDP option (RFC 4861 Section 4.6) carried in NDP messages. The option
        Length is in units of 8 octets including the type and length bytes
        themselves. The option type is not validated against the message it is
        carried in; a conforming receiver silently ignores an option that is
        not defined for the message (RFC 4861 Section 4.6). RFC requirements
        stated for options describe a conforming packet; the model does not
        enforce them, so other values can be configured for conformance and
        negative testing.
      type: object
      properties:
        choice:
          type: string
          default: source_link_layer_address
          x-field-uid: 1
          x-enum:
            source_link_layer_address:
              x-field-uid: 1
            target_link_layer_address:
              x-field-uid: 2
            prefix_information:
              x-field-uid: 3
            redirected_header:
              x-field-uid: 4
            mtu:
              x-field-uid: 5
        source_link_layer_address:
          $ref: '#/components/schemas/Flow.Icmpv6.NdpLinkLayerAddressOption'
          x-field-uid: 2
        target_link_layer_address:
          $ref: '#/components/schemas/Flow.Icmpv6.NdpLinkLayerAddressOption'
          x-field-uid: 3
        prefix_information:
          $ref: '#/components/schemas/Flow.Icmpv6.NdpPrefixInformationOption'
          x-field-uid: 4
        redirected_header:
          $ref: '#/components/schemas/Flow.Icmpv6.NdpRedirectedHeaderOption'
          x-field-uid: 5
        mtu:
          $ref: '#/components/schemas/Flow.Icmpv6.NdpMtuOption'
          x-field-uid: 6
    Flow.Icmpv6.NdpLinkLayerAddressOption:
      description: >-
        NDP Source Link-Layer Address (Type 1) or Target Link-Layer Address
        (Type 2) option (RFC 4861 Section 4.6.1). The option Type byte is
        set from the parent choice.
      type: object
      properties:
        length:
          x-field-pattern:
            description: >-
              Option length in units of 8 octets, including the type and
              length bytes. For a 6-octet Ethernet address this is 1.
            format: integer
            length: 8
            default: 1
            features: [auto, count]
          x-field-uid: 1
        link_layer_address:
          x-field-pattern:
            description: >-
              Link-layer address of the sender (source option) or target
              (target option).
            format: mac
            default: '00:00:00:00:00:01'
            features: [count]
          x-field-uid: 2
    Flow.Icmpv6.NdpPrefixInformationOption:
      description: >-
        NDP Prefix Information option (Type 3). Defined in RFC 4861
        Section 4.6.2 and extended for Mobile IPv6 Home Agent by
        RFC 6275 Section 7.2 (R flag). Provides hosts with on-link
        prefixes and prefixes for address autoconfiguration.
      type: object
      properties:
        length:
          x-field-pattern:
            description: >-
              Option length in units of 8 octets. Fixed at 4 for the
              Prefix Information option.
            format: integer
            length: 8
            default: 4
            features: [auto, count]
          x-field-uid: 1
        prefix_length:
          x-field-pattern:
            description: >-
              Number of leading bits of the Prefix field that are valid.
              Range 0..128.
            format: integer
            length: 8
            default: 0
            features: [count]
          x-field-uid: 2
        l_flag:
          x-field-pattern:
            description: >-
              On-link (L) flag. When set, the prefix can be used for
              on-link determination. RFC 4861 Section 4.6.2.
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 3
        a_flag:
          x-field-pattern:
            description: >-
              Autonomous address-configuration (A) flag. When set, the
              prefix can be used for stateless address autoconfiguration.
              RFC 4861 Section 4.6.2.
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 4
        r_flag:
          x-field-pattern:
            description: >-
              Router address (R) flag. When set, the Prefix field
              contains a complete IP address assigned to the sending
              router. Used by Mobile IPv6 (RFC 6275 Section 7.2).
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 5
        reserved1:
          x-field-pattern:
            description: >-
              Reserved. Must be initialized to zero by the sender.
            format: integer
            length: 5
            default: 0
            features: [count]
          x-field-uid: 6
        valid_lifetime:
          x-field-pattern:
            description: >-
              Length of time in seconds that the prefix is valid for
              on-link determination. A value of 0xffffffff represents
              infinity.
            format: integer
            length: 32
            default: 4294967295
            features: [count]
          x-field-uid: 7
        preferred_lifetime:
          x-field-pattern:
            description: >-
              Length of time in seconds that addresses generated from the
              prefix via stateless address autoconfiguration remain
              preferred. Must be less than or equal to valid_lifetime.
            format: integer
            length: 32
            default: 10
            features: [count]
          x-field-uid: 8
        reserved2:
          x-field-pattern:
            description: >-
              Reserved. Must be initialized to zero by the sender.
            format: integer
            length: 32
            default: 0
            features: [count]
          x-field-uid: 9
        prefix:
          x-field-pattern:
            description: >-
              IP address or prefix of an IP address. The Prefix Length
              field contains the number of valid leading bits.
            format: ipv6
            default: '0::1'
            features: [count]
          x-field-uid: 10
    Flow.Icmpv6.NdpRedirectedHeaderOption:
      description: >-
        NDP Redirected Header option (Type 4). Defined in RFC 4861
        Section 4.6.3. Used in Redirect messages to include as much as
        possible of the IP packet that triggered the Redirect, without
        exceeding the minimum IPv6 MTU.
      type: object
      properties:
        length:
          x-field-pattern:
            description: >-
              Option length in units of 8 octets (RFC 4861 Section 4.6),
              covering the type, length and reserved octets (8 octets in
              total) plus the data. When auto, it is computed as
              ceil((8 + octets of data) / 8) and the data is padded with zero
              octets to a multiple of 8 octets.
            format: integer
            length: 8
            default: 1
            features: [auto, count]
          x-field-uid: 1
        reserved1:
          x-field-pattern:
            description: >-
              Reserved. Must be initialized to zero by the sender.
            format: integer
            length: 16
            default: 0
            features: [count]
          x-field-uid: 2
        reserved2:
          x-field-pattern:
            description: >-
              Reserved. Must be initialized to zero by the sender.
            format: integer
            length: 32
            default: 0
            features: [count]
          x-field-uid: 3
        data:
          description: >-
            Leading part of the original IP packet (IP header + data) that
            triggered the Redirect, truncated so the Redirect message does not
            exceed the minimum IPv6 MTU (RFC 4861 Section 4.6.3). Hex string.
            The option is padded with zero octets to a multiple of 8 octets.
          type: string
          format: hex
          default: '00'
          x-field-uid: 4
    Flow.Icmpv6.NdpMtuOption:
      description: >-
        NDP MTU option (Type 5). Defined in RFC 4861 Section 4.6.4. Used
        in Router Advertisement messages to ensure that all nodes on a
        link use the same MTU value in those cases where the link MTU is
        not well known.
      type: object
      properties:
        length:
          x-field-pattern:
            description: >-
              Option length in units of 8 octets. Fixed at 1 for the
              MTU option.
            format: integer
            length: 8
            default: 1
            features: [auto, count]
          x-field-uid: 1
        reserved:
          x-field-pattern:
            description: >-
              Reserved. Must be initialized to zero by the sender.
            format: integer
            length: 16
            default: 0
            features: [count]
          x-field-uid: 2
        mtu:
          x-field-pattern:
            description: >-
              Recommended MTU for the link, in octets.
            format: integer
            length: 32
            default: 1500
            features: [count]
          x-field-uid: 3
    Flow.Icmpv6.Common:
      description: >-
        Common properties for ICMPv6 packet headers that require checksum
      type: object
      properties:
        checksum:
          x-field-pattern:
            description: >-
              ICMPv6 checksum
            format: checksum
            length: 16
          x-field-uid: 1
