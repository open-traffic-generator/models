components:
  schemas:
    Ospfv2.SegmentRouting:
      description: |-
        Segment Routing (SR) allows for a flexible definition of end-to-end paths within IGP
        topologies by encoding paths as sequences of topological sub-paths, called "segments".
        In OSPFv2 the SR-specific information is advertised using Opaque LSAs. The router level
        Segment Routing capabilities (SR-Algorithm, SID/Label Range (SRGB), SR Local Block (SRLB))
        are carried in the Router Information (RI) Opaque LSA.
        Reference: https://datatracker.ietf.org/doc/html/rfc8665.
        An implementation may advertise the SR capabilities with default values if a user does
        not set any of the properties of Segment Routing.
        A router's own Node (loopback) Prefix-SID is not a separate object here: model the
        loopback as an ordinary device.ospfv2.router.v4_routes entry with an
        Ospfv2SR.PrefixSid attached, and set n_flag on that route range's Extended Prefix flags
        (route_origin.<type>.flags.n_flag) to identify it as the router's own prefix
        (RFC 7684).
      type: object
      properties:
        algorithms:
          description: |-
            The SR-Algorithm TLV, if present, carries one or more Segment Routing Algorithms that
            the router supports when calculating reachability to other nodes or to prefixes
            attached to these nodes.
            - 0: SPF algorithm based on link metric.
            - 1: Strict SPF algorithm based on link metric.
            Reference: https://datatracker.ietf.org/doc/html/rfc8665#name-sr-algorithm-tlv.
            When the originating router does not advertise the SR-Algorithm TLV, it implies that
            algorithm 0 is the only algorithm supported. When advertised, algorithm 0 MUST be
            present while non-zero algorithms MAY be present.
          type: array
          items:
            type: integer
            format: uint32
            default: 0
            maximum: 255
          x-field-uid: 1
        srgb_ranges:
          description: |-
            The list of Segment Routing Global Block (SRGB) ranges advertised in the
            SID/Label Range TLV of the RI Opaque LSA.
            If no SRGB range is configured, an implementation should advertise one SRGB range with
            default values.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2SR.Srgb'
          x-field-uid: 2
        srlb_ranges:
          description: |-
            The list of SR Local Block (SRLB) ranges advertised in the SR Local Block TLV of the
            RI Opaque LSA. The SRLB contains the range of labels the node has reserved for local
            SIDs, for example Adjacency SIDs.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2SR.Srlb'
          x-field-uid: 3

    Ospfv2SR.Srgb:
      description: |-
        This contains the properties of a single Segment Routing Global Block (SRGB) range.
        The SID/Label Range TLV carries the size of the range and a mandatory SID/Label sub-TLV
        that provides the first (base) SID/Label value of the range.
        Reference: https://datatracker.ietf.org/doc/html/rfc8665#name-sidlabel-range-tlv.
      type: object
      properties:
        starting_sid:
          description: >-
            The first value of the SRGB range provided by the SID/Label sub-TLV.
          type: integer
          format: uint32
          minimum: 1
          maximum: 4294967295
          default: 16000
          x-field-uid: 1
        range:
          description: >-
            The Range Size, i.e. the number of SIDs in this SRGB range. MUST be greater than zero.
          type: integer
          format: uint32
          minimum: 1
          maximum: 16777215
          default: 8000
          x-field-uid: 2

    Ospfv2SR.Srlb:
      description: |-
        This contains the properties of a single SR Local Block (SRLB) range.
        The SR Local Block TLV carries the size of the range and a mandatory SID/Label sub-TLV
        that provides the first (base) SID/Label value of the local block.
        Reference: https://datatracker.ietf.org/doc/html/rfc8665#name-sr-local-block-tlv.
      type: object
      properties:
        starting_sid:
          description: >-
            The first value of the SRLB range provided by the SID/Label sub-TLV.
          type: integer
          format: uint32
          minimum: 1
          maximum: 4294967295
          default: 16000
          x-field-uid: 1
        range:
          description: >-
            The Range Size, i.e. the number of SIDs in this SRLB range. MUST be greater than zero.
          type: integer
          format: uint32
          minimum: 1
          maximum: 16777215
          default: 8000
          x-field-uid: 2
