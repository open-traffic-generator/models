components:
  schemas:
    Ospfv2Lsas.State.Request:
      description: >-
        The request to retrieve OSPFv2 Link State Advertisements (LSA) information learned by the
        routers.
      type: object
      properties:
        router_names:
          description: >-
            The names of OSPFv2 routers for which learned information is requested.
            An empty list will return results for all OSPFv2 routers.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Device.Ospfv2Router/properties/name"
          x-field-uid: 1
    Ospfv2Lsa.State:
      description: >-
        The result of OSPFv2 LSA information that are retrieved.
      type: object
      properties:
        router_name:
          description: >-
           The name of the OSPFv2 Router that learned the LSA information.
          type: string
          x-field-uid: 1
        router_lsas:
          description: >-
            One or more OSPFv2 Router-LSA - Type 1.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.RouterLsa'
          x-field-uid: 2
        network_lsas:
          description: >-
            One or more OSPFv2 Network-LSA - Type 2.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.NetworkLsa'
          x-field-uid: 3
        network_summary_lsas:
          description: >-
            One or more OSPFv2 Network summary LSA - Type 3.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.NetworkSummaryLsa'
          x-field-uid: 4
        summary_as_lsas:
          description: >-
            One or more OSPFv2 Autonomous System Boundary Router (ASBR) summary LSA - Type 4.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.SummaryAsLsa'
          x-field-uid: 5
        external_as_lsas:
          description: >-
            OSPFv2 AS-External-LSA - Type 5.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.ExternalAsLsa'
          x-field-uid: 6
        nssa_lsas:
          description: >-
            One or more OSPFv2 NSSA-LSA - Type 7.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.NssaLsa'
          x-field-uid: 7
        opaque_lsas:
          description: >-
            One or more OSPFv2 Opaque LSAs - Type 9, Type 10, or Type 11.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.OpaqueLsa'
          x-field-uid: 8
    Ospfv2.RouterLsa:
      description: >-
        Contents of the router LSA.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        links:
          description: >-
            Links that are described within the LSA.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.Link'
          x-field-uid: 2
    Ospfv2.NetworkLsa:
      description: >-
        Contents of the Network LSA.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        neighbor_router_ids:
          description: >-
            Neighbor router ids that are described within the LSA.
          type: array
          items:
            type: string
            format: ipv4
          x-field-uid: 3

    Ospfv2.NetworkSummaryLsa:
      description: |-
        Contents of the Network Summary LSA - Type 3.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
    Ospfv2.SummaryAsLsa:
      description: >-
        Contents of OSPFv2 Autonomous System Boundary Router (ASBR) summary LSA - Type 4.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
    Ospfv2.ExternalAsLsa:
      description: |-
        Contents of OSPFv2 AS-External-LSA - Type 5.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        metric_type:
          description: >-
            The type of metric associated with the route range.
          type: integer
          format: uint32
          x-field-uid: 4
    Ospfv2.NssaLsa:
      description: |-
        Contents of OSPFv2 NSSA LSA - Type 7.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        metric_type:
          description: >-
            The type of metric associated with the route range.
          type: integer
          format: uint32
          x-field-uid: 4
        forwarding_address:
          description: >-
            IPv4 Forwarding address.
          type: string
          format: ipv4
          x-field-uid: 5
    Ospfv2.OpaqueLsa:
      description: |-
        Contents of OSPFv2 Opaque LSA - Type 9/10/11 (RFC 5250).
        The Link State ID of an Opaque LSA is not a plain IPv4 address; it is split into
        an Opaque Type (most significant octet) and an Opaque ID (remaining three octets),
        decoded here as tlv_information.choice and id (RFC 5250 Section 3). header.lsa_id
        carries the raw, undecoded Link State ID value.
        The Segment Routing and Traffic Engineering information carried by an Opaque LSA is
        reported on this object, in the LSA it was actually advertised in, rather than on the
        Router-LSA, Summary-LSA, AS-External-LSA or NSSA-LSA that describes the router, link
        or prefix it applies to. The decoded contents are reported under tlv_information,
        whose choice names the Opaque Type and selects the contents of that Opaque Type
        directly; every top-level TLV of the LSA that the model does not decode is reported
        raw in unknown_tlvs. Each decoded object documents how to correlate it back to the
        LSA that advertises the router, link or prefix it describes.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        type:
          description: |-
            The flooding scope of the Opaque LSA, determined by the LSA's LS Type
            (RFC 5250 Section 4): local (Type 9, not flooded beyond the local link),
            area (Type 10, flooded throughout the area) or domain (Type 11, flooded
            throughout the Autonomous System, excluding stub areas).
          type: string
          x-field-uid: 2
          x-enum:
            local:
              x-field-uid: 1
            area:
              x-field-uid: 2
            domain:
              x-field-uid: 3
        tlv_information:
          description: |-
            The type of information carried in the body of the Opaque LSA, decoded from the
            Opaque Type in the most significant octet of the LSA's Link State ID
            (RFC 5250 Section 3), together with the decoded contents of that Opaque Type.
          $ref: '#/components/schemas/Ospfv2.OpaqueLsa.TlvInformation'
          x-field-uid: 3
        id:
          description: >-
            The Opaque ID, decoded from the least significant three octets of the LSA's
            Link State ID (RFC 5250 Section 3). Used to further distinguish LSAs of the
            same Opaque Type originated by the same router.
          type: integer
          format: uint32
          minimum: 0
          maximum: 16777215
          x-field-uid: 4
        unknown_tlvs:
          description: |-
            Top-level TLVs carried in the body of the Opaque LSA that are not decoded into
            tlv_information, returned raw in the generic type/length/value TLV format used by
            all OSPFv2 Opaque LSAs (RFC 7770 Section 2, RFC 8665, RFC 9492).
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.OpaqueLsa.Tlv'
          x-field-uid: 5
    Ospfv2.OpaqueLsa.TlvInformation:
      description: |-
        The decoded body of an OSPFv2 Opaque LSA, selected by Opaque Type (RFC 5250
        Section 3, IANA Opaque Link-State Advertisements (LSA) Option Types registry).
        choice names the Opaque Type of the LSA, so reading choice is enough to know what
        to read next. There are three cases:
        1. The Opaque Type has a decoded payload in this model: choice is also the name of
        the field carrying that payload (traffic_engineering, router_information,
        extended_prefixes, extended_links).
        2. The Opaque Type is assigned by IANA but this model does not decode its body
        (sycamore_optical_topology, grace, l1vpn, inter_as_te_v2, ttz, dynamic_flooding,
        extended_inter_area_asbr): choice identifies the type, no decoded payload is
        exposed, and the TLVs of the LSA are reported raw in the parent LSA's unknown_tlvs.
        3. The Opaque Type is not assigned by IANA - value 12 to 127 (unassigned) or 128 to
        255 (reserved for private use, RFC 5250): choice is unknown, the raw Opaque Type
        value is reported in unknown, and the TLVs of the LSA are reported raw in the
        parent LSA's unknown_tlvs.
        unknown_tlvs is not limited to cases 2 and 3: a TLV of a decoded Opaque Type that
        this model does not itself decode is reported there too, which is why it stays on
        the parent LSA rather than inside this object.
      type: object
      properties:
        choice:
          description: >-
            The Opaque Type carried in the most significant octet of the LSA's Link State ID
            (RFC 5250 Section 3).
          type: string
          x-field-uid: 1
          x-enum:
            traffic_engineering:
              description: >-
                Traffic Engineering LSA, Opaque Type 1 (RFC 3630).
              x-field-uid: 1
            sycamore_optical_topology:
              description: >-
                Sycamore Optical Topology Descriptions, Opaque Type 2.
              x-field-uid: 2
            grace:
              description: >-
                grace-LSA, Opaque Type 3 (RFC 3623).
              x-field-uid: 3
            router_information:
              description: >-
                Router Information (RI) Opaque LSA, Opaque Type 4 (RFC 7770).
              x-field-uid: 4
            l1vpn:
              description: >-
                L1VPN LSA, Opaque Type 5 (RFC 5252).
              x-field-uid: 5
            inter_as_te_v2:
              description: >-
                Inter-AS-TE-v2 LSA, Opaque Type 6 (RFC 5392).
              x-field-uid: 6
            extended_prefixes:
              description: >-
                OSPFv2 Extended Prefix Opaque LSA, Opaque Type 7 (RFC 7684).
              x-field-uid: 7
            extended_links:
              description: >-
                OSPFv2 Extended Link Opaque LSA, Opaque Type 8 (RFC 7684).
              x-field-uid: 8
            ttz:
              description: >-
                TTZ LSA, Opaque Type 9 (RFC 8099).
              x-field-uid: 9
            dynamic_flooding:
              description: >-
                OSPFv2 Dynamic Flooding Opaque LSA, Opaque Type 10 (RFC 9667).
              x-field-uid: 10
            extended_inter_area_asbr:
              description: >-
                OSPFv2 Extended Inter-Area ASBR (EIA-ASBR) LSA, Opaque Type 11
                (RFC 9350 Section 10.1).
              x-field-uid: 11
            unknown:
              description: >-
                An Opaque Type that IANA has not assigned: value 12 to 127 (unassigned) or
                128 to 255 (reserved for private use, RFC 5250). The raw value is reported
                in unknown.
              x-field-uid: 12
        traffic_engineering:
          description: |-
            The decoded contents of a Traffic Engineering Opaque LSA
            (RFC 3630 Section 2.4).
          $ref: '#/components/schemas/Ospfv2.OpaqueLsa.TrafficEngineering'
          x-field-uid: 2
        router_information:
          description: |-
            The decoded contents of a Router Information (RI) Opaque LSA
            (RFC 7770 Section 2).
            An RI Opaque LSA is originated per router, so its contents describe the router
            identified by the parent LSA's header.advertising_router_id. Correlate it to the
            Router-LSA of that router by matching
            router_lsas[].header.advertising_router_id.
          $ref: '#/components/schemas/Ospfv2.OpaqueLsa.RouterInformation'
          x-field-uid: 3
        extended_prefixes:
          description: |-
            The decoded OSPFv2 Extended Prefix TLVs of an Extended Prefix Opaque LSA.
            One Extended Prefix Opaque LSA can carry more than one Extended Prefix TLV, each
            describing a different prefix (RFC 7684 Section 2.1).
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.OpaqueLsa.ExtendedPrefix'
          x-field-uid: 4
        extended_links:
          description: |-
            The decoded OSPFv2 Extended Link TLVs of an Extended Link Opaque LSA
            (RFC 7684 Section 3.1).
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.OpaqueLsa.ExtendedLink'
          x-field-uid: 5
        unknown:
          description: |-
            The raw Opaque Type value of an LSA whose Opaque Type IANA has not assigned:
            value 12 to 127 (unassigned) or 128 to 255 (reserved for private use,
            RFC 5250). The body of such an LSA cannot be decoded, so its TLVs are reported
            raw in the parent LSA's unknown_tlvs.
          type: integer
          format: uint32
          maximum: 255
          x-field-uid: 6
    Ospfv2.OpaqueLsa.RouterInformation:
      description: |-
        The decoded Router Information (RI) Opaque LSA contents, Opaque Type 4
        (RFC 7770 Section 2). The RI Opaque LSA is originated once per router, so everything
        reported here describes the router named by the parent LSA's
        header.advertising_router_id.
      type: object
      properties:
        sr_capability:
          description: |-
            The Segment Routing capability of the advertising router, decoded from the
            SR-Algorithm TLV, SID/Label Range (SRGB) TLV and SR Local Block (SRLB) TLV
            (RFC 8665 Sections 3.1, 3.2, 3.3).
          $ref: '#/components/schemas/Ospfv2Lsa.SrCapability'
          x-field-uid: 1
        ri_capabilities:
          description: |-
            The Router Informational and Functional Capabilities of the advertising router,
            decoded from the Router Informational Capabilities TLV and the Router Functional
            Capabilities TLV (RFC 7770 Sections 2.5, 2.6).
          $ref: '#/components/schemas/Ospfv2Lsa.RiCapabilities'
          x-field-uid: 2
        node_msd:
          description: |-
            One or more Maximum SID Depth (MSD) values of the advertising router, decoded from
            the Node MSD TLV (RFC 8476 Section 2).
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2Lsa.Msd'
          x-field-uid: 3
    Ospfv2.OpaqueLsa.TrafficEngineering:
      description: |-
        The decoded Traffic Engineering Opaque LSA contents, Opaque Type 1
        (RFC 3630 Section 2.4). A TE LSA carries a single top-level TLV: either the Router
        Address TLV, reported as router_address, or the Link TLV, reported as link_id plus
        link_attributes.
      type: object
      properties:
        router_address:
          description: |-
            The stable IPv4 address of the advertising router, decoded from the Router Address
            TLV, TLV type 1 (RFC 3630 Section 2.4.1). Present instead of link_id and
            link_attributes when the LSA carries a Router Address TLV.
          type: string
          format: ipv4
          x-field-uid: 1
        link_id:
          description: |-
            The identifier of the link the Link TLV describes, decoded from its Link ID
            sub-TLV, sub-type 2 (RFC 3630 Section 2.5.2): the Router ID of the neighbor for a
            point-to-point link, or the interface address of the Designated Router for a
            multi-access link. Correlate the link attributes to the link they describe by
            matching router_lsas[].links[].id of the Router-LSA whose
            header.advertising_router_id equals that of this Opaque LSA.
          type: string
          format: ipv4
          x-field-uid: 2
        link_attributes:
          description: |-
            The traffic engineering attributes of the link, decoded from the sub-TLVs of the
            Link TLV, TLV type 2 (RFC 3630 Section 2.5).
          $ref: '#/components/schemas/Ospfv2Lsa.LinkTrafficEngineering'
          x-field-uid: 3
    Ospfv2.OpaqueLsa.ExtendedPrefix:
      description: |-
        A decoded OSPFv2 Extended Prefix TLV of an Extended Prefix Opaque LSA, TLV type 1
        (RFC 7684 Section 2.1).
        The TLV names the prefix it applies to in its own body, so no reference to another LSA
        is needed to identify it. Correlate it to the LSA that advertises that prefix by
        matching prefix against router_lsas[].links[].id of a stub link for an intra-area
        prefix, or against header.lsa_id of network_summary_lsas[] for an inter-area prefix,
        external_as_lsas[] for an AS-external prefix or nssa_lsas[] for an NSSA-external
        prefix. RFC 2328 Sections 12.4.3 and 12.4.4 define the Link State ID of a Summary-LSA
        and of an AS-External-LSA as the prefix itself, and RFC 3101 gives the NSSA-LSA the
        same format, so that correlation is a direct value match rather than a new lookup.
      type: object
      properties:
        prefix:
          description: |-
            The IPv4 address prefix the TLV applies to, decoded from the Address Prefix field
            (RFC 7684 Section 2.1).
          type: string
          format: ipv4
          x-field-uid: 1
        prefix_length:
          description: |-
            The length in bits of prefix, decoded from the Prefix Length field
            (RFC 7684 Section 2.1).
          type: integer
          format: uint32
          maximum: 32
          x-field-uid: 2
        prefix_sid:
          description: |-
            The Prefix-SID advertised for this prefix, decoded from the Prefix-SID sub-TLV,
            sub-type 2 (RFC 8665 Section 5).
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSid'
          x-field-uid: 3
    Ospfv2.OpaqueLsa.ExtendedLink:
      description: |-
        A decoded OSPFv2 Extended Link TLV of an Extended Link Opaque LSA, TLV type 1
        (RFC 7684 Section 3.1).
        The TLV repeats the Link Type, Link ID and Link Data of the Router-LSA link it extends,
        so correlate it to that link by matching link_id, and link_data when the same link_id
        is advertised more than once, against router_lsas[].links[] of the Router-LSA whose
        header.advertising_router_id equals that of this Opaque LSA.
      type: object
      properties:
        link_type:
          description: |-
            The type of the link the TLV extends, decoded from the Link Type field
            (RFC 7684 Section 3.1). Carries the same value as the Type field of the
            corresponding Router-LSA link (RFC 2328 Section A.4.2).
          type: string
          x-field-uid: 1
          x-enum:
            point_to_point:
              x-field-uid: 1
            transit:
              x-field-uid: 2
            stub:
              x-field-uid: 3
            virtual:
              x-field-uid: 4
        link_id:
          description: |-
            The identifier of the link the TLV extends, decoded from the Link ID field
            (RFC 7684 Section 3.1).
          type: string
          format: ipv4
          x-field-uid: 2
        link_data:
          description: |-
            The data of the link the TLV extends, decoded from the Link Data field
            (RFC 7684 Section 3.1). Distinguishes two links that share a link_id, such as
            parallel point-to-point links to the same neighbor.
          type: string
          format: ipv4
          x-field-uid: 3
        adjacency_sid:
          description: |-
            The Adjacency-SID advertised for this link, decoded from the Adj-SID sub-TLV,
            sub-type 2, or the LAN Adj-SID sub-TLV, sub-type 3 (RFC 8665 Sections 6.1, 6.2).
          $ref: '#/components/schemas/Ospfv2Lsa.AdjacencySid'
          x-field-uid: 4
        link_attributes:
          description: |-
            The link attributes advertised for this link, decoded from the application-specific
            and legacy link attribute sub-TLVs of the Extended Link TLV (RFC 9492 Section 6).
          $ref: '#/components/schemas/Ospfv2Lsa.LinkTrafficEngineering'
          x-field-uid: 5
    Ospfv2.OpaqueLsa.Tlv:
      description: >-
        A top-level TLV carried in the body of an OSPFv2 Opaque LSA that is not decoded into a
        structured field elsewhere in the model (RFC 7770 Section 2).
      type: object
      properties:
        type:
          description: |-
            The TLV Type field. Its meaning is scoped by the parent LSA's
            tlv_information.choice (IANA OSPFv2 TLV registries).
          type: string
          x-field-uid: 1
          x-enum:
            te_router_address:
              description: >-
                Router Address, TE LSA (tlv_information.choice traffic_engineering) TLV type 1
                (RFC 3630).
              x-field-uid: 1
            te_link:
              description: >-
                Link, TE LSA TLV type 2 (RFC 3630).
              x-field-uid: 2
            te_router_ipv6_address:
              description: >-
                Router IPv6 Address, TE LSA TLV type 3 (RFC 5329).
              x-field-uid: 3
            te_link_local:
              description: >-
                Link Local, TE LSA TLV type 4 (RFC 4203).
              x-field-uid: 4
            te_node_attribute:
              description: >-
                Node Attribute, TE LSA TLV type 5 (RFC 5786).
              x-field-uid: 5
            te_optical_node_property:
              description: >-
                Optical Node Property, TE LSA TLV type 6 (RFC 7688).
              x-field-uid: 6
            ri_te_mesh_group_ipv4:
              description: >-
                TE-MESH-GROUP TLV (IPv4), RI LSA TLV type 3 (RFC 4972).
              x-field-uid: 7
            ri_te_mesh_group_ipv6:
              description: >-
                TE-MESH-GROUP TLV (IPv6), RI LSA TLV type 4 (RFC 4972).
              x-field-uid: 8
            ri_te_node_capability_descriptor:
              description: >-
                TE Node Capability Descriptor, RI LSA TLV type 5 (RFC 5073).
              x-field-uid: 9
            ri_pced:
              description: >-
                PCED, RI LSA TLV type 6 (RFC 5088).
              x-field-uid: 10
            ri_dynamic_hostname:
              description: >-
                OSPF Dynamic Hostname, RI LSA TLV type 7 (RFC 5642).
              x-field-uid: 11
            ri_sr_algorithm:
              description: >-
                SR-Algorithm TLV, RI LSA TLV type 8 (RFC 8665).
              x-field-uid: 12
            ri_sid_label_range:
              description: >-
                SID/Label Range TLV, RI LSA TLV type 9 (RFC 8665).
              x-field-uid: 13
            ri_node_admin_tag:
              description: >-
                Node Admin Tag TLV, RI LSA TLV type 10 (RFC 7777).
              x-field-uid: 14
            ri_sbfd_discriminator:
              description: >-
                S-BFD Discriminator, RI LSA TLV type 11 (RFC 7884).
              x-field-uid: 15
            ri_tunnel_encapsulations:
              description: >-
                Tunnel Encapsulations, RI LSA TLV type 13 (RFC 9013).
              x-field-uid: 16
            ri_sr_local_block:
              description: >-
