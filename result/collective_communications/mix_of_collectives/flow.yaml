components:
  schemas:
    CollectiveCommunications.MixOfCollectives.Flow.Metrics.Request:
      description: >-
        Request for flow metrics. Contains flow size and timing statistics for each queue pair per logical transfer from rank to rank.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              process_group:
                x-field-uid: 2
              collective:
                x-field-uid: 3
              data_size_bytes:
                x-field-uid: 4
              operation_iteration:
                x-field-uid: 5
              data_chunk_transfer_id:
                x-field-uid: 6
              qp_id:
                x-field-uid: 7
              channel_id:
                x-field-uid: 8
              buffer_offset:
                x-field-uid: 9
              chunk_count:
                x-field-uid: 10
              start_ms:
                x-field-uid: 11
              end_ms:
                x-field-uid: 12
              completion_time_ms:
                x-field-uid: 13
              transmit_type:
                x-field-uid: 14
              emulated_tx_component:
                x-field-uid: 15
              flow_size_bytes:
                x-field-uid: 16
              source_rank:
                x-field-uid: 19
              destination_rank:
                x-field-uid: 20
              source_nic:
                x-field-uid: 21
              destination_nic:
                x-field-uid: 22
              workload_set_iteration:
                x-field-uid: 23
              workload_iteration:
                x-field-uid: 24
          x-field-uid: 2
    CollectiveCommunications.MixOfCollectives.Flow.Metric:
      description: >-
        One row of flow metrics.
      type: object
      properties:
        source_rank:
          description: >-
            Source rank of the flow.
          type: integer
          format: uint32
          x-field-uid: 2
        destination_rank:
          description: >-
            Destination rank of the flow.
          type: integer
          format: uint32
          x-field-uid: 3
        source_nic:
          description: >-
            Source NIC.
          type: integer
          format: uint32
          x-field-uid: 4
        destination_nic:
          description: >-
            Destination NIC.
          type: integer
          format: uint32
          x-field-uid: 5
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this flow.
          type: string
          x-field-uid: 6
        process_group:
          description: >-
            The process group whose NPUs executed this flow.
          type: string
          x-field-uid: 7
        collective:
          description: >-
            Collective operation name.
          type: string
          x-field-uid: 8
        data_size_bytes:
          description: >-
            Configured collective data size in Bytes.
          type: integer
          format: uint64
          x-field-uid: 9
        operation_iteration:
          description: >-
            Operation iteration number.
          type: integer
          format: uint32
          x-field-uid: 10
        data_chunk_transfer_id:
          description: >-
            Data Chunk Transfer ID.
          type: integer
          format: uint32
          x-field-uid: 11
        qp_id:
          description: >-
            Destination Queue pair ID.
          type: integer
          format: uint32
          x-field-uid: 12
        channel_id:
          description: >-
            Communication channel ID.
          type: integer
          format: uint32
          x-field-uid: 13
        buffer_offset:
          description: >-
            Buffer offset where the chunk starts.
          type: integer
          format: uint64
          x-field-uid: 14
        chunk_count:
          description: >-
            Number of chunks being transmitted.
          type: integer
          format: uint32
          x-field-uid: 15
        start_ms:
          description: >-
            Start time of the flow expressed in ms.
          type: number
          x-field-uid: 16
        end_ms:
          description: >-
            End time of the flow expressed in ms.
          type: number
          x-field-uid: 17
        completion_time_ms:
          description: >-
            Completion time of the flow expressed in ms.
          type: number
          x-field-uid: 18
        transmit_type:
          description: >-
            Whether via NPU interconnect or NIC network interconnects.
          type: string
          x-field-uid: 19
        emulated_tx_component:
          description: >-
            Emulated infra component source of the flow transfer.
          type: string
          x-field-uid: 20
        flow_size_bytes:
          description: >-
            Flow size in Bytes.
          type: integer
          format: uint64
          x-field-uid: 21
        workload_set_iteration:
          description: >-
            Workload Set iteration number.
          type: integer
          format: uint32
          x-field-uid: 24
        workload_iteration:
          description: >-
            Workload iteration number.
          type: integer
          format: uint32
          x-field-uid: 25
