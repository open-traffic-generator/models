components:
  schemas:
    CollectiveCommunications.MixOfCollectives.OperationIteration.Metrics.Request:
      description: >-
        Request for operation iteration metrics. Contains completion time and throughput details for each operation iteration of each collective datasize.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              process_group:
                x-field-uid: 2
              data_size_bytes:
                x-field-uid: 3
              collective:
                x-field-uid: 4
              workload_set_iteration:
                x-field-uid: 5
              workload_iteration:
                x-field-uid: 6
              operation_iteration:
                x-field-uid: 7
              collective_start_time_ms:
                x-field-uid: 8
              collective_end_time_ms:
                x-field-uid: 9
              collective_completion_time_ms:
                x-field-uid: 10
              algbw_gbps:
                x-field-uid: 11
              busbw_gbps:
                x-field-uid: 12
              ideal_percentage:
                x-field-uid: 13
              min_fct_ms:
                x-field-uid: 14
              p50_fct_ms:
                x-field-uid: 15
              p95_fct_ms:
                x-field-uid: 16
              max_fct_ms:
                x-field-uid: 17
              p99_fct_ms:
                x-field-uid: 18
              p99_99_fct_ms:
                x-field-uid: 19
          x-field-uid: 2
    CollectiveCommunications.MixOfCollectives.OperationIteration.Metric:
      description: >-
        One row of operation iteration metrics.
      type: object
      properties:
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        process_group:
          description: >-
            The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 2
        data_size_bytes:
          description: >-
            The payload size of the collective in bytes.
          type: integer
          format: uint64
          x-field-uid: 3
        collective:
          description: >-
            Identifier of the collective operation executed in this row.
          type: string
          x-field-uid: 4
        workload_set_iteration:
          description: >-
            The workload set iteration in which this operation iteration was
            executed.
          type: integer
          format: uint32
          x-field-uid: 5
        workload_iteration:
          description: >-
            The workload iteration in which this operation iteration was
            executed.
          type: integer
          format: uint32
          x-field-uid: 6
        operation_iteration:
          description: >-
            The operation iteration index within the workload iteration for this
            collective.
          type: integer
          format: uint32
          x-field-uid: 7
        collective_start_time_ms:
          description: >-
            Start time of the collective operation iteration measured in
            milliseconds since the start of execution.
          type: number
          x-field-uid: 8
        collective_end_time_ms:
          description: >-
            End time of the collective operation iteration measured in
            milliseconds since the start of execution.
          type: number
          x-field-uid: 9
        collective_completion_time_ms:
          description: >-
            Completion time of the collective operation iteration (end minus
            start), in ms.
          type: number
          x-field-uid: 10
        algbw_gbps:
          description: >-
            Algorithmic bandwidth (GB/s) achieved during this operation
            iteration.
          type: number
          x-field-uid: 11
        busbw_gbps:
          description: >-
            Bus bandwidth (GB/s) achieved during this operation iteration.
          type: number
          x-field-uid: 12
        ideal_percentage:
          description: >-
            Achieved bus bandwidth as a percentage of the ideal link bandwidth.
          type: number
          x-field-uid: 13
        min_fct_ms:
          description: >-
            Minimum per-flow completion time (ms) observed in this operation
            iteration.
          type: number
          x-field-uid: 14
        p50_fct_ms:
          description: >-
            50th percentile (median) per-flow completion time (ms) in this
            operation iteration.
          type: number
          x-field-uid: 15
        p95_fct_ms:
          description: >-
            95th percentile per-flow completion time (ms) in this operation
            iteration.
          type: number
          x-field-uid: 16
        max_fct_ms:
          description: >-
            Maximum per-flow completion time (ms) observed in this operation
            iteration.
          type: number
          x-field-uid: 17
        p99_fct_ms:
          description: >-
            99th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 18
        p99_99_fct_ms:
          description: >-
            99.99th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 19
