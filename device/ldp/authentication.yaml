components:
  schemas:
    Ldp.Authentication:
      description: >-
        LDP session authentication. When this object is present, the TCP MD5
        Signature Option (RFC 2385) is used on the LDP session TCP connection
        (RFC 5036 Section 2.9). Omit the object to disable authentication.
      type: object
      properties:
        choice:
          description: >-
            The authentication mechanism.
          type: string
          default: md5
          x-enum:
            md5:
              x-field-uid: 1
          x-field-uid: 1
        md5:
          description: >-
            The shared key used to compute the TCP MD5 signature (RFC 2385).
            A key must be set when choice is md5.
          type: string
          minLength: 1
          maxLength: 80
          x-field-uid: 2
