components:
  schemas:
    CollectiveCommunications.State.Request:
      description: >-
        The request to retrieve execution/run states of the configured
        collective benchmark.
      type: object
      required:
        - choice
      properties:
        choice:
          type: string
          description: >-
            Selects which collective benchmark states to retrieve.
          x-enum:
            execution:
              description: >-
                Retrieve the execution/run states of the collective benchmark.
              x-field-uid: 1
          x-field-uid: 1
        execution:
          $ref: '#/components/schemas/CollectiveCommunications.State.Execution'
          description: >-
            Request for the execution/run states of the collective benchmark.
          x-field-uid: 2

    CollectiveCommunications.State:
      description: >-
        The execution/run states of the configured collective benchmark.
      type: object
      required:
        - choice
      properties:
        choice:
          type: string
          description: >-
            Indicates which collective benchmark states are being reported.
          x-enum:
            execution:
              description: >-
                The execution/run states of the collective benchmark.
              x-field-uid: 1
          x-field-uid: 1
        execution:
          $ref: '#/components/schemas/CollectiveCommunications.State.Execution'
          description: >-
            The execution/run states of the collective benchmark.
          x-field-uid: 2

    CollectiveCommunications.State.Execution:
      description: >-
        The execution/run states of the collective benchmark.
      type: object
      required:
        - choice
      properties:
        choice:
          description: |-
            The current lifecycle state of the AI workload's collective benchmark run.
          type: string
          x-field-uid: 1
          x-enum:
            stopped:
              description: >-
                The collective benchmark has been stopped.
              x-field-uid: 1
            started:
              description: >-
                The collective benchmark is running.
              x-field-uid: 2
            stopping:
              description: >-
                The collective benchmark is in the process of stopping.
              x-field-uid: 3
        stopped:
          $ref: '#/components/schemas/CollectiveCommunications.State.Stopped'
          description: >-
            The reason the collective benchmark has been stopped and possibly results of a successful run.
          x-field-uid: 2

    CollectiveCommunications.State.Stopped:
      description: >-
        Status information about why state has stopped
      type: object
      required:
        - choice
      properties:
        choice:
          type: string
          description: >-
            The reason the collective benchmark is in the stopped state.
          x-field-uid: 2
          x-enum:
            unrun:
              description: >-
                The last specified configuration has never been run
              x-field-uid: 1
            success:
              description: >-
                The last collective benchmark execution has been successfully completed
              x-field-uid: 2
            manual:
              description: >-
                The last collective benchmark execution was stopped manually
              x-field-uid: 3
            failure:
              description: >-
                The last collective benchmark execution failed with an error
              x-field-uid: 4
        success:
          $ref: '#/components/schemas/CollectiveCommunications.State.Stopped.Success'
          description: >-
            Status associated with a run that was successful and complete
          x-field-uid: 4
        failure:
          $ref: '#/components/schemas/CollectiveCommunications.State.Stopped.Failure'
          description: >-
            Status associated with a run that failed
          x-field-uid: 6

    CollectiveCommunications.State.Stopped.Success:
      description: >-
        Status associated with a run that was successful and complete
      type: object
      properties:
        warnings:
          x-include: './request.yaml#/components/schemas/Warning/properties/warnings'
          x-field-uid: 1

    CollectiveCommunications.State.Stopped.Failure:
      description: >-
        Status associated with a run that failed
      type: object
      properties:
        code:
          x-include: './request.yaml#/components/schemas/Error/properties/code'
          x-field-uid: 1
        kind:
          x-include: './request.yaml#/components/schemas/Error/properties/kind'
          x-field-uid: 2
        errors:
          x-include: './request.yaml#/components/schemas/Error/properties/errors'
          x-field-uid: 3

