components:
  schemas:
    CollectiveCommunications.WorkloadReplay.Flow.Metrics.Request:
      description: >-
        Request for flow metrics. Contains timing statistics for each logical transfer from rank to rank
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              collective:
                x-field-uid: 3
              data_size:
                x-field-uid: 4
              iteration:
                x-field-uid: 5
              data_chunk_transfer_id:
                x-field-uid: 6
              qp_id:
                x-field-uid: 7
              channel_id:
                x-field-uid: 8
              buffer_offset:
                x-field-uid: 9
              chunk_count:
                x-field-uid: 10
              start_ms:
                x-field-uid: 11
              end_ms:
                x-field-uid: 12
              completion_time_ms:
                x-field-uid: 13
              transmit_type:
                x-field-uid: 14
              emulated_tx_component:
                x-field-uid: 15
              flow_size:
                x-field-uid: 16
              hop_count:
                x-field-uid: 17
              hop_latency_us:
                x-field-uid: 18
              source_rank:
                x-field-uid: 19
              destination_rank:
                x-field-uid: 20
              source_nic:
                x-field-uid: 21
              destination_nic:
                x-field-uid: 22
          x-field-uid: 2
    CollectiveCommunications.WorkloadReplay.Flow.Metric:
      description: >-
        One row of flow metrics.
      type: object
      properties:
        source_rank:
          description: >-
            Source rank of the flow.
          type: integer
          x-field-uid: 2
        destination_rank:
          description: >-
            Destination rank of the flow.
          type: integer
          x-field-uid: 3
        source_nic:
          description: >-
            Source NIC.
          type: integer
          x-field-uid: 4
        destination_nic:
          description: >-
            Destination NIC.
          type: integer
          x-field-uid: 5
        collective:
          description: >-
            Collective operation name.
          type: string
          x-field-uid: 8
        data_size:
          description: >-
            Configured collective data size in Bytes.
          type: integer
          format: uint64
          x-field-uid: 9
        iteration:
          description: >-
            Iteration number.
          type: integer
          x-field-uid: 10
        data_chunk_transfer_id:
          description: >-
            Data Chunk Transfer ID.
          type: integer
          x-field-uid: 11
        qp_id:
          description: >-
            Destination Queue pair ID.
          type: integer
          x-field-uid: 12
        channel_id:
          description: >-
            Communication channel ID.
          type: integer
          x-field-uid: 13
        buffer_offset:
          description: >-
            Buffer offset where the chunk starts.
          type: integer
          x-field-uid: 14
        chunk_count:
          description: >-
            Number of chunks being transmitted.
          type: integer
          x-field-uid: 15
        start_ms:
          description: >-
            Start time of the flow expressed in ms.
          type: number
          x-field-uid: 16
        end_ms:
          description: >-
            End time of the flow expressed in ms.
          type: number
          x-field-uid: 17
        completion_time_ms:
          description: >-
            Completion time of the flow expressed in ms.
          type: number
          x-field-uid: 18
        transmit_type:
          description: >-
            Whether via NPU interconnect or NIC network interconnects.
          type: string
          x-field-uid: 19
        emulated_tx_component:
          description: >-
            Emulated infra component source of the flow transfer.
          type: string
          x-field-uid: 20
        flow_size:
          description: >-
            Flow size in Bytes.
          type: integer
          format: uint64
          x-field-uid: 21
        hop_count:
          description: >-
            Number of network switches the data passes through between the
            source and destination NICs. For example, 1 when both endpoints
            connect to the same switch, or 3 when the path goes through two edge
            switches and a spine switch. Only present when hop latency modeling
            is enabled.
          type: integer
          x-field-uid: 22
        hop_latency_us:
          description: >-
            Extra latency, in microseconds, added to this flow's completion time
            to account for the time spent crossing network switches. It
            increases with `hop_count`; it is 0 only when no switches are
            crossed. Only present when hop latency modeling is enabled.
          type: number
          x-field-uid: 23
