components:
  schemas:
    Ldp.Bindings.State.Request:
      description: >-
        The request to retrieve IPv4 FEC label bindings learned from peers.
      type: object
      properties:
        ldp_router_names:
          description: >-
            The names of LDP routers for which label bindings are requested.
            An empty list returns bindings for all LDP routers.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Device.Ldp/properties/name"
          x-field-uid: 1

    Ldp.Bindings.State:
      description: >-
        The label bindings learned by one LDP router.
      type: object
      properties:
        ldp_router_name:
          description: >-
            The name of the LDP router.
          type: string
          x-field-uid: 1
        ipv4_bindings:
          description: >-
            IPv4 prefix FEC to label bindings learned from peers. An empty
            list means no bindings were learned.
          type: array
          items:
            $ref: '#/components/schemas/Ldp.Ipv4Binding'
          x-field-uid: 2

    Ldp.Ipv4Binding:
      description: >-
        An IPv4 prefix FEC to label binding received in a Label Mapping
        message (RFC 5036 Sections 3.4.1 and 3.5.7).
      type: object
      properties:
        prefix:
          description: >-
            The IPv4 prefix of the FEC (FEC element type 2, RFC 5036
            Section 3.4.1).
          type: string
          format: ipv4
          x-field-uid: 1
        prefix_length:
          description: >-
            The prefix length of the FEC in bits.
          type: integer
          format: uint32
          maximum: 32
          x-field-uid: 2
        label:
          description: >-
            The label bound to the FEC (Generic Label TLV, RFC 5036
            Section 3.4.2).
          type: integer
          format: uint32
          maximum: 1048575
          x-field-uid: 3
