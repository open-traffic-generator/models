openapi: 3.0.3
info:
  title: Control Ultra Ethernet models
  description: >-
    All control state schemas for Ultra Ethernet link layer features.
  version: ^0.0.0
components:
  schemas:
    State.UltraEthernet:
      description: >-
        States associated with Ultra Ethernet link layer features on configured
        resources.
      type: object
      required:
        - choice
      properties:
        choice:
          type: string
          x-enum:
            llr:
              x-field-uid: 1
            cbfc:
              x-field-uid: 2
          x-field-uid: 1
        llr:
          $ref: '#/components/schemas/State.UltraEthernet.Llr'
          x-field-uid: 2
        cbfc:
          $ref: '#/components/schemas/State.UltraEthernet.Cbfc'
          x-field-uid: 3

    State.UltraEthernet.Llr:
      description: >-
        Sets the Link Layer Retry (LLR) mode state of configured Ultra Ethernet
        instances.
      type: object
      required:
        - state
      properties:
        ultra_ethernet_names:
          description: >-
            The names of target Ultra Ethernet instances.
            An empty or null list will target all Ultra Ethernet instances.
          type: array
          items:
            type: string
          x-constraint:
          - '/components/schemas/UltraEthernet/properties/name'
          x-field-uid: 1
        state:
          description: >-
            The LLR mode state to apply.

            - local_enable / local_disable: enable or disable LLR reception
              (llr_mode_local).
            - remote_enable / remote_disable: enable or disable LLR transmission
              (llr_mode_remote).
            - enable_all / disable_all: enable or disable both directions.
          type: string
          x-field-uid: 2
          x-enum:
            local_enable:
              x-field-uid: 1
            local_disable:
              x-field-uid: 2
            remote_enable:
              x-field-uid: 3
            remote_disable:
              x-field-uid: 4
            enable_all:
              x-field-uid: 5
            disable_all:
              x-field-uid: 6

    State.UltraEthernet.Cbfc:
      description: >-
        Sets the Credit-based Flow Control (CBFC) state of configured Ultra Ethernet
        instances.
      type: object
      required:
        - state
      properties:
        ultra_ethernet_names:
          description: >-
            The names of target Ultra Ethernet instances.
            An empty or null list will target all Ultra Ethernet instances.
          type: array
          items:
            type: string
          x-constraint:
          - '/components/schemas/UltraEthernet/properties/name'
          x-field-uid: 1
        state:
          description: >-
            The CBFC state to apply.

            - sender_enable / sender_disable: enable or disable the CBFC sender.
            - receiver_enable / receiver_disable: enable or disable the CBFC receiver.
            - enable_all / disable_all: enable or disable both sender and receiver.
          type: string
          x-field-uid: 2
          x-enum:
            sender_enable:
              x-field-uid: 1
            sender_disable:
              x-field-uid: 2
            receiver_enable:
              x-field-uid: 3
            receiver_disable:
              x-field-uid: 4
            enable_all:
              x-field-uid: 5
            disable_all:
              x-field-uid: 6
