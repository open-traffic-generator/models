components:
  schemas:
    Flow.Igmpv2:
      description: >-
        Packet Header for IGMP version 2 (RFC 2236 Section 2): an 8 octet
        message carried directly in IPv4. A conforming message is sent with IP
        protocol 2, TTL 1, IP precedence Internetwork Control (ToS 0xc0) and
        the IP Router Alert option (RFC 2236 Section 2, RFC 2113).

        RFC requirements described for this header (MUST / MUST NOT) apply to
        a conforming packet. The model does not enforce them, so any value the
        fields can encode may be configured for conformance and negative
        testing.

        The IPv4 and Ethernet destinations are set in their own headers. Use
        these values (RFC 2236 Section 3):

          General Query:        IPv4 dst 224.0.0.1, group_address 0.0.0.0
          Group-Specific Query: IPv4 dst = group, group_address = group
          v2 Membership Report: IPv4 dst = group, group_address = group
          Leave Group:          IPv4 dst 224.0.0.2, group_address = group

        Ethernet dst = 01:00:5e + the low 23 bits of the IPv4 destination
        (RFC 1112 Section 6.4). Example: 224.0.0.1 gives 01:00:5e:00:00:01 and
        239.1.2.3 gives 01:00:5e:01:02:03. Only 23 bits are used, so 239.129.2.3
        maps to the same MAC as 239.1.2.3.
      type: object
      properties:
        type:
          x-field-pattern:
            x-constants:
              membership_query: 17
              v1_membership_report: 18
              v2_membership_report: 22
              leave_group: 23
            description: >-
              IGMP message type (RFC 2236 Section 2.1). Default 17 (0x11) is a
              Membership Query, general or group-specific depending on group_address.
              18 (0x12) is the IGMPv1 Membership Report, accepted by IGMPv2 for
              backward compatibility. 22 (0x16) is the IGMPv2 Membership Report and
              23 (0x17) is Leave Group.
            format: integer
            length: 8
            default: 17
            features: [count]
          x-field-uid: 1
        max_response_time:
          x-field-pattern:
            description: >-
              Maximum response time in units of 1/10 second (RFC 2236 Section 2.2),
              so 100 is 10 seconds and 255 is 25.5 seconds. Meaningful only in
              Membership Query messages. In a conforming Membership Report or
              Leave Group it is set to zero by the sender and ignored by the receiver;
              the default is 100, so set 0 explicitly when building those messages.
            format: integer
            length: 8
            default: 100
            features: [count]
          x-field-uid: 2
        checksum:
          x-field-pattern:
            description: >-
              IGMP checksum (RFC 2236 Section 2.3): the 16-bit one's complement of
              the one's complement sum of the entire IGMP message (the IP payload).
              Unlike ICMPv6 there is no pseudo-header, so it depends only on the
              fields of this header. The generated choice is computed for every
              packet, so the value differs between packets when type, max_response_time
              or group_address vary across the flow; bad is a deliberately incorrect
              value. The custom choice is one fixed value sent in every packet and is
              not updated when other fields vary. An implementation that cannot
              generate the checksum for a configuration should reject it with an
              error rather than send a different value.
            format: checksum
            length: 16
          x-field-uid: 3
        group_address:
          x-field-pattern:
            description: >-
              Group address (RFC 2236 Section 2.4). Zero in a general Membership Query;
              the group being queried in a Group-Specific Query; the group being reported
              or left in a Membership Report or Leave Group. In a conforming packet
              a non-zero value is a multicast group address.
            format: ipv4
            default: 0.0.0.0
            features: [count]
          x-field-uid: 4
