components:
  schemas:
    Ldp.GracefulRestart:
      description: >-
        LDP graceful restart parameters carried in the Fault Tolerant Session
        TLV (RFC 3478 Section 2). Presence of this object enables graceful
        restart.
      type: object
      properties:
        reconnect_time:
          description: >-
            Reconnect Timeout in seconds: the time the sender asks its peer to
            wait for the LDP session to be re-established after a failure
            (RFC 3478 Section 2). The wire value is in milliseconds; the
            implementation converts.
          type: integer
          format: uint32
          default: 60
          maximum: 4294967
          x-field-uid: 1
        recovery_time:
          description: >-
            Recovery Time in seconds: the time the sender retains its MPLS
            forwarding state across a restart (RFC 3478 Section 2). The wire
            value is in milliseconds; the implementation converts. 0 means the
            forwarding state was not preserved.
          type: integer
          format: uint32
          default: 120
          maximum: 4294967
          x-field-uid: 2
