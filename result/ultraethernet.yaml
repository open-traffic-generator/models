openapi: 3.0.3

info:
  title: Ultra Ethernet results models
  version: ^0.0.0

components:
  schemas:
    UltraEthernet.Metrics.Request:
      description: >-
        The request to retrieve Ultra Ethernet (UE) per port metrics/statistics.
        A choice selects which statistics set to retrieve: the port level LLR and
        PHY/CtlOS counters (llr_cbfc_stat), the CBFC sender per virtual channel state
        (sender_vc_stat), or the CBFC receiver per virtual channel state
        (receiver_vc_stat).
      type: object
      properties:
        port_names:
          description: >-
            The names of the ports to return Ultra Ethernet results for.
            An empty list will return results for all ports that have Ultra Ethernet
            configured.
          type: array
          items:
            type: string
          x-constraint:
            - "/components/schemas/Port/properties/name"
          x-field-uid: 1
        choice:
          description: >-
            The statistics set to retrieve.
          type: string
          default: llr_cbfc_stat
          x-field-uid: 2
          x-enum:
            llr_cbfc_stat:
              x-field-uid: 1
            sender_vc_stat:
              x-field-uid: 2
            receiver_vc_stat:
              x-field-uid: 3
        llr_cbfc_stat:
          $ref: '#/components/schemas/UltraEthernet.Metrics.Request.LlrCbfcStat'
          x-field-uid: 3
        sender_vc_stat:
          $ref: '#/components/schemas/UltraEthernet.Metrics.Request.SenderVcStat'
          x-field-uid: 4
        receiver_vc_stat:
          $ref: '#/components/schemas/UltraEthernet.Metrics.Request.ReceiverVcStat'
          x-field-uid: 5

    UltraEthernet.Metrics.Request.LlrCbfcStat:
      description: >-
        Request for the port level LLR and PHY/CtlOS counters.
      type: object
      properties:
        column_names:
          description: >-
            The requested list of column names for the result set.
            If the list is empty then metrics for all columns will be returned.
            The port_name identity column can not be excluded.
          type: array
          items:
            type: string
            x-enum:
              tx_init_ctl_os:
                x-field-uid: 1
              tx_init_echo_ctl_os:
                x-field-uid: 2
              tx_ack_ctl_os:
                x-field-uid: 3
              tx_nack_ctl_os:
                x-field-uid: 4
              tx_discard:
                x-field-uid: 5
              tx_ok:
                x-field-uid: 6
              tx_poisoned:
                x-field-uid: 7
              tx_replay_event:
                x-field-uid: 8
              replayed_packet:
                x-field-uid: 9
              replayed_byte:
                x-field-uid: 10
              tx_seq:
                x-field-uid: 11
              tx_outstanding_seq:
                x-field-uid: 12
              rx_init_ctl_os:
                x-field-uid: 13
              rx_init_echo_ctl_os:
                x-field-uid: 14
              rx_ack_ctl_os:
                x-field-uid: 15
              rx_nack_ctl_os:
                x-field-uid: 16
              rx_ack_nack_seq_error:
                x-field-uid: 17
              rx_ok:
                x-field-uid: 18
              rx_poisoned:
                x-field-uid: 19
              rx_bad:
                x-field-uid: 20
              rx_expected_seq_good:
                x-field-uid: 21
              rx_expected_seq_poisoned:
                x-field-uid: 22
              rx_expected_seq_bad:
                x-field-uid: 23
              rx_missing_seq:
                x-field-uid: 24
              rx_duplicate_seq:
                x-field-uid: 25
              rx_replay:
                x-field-uid: 26
              rx_next_seq:
                x-field-uid: 27
              llr_init_ctl_os_spacing_min:
                x-field-uid: 28
              llr_init_ctl_os_spacing_error:
                x-field-uid: 29
              llr_ack_nack_ctl_os_spacing_min:
                x-field-uid: 30
              llr_ack_nack_ctl_os_spacing_error:
                x-field-uid: 31
              llr_init_echo_init_seq_mismatch:
                x-field-uid: 32
              rx_ack_ctl_os_dropped:
                x-field-uid: 33
              rx_nack_ctl_os_dropped:
                x-field-uid: 34
              rx_init_ctl_os_dropped:
                x-field-uid: 35
              rx_init_echo_ctl_os_dropped:
                x-field-uid: 36
              ue_rx_ctl_os_frame_header_error:
                x-field-uid: 37
              ue_rx_ctl_os_intra_frame_spacing_error:
                x-field-uid: 38
              ue_ctl_os_spacing_min:
                x-field-uid: 39
              ue_ctl_os_spacing_error:
                x-field-uid: 40
              llr_mode_local:
                x-field-uid: 41
              llr_mode_remote:
                x-field-uid: 42
              llr_transmit_state:
                x-field-uid: 43
              llr_ack_nack_transmit_state:
                x-field-uid: 44
              round_trip_time_ns:
                x-field-uid: 45
              round_trip_time_valid:
                x-field-uid: 46
              mean_time_between_phy_errors:
                x-field-uid: 47
          x-field-uid: 1

    UltraEthernet.Metrics.Request.SenderVcStat:
      description: >-
        Request for the CBFC sender per virtual channel state.
      type: object
      properties:
        column_names:
          description: >-
            The requested list of column names for the result set.
            If the list is empty then metrics for all columns will be returned.
            The port_name and vc_id identity columns can not be excluded.
          type: array
          items:
            type: string
            x-enum:
              s_p_cu:
                x-field-uid: 1
              received_cf_update_count:
                x-field-uid: 2
              port_excess_credit_free_error:
                x-field-uid: 3
              vc_state:
                x-field-uid: 4
              excess_credit_free_error:
                x-field-uid: 5
              s_vc_cc:
                x-field-uid: 6
              s_vc_cf:
                x-field-uid: 7
          x-field-uid: 1

    UltraEthernet.Metrics.Request.ReceiverVcStat:
      description: >-
        Request for the CBFC receiver per virtual channel state.
      type: object
      properties:
        column_names:
          description: >-
            The requested list of column names for the result set.
            If the list is empty then metrics for all columns will be returned.
            The port_name and vc_id identity columns can not be excluded.
          type: array
          items:
            type: string
            x-enum:
              port_credit_limit_exceed_error:
                x-field-uid: 1
              vc_state:
                x-field-uid: 2
              credit_limit_exceed_error:
                x-field-uid: 3
              lost_credit_err:
                x-field-uid: 4
              r_vc_cc:
                x-field-uid: 5
              r_vc_cf:
                x-field-uid: 6
          x-field-uid: 1

    UltraEthernet.Metric:
      description: >-
        Ultra Ethernet statistics. A choice of the port level LLR and PHY/CtlOS
        counters (llr_cbfc), the CBFC sender per virtual channel state (sender_vc), or
        the CBFC receiver per virtual channel state (receiver_vc).
      type: object
      properties:
        choice:
          description: >-
            The type of Ultra Ethernet statistics carried by this metric.
          type: string
          default: llr_cbfc
          x-field-uid: 1
          x-enum:
            llr_cbfc:
              x-field-uid: 1
            sender_vc:
              x-field-uid: 2
            receiver_vc:
              x-field-uid: 3
        llr_cbfc:
          $ref: '#/components/schemas/UltraEthernet.LlrCbfc.Metric'
          x-field-uid: 2
        sender_vc:
          $ref: '#/components/schemas/UltraEthernet.SenderVc.Metric'
          x-field-uid: 3
        receiver_vc:
          $ref: '#/components/schemas/UltraEthernet.ReceiverVc.Metric'
          x-field-uid: 4

    UltraEthernet.LlrCbfc.Metric:
      description: >-
        Ultra Ethernet per port LLR and PHY/CtlOS statistics. LLR/PHY counters per
        UE-Specification-1.0.3 Table 5-13.
      type: object
      properties:
        port_name:
          description: >-
            The name of the port.
          type: string
          x-field-uid: 1
        llr_mode_local:
          description: >-
            The current LLR local mode (receive) reported by the device.
          type: string
          x-field-uid: 2
          x-enum:
            "off":
              x-field-uid: 1
            "on":
              x-field-uid: 2
        llr_mode_remote:
          description: >-
            The current LLR remote mode (transmit) reported by the device.
          type: string
          x-field-uid: 3
          x-enum:
            "off":
              x-field-uid: 1
            "on":
              x-field-uid: 2
        llr_transmit_state:
          description: >-
            The current LLR remote transmit state machine value.
          type: string
          x-field-uid: 4
          x-enum:
            "off":
              x-field-uid: 1
            init:
              x-field-uid: 2
            advance:
              x-field-uid: 3
            replay:
              x-field-uid: 4
            flush:
              x-field-uid: 5
        llr_ack_nack_transmit_state:
          description: >-
            The current LLR ACK/NACK transmit state machine value.
          type: string
          x-field-uid: 5
          x-enum:
            "off":
              x-field-uid: 1
            send_acks:
              x-field-uid: 2
            send_nack:
              x-field-uid: 3
            nack_sent:
              x-field-uid: 4
        round_trip_time_ns:
          description: >-
            The measured round trip time, in nanoseconds, of the LLR_INIT control
            ordered set handshake.
          type: integer
          format: uint64
          x-field-uid: 6
        round_trip_time_valid:
          description: >-
            Indicates whether the round_trip_time_ns measurement is currently valid.
          type: boolean
          x-field-uid: 7
        mean_time_between_phy_errors:
          description: >-
            The mean time, in seconds, between PHY errors.
          type: number
          format: double
          x-field-uid: 8
        tx_init_ctl_os:
          description: Number of LLR_INIT control ordered sets transmitted.
          type: integer
          format: uint64
          x-field-uid: 9
        tx_init_echo_ctl_os:
          description: Number of LLR_INIT_ECHO control ordered sets transmitted.
          type: integer
          format: uint64
          x-field-uid: 10
        tx_ack_ctl_os:
          description: Number of LLR_ACK control ordered sets transmitted.
          type: integer
          format: uint64
          x-field-uid: 11
        tx_nack_ctl_os:
          description: Number of LLR_NACK control ordered sets transmitted.
          type: integer
          format: uint64
          x-field-uid: 12
        tx_discard:
          description: >-
            Number of LLR-eligible frames discarded by the LLR transmitter while in
            the INIT or FLUSH state with a discard behavior.
          type: integer
          format: uint64
          x-field-uid: 13
        tx_ok:
          description: Number of LLR-eligible frames transmitted with a good FCS.
          type: integer
          format: uint64
          x-field-uid: 14
        tx_poisoned:
          description: Number of LLR-eligible frames transmitted with a poisoned FCS.
          type: integer
          format: uint64
          x-field-uid: 15
        tx_replay_event:
          description: >-
            Number of times the transmitter completed a replay operation (exited the
            REPLAY state).
          type: integer
          format: uint64
          x-field-uid: 16
        replayed_packet:
          description: Number of LLR-eligible frames replayed.
          type: integer
          format: uint64
          x-field-uid: 17
        replayed_byte:
          description: Number of bytes replayed.
          type: integer
          format: uint64
          x-field-uid: 18
        tx_seq:
          description: The current LLR transmit sequence number.
          type: integer
          format: uint64
          x-field-uid: 19
        tx_outstanding_seq:
          description: The current number of unacknowledged transmitted frames.
          type: integer
          format: uint64
          x-field-uid: 20
        rx_init_ctl_os:
          description: Number of LLR_INIT control ordered sets received.
          type: integer
          format: uint64
          x-field-uid: 21
        rx_init_echo_ctl_os:
          description: Number of LLR_INIT_ECHO control ordered sets received.
          type: integer
          format: uint64
          x-field-uid: 22
        rx_ack_ctl_os:
          description: Number of LLR_ACK control ordered sets received.
          type: integer
          format: uint64
          x-field-uid: 23
        rx_nack_ctl_os:
          description: Number of LLR_NACK control ordered sets received.
          type: integer
          format: uint64
          x-field-uid: 24
        rx_ack_nack_seq_error:
          description: >-
            Number of LLR_ACK/LLR_NACK control ordered sets received with a sequence
            number error.
          type: integer
          format: uint64
          x-field-uid: 25
        rx_ok:
          description: Number of LLR-eligible frames received with a good FCS.
          type: integer
          format: uint64
          x-field-uid: 26
        rx_poisoned:
          description: Number of LLR-eligible frames received with a poisoned FCS.
          type: integer
          format: uint64
          x-field-uid: 27
        rx_bad:
          description: Number of LLR-eligible frames received with a bad FCS.
          type: integer
          format: uint64
          x-field-uid: 28
        rx_expected_seq_good:
          description: >-
            Number of LLR-eligible frames received with a good FCS that had the
            expected sequence number.
          type: integer
          format: uint64
          x-field-uid: 29
        rx_expected_seq_poisoned:
          description: >-
            Number of LLR-eligible frames received with a poisoned FCS that had the
            expected sequence number.
          type: integer
          format: uint64
          x-field-uid: 30
        rx_expected_seq_bad:
          description: >-
            Number of LLR-eligible frames received with a bad FCS that had the
            expected sequence number.
          type: integer
          format: uint64
          x-field-uid: 31
        rx_missing_seq:
          description: >-
            Number of LLR-eligible frames received that indicated a missing frame in
            the sequence.
          type: integer
          format: uint64
          x-field-uid: 32
        rx_duplicate_seq:
          description: >-
            Number of LLR-eligible frames received that had a duplicate sequence
            number.
          type: integer
          format: uint64
          x-field-uid: 33
        rx_replay:
          description: >-
            Number of times the receiver has detected the start of a replay.
          type: integer
          format: uint64
          x-field-uid: 34
        rx_next_seq:
          description: The current expected LLR receive sequence number.
          type: integer
          format: uint64
          x-field-uid: 35
        llr_init_ctl_os_spacing_min:
          description: >-
            The minimum observed spacing between received LLR_INIT control ordered
            sets.
          type: integer
          format: uint64
          x-field-uid: 36
        llr_init_ctl_os_spacing_error:
          description: >-
            Number of received LLR_INIT control ordered set minimum spacing
            violations.
          type: integer
          format: uint64
          x-field-uid: 37
        llr_ack_nack_ctl_os_spacing_min:
          description: >-
            The minimum observed spacing between received LLR_ACK/LLR_NACK control
            ordered sets.
          type: integer
          format: uint64
          x-field-uid: 38
        llr_ack_nack_ctl_os_spacing_error:
          description: >-
            Number of received LLR_ACK/LLR_NACK control ordered set minimum spacing
            violations.
          type: integer
          format: uint64
          x-field-uid: 39
        llr_init_echo_init_seq_mismatch:
          description: >-
            Number of received LLR_INIT_ECHO control ordered sets whose init sequence
            did not match the transmit sequence.
          type: integer
          format: uint64
          x-field-uid: 40
        rx_ack_ctl_os_dropped:
          description: Number of received LLR_ACK control ordered sets dropped.
          type: integer
          format: uint64
          x-field-uid: 41
        rx_nack_ctl_os_dropped:
          description: Number of received LLR_NACK control ordered sets dropped.
          type: integer
          format: uint64
          x-field-uid: 42
        rx_init_ctl_os_dropped:
          description: Number of received LLR_INIT control ordered sets dropped.
          type: integer
          format: uint64
          x-field-uid: 43
        rx_init_echo_ctl_os_dropped:
          description: Number of received LLR_INIT_ECHO control ordered sets dropped.
          type: integer
          format: uint64
          x-field-uid: 44
        ue_rx_ctl_os_frame_header_error:
          description: >-
            Number of received UE control ordered sets with a frame header error.
          type: integer
          format: uint64
          x-field-uid: 45
        ue_rx_ctl_os_intra_frame_spacing_error:
          description: >-
            Number of received UE control ordered set intra-frame spacing violations.
          type: integer
          format: uint64
          x-field-uid: 46
        ue_ctl_os_spacing_min:
          description: >-
            The minimum observed spacing between received UE control ordered sets.
          type: integer
          format: uint64
          x-field-uid: 47
        ue_ctl_os_spacing_error:
          description: >-
            Number of received UE control ordered set minimum spacing violations.
          type: integer
          format: uint64
          x-field-uid: 48

    UltraEthernet.SenderVc.Metric:
      description: >-
        CBFC sender per virtual channel (VC) state (the Port/VC State of the CBFC
        sender). Credit counters per UE-Specification-1.0.3 Tables 5-15/5-16.
      type: object
      properties:
        port_name:
          description: The name of the port.
          type: string
          x-field-uid: 1
        s_p_cu:
          description: >-
            The sender port credits in use (S_P_CU) - a port level value repeated for
            each VC row of the port.
          type: integer
          format: uint64
          x-field-uid: 2
        received_cf_update_count:
          description: >-
            The number of CF_Update messages received by the sender - a port level
            value repeated for each VC row of the port.
          type: integer
          format: uint64
          x-field-uid: 3
        port_excess_credit_free_error:
          description: >-
            Indicates whether a port level excess credit freed condition was detected.
          type: boolean
          x-field-uid: 4
        vc_id:
          description: The zero based VC number.
          type: integer
          format: uint32
          x-field-uid: 5
        vc_state:
          description: The current operational state of the VC.
          type: string
          x-field-uid: 6
          x-enum:
            best_effort:
              x-field-uid: 1
            lossless:
              x-field-uid: 2
        excess_credit_free_error:
          description: >-
            Indicates whether an excess credit freed condition was detected on this VC
            when the credit mode is per_vc.
          type: boolean
          x-field-uid: 7
        s_vc_cc:
          description: >-
            The sender credits consumed counter for this VC (S_VC_CC). A 20-bit cyclic
            counter (modulo 2^20) per UE-Specification-1.0.3 Section 5.2.
          type: integer
          format: uint64
          x-field-uid: 8
        s_vc_cf:
          description: >-
            The sender credits freed counter for this VC (S_VC_CF). A 15-bit cyclic
            counter (modulo 2^15) per UE-Specification-1.0.3 Section 5.2.
          type: integer
          format: uint64
          x-field-uid: 9

    UltraEthernet.ReceiverVc.Metric:
      description: >-
        CBFC receiver per virtual channel (VC) state (the Port/VC State of the CBFC
        receiver). Credit counters per UE-Specification-1.0.3 Tables 5-15/5-16.
      type: object
      properties:
        port_name:
          description: The name of the port.
          type: string
          x-field-uid: 1
        port_credit_limit_exceed_error:
          description: >-
            Indicates whether a port level credit limit exceeded condition was
            detected.
          type: boolean
          x-field-uid: 2
        vc_id:
          description: The zero based VC number.
          type: integer
          format: uint32
          x-field-uid: 3
        vc_state:
          description: The current operational state of the VC.
          type: string
          x-field-uid: 4
          x-enum:
            best_effort:
              x-field-uid: 1
            lossless:
              x-field-uid: 2
        credit_limit_exceed_error:
          description: >-
            Indicates whether a credit limit exceeded condition was detected on this VC
            when the credit mode is per_vc.
          type: boolean
          x-field-uid: 5
        lost_credit_err:
          description: >-
            Indicates whether a lost credit condition was detected on this VC.
          type: boolean
          x-field-uid: 6
        r_vc_cc:
          description: >-
            The receiver credits consumed counter for this VC (R_VC_CC). A 20-bit
            cyclic counter (modulo 2^20) per UE-Specification-1.0.3 Section 5.2.
          type: integer
          format: uint64
          x-field-uid: 7
        r_vc_cf:
          description: >-
            The receiver credits freed counter for this VC (R_VC_CF). A 15-bit cyclic
            counter (modulo 2^15) per UE-Specification-1.0.3 Section 5.2.
          type: integer
          format: uint64
          x-field-uid: 8
