openapi: 3.0.3
info:
  title: CCL tail latency CDF config models
  version: ^0.0.0
components:
  schemas:
    Ccl.Config.TailLatencyCdf:
      description: >-
        Tail latency CDF (Cumulative Distribution Function) collection
        configuration. When enabled, the backend collects a distribution of
        per-iteration tail latency values during test execution and returns
        them as Ccl.Metric.tail_latency_cdf[] without additional flags in
        Ccl.Metrics.Request.

        Each bucket in the CDF represents a cumulative percentile boundary
        (e.g. P50, P90, P99, P99.9). The transmission_time_percent field in
        each bucket expresses the tail latency at that percentile as a
        percentage of the ideal transmission time (TotalDataSize / line_rate).
        Values above 100% indicate congestion or retransmission overhead at
        that percentile.

        Disabled by default to avoid unnecessary backend overhead on tests
        that do not require distribution analysis.
      type: object
      properties:
        enable:
          description: >-
            Enable tail latency CDF collection. When true, the backend
            accumulates per-iteration tail latency samples during the test
            and computes the CDF distribution. Results are returned in
            Ccl.Metric.tail_latency_cdf[].
          type: boolean
          default: false
          x-field-uid: 1
