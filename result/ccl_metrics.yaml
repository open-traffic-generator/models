openapi: 3.0.3
info:
  title: CCL metrics models
  version: ^0.0.0
components:
  schemas:
    Ccl.Metrics.Request:
      description: >-
        Request to retrieve CCL (Collective Communication) metrics.
      type: object
      properties:
        communicator_names:
          description: >-
            Filter results by communicator name. An empty list returns results
            for all communicators.
          type: array
          items:
            type: string
            x-constraint:
              - "/components/schemas/Ccl.Communicator/properties/name"
          x-field-uid: 1
        stage_names:
          description: >-
            Filter results by stage name. An empty list returns results for all stages.
            Only meaningful when stages[] contains multiple entries.
          type: array
          items:
            type: string
            x-constraint:
              - "/components/schemas/Ccl.Stage/properties/name"
          x-field-uid: 2
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            An empty list returns all columns.
          type: array
          items:
            type: string
            x-enum:
              jct:
                x-field-uid: 1
              calibrated_jct:
                x-field-uid: 2
              ideal_jct:
                x-field-uid: 3
              jct_percent:
                x-field-uid: 4
              alg_bw:
                x-field-uid: 5
              bus_bw:
                x-field-uid: 6
              avg_jct:
                x-field-uid: 7
              max_jct:
                x-field-uid: 8
              min_jct:
                x-field-uid: 9
              max_tail_latency_us:
                x-field-uid: 10
              iteration_count:
                x-field-uid: 11
              drop_count:
                x-field-uid: 12
              reorder_count:
                x-field-uid: 13
              l1_alg_bw:
                x-field-uid: 14
              l1_bus_bw:
                x-field-uid: 15
              reduce_time:
                x-field-uid: 16
              training_time:
                x-field-uid: 17
              trans_time:
                x-field-uid: 18
              alg_bw_tx_time:
                x-field-uid: 19
              bus_bw_tx_time:
                x-field-uid: 20
              alg_bw_fw_time:
                x-field-uid: 21
              bus_bw_fw_time:
                x-field-uid: 22
              forwarding_time:
                x-field-uid: 23
              l1_alg_bw_tx_time:
                x-field-uid: 24
              l1_bus_bw_tx_time:
                x-field-uid: 25
              l1_alg_bw_fw_time:
                x-field-uid: 26
              l1_bus_bw_fw_time:
                x-field-uid: 27
              alg_bw_percent:
                x-field-uid: 28
              bus_bw_percent:
                x-field-uid: 29
              alg_bw_tx_time_percent:
                x-field-uid: 30
              bus_bw_tx_time_percent:
                x-field-uid: 31
              l1_alg_bw_tx_time_percent:
                x-field-uid: 32
              l1_bus_bw_tx_time_percent:
                x-field-uid: 33
              l1_alg_bw_percent:
                x-field-uid: 34
              l1_bus_bw_percent:
                x-field-uid: 35
              max_tail_latency_percent:
                x-field-uid: 36
          x-field-uid: 3
        include_loop_metrics:
          description: >-
            When true, include per-stage-loop JCT metrics in each CclMetric
            response. Only meaningful when stage_loop_count > 1.
          type: boolean
          default: false
          x-field-uid: 5

    Ccl.Metric:
      description: >-
        CCL metrics for one communicator (and one stage, for multi-stage configs).
        When stage_loop_count = 1 (default), the top-level fields cover the single
        run directly. When stage_loop_count > 1, the top-level fields are cumulative
        across all loop passes: jct and iteration_count are summed; avg_jct =
        jct / iteration_count; alg_bw = S / avg_jct; max_jct / min_jct are the
        extremes across all iterations in all loops; drop_count / reorder_count are
        totals across all loops. Per-loop breakdown is in loop_metrics[] when
        include_loop_metrics = true.
      type: object
      properties:
        communicator_name:
          description: Name of the communicator this metric row belongs to.
          type: string
          x-field-uid: 1
        stage_index:
          description: 0-based stage index (matches stages[] order in Config.ccl).
          type: integer
          format: uint64
          x-field-uid: 2
        stage_name:
          description: Human-readable name of the stage.
          type: string
          x-field-uid: 3
        jct:
          description: >-
            Measured Job Completion Time (seconds). End-to-end time across all
            iterations, from first packet sent to last ACK received. Primary
            performance indicator.
          type: number
          format: double
          x-field-uid: 4
        calibrated_jct:
          description: >-
            JCT minus test-tool instrumentation overhead (seconds). Isolates
            fabric latency by removing the constant baseline of the
            tool-to-chassis path.
          type: number
          format: double
          x-field-uid: 5
        ideal_jct:
          description: >-
            Theoretical minimum JCT at 100% link utilization, zero overhead
            (seconds). Computed from data_size, rank count, and link rate.
          type: number
          format: double
          x-field-uid: 6
        jct_percent:
          description: >-
            jct / ideal_jct * 100. Near 100% indicates near-ideal fabric
            utilization. Above 105% indicates congestion, loss, or suboptimal
            routing. Acceptance: < 105.0.
          type: number
          format: double
          x-field-uid: 7
        alg_bw:
          description: >-
            Algorithm Bandwidth = data_size / jct (Gbps). Pure payload
            throughput; no framing overhead. Directly comparable to nccl-tests
            algbw output.
          type: number
          format: double
          x-field-uid: 8
        bus_bw:
          description: >-
            Bus Bandwidth = alg_bw * BusBW_coefficient (Gbps). Represents
            actual fabric traffic volume. Coefficients follow nccl-tests
            convention: AllReduce 2(N-1)/N, AllToAll/ReduceScatter/AllGather
            (N-1)/N, PointToPoint 1.
            Acceptance: bus_bw / link_rate > 90%.
          type: number
          format: double
          x-field-uid: 9
        avg_jct:
          description: >-
            jct / iteration_count (seconds). Per-iteration average JCT; use
            to compare configurations.
          type: number
          format: double
          x-field-uid: 10
        max_jct:
          description: >-
            Maximum single-iteration JCT (seconds). High max_jct / avg_jct
            ratio signals JCT jitter from congestion or retransmission.
            Acceptance: max_jct / avg_jct < 1.1.
          type: number
          format: double
          x-field-uid: 11
        min_jct:
          description: >-
            Minimum single-iteration JCT (seconds). Lower bound; use to detect
            abnormally slow tail iterations.
          type: number
          format: double
          x-field-uid: 12
        max_tail_latency_us:
          description: >-
            Worst-case single-iteration transmission time (microseconds). Early
            warning indicator; inspect the full tail_latency_cdf for the
            distribution.
          type: integer
          format: uint64
          x-field-uid: 13
        iteration_count:
          description: >-
            Completed collective iterations. fixed_iterations mode: equals
            stage.duration.fixed_iterations.count. fixed_seconds mode: number
            of full iterations completed within the time limit.
          type: integer
          format: uint64
          x-field-uid: 14
        drop_count:
          description: >-
            Total packet drops across all iterations. Must be 0 for lossless
            fabric validation (IEEE 802.1Qbb PFC requirement). Non-zero
            indicates PFC or ECN is not functioning correctly on the DUT.
            Acceptance: drop_count = 0.
          type: integer
          format: uint64
          x-field-uid: 15
        reorder_count:
          description: >-
            Total reordered packets across all iterations. Must be 0 in RC
            mode — RDMA Reliable Connection guarantees in-order delivery.
            Non-zero in RC mode indicates fabric routing instability or ECMP
            asymmetry.
          type: integer
          format: uint64
          x-field-uid: 16
        tail_latency_cdf:
          description: >-
            Tail latency CDF distribution. Populated when
            Ccl.Config.tail_latency_cdf.enable = true in SetConfig.
          type: array
          items:
            $ref: '#/components/schemas/Ccl.TailLatencyCDFBucket'
          x-field-uid: 17
        l1_alg_bw_tx_time:
          description: >-
            Layer-1 Algorithm Bandwidth based on transmission time (Gbps):
            alg_bw_tx_time * (ib_mtu + 90) / ib_mtu. L1 equivalent of
            alg_bw_tx_time including frame overhead. Compare against port
            line rate on a tx_time basis.
          type: number
          format: double
          x-field-uid: 18
        l1_alg_bw:
          description: >-
            Layer-1 Algorithm Bandwidth (Gbps). alg_bw * (ib_mtu + 90) /
            ib_mtu. Includes Ethernet/IP/UDP/RoCEv2 frame overhead (90B per
            payload). Use to compare against port line rate; use alg_bw to
            compare against nccl-tests (payload BW only).
          type: number
          format: double
          x-field-uid: 19
        l1_bus_bw:
          description: >-
            Layer-1 Bus Bandwidth (Gbps). bus_bw * (ib_mtu + 90) / ib_mtu.
            L1 equivalent of bus_bw including frame overhead.
          type: number
          format: double
          x-field-uid: 20
        reduce_time:
          description: >-
            Total accumulated GPU compute (reduce) time across all iterations
            (seconds). Sum of all compute_gap values. Zero when no compute_gap
            is configured (back-to-back stress test).
          type: number
          format: double
          x-field-uid: 21
        training_time:
          description: >-
            trans_time + reduce_time (seconds). Full wall-clock time for one
            complete communication + compute cycle across all iterations.
          type: number
          format: double
          x-field-uid: 22
        trans_time:
          description: >-
            Total fabric transmission time across all iterations, excluding
            compute gaps (seconds). jct - reduce_time.
          type: number
          format: double
          x-field-uid: 23
        loop_metrics:
          description: >-
            Per-stage-loop JCT breakdown. Populated when
            Ccl.Metrics.Request.include_loop_metrics = true and
            stage_loop_count > 1. Each entry covers one loop pass for
            this specific (communicator, stage) pair.
          type: array
          items:
            $ref: '#/components/schemas/Ccl.LoopMetric'
          x-field-uid: 24
        alg_bw_tx_time:
          description: >-
            Algorithm Bandwidth based on transmission time (Gbps): S / trans_time.
            Pure sender throughput excluding ACK return path; upper bound of alg_bw.
            alg_bw_tx_time ≈ alg_bw → ACK overhead is negligible.
            alg_bw_tx_time >> alg_bw → bottleneck is ACK latency or DCQCN rate
            reduction on the return path.
          type: number
          format: double
          x-field-uid: 25
        bus_bw_tx_time:
          description: >-
            Bus Bandwidth based on transmission time (Gbps):
            alg_bw_tx_time * BusBW_coefficient (see alg_bw / bus_bw formulas).
          type: number
          format: double
          x-field-uid: 26
        alg_bw_fw_time:
          description: >-
            Algorithm Bandwidth based on forwarding time (Gbps): S / forwarding_time.
            Isolates one-way fabric delivery performance, excluding the ACK return path.
            Invariant: alg_bw <= alg_bw_fw_time <= alg_bw_tx_time.
            (alg_bw_tx_time − alg_bw_fw_time) reflects one-way network latency overhead;
            (alg_bw_fw_time − alg_bw) reflects ACK return-path latency overhead.
          type: number
          format: double
          x-field-uid: 27
        bus_bw_fw_time:
          description: >-
            Bus Bandwidth based on forwarding time (Gbps):
            alg_bw_fw_time * BusBW_coefficient.
          type: number
          format: double
          x-field-uid: 28
        forwarding_time:
          description: >-
            Total time from first frame transmitted to last frame received at
            destination, summed across all iterations (seconds). Excludes ACK
            return path and compute gaps.
            Invariant: trans_time <= forwarding_time <= jct - reduce_time.
            The gap (forwarding_time - trans_time) reflects one-way network
            latency; the gap ((jct - reduce_time) - forwarding_time) reflects
            ACK return-path latency.
          type: number
          format: double
          x-field-uid: 29
        iteration_metrics:
          description: >-
            Per-iteration debug records. Populated when
            Ccl.Config.iteration_recording.enable = true. Each entry
            corresponds to one iteration that exceeded at least one configured
            threshold. All counter fields carry delta values for that iteration
            (not cumulative). Empty array when iteration_recording is disabled.
          type: array
          items:
            $ref: '#/components/schemas/Ccl.IterationMetric'
          x-field-uid: 30
        tail_latency_metrics:
          description: >-
            Per-QP-pair per-step rolling TOP-N debug records. Populated when
            Ccl.Config.tail_latency_recording.enable = true. Only the top
            max_record_count records ranked by tail_latency_recording.top_by are
            retained. Empty array when tail_latency_recording is disabled.
          type: array
          items:
            $ref: '#/components/schemas/Ccl.TailLatencyMetric'
          x-field-uid: 31
        l1_bus_bw_tx_time:
          description: >-
            Layer-1 Bus Bandwidth based on transmission time (Gbps):
            bus_bw_tx_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 32
        l1_alg_bw_fw_time:
          description: >-
            Layer-1 Algorithm Bandwidth based on forwarding time (Gbps):
            alg_bw_fw_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 33
        l1_bus_bw_fw_time:
          description: >-
            Layer-1 Bus Bandwidth based on forwarding time (Gbps):
            bus_bw_fw_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 34
        alg_bw_percent:
          description: >-
            alg_bw / ideal_alg_bw * 100. Algorithm bandwidth efficiency versus
            theoretical maximum at 100% link utilization. Acceptance: > 90%.
          type: number
          format: double
          x-field-uid: 35
        bus_bw_percent:
          description: >-
            bus_bw / ideal_bus_bw * 100. Fabric utilization efficiency.
            Acceptance: > 90%.
          type: number
          format: double
          x-field-uid: 36
        alg_bw_tx_time_percent:
          description: >-
            alg_bw_tx_time / ideal_alg_bw * 100. Sender-side throughput
            efficiency versus ideal; excludes ACK return-path overhead.
          type: number
          format: double
          x-field-uid: 37
        bus_bw_tx_time_percent:
          description: >-
            bus_bw_tx_time / ideal_bus_bw * 100. Sender-side bus bandwidth
            efficiency versus ideal.
          type: number
          format: double
          x-field-uid: 38
        l1_alg_bw_tx_time_percent:
          description: >-
            l1_alg_bw_tx_time / link_rate * 100. L1 sender-side algorithm
            bandwidth efficiency versus port line rate.
          type: number
          format: double
          x-field-uid: 39
        l1_bus_bw_tx_time_percent:
          description: >-
            l1_bus_bw_tx_time / ideal_l1_bus_bw * 100. L1 sender-side bus
            bandwidth efficiency versus ideal L1 bus bandwidth.
          type: number
          format: double
          x-field-uid: 40
        l1_alg_bw_percent:
          description: >-
            l1_alg_bw / link_rate * 100. L1 algorithm bandwidth as a
            percentage of port line rate.
          type: number
          format: double
          x-field-uid: 41
        l1_bus_bw_percent:
          description: >-
            l1_bus_bw / ideal_l1_bus_bw * 100. L1 bus bandwidth efficiency
            versus ideal L1 bus bandwidth.
          type: number
          format: double
          x-field-uid: 42
        max_tail_latency_percent:
          description: >-
            max_tail_latency_us / ideal_transmission_time_us * 100.
            Worst-case per-stream tail latency as a percentage of the ideal
            transmission time. Values above 105% indicate severe per-stream
            congestion or head-of-line blocking.
          type: number
          format: double
          x-field-uid: 43

    Ccl.LoopMetric:
      description: >-
        JCT and bandwidth metrics for one communicator in one stage for one
        loop pass. Ccl.Metric is keyed by (communicator, stage); loop_metrics[]
        inside it gives per-loop breakdown for that specific (communicator,
        stage) pair. stage_loop identifies the loop pass (1-based).
        Only populated when stage_loop_count > 1 and
        include_loop_metrics = true in the metrics request.
      type: object
      properties:
        stage_loop:
          description: 1-based stage loop index.
          type: integer
          format: uint32
          x-field-uid: 1
        jct:
          description: Measured JCT for this loop (seconds).
          type: number
          format: double
          x-field-uid: 2
        calibrated_jct:
          description: Calibrated JCT for this loop (seconds).
          type: number
          format: double
          x-field-uid: 3
        ideal_jct:
          description: Ideal JCT for this loop (seconds).
          type: number
          format: double
          x-field-uid: 4
        jct_percent:
          description: jct / ideal_jct * 100 for this loop.
          type: number
          format: double
          x-field-uid: 5
        alg_bw:
          description: Algorithm bandwidth for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 6
        bus_bw:
          description: Bus bandwidth for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 7
        l1_alg_bw:
          description: Layer-1 algorithm bandwidth for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 8
        l1_bus_bw:
          description: Layer-1 bus bandwidth for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 9
        avg_jct:
          description: Average JCT across iterations in this loop (seconds).
          type: number
          format: double
          x-field-uid: 10
        max_jct:
          description: Maximum JCT across iterations in this loop (seconds).
          type: number
          format: double
          x-field-uid: 11
        min_jct:
          description: Minimum JCT across iterations in this loop (seconds).
          type: number
          format: double
          x-field-uid: 12
        max_tail_latency_us:
          description: Maximum tail latency across all ranks in this loop (µs).
          type: integer
          format: uint64
          x-field-uid: 13
        iteration_count:
          description: Number of completed iterations in this loop.
          type: integer
          format: uint32
          x-field-uid: 14
        drop_count:
          description: Total packet drops in this loop. Must be 0 for lossless validation.
          type: integer
          format: uint64
          x-field-uid: 15
        reorder_count:
          description: Total reordered packets in this loop. Must be 0 in RC mode.
          type: integer
          format: uint64
          x-field-uid: 16
        l1_alg_bw_tx_time:
          description: >-
            Layer-1 Algorithm Bandwidth based on transmission time for this loop (Gbps):
            alg_bw_tx_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 17
        reduce_time:
          description: Total accumulated GPU compute time in this loop (seconds).
          type: number
          format: double
          x-field-uid: 18
        training_time:
          description: trans_time + reduce_time for this loop (seconds).
          type: number
          format: double
          x-field-uid: 19
        trans_time:
          description: Total fabric transmission time in this loop, excluding compute gaps (seconds).
          type: number
          format: double
          x-field-uid: 20
        alg_bw_tx_time:
          description: Algorithm Bandwidth based on transmission time for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 21
        bus_bw_tx_time:
          description: Bus Bandwidth based on transmission time for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 22
        alg_bw_fw_time:
          description: Algorithm Bandwidth based on forwarding time for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 23
        bus_bw_fw_time:
          description: Bus Bandwidth based on forwarding time for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 24
        forwarding_time:
          description: >-
            Total time from first frame TX to last frame RX in this loop (seconds).
            Excludes ACK return path and compute gaps.
          type: number
          format: double
          x-field-uid: 25
        l1_bus_bw_tx_time:
          description: >-
            Layer-1 Bus Bandwidth based on transmission time for this loop (Gbps):
            bus_bw_tx_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 26
        l1_alg_bw_fw_time:
          description: >-
            Layer-1 Algorithm Bandwidth based on forwarding time for this loop (Gbps):
            alg_bw_fw_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 27
        l1_bus_bw_fw_time:
          description: >-
            Layer-1 Bus Bandwidth based on forwarding time for this loop (Gbps):
            bus_bw_fw_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 28
        alg_bw_percent:
          description: alg_bw / ideal_alg_bw * 100 for this loop.
          type: number
          format: double
          x-field-uid: 29
        bus_bw_percent:
          description: bus_bw / ideal_bus_bw * 100 for this loop.
          type: number
          format: double
          x-field-uid: 30
        alg_bw_tx_time_percent:
          description: alg_bw_tx_time / ideal_alg_bw * 100 for this loop.
          type: number
          format: double
          x-field-uid: 31
        bus_bw_tx_time_percent:
          description: bus_bw_tx_time / ideal_bus_bw * 100 for this loop.
          type: number
          format: double
          x-field-uid: 32
        l1_alg_bw_tx_time_percent:
          description: l1_alg_bw_tx_time / link_rate * 100 for this loop.
          type: number
          format: double
          x-field-uid: 33
        l1_bus_bw_tx_time_percent:
          description: l1_bus_bw_tx_time / ideal_l1_bus_bw * 100 for this loop.
          type: number
          format: double
          x-field-uid: 34
        l1_alg_bw_percent:
          description: l1_alg_bw / link_rate * 100 for this loop.
          type: number
          format: double
          x-field-uid: 35
        l1_bus_bw_percent:
          description: l1_bus_bw / ideal_l1_bus_bw * 100 for this loop.
          type: number
          format: double
          x-field-uid: 36
        max_tail_latency_percent:
          description: >-
            max_tail_latency_us / ideal_transmission_time_us * 100 for this loop.
            Values above 105% indicate severe per-stream congestion.
          type: number
          format: double
          x-field-uid: 37

    Ccl.TailLatencyCDFBucket:
      description: One bucket in the tail latency CDF distribution.
      type: object
      properties:
        percent:
          description: Cumulative percentage at this bucket boundary (e.g. 99.9).
          type: number
          format: double
          x-field-uid: 1
        transmission_time_percent:
          description: >-
            Transmission time at this cumulative percentile expressed as a
            percentage of the ideal transmission time, where ideal =
            TotalDataSize / line_rate. Values above 100% indicate congestion
            or retransmission overhead.
          type: number
          format: double
          x-field-uid: 2
        count:
          description: >-
            Number of stream blocks (QP pairs) whose tail latency falls
            within this bucket.
          type: integer
          x-field-uid: 3

    Ccl.IterationMetric:
      description: >-
        Per-iteration debug record. Recorded when any threshold in
        Ccl.Config.IterationRecording was exceeded during that iteration.

        All counter fields (rx_ecn_count, rx_cnp_count, tx_cnp_count,
        rx_pfc_count, drop_count, reorder_count) carry delta values for that
        single iteration, not cumulative totals. This enables precise
        correlation between a JCT spike and its cause: ECN marks, PFC pauses,
        or actual packet drops.
      type: object
      properties:
        iteration:
          description: >-
            1-based iteration index within this communicator and stage.
            Identifies which collective iteration was recorded.
          type: integer
          format: uint32
          x-field-uid: 1
        stage_loop:
          description: >-
            1-based stage loop index. Identifies which repetition of the stage
            sequence (stage_loop_count) this iteration belongs to.
          type: integer
          format: uint32
          x-field-uid: 2
        is_complete:
          description: >-
            True if the iteration completed all algorithm steps normally.
            False if the iteration was interrupted (e.g. by a stop command or
            a hard timeout). Incomplete iterations may have partial JCT values.
          type: boolean
          x-field-uid: 3
        rx_ecn_count:
          description: >-
            ECN-CE marked frames received by all ranks during this iteration
            (delta). High values indicate DCQCN congestion signals from the DUT
            (RED/WRED thresholds exceeded on switch egress queues).
          type: integer
          format: uint64
          x-field-uid: 4
        rx_cnp_count:
          description: >-
            Congestion Notification Packets (CNP) received by all ranks during
            this iteration (delta). Each CNP triggers a DCQCN rate reduction on
            the sender QP. High values correlate with reduced alg_bw.
          type: integer
          format: uint64
          x-field-uid: 5
        tx_cnp_count:
          description: >-
            CNP frames transmitted by all ranks during this iteration (delta).
            Sent by the receiver when it detects CE-marked packets; causes
            the remote sender to reduce its injection rate.
          type: integer
          format: uint64
          x-field-uid: 6
        rx_pfc_count:
          description: >-
            PFC PAUSE frames received by all ranks during this iteration
            (delta). Each PAUSE frame stalls the affected priority queue.
            High values indicate buffer pressure (check PG threshold and
            headroom configuration on the DUT).
          type: integer
          format: uint64
          x-field-uid: 7
        drop_count:
          description: >-
            Packet drops across all ranks during this iteration (delta).
            Must be 0 for lossless fabric validation. Non-zero value despite
            PFC indicates PFC deadlock, lossless queue overflow, or misconfigured
            headroom.
          type: integer
          format: uint64
          x-field-uid: 8
        reorder_count:
          description: >-
            Packet reorders across all ranks during this iteration (delta).
            Must be 0 in RC mode — RDMA Reliable Connection guarantees
            in-order delivery. Non-zero indicates fabric routing instability
            or ECMP asymmetry causing out-of-order delivery.
          type: integer
          format: uint64
          x-field-uid: 9
        max_tail_latency_us:
          description: >-
            Worst-case single-stream transmission time during this iteration
            (microseconds). Use to identify iterations where one QP stream
            experienced extreme latency even if the average JCT looks acceptable.
          type: integer
          format: uint64
          x-field-uid: 10
        jct:
          description: Measured JCT for this iteration (seconds).
          type: number
          format: double
          x-field-uid: 11
        ideal_jct:
          description: >-
            Theoretical minimum JCT for this iteration at 100% link
            utilization, zero overhead (seconds).
          type: number
          format: double
          x-field-uid: 12
        jct_percent:
          description: jct / ideal_jct * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 13
        alg_bw:
          description: Algorithm bandwidth for this iteration (Gbps).
          type: number
          format: double
          x-field-uid: 14
        bus_bw:
          description: Bus bandwidth for this iteration (Gbps).
          type: number
          format: double
          x-field-uid: 15
        failure_reason:
          description: >-
            Human-readable description of which threshold(s) triggered
            recording of this iteration. Examples: "jct_percent=108.3>105.0",
            "drop_count=12", "l1_bus_bw_tx_time_percent=107.1>105.0".
            Empty string when the iteration was recorded due to multiple
            thresholds simultaneously.
          type: string
          x-field-uid: 16
        alg_bw_tx_time:
          description: >-
            Algorithm Bandwidth based on transmission time for this iteration
            (Gbps): S / trans_time_this_iteration.
          type: number
          format: double
          x-field-uid: 17
        bus_bw_tx_time:
          description: >-
            Bus Bandwidth based on transmission time for this iteration (Gbps):
            alg_bw_tx_time * BusBW_coefficient.
          type: number
          format: double
          x-field-uid: 18
        alg_bw_fw_time:
          description: >-
            Algorithm Bandwidth based on forwarding time for this iteration
            (Gbps): S / forwarding_time_this_iteration.
          type: number
          format: double
          x-field-uid: 19
        bus_bw_fw_time:
          description: >-
            Bus Bandwidth based on forwarding time for this iteration (Gbps):
            alg_bw_fw_time * BusBW_coefficient.
          type: number
          format: double
          x-field-uid: 20
        l1_alg_bw:
          description: >-
            Layer-1 Algorithm Bandwidth for this iteration (Gbps):
            alg_bw * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 21
        l1_bus_bw:
          description: >-
            Layer-1 Bus Bandwidth for this iteration (Gbps):
            bus_bw * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 22
        l1_alg_bw_tx_time:
          description: >-
            Layer-1 Algorithm Bandwidth based on transmission time for this
            iteration (Gbps): alg_bw_tx_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 23
        l1_bus_bw_tx_time:
          description: >-
            Layer-1 Bus Bandwidth based on transmission time for this iteration
            (Gbps): bus_bw_tx_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 24
        l1_alg_bw_fw_time:
          description: >-
            Layer-1 Algorithm Bandwidth based on forwarding time for this
            iteration (Gbps): alg_bw_fw_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 25
        l1_bus_bw_fw_time:
          description: >-
            Layer-1 Bus Bandwidth based on forwarding time for this iteration
            (Gbps): bus_bw_fw_time * (ib_mtu + 90) / ib_mtu.
          type: number
          format: double
          x-field-uid: 26
        alg_bw_percent:
          description: >-
            alg_bw / ideal_alg_bw * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 27
        bus_bw_percent:
          description: >-
            bus_bw / ideal_bus_bw * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 28
        alg_bw_tx_time_percent:
          description: >-
            alg_bw_tx_time / ideal_alg_bw * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 29
        bus_bw_tx_time_percent:
          description: >-
            bus_bw_tx_time / ideal_bus_bw * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 30
        l1_alg_bw_tx_time_percent:
          description: >-
            l1_alg_bw_tx_time / link_rate * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 31
        l1_bus_bw_tx_time_percent:
          description: >-
            l1_bus_bw_tx_time / ideal_l1_bus_bw * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 32
        l1_alg_bw_percent:
          description: >-
            l1_alg_bw / link_rate * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 33
        l1_bus_bw_percent:
          description: >-
            l1_bus_bw / ideal_l1_bus_bw * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 34
        max_tail_latency_percent:
          description: >-
            max_tail_latency_us / ideal_transmission_time_us * 100 for this
            iteration. Values above 105% indicate severe per-stream congestion.
          type: number
          format: double
          x-field-uid: 35

    Ccl.TailLatencyMetric:
      description: >-
        Per-QP-pair (or PDC-pair for UET) per-step debug record.
        Only the top max_record_count records ranked by
        Ccl.Config.TailLatencyRecording.top_by are retained in the response;
        lower-ranked records are evicted during test execution.

        Use to identify specific QP pairs and algorithm steps that are
        disproportionately slow or lossy, which may indicate ECMP hot-spots,
        unequal load balancing, or per-path hardware faults.
      type: object
      properties:
        iteration:
          description: 1-based iteration index.
          type: integer
          format: uint32
          x-field-uid: 1
        stage_loop:
          description: 1-based stage loop index.
          type: integer
          format: uint32
          x-field-uid: 2
        stage_index:
          description: >-
            0-based stage index (matches stages[] order in Config.ccl).
            Identifies which stage this stream record belongs to; required
            for TOP-N lists that span multiple stages.
          type: integer
          format: uint32
          x-field-uid: 3
        stage_name:
          description: Human-readable name of the stage this stream record belongs to.
          type: string
          x-field-uid: 4
        step:
          description: >-
            0-based algorithm step index. For Ring AllReduce with N ranks
            there are 2*(N-1) steps (N-1 reduce-scatter + N-1 all-gather).
            Identifies which sub-step of the collective operation this
            stream belongs to.
          type: integer
          format: uint32
          x-field-uid: 7
        transport_id:
          description: >-
            Transport endpoint pair that identifies this stream.
            For rocev2: QP number pair (src_qp, dst_qp).
            For uet: PDC (Packet Delivery Context) pair (src_pdc, dst_pdc).
          $ref: '#/components/schemas/Ccl.TailLatencyMetric.TransportId'
          x-field-uid: 8
        stream_id:
          description: >-
            Monotonically increasing identifier assigned by the generator to
            each unique (communicator, step, QP-pair) stream within a test run.
            Use to correlate stream records across iterations.
          type: integer
          format: uint32
          x-field-uid: 9
        drop_count:
          description: >-
            Packet drops for this QP stream in this step. Non-zero indicates
            lossless fabric failure on this specific path.
          type: integer
          format: uint64
          x-field-uid: 11
        reorder_count:
          description: >-
            Packet reorders for this QP stream in this step (RC mode only).
          type: integer
          format: uint64
          x-field-uid: 12
        transmission_time_us:
          description: >-
            Time from first TX frame to last RX frame for this stream and step
            (microseconds). Used for TOP-N ranking when
            tail_latency_recording.top_by = transmission_time_us.
          type: integer
          format: uint64
          x-field-uid: 13
        transmission_time_exceed:
          description: >-
            transmission_time_us / ideal_transmission_time_us. A ratio > 1.0
            means this stream exceeded the ideal transmission time; values
            significantly above 1.0 (e.g. > 1.05) indicate congestion or
            head-of-line blocking on this specific path.
          type: number
          format: double
          x-field-uid: 14

    Ccl.TailLatencyMetric.TransportId:
      description: >-
        Discriminated union identifying the transport endpoint pair for a
        stream record. Follows the standard OTG discriminated-union pattern.
      type: object
      properties:
        choice:
          description: >-
            rocev2: identify by QP number pair (src_qp, dst_qp).
            uet: identify by PDC pair (src_pdc, dst_pdc).
          type: string
          default: rocev2
          x-field-uid: 1
          x-enum:
            rocev2:
              x-field-uid: 1
            uet:
              x-field-uid: 2
        rocev2:
          $ref: '#/components/schemas/Ccl.TailLatencyMetric.Rocev2Id'
          x-field-uid: 2
        uet:
          $ref: '#/components/schemas/Ccl.TailLatencyMetric.UetId'
          x-field-uid: 3

    Ccl.TailLatencyMetric.Rocev2Id:
      description: RoCEv2 QP number pair identifying a stream.
      type: object
      properties:
        src_qp:
          description: Source QP number.
          type: integer
          format: uint32
          x-field-uid: 1
        dst_qp:
          description: Destination QP number.
          type: integer
          format: uint32
          x-field-uid: 2

    Ccl.TailLatencyMetric.UetId:
      description: >-
        UET Packet Delivery Context (PDC) pair identifying a stream.
        PDC is the UET-specific connection endpoint, analogous to a QP number
        in RoCEv2 (UEC v1.0 specification).
      type: object
      properties:
        src_pdc:
          description: Source PDC identifier.
          type: integer
          format: uint32
          x-field-uid: 1
        dst_pdc:
          description: Destination PDC identifier.
          type: integer
          format: uint32
          x-field-uid: 2
