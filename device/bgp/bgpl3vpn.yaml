components:
  schemas:
    Bgp.L3vpn.Vrf:
      description: |-
        A BGP/MPLS Layer 3 VPN VRF (RFC 4364). Groups a Route Target
        import/export policy with a set of customer (PE-CE learned or locally
        originated) IPv4/IPv6 route ranges. Each route range carries its own
        Route Distinguisher (RFC 4364 Section 4.1), so its prefixes are
        advertised as VPN-IPv4 NLRI (AFI 1, SAFI 128) or VPN-IPv6 NLRI (AFI 2,
        SAFI 128, RFC 4659) instead of plain unicast NLRI. The RD is carried
        per route range - not once per VRF - matching RFC 4364's per-NLRI RD
        semantics, so route ranges in the same VRF may advertise different
        RDs (RFC 4364 Section 4.1 / 4.3.5, e.g. a multihomed CE).

        The BGP capability device.bgp.capability.ipv4_mpls_vpn must be enabled
        on the peer for VPN-IPv4 NLRI to be negotiated and advertised, and
        device.bgp.capability.ipv6_mpls_vpn for VPN-IPv6 NLRI.
      type: object
      required: [name]
      properties:
        name:
          x-include: '../../common/common.yaml#/components/schemas/Named.Object/properties/name'
          x-field-uid: 1
        route_target_export:
          description: >-
            List of Route Targets (RFC 4364 Section 4.3.1) attached as BGP
            Extended Communities to every route advertised from this VRF.
            A remote VRF imports the route only if one of its
            route_target_import values matches one of these.
          type: array
          items:
            $ref: './bgproutetarget.yaml#/components/schemas/Bgp.RouteTarget'
          x-field-uid: 2
        route_target_import:
          description: >-
            List of Route Targets (RFC 4364 Section 4.3.1) used to filter
            which received VPN-IPv4 routes are imported into this VRF.
            A received route is imported if any of its Route Target
            Extended Communities matches one of these.
          type: array
          items:
            $ref: './bgproutetarget.yaml#/components/schemas/Bgp.RouteTarget'
          x-field-uid: 3
        v4_routes:
          description: >-
            Emulated IPv4 customer route ranges belonging to this VRF.
            Each is advertised as VPN-IPv4 NLRI using its own
            route_distinguisher and this VRF's route_target_export.
          type: array
          items:
            $ref: './bgpl3vpnv4routerange.yaml#/components/schemas/Bgp.L3vpn.V4RouteRange'
          x-field-uid: 4
        v6_routes:
          description: >-
            Emulated IPv6 customer route ranges belonging to this VRF
            (6VPE, RFC 4659). Each is advertised as VPN-IPv6 NLRI using its
            own route_distinguisher and this VRF's route_target_export. Each
            route range's dataplane binding is selected via its own
            service_binding, currently a VPN MPLS label (RFC 4364 Section 3);
            the choice structure keeps room for an additional binding (for
            example an SRv6 Service SID, RFC 9252) to be added later without
            a breaking change.
          type: array
          items:
            $ref: './bgpl3vpnv6routerange.yaml#/components/schemas/Bgp.L3vpn.V6RouteRange'
          x-field-uid: 5
