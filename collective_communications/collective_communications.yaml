openapi: 3.0.3
info:
  title: Collective Communication Benchmarks
  description: >-
    All Collective Communications schemas.
  version: ^0.0.0
components:
  schemas:
    CollectiveCommunications:
      description: >-
        Collective Communications configuration.

        The configuration consists of high-level configuration objects that describe
        an AI workload, the infrastructure and platforms it is running on, and
        bindings that link elements together and attach them to physical test resources.
        In addition there is an impairment overlay, and a transport section with
        transport parameters that are unique to collective communications.
      properties:
        workload:
          $ref: './workload.yaml#/components/schemas/CollectiveCommunications.Workload'
          description: >-
            Definition of the collective communications traffic to run.
          x-field-uid: 1
        infrastructure:
          $ref: './infrastructure.yaml#/components/schemas/CollectiveCommunications.Infrastructure'
          description: >-
            The declaration of the system testbed.
          x-field-uid: 2
        platforms:
          type: array
          items:
            $ref: './platform.yaml#/components/schemas/CollectiveCommunications.PlatformConfig'
          description: >-
            Platform configurations available to this collective benchmark,
            including the default platform and per-platform typed settings.
            Multiple platforms may be configured simultaneously to support
            workloads that span more than one platform type.
          x-field-uid: 3
        bindings:
          $ref: './bindings.yaml#/components/schemas/CollectiveCommunications.Bindings'
          description: >-
            Links the workload to the infrastructure and the infrastructure to physical
            test resources.
          x-field-uid: 4
        impairments:
          $ref: './impairments.yaml#/components/schemas/CollectiveCommunications.Impairments'
          description: >-
            Network impairment configuration applied during the run.
          x-field-uid: 5
        result_info:
          $ref: '#/components/schemas/CollectiveCommunications.ResultInfo'
          description: >-
            General information about the collective benchmark Result to populate the collective benchmark Result with. These
            fields in the collective benchmark Result itself can be further edited after the test.
          x-field-uid: 6

    CollectiveCommunications.ResultInfo:
      description: >-
        General information about the collective benchmark Result
      properties:
        tags:
          x-include: '../common/common.yaml#/components/schemas/Tagged.Object/properties/tags'
          description: >-
            The list of tags associated with the collective benchmark.
          x-field-uid: 1
        description:
          x-include: '../common/common.yaml#/components/schemas/Described.Object/properties/description'
          description: >-
            A detailed description of the collective benchmark.
          x-field-uid: 2
      type: object
