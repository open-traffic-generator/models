components:
  schemas:
    CollectiveCommunications.MixOfCollectives.Summary.Metrics.Request:
      description: >-
        Request for summary metrics. Summarizes the completion times and throughput rates per collective datasize.
      type: object
      properties:
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              operation:
                x-field-uid: 2
              process_group:
                x-field-uid: 3
              data_size_bytes:
                x-field-uid: 4
              collective:
                x-field-uid: 5
              workload_set_iterations:
                x-field-uid: 6
              avg_collective_time_ms:
                x-field-uid: 7
              algo_bw_gbps:
                x-field-uid: 8
              bus_bw_gbps:
                x-field-uid: 9
              ideal_percentage:
                x-field-uid: 10
              total_time_s:
                x-field-uid: 11
              duty_cycle_percentage:
                x-field-uid: 12
              pfc_rx:
                x-field-uid: 13
              ecn_ce_rx:
                x-field-uid: 14
              frames_retx:
                x-field-uid: 15
          x-field-uid: 1
    CollectiveCommunications.MixOfCollectives.Summary.Metric:
      description: >-
        One row of summary metrics.
      type: object
      properties:
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        operation:
          description: >-
            The name of the operation aggregated in this row.
          type: string
          x-field-uid: 2
        process_group:
          description: >-
            The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 3
        data_size_bytes:
          description: >-
            Total data size in bytes of the collective across ranks.
          type: integer
          format: uint64
          x-field-uid: 4
        collective:
          description: >-
            The collective algorithm type of the operation aggregated in this row.
          type: string
          x-field-uid: 5
        workload_set_iterations:
          description: >-
            The number of cycles over which this collective was executed.
          type: integer
          format: uint32
          x-field-uid: 6
        avg_collective_time_ms:
          description: >-
            Average completion time (ms) of the collective across all workload
            set iterations.
          type: number
          x-field-uid: 7
        algo_bw_gbps:
          description: >-
            Algorithmic bandwidth (data size divided by collective time), GB/s.
          type: number
          x-field-uid: 8
        bus_bw_gbps:
          description: >-
            Bus bandwidth in GB/s. Equals algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 9
        ideal_percentage:
          description: >-
            Achieved bus bandwidth as a percentage of the ideal goodput.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 10
        total_time_s:
          description: >-
            Wall-clock time (s) the collective was active across all workload set iterations.
          type: number
          x-field-uid: 11
        duty_cycle_percentage:
          description: >-
            Fraction of total time the collective was actively transferring data
            (as percentage).
          type: number
          x-field-uid: 12
        pfc_rx:
          description: >-
            Total Priority Flow Control pause frames received during execution.
          type: integer
          format: uint64
          x-field-uid: 13
        ecn_ce_rx:
          description: >-
            Total ECN Congestion Experienced packets received during execution.
          type: integer
          format: uint64
          x-field-uid: 14
        frames_retx:
          description: >-
            Total frames retransmitted during execution.
          type: integer
          format: uint64
          x-field-uid: 15
