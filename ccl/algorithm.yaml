openapi: 3.0.3
info:
  title: CCL algorithm models
  version: ^0.0.0
components:
  schemas:
    Ccl.Algorithm:
      description: >-
        Collective algorithm selector for a communicator.
        Specifies which algorithm to run and, for allreduce variants, which phase.
        Run control parameters (iteration count, duration) belong to Ccl.Stage.
      type: object
      properties:
        choice:
          description: >-
            Algorithm selection.
            ring_allreduce: Ring AllReduce, most common algorithm.
            halving_doubling: Recursive halving-doubling, O(log N) steps.
            dual_tree: Dual binary tree, low latency for small data.
            alternating_ring: Alternating ring, reduces hot spots.
            all_to_all_via_proxy: Full mesh AllToAll routed via a high-speed proxy interconnect between nodes.
            all_to_all_direct: Full mesh AllToAll with direct peer-to-peer connections, no proxy.
            point_to_point: Direct point-to-point transfer between two ranks.
            Note: reduce_scatter and all_gather are phases of allreduce variants,
            not standalone algorithms. Use choice=ring_allreduce (or other
            allreduce variants) with phase=reduce_scatter / phase=all_gather.
          type: string
          default: ring_allreduce
          x-field-uid: 1
          x-enum:
            ring_allreduce:
              x-field-uid: 1
            halving_doubling:
              x-field-uid: 2
            dual_tree:
              x-field-uid: 3
            alternating_ring:
              x-field-uid: 4
            all_to_all_via_proxy:
              x-field-uid: 5
            all_to_all_direct:
              x-field-uid: 6
            point_to_point:
              x-field-uid: 7
        phase:
          description: >-
            Algorithm phase. Applies when choice is an allreduce variant
            (ring_allreduce, halving_doubling, dual_tree, alternating_ring).
            allreduce: full ReduceScatter + AllGather (default).
            reduce_scatter: only the scatter phase.
            all_gather: only the gather phase.
          type: string
          default: allreduce
          x-field-uid: 2
          x-enum:
            allreduce:
              x-field-uid: 1
            reduce_scatter:
              x-field-uid: 2
            all_gather:
              x-field-uid: 3
