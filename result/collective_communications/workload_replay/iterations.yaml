components:
  schemas:
    CollectiveCommunications.WorkloadReplay.Iterations.Metrics.Request:
      description: >-
        Request for iteration metrics. Contains timing statistics of collectives for each iteration within the workload.
      type: object
      properties:
        workload_name:
          description: >-
            Filter results by workload name. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              iteration:
                x-field-uid: 1
              start:
                x-field-uid: 2
              job_completion_time:
                x-field-uid: 3
              comp_time:
                x-field-uid: 4
              comm_time:
                x-field-uid: 5
              exposed_time:
                x-field-uid: 6
              overlap_ms:
                x-field-uid: 7
              overlap:
                x-field-uid: 8
              all_reduce:
                x-field-uid: 9
              reduce_scatter:
                x-field-uid: 10
              all_gather:
                x-field-uid: 11
              all_to_all:
                x-field-uid: 12
              broadcast:
                x-field-uid: 13
              gather:
                x-field-uid: 14
              p50:
                x-field-uid: 15
              p95:
                x-field-uid: 16
              max:
                x-field-uid: 17
              comm_skew_p95:
                x-field-uid: 18
          x-field-uid: 2
    CollectiveCommunications.WorkloadReplay.Iterations.Metric:
      description: >-
        One row of replay iterations metrics.
      type: object
      properties:
        workload_identifier:
          description: >-
            Name of the replayed workload.
          type: string
          x-field-uid: 1
        iteration:
          description: >-
            The iteration of the replayed workload.
          type: string
          x-field-uid: 2
        start:
          description: >-
            The start time (ms) of the replay iteration.
          type: number
          x-field-uid: 3
        job_completion_time:
          description: >-
            The total elapsed time (ms) from the start to the end of an emulation
            job, encompassing all iterations and all ranks.
          type: number
          x-field-uid: 4
        comp_time:
          description: >-
            The total time (ms) spent on computation, excluding time spent on
            communication or waiting for data.
          type: number
          x-field-uid: 5
        comm_time:
          description: >-
            The cumulative time (ms) spent on data exchange between ranks during
            all iterations of the job.
          type: number
          x-field-uid: 6
        exposed_time:
          description: >-
            The total time (ms) during which communication occurs without
            overlapping with computation, across all iterations and ranks.
          type: number
          x-field-uid: 7
        overlap_ms:
          description: >-
            The total time (ms) during which communication overlaps with
            computation.
          type: number
          x-field-uid: 8
        overlap:
          description: >-
            The percentage of communication time that is overlapped with
            computation time.
          type: number
          x-field-uid: 9
        all_reduce:
          description: >-
            The total execution time (ms) of AllReduce operations.
          type: number
          x-field-uid: 10
        reduce_scatter:
          description: >-
            The total execution time (ms) of ReduceScatter operations.
          type: number
          x-field-uid: 11
        all_gather:
          description: >-
            The total execution time (ms) of AllGather operations.
          type: number
          x-field-uid: 12
        all_to_all:
          description: >-
            The total execution time (ms) of AllToAll operations.
          type: number
          x-field-uid: 13
        broadcast:
          description: >-
            The total execution time (ms) of Broadcast operations.
          type: number
          x-field-uid: 14
        gather:
          description: >-
            The total execution time (ms) of Gather operations.
          type: number
          x-field-uid: 15
        p50:
          description: >-
            The 50th percentile (median) communication time (ms) across all
            collective operations.
          type: number
          x-field-uid: 16
        p95:
          description: >-
            The 95th percentile communication time (ms) across all collective
            operations.
          type: number
          x-field-uid: 17
        max:
          description: >-
            The maximum communication time (ms) recorded for any collective
            operation.
          type: number
          x-field-uid: 18
        comm_skew_p95:
          description: >-
            The 95th percentile of communication time variance between ranks
            (as percentage), indicating load imbalance.
          type: number
          x-field-uid: 19
