components:
  schemas:
    Ldp.Ipv4TargetedPeer:
      description: >-
        LDP Extended Discovery to one IPv4 peer (RFC 5036 Section 2.4.2). The
        emulated LSR sends unicast Targeted Hellos (UDP port 646) from the
        address of ipv4_name to remote_address and forms a session with that
        LSR. remote_address must be reachable from the DUT, for example through
        an IGP or a static route.
      type: object
      required: [name, ipv4_name, remote_address]
      properties:
        name:
          x-include: ../../common/common.yaml#/components/schemas/Named.Object/properties/name
          x-field-uid: 1
        ipv4_name:
          description: >-
            The globally unique name of the local IPv4 interface or IPv4
            loopback from which Targeted Hellos are sent. It must match the
            "name" field of an entry in "ipv4_addresses" or "ipv4_loopbacks".
          type: string
          x-constraint:
          - '/components/schemas/Device.Ipv4/properties/name'
          - '/components/schemas/Device.Ipv4Loopback/properties/name'
          x-field-uid: 2
        remote_address:
          description: >-
            The IPv4 address of the targeted peer, to which Targeted Hellos are
            sent (RFC 5036 Section 2.4.2).
          type: string
          format: ipv4
          x-field-uid: 3
        hello_interval:
          description: >-
            The interval in seconds between Targeted Hello messages. It should
            be at most one third of hello_hold_time (RFC 5036 Section 3.5.2.1).
          type: integer
          format: uint32
          minimum: 1
          maximum: 65535
          default: 15
          x-field-uid: 4
        hello_hold_time:
          description: >-
            The Hold Time in seconds advertised in the Common Hello Parameters
            TLV of Targeted Hellos (RFC 5036 Section 3.5.2). The value 65535
            means infinite.
          type: integer
          format: uint32
          minimum: 1
          maximum: 65535
          default: 45
          x-field-uid: 5
        authentication:
          description: >-
            When present, the TCP MD5 Signature Option is used on the session
            TCP connection to this peer (RFC 5036 Section 2.9). Omit to disable
            authentication. If the peer is also reached through an
            Ldp.Ipv4Interface, both must use the same key.
          $ref: './authentication.yaml#/components/schemas/Ldp.Authentication'
          x-field-uid: 6
