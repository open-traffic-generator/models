openapi: 3.0.3

info:
  title: Ultra Ethernet results models
  version: ^0.0.0

components:
  schemas:
    UltraEthernet.Metrics.Request:
      description: >-
        The request to retrieve Ultra Ethernet (UE) per port metrics/statistics
        covering the Link Layer Retry (LLR), Credit-based Flow Control (CBFC) and
        PHY Control Ordered Set (CtlOS) features.
      type: object
      properties:
        ultra_ethernet_names:
          description: >-
            The names of Ultra Ethernet configurations to return results for.
            An empty list will return results for all Ultra Ethernet configurations.
          type: array
          items:
            type: string
          x-constraint:
            - "/components/schemas/UltraEthernet/properties/name"
          x-field-uid: 1
        column_names:
          description: >-
            The requested list of column names for the result set.
            If the list is empty then metrics for all columns will be returned.
            The name of the Ultra Ethernet configuration can not be excluded.
          type: array
          items:
            type: string
            x-enum:
              tx_init_ctl_os:
                x-field-uid: 1
              tx_init_echo_ctl_os:
                x-field-uid: 2
              tx_ack_ctl_os:
                x-field-uid: 3
              tx_nack_ctl_os:
                x-field-uid: 4
              tx_discard:
                x-field-uid: 5
              tx_ok:
                x-field-uid: 6
              tx_poisoned:
                x-field-uid: 7
              tx_replay_event:
                x-field-uid: 8
              replayed_packet:
                x-field-uid: 9
              replayed_byte:
                x-field-uid: 10
              tx_seq:
                x-field-uid: 11
              tx_outstanding_seq:
                x-field-uid: 12
              rx_init_ctl_os:
                x-field-uid: 13
              rx_init_echo_ctl_os:
                x-field-uid: 14
              rx_ack_ctl_os:
                x-field-uid: 15
              rx_nack_ctl_os:
                x-field-uid: 16
              rx_ack_nack_seq_error:
                x-field-uid: 17
              rx_ok:
                x-field-uid: 18
              rx_poisoned:
                x-field-uid: 19
              rx_bad:
                x-field-uid: 20
              rx_expected_seq_good:
                x-field-uid: 21
              rx_expected_seq_poisoned:
                x-field-uid: 22
              rx_expected_seq_bad:
                x-field-uid: 23
              rx_missing_seq:
                x-field-uid: 24
              rx_duplicate_seq:
                x-field-uid: 25
              rx_replay:
                x-field-uid: 26
              rx_next_seq:
                x-field-uid: 27
              llr_init_ctl_os_spacing_min:
                x-field-uid: 28
              llr_init_ctl_os_spacing_error:
                x-field-uid: 29
              llr_ack_nack_ctl_os_spacing_min:
                x-field-uid: 30
              llr_ack_nack_ctl_os_spacing_error:
                x-field-uid: 31
              llr_init_echo_init_seq_mismatch:
                x-field-uid: 32
              rx_ack_ctl_os_dropped:
                x-field-uid: 33
              rx_nack_ctl_os_dropped:
                x-field-uid: 34
              rx_init_ctl_os_dropped:
                x-field-uid: 35
              rx_init_echo_ctl_os_dropped:
                x-field-uid: 36
              ue_rx_ctl_os_frame_header_error:
                x-field-uid: 37
              ue_rx_ctl_os_intra_frame_spacing_error:
                x-field-uid: 38
              ue_ctl_os_spacing_min:
                x-field-uid: 39
              ue_ctl_os_spacing_error:
                x-field-uid: 40
          x-field-uid: 2

    UltraEthernet.Metric:
      description: >-
        Ultra Ethernet per port statistics information covering LLR, PHY/CtlOS and
        the CBFC per virtual channel state.
      type: object
      properties:
        name:
          description: >-
            The name of the configured Ultra Ethernet instance.
          type: string
          x-field-uid: 1
        llr_mode_local:
          description: >-
            The current LLR local mode (receive) reported by the device.
          type: string
          x-field-uid: 2
          x-enum:
            "off":
              x-field-uid: 1
            "on":
              x-field-uid: 2
        llr_mode_remote:
          description: >-
            The current LLR remote mode (transmit) reported by the device.
          type: string
          x-field-uid: 3
          x-enum:
            "off":
              x-field-uid: 1
            "on":
              x-field-uid: 2
        llr_transmit_state:
          description: >-
            The current LLR remote transmit state machine value.
          type: string
          x-field-uid: 4
          x-enum:
            "off":
              x-field-uid: 1
            init:
              x-field-uid: 2
            advance:
              x-field-uid: 3
            replay:
              x-field-uid: 4
            flush:
              x-field-uid: 5
        llr_ack_nack_transmit_state:
          description: >-
            The current LLR ACK/NACK transmit state machine value.
          type: string
          x-field-uid: 5
          x-enum:
            "off":
              x-field-uid: 1
            send_acks:
              x-field-uid: 2
            send_nack:
              x-field-uid: 3
            nack_sent:
              x-field-uid: 4
        round_trip_time_ns:
          description: >-
            The measured round trip time, in nanoseconds, of the LLR_INIT control
            ordered set handshake.
          type: integer
          format: uint64
          x-field-uid: 6
        mean_time_between_phy_errors:
          description: >-
            The mean time, in seconds, between PHY errors.
          type: number
          format: double
          x-field-uid: 7
        tx_init_ctl_os:
          description: Number of LLR_INIT control ordered sets transmitted.
          type: integer
          format: uint64
          x-field-uid: 8
        tx_init_echo_ctl_os:
          description: Number of LLR_INIT_ECHO control ordered sets transmitted.
          type: integer
          format: uint64
          x-field-uid: 9
        tx_ack_ctl_os:
          description: Number of LLR_ACK control ordered sets transmitted.
          type: integer
          format: uint64
          x-field-uid: 10
        tx_nack_ctl_os:
          description: Number of LLR_NACK control ordered sets transmitted.
          type: integer
          format: uint64
          x-field-uid: 11
        tx_discard:
          description: >-
            Number of LLR-eligible frames discarded by the LLR transmitter while in
            the INIT or FLUSH state with a discard behavior.
          type: integer
          format: uint64
          x-field-uid: 12
        tx_ok:
          description: Number of LLR-eligible frames transmitted with a good FCS.
          type: integer
          format: uint64
          x-field-uid: 13
        tx_poisoned:
          description: Number of LLR-eligible frames transmitted with a poisoned FCS.
          type: integer
          format: uint64
          x-field-uid: 14
        tx_replay_event:
          description: >-
            Number of times the transmitter completed a replay operation (exited the
            REPLAY state).
          type: integer
          format: uint64
          x-field-uid: 15
        replayed_packet:
          description: Number of LLR-eligible frames replayed.
          type: integer
          format: uint64
          x-field-uid: 16
        replayed_byte:
          description: Number of bytes replayed.
          type: integer
          format: uint64
          x-field-uid: 17
        tx_seq:
          description: The current LLR transmit sequence number.
          type: integer
          format: uint64
          x-field-uid: 18
        tx_outstanding_seq:
          description: The current number of unacknowledged transmitted frames.
          type: integer
          format: uint64
          x-field-uid: 19
        rx_init_ctl_os:
          description: Number of LLR_INIT control ordered sets received.
          type: integer
          format: uint64
          x-field-uid: 20
        rx_init_echo_ctl_os:
          description: Number of LLR_INIT_ECHO control ordered sets received.
          type: integer
          format: uint64
          x-field-uid: 21
        rx_ack_ctl_os:
          description: Number of LLR_ACK control ordered sets received.
          type: integer
          format: uint64
          x-field-uid: 22
        rx_nack_ctl_os:
          description: Number of LLR_NACK control ordered sets received.
          type: integer
          format: uint64
          x-field-uid: 23
        rx_ack_nack_seq_error:
          description: >-
            Number of LLR_ACK/LLR_NACK control ordered sets received with a sequence
            number error.
          type: integer
          format: uint64
          x-field-uid: 24
        rx_ok:
          description: Number of LLR-eligible frames received with a good FCS.
          type: integer
          format: uint64
          x-field-uid: 25
        rx_poisoned:
          description: Number of LLR-eligible frames received with a poisoned FCS.
          type: integer
          format: uint64
          x-field-uid: 26
        rx_bad:
          description: Number of LLR-eligible frames received with a bad FCS.
          type: integer
          format: uint64
          x-field-uid: 27
        rx_expected_seq_good:
          description: >-
            Number of LLR-eligible frames received with a good FCS that had the
            expected sequence number.
          type: integer
          format: uint64
          x-field-uid: 28
        rx_expected_seq_poisoned:
          description: >-
            Number of LLR-eligible frames received with a poisoned FCS that had the
            expected sequence number.
          type: integer
          format: uint64
          x-field-uid: 29
        rx_expected_seq_bad:
          description: >-
            Number of LLR-eligible frames received with a bad FCS that had the
            expected sequence number.
          type: integer
          format: uint64
          x-field-uid: 30
        rx_missing_seq:
          description: >-
            Number of LLR-eligible frames received that indicated a missing frame in
            the sequence.
          type: integer
          format: uint64
          x-field-uid: 31
        rx_duplicate_seq:
          description: >-
            Number of LLR-eligible frames received that had a duplicate sequence
            number.
          type: integer
          format: uint64
          x-field-uid: 32
        rx_replay:
          description: >-
            Number of times the receiver has detected the start of a replay.
          type: integer
          format: uint64
          x-field-uid: 33
        rx_next_seq:
          description: The current expected LLR receive sequence number.
          type: integer
          format: uint64
          x-field-uid: 34
        llr_init_ctl_os_spacing_min:
          description: >-
            The minimum observed spacing between received LLR_INIT control ordered
            sets.
          type: integer
          format: uint64
          x-field-uid: 35
        llr_init_ctl_os_spacing_error:
          description: >-
            Number of received LLR_INIT control ordered set minimum spacing
            violations.
          type: integer
          format: uint64
          x-field-uid: 36
        llr_ack_nack_ctl_os_spacing_min:
          description: >-
            The minimum observed spacing between received LLR_ACK/LLR_NACK control
            ordered sets.
          type: integer
          format: uint64
          x-field-uid: 37
        llr_ack_nack_ctl_os_spacing_error:
          description: >-
            Number of received LLR_ACK/LLR_NACK control ordered set minimum spacing
            violations.
          type: integer
          format: uint64
          x-field-uid: 38
        llr_init_echo_init_seq_mismatch:
          description: >-
            Number of received LLR_INIT_ECHO control ordered sets whose init sequence
            did not match the transmit sequence.
          type: integer
          format: uint64
          x-field-uid: 39
        rx_ack_ctl_os_dropped:
          description: Number of received LLR_ACK control ordered sets dropped.
          type: integer
          format: uint64
          x-field-uid: 40
        rx_nack_ctl_os_dropped:
          description: Number of received LLR_NACK control ordered sets dropped.
          type: integer
          format: uint64
          x-field-uid: 41
        rx_init_ctl_os_dropped:
          description: Number of received LLR_INIT control ordered sets dropped.
          type: integer
          format: uint64
          x-field-uid: 42
        rx_init_echo_ctl_os_dropped:
          description: Number of received LLR_INIT_ECHO control ordered sets dropped.
          type: integer
          format: uint64
          x-field-uid: 43
        ue_rx_ctl_os_frame_header_error:
          description: >-
            Number of received UE control ordered sets with a frame header error.
          type: integer
          format: uint64
          x-field-uid: 44
        ue_rx_ctl_os_intra_frame_spacing_error:
          description: >-
            Number of received UE control ordered set intra-frame spacing violations.
          type: integer
          format: uint64
          x-field-uid: 45
        ue_ctl_os_spacing_min:
          description: >-
            The minimum observed spacing between received UE control ordered sets.
          type: integer
          format: uint64
          x-field-uid: 46
        ue_ctl_os_spacing_error:
          description: >-
            Number of received UE control ordered set minimum spacing violations.
          type: integer
          format: uint64
          x-field-uid: 47
        cbfc_sender_virtual_channels:
          description: >-
            The CBFC sender per virtual channel credit state.
          type: array
          items:
            $ref: '#/components/schemas/UltraEthernet.Cbfc.Vc.Metric'
          x-field-uid: 48
        cbfc_receiver_virtual_channels:
          description: >-
            The CBFC receiver per virtual channel credit state.
          type: array
          items:
            $ref: '#/components/schemas/UltraEthernet.Cbfc.Vc.Metric'
          x-field-uid: 49

    UltraEthernet.Cbfc.Vc.Metric:
      description: >-
        CBFC per virtual channel (VC) credit state.
      type: object
      properties:
        vc_id:
          description: The zero based VC number.
          type: integer
          format: uint32
          x-field-uid: 1
        vc_state:
          description: The current operational state of the VC.
          type: string
          x-field-uid: 2
          x-enum:
            best_effort:
              x-field-uid: 1
            lossless:
              x-field-uid: 2
        credits_consumed:
          description: >-
            The credits consumed counter for this VC (S_VC_CC for the sender or
            R_VC_CC for the receiver).
          type: integer
          format: uint64
          x-field-uid: 3
        credits_freed:
          description: >-
            The credits freed counter for this VC (S_VC_CF for the sender or
            R_VC_CF for the receiver).
          type: integer
          format: uint64
          x-field-uid: 4
        credit_limit_exceeded_error:
          description: >-
            Indicates whether a credit limit exceeded condition was detected on this
            VC when the sender credit mode is per VC.
          type: boolean
          x-field-uid: 5
        excess_credit_freed_error:
          description: >-
            Indicates whether an excess credit freed condition was detected on this
            VC when the sender credit mode is per VC.
          type: boolean
          x-field-uid: 6
        lost_credit_error:
          description: >-
            Indicates whether a lost credit condition was detected on this VC when the
            credit mode is per VC.
          type: boolean
          x-field-uid: 7
        drain_rate_actual:
          description: >-
            The actual configured drain rate for this VC as a percentage of the port
            line rate. Applies to the receiver direction only.
          type: number
          format: double
          x-field-uid: 8
