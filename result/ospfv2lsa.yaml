components:
  schemas:
    Ospfv2Lsas.State.Request:
      description: >-
        The request to retrieve OSPFv2 Link State Advertisements (LSA) information learned by the
        routers.
      type: object
      properties:
        router_names:
          description: >-
            The names of OSPFv2 routers for which learned information is requested.
            An empty list will return results for all OSPFv2 routers.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Device.Ospfv2Router/properties/name"
          x-field-uid: 1
    Ospfv2Lsa.State:
      description: >-
        The result of OSPFv2 LSA information that are retrieved.
      type: object
      properties:
        router_name:
          description: >-
           The name of the OSPFv2 Router that learned the LSA information.
          type: string
          x-field-uid: 1
        router_lsas:
          description: >-
            One or more OSPFv2 Router-LSA - Type 1.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.RouterLsa'
          x-field-uid: 2
        network_lsas:
          description: >-
            One or more OSPFv2 Network-LSA - Type 2.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.NetworkLsa'
          x-field-uid: 3
        network_summary_lsas:
          description: >-
            One or more OSPFv2 Network summary LSA - Type 3.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.NetworkSummaryLsa'
          x-field-uid: 4
        summary_as_lsas:
          description: >-
            One or more OSPFv2 Autonomous System Boundary Router (ASBR) summary LSA - Type 4.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.SummaryAsLsa'
          x-field-uid: 5
        external_as_lsas:
          description: >-
            OSPFv2 AS-External-LSA - Type 5.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.ExternalAsLsa'
          x-field-uid: 6
        nssa_lsas:
          description: >-
            One or more OSPFv2 NSSA-LSA - Type 7.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.NssaLsa'
          x-field-uid: 7
        opaque_lsas:
          description: >-
            One or more OSPFv2 Link-Scope Opaque-LSA - Type 9.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.OpaqueLsa'
          x-field-uid: 8
    Ospfv2.RouterLsa:
      description: >-
        Contents of the router LSA.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        links:
          description: >-
            Links that are described within the LSA.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.Link'
          x-field-uid: 2
        label:
          description: >-
            The Segment Routing Node/Prefix-SID label or index learned for this router. This value
            is correlated from the Prefix-SID sub-TLV of the OSPFv2 Extended Prefix Opaque LSA
            (RFC 8665) advertised for the router's own prefix.
          type: integer
          format: uint32
          x-field-uid: 3
        srgb:
          description: >-
            The learned Segment Routing Global Block (SRGB) range(s) advertised by this router in
            the SID/Label Range TLV of the Router Information Opaque LSA (RFC 8665).
          type: string
          x-field-uid: 4
    Ospfv2.NetworkLsa:
      description: >-
        Contents of the Network LSA.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        neighbor_router_ids:
          description: >-
            Neighbor router ids that are described within the LSA.
          type: array
          items:
            type: string
            format: ipv4
          x-field-uid: 3
        
    Ospfv2.NetworkSummaryLsa:
      description: |-
        Contents of the Network Summary LSA - Type 3.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        label:
          description: >-
            The Segment Routing Prefix-SID label or index learned for this prefix. This value is
            correlated from the Prefix-SID sub-TLV of the OSPFv2 Extended Prefix Opaque LSA
            (RFC 8665), whose Extended Prefix TLV references this prefix by route type.
          type: integer
          format: uint32
          x-field-uid: 4
    Ospfv2.SummaryAsLsa:
      description: >-
        Contents of OSPFv2 Autonomous System Boundary Router (ASBR) summary LSA - Type 4.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
    Ospfv2.ExternalAsLsa:
      description: |-
        Contents of OSPFv2 AS-External-LSA - Type 5.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        metric_type:
          description: >-
            The type of metric associated with the route range.
          type: integer
          format: uint32
          x-field-uid: 4
        label:
          description: >-
            The Segment Routing Prefix-SID label or index learned for this prefix. This value is
            correlated from the Prefix-SID sub-TLV of the OSPFv2 Extended Prefix Opaque LSA
            (RFC 8665), whose Extended Prefix TLV references this prefix by route type.
          type: integer
          format: uint32
          x-field-uid: 5
    Ospfv2.NssaLsa:
      description: |-
        Contents of OSPFv2 NSSA LSA - Type 7.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        metric_type:
          description: >-
            The type of metric associated with the route range.
          type: integer
          format: uint32
          x-field-uid: 4 
        forwarding_address:
          description: >-
            IPv4 Forwarding address.
          type: string
          format: ipv4
          x-field-uid: 5
        label:
          description: >-
            The Segment Routing Prefix-SID label or index learned for this prefix. This value is
            correlated from the Prefix-SID sub-TLV of the OSPFv2 Extended Prefix Opaque LSA
            (RFC 8665), whose Extended Prefix TLV references this prefix by route type.
          type: integer
          format: uint32
          x-field-uid: 6
    Ospfv2.OpaqueLsa:
      description: >-
        Contents of OSPFv2 Opaque LSA - Type 7.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        type:
          description: >-
            The type of Opaque TE LSAs. The LSA type.
          type: string
          x-field-uid: 2
          x-enum:
            local:
              x-field-uid: 1
            area:
              x-field-uid: 2
            domain:
              x-field-uid: 3
        tlvs:
          description: >-
            The list of TLVs learned in this Opaque LSA. The Segment Routing information is carried
            here, e.g. the Extended Prefix TLV (with the Prefix-SID sub-TLV), the Extended Link TLV
            (with the Adjacency-SID / LAN Adjacency-SID sub-TLVs), and the Router Information (RI)
            SR-Algorithm, SID/Label Range (SRGB), SR Local Block (SRLB) and SRMS Preference TLVs.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.OpaqueLsaTlv'
          x-field-uid: 4
    Ospfv2.LsaHeader:
      description: >-
        Attributes in LSA Header.
      type: object
      properties:
        lsa_id:
          description: >-
            LSA ID in the IPv4 format. The Link State ID for the specified LSA type.
          type: string
          format: ipv4
          x-field-uid: 1
        advertising_router_id :
          description: >-
            The router ID (in the IPv4 format) of the router that originated the LSA.
          type: string
          format: ipv4
          x-field-uid: 2
        sequence_number:
          description: >-
            Sequence number to detect old and duplicate
            LSAs. The greater the sequence number the more recent the LSA.
          type: integer
          format: uint32
          x-field-uid: 3
        age:
          description: >-
            The time since the LSA's generation in seconds.
          type: integer
          format: uint32
          x-field-uid: 4
        option_bits:
          description: >-
            The optional bits.
          type: integer
          format: uint32
          x-field-uid: 5
    Ospfv2.Link:
      description: >-
        Generic attributes used to identify links within OSPFv2.
      type: object
      properties:
        type:
          description: >-
            The data associated with the link type. The value is
            dependent upon the subtype of the LSA.
            - point_to_point: The LSA represents a point-to-point connection to another router.
            - transit: The LSA represents a connection to a transit network.
            - stub: The LSA represents a connection to a stub network.
            - virtual: The LSA represents a virtual link connection.
          type: string
          x-enum:
            point_to_point:
              x-field-uid: 1
            transit:
              x-field-uid: 2
            stub:
              x-field-uid: 3
            virtual:
              x-field-uid: 4
          x-field-uid: 1
        id:
          description: |-
           The identifier for the link specified. The value of the link
           identifier is dependent upon the type of the LSA.
          type: string
          format: ipv4
          x-field-uid: 2
        data:
          description: |-
            The data associated with the link type. The value is
            dependent upon the subtype of the LSA. When the connection is
            to a stub network it represents the mask; for p2p connections
            that are unnumbered it represents the ifIndex value of the
            router's interface; for all other connections it represents
            the local system's IP address.
          type: string
          format: ipv4
          x-field-uid: 3
        metric:
          description: |-
            The data associated with the link type. The value is
            dependent upon the subtype of the LSA. When the connection is
            to a stub network it represents the mask; for p2p connections
            that are unnumbered it represents the ifIndex value of the
            router's interface; for all other connections it represents
            the local system's IP address.
          type: integer
          format: uint32
          x-field-uid: 4
        adjacency_label:
          description: >-
            The Segment Routing Adjacency SID label learned for this link. This value is correlated
            from the Adj-SID sub-TLV of the OSPFv2 Extended Link Opaque LSA (RFC 8665), whose
            Extended Link TLV references this link.
          type: integer
          format: uint32
          x-field-uid: 5

    Ospfv2.OpaqueLsaTlv:
      description: >-
        A single TLV learned within an OSPFv2 Opaque LSA, reported as a type, length and raw value.
      type: object
      properties:
        type:
          description: |-
            The Opaque LSA TLV type. The Segment Routing related types are the Extended Prefix TLV,
            the Extended Prefix Range TLV, the Router Information (RI) SR-Algorithm TLV, the RI
            Global (SRGB) and Local (SRLB) Label Range TLVs, the RI SRMS Preference TLV and the
            Extended Link TLV.
          type: string
          x-field-uid: 1
          x-enum:
            unknown:
              x-field-uid: 1
            router_address:
              x-field-uid: 2
            link:
              x-field-uid: 3
            extended_prefix:
              x-field-uid: 4
            extended_prefix_range:
              x-field-uid: 5
            ri_sr_algorithm:
              x-field-uid: 6
            ri_global_label_range:
              x-field-uid: 7
            ri_local_label_range:
              x-field-uid: 8
            ri_srms_preference:
              x-field-uid: 9
            extended_link:
              x-field-uid: 10
            ri_flex_algo_definition:
              x-field-uid: 11
        length:
          description: >-
            The length of the TLV value.
          type: integer
          format: uint32
          x-field-uid: 2
        value:
          description: >-
            The raw value of the TLV.
          type: string
          x-field-uid: 3
        sub_tlvs:
          description: >-
            The list of sub-TLVs learned within this TLV, e.g. the Prefix-SID, SID/Label,
            Adjacency-SID and LAN Adjacency-SID sub-TLVs.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.OpaqueLsaSubTlv'
          x-field-uid: 4

    Ospfv2.OpaqueLsaSubTlv:
      description: >-
        A single sub-TLV learned within an OSPFv2 Opaque LSA TLV, reported as a type, length and
        raw value.
      type: object
      properties:
        type:
          description: |-
            The Opaque LSA sub-TLV type. The Segment Routing related sub-TLV types are the
            Prefix-SID, the SID/Label, the Adjacency-SID (Adj SID or Label), the LAN Adjacency-SID
            (LAN Adj SID or Label) and the Source Router ID.
          type: string
          x-field-uid: 1
          x-enum:
            unknown:
              x-field-uid: 1
            prefix_sid:
              x-field-uid: 2
            sid_label:
              x-field-uid: 3
            adj_sid_label:
              x-field-uid: 4
            lan_adj_sid_label:
              x-field-uid: 5
            source_router_id:
              x-field-uid: 6
        length:
          description: >-
            The length of the sub-TLV value.
          type: integer
          format: uint32
          x-field-uid: 2
        value:
          description: >-
            The raw value of the sub-TLV.
          type: string
          x-field-uid: 3
