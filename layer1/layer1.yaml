components:
  schemas:
    Layer1:
      description: |-
        A container for layer1 settings.
      type: object
      required: [port_names, name]
      properties:
        port_names:
          description: |-
            A list of unique names of port objects that will share the
            choice settings. 
          type: array
          items:
            type: string
          x-constraint:
          - '/components/schemas/Port/properties/name'
          x-field-uid: 1
        speed:
          description: |-
            Set the speed if supported. When no speed is explicitly set, the current
            speed of underlying test interface shall be assumed.
          type: string
          x-include: ./layer1.yaml#/components/schemas/Layer1.SpeedEnum/properties/value
          x-field-uid: 2
        media:
          description: |-
            Set the type of media for test interface if supported. When no media
            type is explicitly set, the current media type of underlying test
            interface shall be assumed.
          type: string
          x-field-uid: 3
          x-enum:
            copper:
              x-field-uid: 1
            fiber:
              x-field-uid: 2
            sgmii:
              x-field-uid: 3
        promiscuous:
          description: |-
            Enable promiscuous mode on test interface. A warning shall be raised if
            this field is set to `true`, even when it's not supported, ignoring
            the setting altogether.
          type: boolean
          default: true
          x-field-uid: 4
        mtu:
          description: |-
            Set the maximum transmission unit size. A warning shall be raised if
            the specified value is valid but not supported, ignoring the setting altogether.
          type: integer
          format: uint32
          minimum: 64
          maximum: 14000
          default: 1500
          x-field-uid: 5
        ieee_media_defaults:
          description: |-
            Set to true to override the auto_negotiate, link_training,
            rs_fec and fec_mode settings for gigabit ethernet interfaces.
          type: boolean
          x-field-uid: 6
          x-status:
            status: under_review
            information: This field is currently under review for pending exploration on use cases
        auto_negotiate:
          description: |-
            Enable/disable auto negotiation.
          type: boolean
          x-field-uid: 7
          x-status:
            status: under_review
            information: This field is currently under review for pending exploration on use cases, given that a separate configuration called `AutoNegotiation` already exists.
        auto_negotiation:
          $ref: '#/components/schemas/Layer1.AutoNegotiation'
          x-field-uid: 8
        flow_control:
          $ref: '#/components/schemas/Layer1.FlowControl'
          x-field-uid: 9
        name:
          x-include: ../common/common.yaml#/components/schemas/Named.Object/properties/name
          x-field-uid: 10
        mode:
          description: |-
            Set the mode of the test interface, in addition to the speed.
            When no mode is explicitly set, mode_no_change applies i.e. the current
            mode of the underlying test interface shall be retained.
            The modes are mutually exclusive; a combination of modes, if ever needed,
            shall be introduced as a separate value.
            Supported modes:
              - mode_no_change: retain the current mode of the test interface (default).
              - mode_default: switch the test interface to the default mode of the
                configured speed i.e. the mode to which the hardware port boots up.
              - mode_macsec_128: switch the test interface to a mode that supports
                MACsec with a 128-bit cipher. MACsec itself is not configured by this
                field.
              - mode_macsec_256: switch the test interface to a mode that supports
                MACsec with a 256-bit cipher. MACsec itself is not configured by this
                field.
              - mode_high_stream: switch the test interface to a mode of the configured
                speed that supports a larger number of transmit flows than the default
                mode, typically at the expense of other capabilities of the test
                interface (e.g. per flow statistics or capture). Use this mode only
                when a test requires more flows than the test interface supports in
                its default mode. The number of flows supported and the capabilities
                traded off are implementation specific.
              - mode_rocev2: switch the test interface to a mode of the configured
                speed that supports RoCEv2 (RDMA over Converged Ethernet v2). RoCEv2
                itself is not configured by this field.
            If the requested mode is not supported for the configured speed or by the
            underlying test interface, an error shall be returned. This applies to
            every port in port_names; if any of them cannot be set to the requested
            mode, the configuration shall be rejected.
            If the current mode differs from the requested mode, the test interface
            shall be switched to the requested mode before the remaining layer1
            settings are applied.
          type: string
          default: mode_no_change
          x-field-uid: 11
          x-enum:
            mode_no_change:
              x-field-uid: 1
            mode_default:
              x-field-uid: 2
            mode_macsec_128:
              x-field-uid: 3
            mode_macsec_256:
              x-field-uid: 4
            mode_high_stream:
              x-field-uid: 5
            mode_rocev2:
              x-field-uid: 6
        signaling:
          description: |-
            Physical lane signaling for the configured speed. Combined with
            'speed' this determines the number of lanes and the per-lane rate,
            e.g. speed_400_gbps with pam4_106_gbps implies 4 lanes at
            106.25 Gbps each.
          type: string
          default: auto
          x-field-uid: 12
          x-enum:
            auto:
              description: |-
                Use the interface default signaling for the configured speed.
              x-field-uid: 1
            nrz:
              x-field-uid: 2
            pam4_53_gbps:
              x-field-uid: 3
            pam4_106_gbps:
              x-field-uid: 4
        fec_mode:
          description: |-
            The Forward Error Correction mode set or advertised.

            If any mode except for `default` is selected, the mode will either be
            advertised and requested during negotiation (if `auto_negotiate` is True),
            or set directly without negotiation (if `auto_negotiate` is False).

            Setting the mode to `default` lets the FEC mode be selected via the
            deprecated `auto_negotiation.rs_fec` field. This option enables preserving
            behavior for clients which are not yet using this field.

            Implementations should reject with an error FEC settings that are incompatible
            with the other parameters (speed etc).
          type: string
          default: default
          x-field-uid: 13
          x-enum:
            default:
              description: |-
                FEC setting is decided via the `auto_negotiation.rs_fec` field.

                See the description of that field for the exact semantics.
              x-field-uid: 1
            no_fec:
              description: |-
                FEC disabled.
              x-field-uid: 2
            rs_fec:
              description: |-
                Reed-Solomon RS(528,514) FEC, IEEE 802.3 Clause 91.
              x-field-uid: 3
            rs_fec_kp4:
              description: |-
                Reed-Solomon RS(544,514) FEC, IEEE 802.3 Clause 134 (KP4).
              x-field-uid: 4
    Layer1.SpeedEnum:
      description: |-
        Holder for the canonical Ethernet interface speed enum. Not a schema in
        the bundled artifacts; the value property is merged inline wherever it
        is included via x-include.
      type: object
      properties:
        value:
          type: string
          x-field-uid: 1
          x-enum:
            speed_10_fd_mbps:
              x-field-uid: 1
            speed_10_hd_mbps:
              x-field-uid: 2
            speed_100_fd_mbps:
              x-field-uid: 3
            speed_100_hd_mbps:
              x-field-uid: 4
            speed_1_gbps:
              x-field-uid: 5
            speed_10_gbps:
              x-field-uid: 6
            speed_25_gbps:
              x-field-uid: 7
            speed_40_gbps:
              x-field-uid: 8
            speed_50_gbps:
              x-field-uid: 9
            speed_100_gbps:
              x-field-uid: 10
            speed_200_gbps:
              x-field-uid: 11
            speed_400_gbps:
              x-field-uid: 12
            speed_800_gbps:
              x-field-uid: 13
    Layer1.AutoNegotiation:
      description: |-
        Configuration for auto negotiation settings
      type: object
      properties:
        advertise_1000_mbps:
          description: |-
            If auto_negotiate is true and the interface supports
            1000 megabits per second, then this speed will be advertised.
          type: boolean
          default: true
          x-field-uid: 1
        advertise_100_fd_mbps:
          description: |-
            If auto_negotiate is true and the interface supports
            100 megabits per second full-duplex, then this speed will be advertised.
          type: boolean
          default: true
          x-field-uid: 2
        advertise_100_hd_mbps:
          description: |-
            If auto_negotiate is true and the interface supports
            100 megabits per second, half-duplex, then this speed will be advertised.
          type: boolean
          default: true
          x-field-uid: 3
        advertise_10_fd_mbps:
          description: |-
            If auto_negotiate is true and the interface supports
            10 megabits per second, full-duplex, then this speed will be advertised.
          type: boolean
          default: true
          x-field-uid: 4
        advertise_10_hd_mbps:
          description: |-
            If auto_negotiate is true and the interface supports
            10 megabits per second, half-duplex, then this speed will be advertised.
          type: boolean
          default: true
          x-field-uid: 5
        link_training:
          description: |-
            Enable/disable gigabit ethernet link training.
          type: boolean
          default: false
          x-field-uid: 6
        rs_fec:
          description: |-
            Enables setting the Forward Error Correction mode for the link through
            auto-negotiation.

            If both this field and `auto_negotiate` are set, the Clause 91 Reed-Solomon
            FEC mode will be advertised and requested during negotiation. Otherwise, FEC
            will remain disabled, unless a specific mode is mandated by the link speed,
            in which case that one will be applied.

            This field is deprecated in favor of the `fec_mode` field and will be ignored
            if the latter is set to anything other than `default`.
          x-status:
            status: deprecated
            information: This property is deprecated in favor of the `fec_mode` field
          type: boolean
          default: false
          x-field-uid: 7
    Layer1.FlowControl:
      description: |-
        A container for layer1 receive flow control settings.
        To enable flow control settings on ports this object must be a valid
        object not a null value.
      type: object
      properties:
        directed_address:
          description: |-
            The 48bit mac address that the layer1 port names will listen on
            for a directed pause.
          type: string
          format: mac
          default: "01:80:C2:00:00:01"
          x-field-uid: 1
        choice:
          description: |-
            The type of priority flow control.
          type: string
          default: ieee_802_1qbb
          x-field-uid: 2
          x-enum:
            ieee_802_1qbb:
              x-field-uid: 1
            ieee_802_3x:
              x-field-uid: 2
        ieee_802_1qbb:
          $ref: '#/components/schemas/Layer1.Ieee8021qbb'
          x-field-uid: 3
        ieee_802_3x:
          $ref: '#/components/schemas/Layer1.Ieee8023x'
          x-field-uid: 4
    Layer1.Ieee8023x:
      description: |-
        A container for ieee 802.3x rx pause settings
      type: object
    Layer1.Ieee8021qbb:
      description: |-
        These settings enhance the existing 802.3x pause priority capabilities 
        to enable flow control based on 802.1p priorities (classes of service). 
      type: object
      properties:
        pfc_delay:
          description: |-
            The upper limit on the transmit time of a queue after receiving a 
            message to pause a specified priority.
            A value of 0 indicates that PFC delay will not be enabled. 
          type: integer
          format: uint32
          default: 0
          maximum: 65535
          x-field-uid: 1
        pfc_class_0:
          description: |-
            The priority group assigned to priority 0.
            
            All priorities mapped to the same group will be treated as if they were one
            priority, i.e. a pause/resume request received for any of the priorities in
            the group will pause/resume traffic for all of the priorities in the group.

            Use enabled_pfc_priorities to enable/disable PFC altogether for select priorities.
          type: integer
          format: uint32
          maximum: 7
          default: 0
          x-field-uid: 2
        pfc_class_1:
          description: |-
            The priority group assigned to priority 1.
            
            All priorities mapped to the same group will be treated as if they were one
            priority, i.e. a pause/resume request received for any of the priorities in
            the group will pause/resume traffic for all of the priorities in the group.

            Use enabled_pfc_priorities to enable/disable PFC altogether for select priorities.
          type: integer
          format: uint32
          maximum: 7
          default: 1
          x-field-uid: 3
        pfc_class_2:
          description: |-
            The priority group assigned to priority 2.
            
            All priorities mapped to the same group will be treated as if they were one
            priority, i.e. a pause/resume request received for any of the priorities in
            the group will pause/resume traffic for all of the priorities in the group.

            Use enabled_pfc_priorities to enable/disable PFC altogether for select priorities.
          type: integer
          format: uint32
          maximum: 7
          default: 2
          x-field-uid: 4
        pfc_class_3:
          description: |-
            The priority group assigned to priority 3.
            
            All priorities mapped to the same group will be treated as if they were one
            priority, i.e. a pause/resume request received for any of the priorities in
            the group will pause/resume traffic for all of the priorities in the group.

            Use enabled_pfc_priorities to enable/disable PFC altogether for select priorities.
          type: integer
          format: uint32
          maximum: 7
          default: 3
          x-field-uid: 5
        pfc_class_4:
          description: |-
            The priority group assigned to priority 4.
            
            All priorities mapped to the same group will be treated as if they were one
            priority, i.e. a pause/resume request received for any of the priorities in
            the group will pause/resume traffic for all of the priorities in the group.

            Use enabled_pfc_priorities to enable/disable PFC altogether for select priorities.
          type: integer
          format: uint32
          maximum: 7
          default: 4
          x-field-uid: 6
        pfc_class_5:
          description: |-
            The priority group assigned to priority 5.
            
            All priorities mapped to the same group will be treated as if they were one
            priority, i.e. a pause/resume request received for any of the priorities in
            the group will pause/resume traffic for all of the priorities in the group.

            Use enabled_pfc_priorities to enable/disable PFC altogether for select priorities.
          type: integer
          format: uint32
          maximum: 7
          default: 5
          x-field-uid: 7
        pfc_class_6:
          description: |-
            The priority group assigned to priority 6.
            
            All priorities mapped to the same group will be treated as if they were one
            priority, i.e. a pause/resume request received for any of the priorities in
            the group will pause/resume traffic for all of the priorities in the group.

            Use enabled_pfc_priorities to enable/disable PFC altogether for select priorities.
          type: integer
          format: uint32
          maximum: 7
          default: 6
          x-field-uid: 8
        pfc_class_7:
          description: |-
            The priority group assigned to priority 7.
            
            All priorities mapped to the same group will be treated as if they were one
            priority, i.e. a pause/resume request received for any of the priorities in
            the group will pause/resume traffic for all of the priorities in the group.

            Use enabled_pfc_priorities to enable/disable PFC altogether for select priorities.
          type: integer
          format: uint32
          maximum: 7
          default: 7
          x-field-uid: 9
        enabled_pfc_priorities:
          description: |-
            The list of priorities for which PFC is enabled.

            By default PFC is enabled for all priorities.

            Disabled priorities will not be considered to be part of a priority group
            regardless of their pfc_class_X setting.
          type: array
          default: [0, 1, 2, 3, 4, 5, 6, 7]
          uniqueItems: true
          maxItems: 8
          items:
            type: integer
            format: uint32
            minimum: 0
            maximum: 7
          x-field-uid: 10
