openapi: 3.0.3
info:
  title: LDP metric results model.
  version: ^0.0.0
components:
  schemas:
    Ldp.Metrics.Request:
      description: >-
        The request to retrieve LDP per router metrics/statistics.
      type: object
      properties:
        router_names:
          description: >-
            The names of LDP routers to return results for.
            An empty list will return results for all LDP routers.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Device.LdpRouter/properties/name"
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
            The name of the LDP router cannot be excluded.
          type: array
          items:
            type: string
            x-enum:
              sessions_up:
                x-field-uid: 1
              sessions_flap:
                x-field-uid: 2
              sessions_non_existent:
                x-field-uid: 3
              sessions_initialized:
                x-field-uid: 4
              sessions_open_received:
                x-field-uid: 5
              sessions_open_sent:
                x-field-uid: 6
              sessions_operational:
                x-field-uid: 7
              notifications_sent:
                x-field-uid: 8
              notifications_received:
                x-field-uid: 9
              label_mappings_sent:
                x-field-uid: 10
              label_mappings_received:
                x-field-uid: 11
              label_requests_sent:
                x-field-uid: 12
              label_requests_received:
                x-field-uid: 13
              label_withdraws_sent:
                x-field-uid: 14
              label_withdraws_received:
                x-field-uid: 15
              label_releases_sent:
                x-field-uid: 16
              label_releases_received:
                x-field-uid: 17
              label_abort_requests_sent:
                x-field-uid: 18
              label_abort_requests_received:
                x-field-uid: 19
              ingress_lsps_up:
                x-field-uid: 20
              egress_lsps_up:
                x-field-uid: 21
          x-field-uid: 2

    Ldp.Metric:
      description: >-
        LDP per router statistics information. A counter that is not reported
        by the implementation is absent.
      type: object
      properties:
        name:
          description: >-
            The name of a configured LDP router.
          type: string
          x-field-uid: 1
        sessions_up:
          description: >-
            The number of LDP sessions of this router that are up, that is in
            the OPERATIONAL state (RFC 5036 Section 2.5.4). Sessions formed
            through Basic (link) discovery (RFC 5036 Section 2.4.1) and through
            Extended (targeted) discovery (RFC 5036 Section 2.4.2) are both
            counted.
          type: integer
          format: uint64
          x-field-uid: 2
        sessions_flap:
          description: >-
            The number of times an LDP session of this router left the
            OPERATIONAL state (RFC 5036 Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 3
        sessions_non_existent:
          description: >-
            The number of LDP sessions of this router currently in the NON
            EXISTENT state of the session initialization state machine (RFC 5036
            Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 4
        sessions_initialized:
          description: >-
            The number of LDP sessions of this router currently in the
            INITIALIZED state of the session initialization state machine (RFC
            5036 Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 5
        sessions_open_received:
          description: >-
            The number of LDP sessions of this router currently in the OPENREC
            state of the session initialization state machine (RFC 5036 Section
            2.5.4).
          type: integer
          format: uint64
          x-field-uid: 6
        sessions_open_sent:
          description: >-
            The number of LDP sessions of this router currently in the OPENSENT
            state of the session initialization state machine (RFC 5036 Section
            2.5.4).
          type: integer
          format: uint64
          x-field-uid: 7
        sessions_operational:
          description: >-
            The number of LDP sessions of this router currently in the
            OPERATIONAL state of the session initialization state machine (RFC
            5036 Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 8
        notifications_sent:
          description: >-
            The number of Notification messages (type 0x0001, RFC 5036 Section
            3.5.1) sent.
          type: integer
          format: uint64
          x-field-uid: 9
        notifications_received:
          description: >-
            The number of Notification messages (type 0x0001, RFC 5036 Section
            3.5.1) received.
          type: integer
          format: uint64
          x-field-uid: 10
        label_mappings_sent:
          description: >-
            The number of Label Mapping messages (type 0x0400, RFC 5036
            Section 3.5.7) sent.
          type: integer
          format: uint64
          x-field-uid: 11
        label_mappings_received:
          description: >-
            The number of Label Mapping messages (type 0x0400, RFC 5036
            Section 3.5.7) received.
          type: integer
          format: uint64
          x-field-uid: 12
        label_requests_sent:
          description: >-
            The number of Label Request messages (type 0x0401, RFC 5036
            Section 3.5.8) sent.
          type: integer
          format: uint64
          x-field-uid: 13
        label_requests_received:
          description: >-
            The number of Label Request messages (type 0x0401, RFC 5036
            Section 3.5.8) received.
          type: integer
          format: uint64
          x-field-uid: 14
        label_withdraws_sent:
          description: >-
            The number of Label Withdraw messages (type 0x0402, RFC 5036
            Section 3.5.10) sent.
          type: integer
          format: uint64
          x-field-uid: 15
        label_withdraws_received:
          description: >-
            The number of Label Withdraw messages (type 0x0402, RFC 5036
            Section 3.5.10) received.
          type: integer
          format: uint64
          x-field-uid: 16
        label_releases_sent:
          description: >-
            The number of Label Release messages (type 0x0403, RFC 5036
            Section 3.5.11) sent.
          type: integer
          format: uint64
          x-field-uid: 17
        label_releases_received:
          description: >-
            The number of Label Release messages (type 0x0403, RFC 5036
            Section 3.5.11) received.
          type: integer
          format: uint64
          x-field-uid: 18
        label_abort_requests_sent:
          description: >-
            The number of Label Abort Request messages (type 0x0404, RFC 5036
            Section 3.5.9) sent.
          type: integer
          format: uint64
          x-field-uid: 19
        label_abort_requests_received:
          description: >-
            The number of Label Abort Request messages (type 0x0404, RFC 5036
            Section 3.5.9) received.
          type: integer
          format: uint64
          x-field-uid: 20
        ingress_lsps_up:
          description: >-
            The number of IPv4 Prefix FECs for which this LSR has received a
            label from a peer, that is LSPs for which this LSR is the ingress.
          type: integer
          format: uint64
          x-field-uid: 21
        egress_lsps_up:
          description: >-
            The number of IPv4 Prefix FECs advertised by this LSR for which a
            session to a peer is OPERATIONAL, that is LSPs for which this LSR
            is the egress.
          type: integer
          format: uint64
          x-field-uid: 22
