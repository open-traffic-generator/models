components:
  schemas:
    CollectiveCommunications.SingleCollective.AggregationOfIterations.Metrics.Request:
      description: >-
        Request for aggregated iteration metrics. Each row summarizes the iterations per collective datasize.
      type: object
      properties:
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              data_size_bytes:
                x-field-uid: 1
              collective:
                x-field-uid: 2
              iterations:
                x-field-uid: 3
              min_collective_time_ms:
                x-field-uid: 4
              avg_collective_time_ms:
                x-field-uid: 5
              max_collective_time_ms:
                x-field-uid: 6
              min_algo_bw_gbps:
                x-field-uid: 7
              avg_algo_bw_gbps:
                x-field-uid: 8
              max_algo_bw_gbps:
                x-field-uid: 9
              min_bus_bw_gbps:
                x-field-uid: 10
              avg_bus_bw_gbps:
                x-field-uid: 11
              max_bus_bw_gbps:
                x-field-uid: 12
              min_ideal_percentage:
                x-field-uid: 13
              avg_ideal_percentage:
                x-field-uid: 14
              max_ideal_percentage:
                x-field-uid: 15
              pfc_rx:
                x-field-uid: 16
              ecn_ce_rx:
                x-field-uid: 17
              frames_retx:
                x-field-uid: 18
              total_time_s:
                x-field-uid: 19
              duty_cycle_percentage:
                x-field-uid: 20
          x-field-uid: 1
    CollectiveCommunications.SingleCollective.AggregationOfIterations.Metric:
      description: >-
        One row of aggregated iteration metrics.
      type: object
      properties:
        data_size_bytes:
          description: >-
            Total data size in bytes of the collective across ranks.
          type: integer
          format: uint64
          x-field-uid: 1
        collective:
          description: >-
            Collective operation name.
          type: string
          x-field-uid: 2
        iterations:
          description: >-
            Number of benchmark runs per data size.
          type: integer
          format: uint32
          x-field-uid: 3
        min_collective_time_ms:
          description: >-
            Minimum collective time in milliseconds.
          type: number
          x-field-uid: 4
        avg_collective_time_ms:
          description: >-
            Average collective time in milliseconds.
          type: number
          x-field-uid: 5
        max_collective_time_ms:
          description: >-
            Maximum collective time in milliseconds.
          type: number
          x-field-uid: 6
        min_algo_bw_gbps:
          description: >-
            Minimum algorithm bandwidth (GB/s).
          type: number
          x-field-uid: 7
        avg_algo_bw_gbps:
          description: >-
            Average algorithm bandwidth (GB/s).
          type: number
          x-field-uid: 8
        max_algo_bw_gbps:
          description: >-
            Maximum algorithm bandwidth (GB/s).
          type: number
          x-field-uid: 9
        min_bus_bw_gbps:
          description: >-
            Minimum bus bandwidth (GB/s). Equals min_algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 10
        avg_bus_bw_gbps:
          description: >-
            Average bus bandwidth (GB/s). Equals avg_algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 11
        max_bus_bw_gbps:
          description: >-
            Maximum bus bandwidth (GB/s). Equals max_algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 12
        min_ideal_percentage:
          description: >-
            Minimum achieved bus bandwidth as a percentage of the ideal goodput.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 13
        avg_ideal_percentage:
          description: >-
            Average achieved bus bandwidth as a percentage of the ideal goodput.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 14
        max_ideal_percentage:
          description: >-
            Maximum achieved bus bandwidth as a percentage of the ideal goodput.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 15
        pfc_rx:
          description: >-
            Number of Priority Flow Control frames received.
          type: integer
          format: uint64
          x-field-uid: 16
        ecn_ce_rx:
          description: >-
            Number of frames received with ECN congestion encountered.
          type: integer
          format: uint64
          x-field-uid: 17
        frames_retx:
          description: >-
            Frames Retransmitted count.
          type: integer
          format: uint64
          x-field-uid: 18
        total_time_s:
          description: >-
            Time to complete all iterations, in seconds.
          type: number
          x-field-uid: 19
        duty_cycle_percentage:
          description: >-
            Ratio of total execution time utilized for actual collective
            operation (as percentage).
          type: number
          x-field-uid: 20
