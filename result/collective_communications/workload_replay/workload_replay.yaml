components:
  schemas:
    CollectiveCommunications.WorkloadReplay.Metrics.Request:
      description: >-
        Request for metrics from a Collective Communication Benchmark run with workload replay.
      type: object
      required:
        - choice
      properties:
        choice:
          description: >-
            The type of Workload Replay metrics to fetch.
          type: string
          x-field-uid: 1
          x-enum:
            summary:
              x-field-uid: 1
            iterations:
              x-field-uid: 2
            data_chunk:
              x-field-uid: 3
            flows:
              x-field-uid: 4
            qpairs:
              x-field-uid: 5
            ports:
              x-field-uid: 6
            packet_drop:
              x-field-uid: 7
            collectives:
              x-field-uid: 8
        summary:
          $ref: './summary.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Summary.Metrics.Request'
          x-field-uid: 2
        iterations:
          $ref: './iterations.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Iterations.Metrics.Request'
          x-field-uid: 3
        data_chunk:
          $ref: './data_chunk.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.DataChunk.Metrics.Request'
          x-field-uid: 4
        flows:
          $ref: './flow.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Flow.Metrics.Request'
          x-field-uid: 5
        qpairs:
          $ref: './qp.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Qp.Metrics.Request'
          x-field-uid: 6
        ports:
          $ref: './ports.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Ports.Metrics.Request'
          x-field-uid: 7
        packet_drop:
          $ref: './packet_drop.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.PacketDrop.Metrics.Request'
          x-field-uid: 8
        collectives:
          $ref: './collectives.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Collectives.Metrics.Request'
          x-field-uid: 9
    CollectiveCommunications.WorkloadReplay.Metrics.Response:
      description: >-
        Response containing Workload Replay metrics of the chosen type.
      type: object
      required:
        - choice
      properties:
        choice:
          description: >-
            The type of Workload Replay metrics contained in the response.
          type: string
          x-field-uid: 1
          x-enum:
            summary:
              x-field-uid: 1
            iterations:
              x-field-uid: 2
            data_chunk:
              x-field-uid: 3
            flows:
              x-field-uid: 4
            qpairs:
              x-field-uid: 5
            ports:
              x-field-uid: 6
            packet_drop:
              x-field-uid: 7
            collectives:
              x-field-uid: 8
        summary:
          description: >-
            The rows of summary metrics.
          type: array
          items:
            $ref: './summary.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Summary.Metric'
          x-field-uid: 2
        iterations:
          description: >-
            The rows of iteration metrics.
          type: array
          items:
            $ref: './iterations.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Iterations.Metric'
          x-field-uid: 3
        data_chunk:
          description: >-
            The rows of data-chunk-transfer metrics.
          type: array
          items:
            $ref: './data_chunk.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.DataChunk.Metric'
          x-field-uid: 4
        flows:
          description: >-
            The rows of flow metrics.
          type: array
          items:
            $ref: './flow.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Flow.Metric'
          x-field-uid: 5
        qpairs:
          description: >-
            The rows of queue-pair (QP) metrics.
          type: array
          items:
            $ref: './qp.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Qp.Metric'
          x-field-uid: 6
        ports:
          description: >-
            The rows of port metrics.
          type: array
          items:
            $ref: './ports.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Ports.Metric'
          x-field-uid: 7
        packet_drop:
          description: >-
            The rows of packet drop metrics.
          type: array
          items:
            $ref: './packet_drop.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.PacketDrop.Metric'
          x-field-uid: 8
        collectives:
          description: >-
            The rows of per-collective summary metrics.
          type: array
          items:
            $ref: './collectives.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Collectives.Metric'
          x-field-uid: 9
