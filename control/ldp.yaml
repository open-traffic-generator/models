openapi: 3.0.3
info:
  title: LDP Control models
  description: >-
    All LDP control schemas
  version: ^0.0.0
components:
  schemas:
    Action.Protocol.Ldp:
      description: >-
        Actions associated with LDP on configured resources.
      type: object
      required:
        - choice
      properties:
        choice:
          description: >-
            The LDP action to perform.
          type: string
          x-enum:
            initiate_graceful_restart:
              x-field-uid: 1
          x-field-uid: 1
        initiate_graceful_restart:
          description: >-
            Configuration for the initiation of an LDP graceful restart.
          $ref: '#/components/schemas/Action.Protocol.Ldp.InitiateGracefulRestart'
          x-field-uid: 2

    Action.Protocol.Ldp.InitiateGracefulRestart:
      description: >-
        Initiates an LDP graceful restart (RFC 3478) on the selected LDP
        routers. Each selected router closes its LDP sessions without
        withdrawing its labels, and re-establishes them after restart_delay
        seconds. The Initialization messages sent after the restart carry the
        FT Session TLV with the configured reconnect_time and recovery_time
        (RFC 3478 Section 2). A selected router must have graceful_restart
        configured; otherwise the implementation returns an error.
        If no name is specified, all configured LDP routers are restarted.
      type: object
      properties:
        router_names:
          description: >-
            The names of LDP routers to restart.
          type: array
          items:
            type: string
          x-constraint:
          - /components/schemas/Device.LdpRouter/properties/name
          x-field-uid: 1
        restart_delay:
          description: >-
            The time in seconds after which the selected LDP routers
            re-establish their sessions.
          type: integer
          format: uint32
          maximum: 3600
          default: 30
          x-field-uid: 2
