components:
  schemas:
    Port.Metrics.Request:
      description: >-
        The port result request to the traffic generator
      type: object
      properties:
        port_names:
          description: >-
            The names of objects to return results for.
            An empty list will return all port row results.
          type: array
          items:
            type: string
          x-constraint:
          - '/components/schemas/Port/properties/name'
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
            The name of the port cannot be excluded.
          type: array
          items:
            type: string
            x-enum:
              transmit:
                x-field-uid: 1
              location:
                x-field-uid: 2
              link:
                x-field-uid: 3
              capture:
                x-field-uid: 4
              frames_tx:
                x-field-uid: 5
              frames_rx:
                x-field-uid: 6
              bytes_tx:
                x-field-uid: 7
              bytes_rx:
                x-field-uid: 8
              frames_tx_rate:
                x-field-uid: 9
              frames_rx_rate:
                x-field-uid: 10
              bytes_tx_rate:
                x-field-uid: 11
              bytes_rx_rate:
                x-field-uid: 12
              last_change:
                x-field-uid: 13
              speed:
                x-field-uid: 14
              pfc:
                x-field-uid: 15
          x-field-uid: 2
    Port.Metric:
      description: >-
        The per-port result metrics.
      type: object
      properties:
        name:
          description: >-
            The name of a configured port
          type: string
          x-constraint:
          - '/components/schemas/Port/properties/name'
          x-field-uid: 1
        location:
          description: >-
            The state of the connection to the test port location.
            The format should be the configured port location along with  any custom
            connection state message.
          type: string
          x-field-uid: 2
        link:
          description: >-
            The state of the test port link
            The string can be up, down or a custom error message.
          type: string
          x-field-uid: 3
          x-enum:
            up:
              x-field-uid: 1
            down:
              x-field-uid: 2
        capture:
          description: >-
            The state of the test port capture infrastructure.
            The string can be started, stopped or a custom error message.
          type: string
          x-field-uid: 4
          x-enum:
            started:
              x-field-uid: 1
            stopped:
              x-field-uid: 2
        frames_tx:
          description: >-
            The current total number of frames transmitted
          type: integer
          format: uint64
          x-field-uid: 5
        frames_rx:
          description: >-
            The current total number of valid frames received
          type: integer
          format: uint64
          x-field-uid: 6
        bytes_tx:
          description: >-
            The current total number of bytes transmitted
          type: integer
          format: uint64
          x-field-uid: 7
        bytes_rx:
          description: >-
            The current total number of valid bytes received
          type: integer
          format: uint64
          x-field-uid: 8
        frames_tx_rate:
          description: >-
            The current rate of frames transmitted
          type: number
          x-field-uid: 9
        frames_rx_rate:
          description: >-
            The current rate of valid frames received
          type: number
          x-field-uid: 10
        bytes_tx_rate:
          description: >-
            The current rate of bytes transmitted
          type: number
          x-field-uid: 11
        bytes_rx_rate:
          description: >-
            The current rate of bytes received
          type: number
          x-field-uid: 12
        transmit:
          description: >-
            The transmit state of the flow.
          type: string
          x-field-uid: 13
          x-enum:
            started:
              x-field-uid: 1
            stopped:
              x-field-uid: 2
        last_change:
          description: |-
            The timestamp indicates the absolute time of the last 
            link state change of the test port (e.g., up-to-down transition).
      
            The value is the timestamp in nanoseconds relative to
            the Unix Epoch (Jan 1, 1970 00:00:00 UTC).
          type: integer
          format: uint64
          x-field-uid: 14
        data_integrity:
          $ref: '#/components/schemas/Metric.DataIntegrity'
          x-field-uid: 15
        speed:
          description: >-
            The speed in KBps the frames are transmitted. The calculated speed for 
            a negotiated line speed of
            (i) 100 Gbps is 100 * 1000 * 1000 / 8 = 12500000 KBps,
            (ii) 1.6 Tbps (high performance devices) is 1.6 * 1000 * 1000 * 1000 / 8 = 200000000 KBps,
            (iii) 10 Mbps (legacy devices) is 10 * 1000 / 8 = 1250 KBps
          type: integer
          format: uint64
          x-field-uid: 16
        pfc:
          $ref: '#/components/schemas/Metric.Pfc'
          x-field-uid: 17
    Metric.Pfc:
      description: |-
        The container for Priority Flow Control (PFC) metrics, as defined by IEEE 802.1Qbb.
        Counters are kept per priority (class) 0-7 for received PFC pause frames.
      type: object
      properties:
        rx:
          $ref: '#/components/schemas/Metric.Pfc.Rx'
          x-field-uid: 1
    Metric.Pfc.Rx:
      description: |-
        The per-priority counters of PFC pause frames received on the port.
      type: object
      properties:
        class_0:
          description: >-
            The number of IEEE 802.1Qbb PFC pause frames received on this port with bit 0 set in the
            priority-enable vector, requesting the peer to pause priority 0 traffic (PCP 0, default
            traffic type "Best Effort" in IEEE 802.1Q Annex I). A frame that enables multiple priorities
            is counted in each corresponding counter. The traffic-type mapping is the 802.1Q default
            and operators can remap it.
          type: integer
          format: uint64
          x-field-uid: 1
        class_1:
          description: >-
            The number of IEEE 802.1Qbb PFC pause frames received on this port with bit 1 set in the
            priority-enable vector, requesting the peer to pause priority 1 traffic (PCP 1, default
            traffic type "Background" in IEEE 802.1Q Annex I). A frame that enables multiple priorities
            is counted in each corresponding counter. The traffic-type mapping is the 802.1Q default
            and operators can remap it.
          type: integer
          format: uint64
          x-field-uid: 2
        class_2:
          description: >-
            The number of IEEE 802.1Qbb PFC pause frames received on this port with bit 2 set in the
            priority-enable vector, requesting the peer to pause priority 2 traffic (PCP 2, default
            traffic type "Excellent Effort" in IEEE 802.1Q Annex I). A frame that enables multiple priorities
            is counted in each corresponding counter. The traffic-type mapping is the 802.1Q default
            and operators can remap it.
          type: integer
          format: uint64
          x-field-uid: 3
        class_3:
          description: >-
            The number of IEEE 802.1Qbb PFC pause frames received on this port with bit 3 set in the
            priority-enable vector, requesting the peer to pause priority 3 traffic (PCP 3, default
            traffic type "Critical Applications" in IEEE 802.1Q Annex I). A frame that enables multiple priorities
            is counted in each corresponding counter. The traffic-type mapping is the 802.1Q default
            and operators can remap it.
          type: integer
          format: uint64
          x-field-uid: 4
        class_4:
          description: >-
            The number of IEEE 802.1Qbb PFC pause frames received on this port with bit 4 set in the
            priority-enable vector, requesting the peer to pause priority 4 traffic (PCP 4, default
            traffic type "Video" in IEEE 802.1Q Annex I). A frame that enables multiple priorities
            is counted in each corresponding counter. The traffic-type mapping is the 802.1Q default
            and operators can remap it.
          type: integer
          format: uint64
          x-field-uid: 5
        class_5:
          description: >-
            The number of IEEE 802.1Qbb PFC pause frames received on this port with bit 5 set in the
            priority-enable vector, requesting the peer to pause priority 5 traffic (PCP 5, default
            traffic type "Voice" in IEEE 802.1Q Annex I). A frame that enables multiple priorities
            is counted in each corresponding counter. The traffic-type mapping is the 802.1Q default
            and operators can remap it.
          type: integer
          format: uint64
          x-field-uid: 6
        class_6:
          description: >-
            The number of IEEE 802.1Qbb PFC pause frames received on this port with bit 6 set in the
            priority-enable vector, requesting the peer to pause priority 6 traffic (PCP 6, default
            traffic type "Internetwork Control" in IEEE 802.1Q Annex I). A frame that enables multiple priorities
            is counted in each corresponding counter. The traffic-type mapping is the 802.1Q default
            and operators can remap it.
          type: integer
          format: uint64
          x-field-uid: 7
        class_7:
          description: >-
            The number of IEEE 802.1Qbb PFC pause frames received on this port with bit 7 set in the
            priority-enable vector, requesting the peer to pause priority 7 traffic (PCP 7, default
            traffic type "Network Control" in IEEE 802.1Q Annex I). A frame that enables multiple priorities
            is counted in each corresponding counter. The traffic-type mapping is the 802.1Q default
            and operators can remap it.
          type: integer
          format: uint64
          x-field-uid: 8
    Metric.DataIntegrity:
      description: |-
        The container for data integrity metrics. The container will be empty if 
        options.port_options.data_integrity has not been enabled during set_config.
      type: object
      properties:
        total_frames_rx:
          description: |-
            The total number of data integrity enabled frames received
          type: integer
          format: uint64
          x-field-uid: 1
        error_frames_rx:
          description: |-
            The total number of data integrity enabled frames received with payload modified
          type: integer
          format: uint64
          x-field-uid: 2
