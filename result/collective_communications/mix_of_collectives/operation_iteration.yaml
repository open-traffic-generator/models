components:
  schemas:
    CollectiveCommunications.MixOfCollectives.OperationIteration.Metrics.Request:
      description: >-
        Request for operation iteration metrics. Contains completion time and throughput details for each operation iteration of each collective datasize.
      type: object
      properties:
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              workload:
                x-field-uid: 2
              operation:
                x-field-uid: 3
              process_group:
                x-field-uid: 4
              data_size_bytes:
                x-field-uid: 5
              collective:
                x-field-uid: 6
              workload_set_iteration:
                x-field-uid: 7
              workload_iteration:
                x-field-uid: 8
              operation_iteration:
                x-field-uid: 9
              collective_start_time_ms:
                x-field-uid: 10
              collective_end_time_ms:
                x-field-uid: 11
              collective_completion_time_ms:
                x-field-uid: 12
              algbw_gbps:
                x-field-uid: 13
              busbw_gbps:
                x-field-uid: 14
              ideal_percentage:
                x-field-uid: 15
              min_fct_ms:
                x-field-uid: 16
              p50_fct_ms:
                x-field-uid: 17
              p95_fct_ms:
                x-field-uid: 18
              max_fct_ms:
                x-field-uid: 19
              p99_fct_ms:
                x-field-uid: 20
              p99_99_fct_ms:
                x-field-uid: 21
          x-field-uid: 1
    CollectiveCommunications.MixOfCollectives.OperationIteration.Metric:
      description: >-
        One row of operation iteration metrics.
      type: object
      properties:
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        workload:
          description: >-
            The name of the workload, within the workload set, that owns this collective.
          type: string
          x-field-uid: 2
        operation:
          description: >-
            The name of the operation.
          type: string
          x-field-uid: 3
        process_group:
          description: >-
            The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 4
        data_size_bytes:
          description: >-
            Total data size in bytes of the collective across ranks.
          type: integer
          format: uint64
          x-field-uid: 5
        collective:
          description: >-
            The collective algorithm type of the operation.
          type: string
          x-field-uid: 6
        workload_set_iteration:
          description: >-
            The workload set iteration in which this operation iteration was
            executed.
          type: integer
          format: uint32
          x-field-uid: 7
        workload_iteration:
          description: >-
            The workload iteration in which this operation iteration was
            executed.
          type: integer
          format: uint32
          x-field-uid: 8
        operation_iteration:
          description: >-
            The operation iteration index within the workload iteration for this
            collective.
          type: integer
          format: uint32
          x-field-uid: 9
        collective_start_time_ms:
          description: >-
            Start time of the collective operation iteration measured in
            milliseconds since the start of execution.
          type: number
          x-field-uid: 10
        collective_end_time_ms:
          description: >-
            End time of the collective operation iteration measured in
            milliseconds since the start of execution.
          type: number
          x-field-uid: 11
        collective_completion_time_ms:
          description: >-
            Completion time of the collective operation iteration (end minus
            start), in ms.
          type: number
          x-field-uid: 12
        algbw_gbps:
          description: >-
            Algorithmic bandwidth (GB/s) achieved during this operation
            iteration.
          type: number
          x-field-uid: 13
        busbw_gbps:
          description: >-
            Bus bandwidth in GB/s. Equals algbw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 14
        ideal_percentage:
          description: >-
            Achieved bus bandwidth as a percentage of the ideal goodput.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 15
        min_fct_ms:
          description: >-
            Minimum per-flow completion time (ms) observed in this operation
            iteration.
          type: number
          x-field-uid: 16
        p50_fct_ms:
          description: >-
            50th percentile (median) per-flow completion time (ms) in this
            operation iteration.
          type: number
          x-field-uid: 17
        p95_fct_ms:
          description: >-
            95th percentile per-flow completion time (ms) in this operation
            iteration.
          type: number
          x-field-uid: 18
        max_fct_ms:
          description: >-
            Maximum per-flow completion time (ms) observed in this operation
            iteration.
          type: number
          x-field-uid: 19
        p99_fct_ms:
          description: >-
            99th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 20
        p99_99_fct_ms:
          description: >-
            99.99th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 21
