components:
  schemas:
    CollectiveCommunications.SingleCollective.Metrics.Request:
      description: >-
        Request for metrics from a Collective Communication Benchmark run with a single collective.
      type: object
      required:
        - choice
      properties:
        choice:
          description: >-
            The type of Single Collective metrics to fetch.
          type: string
          x-field-uid: 1
          x-enum:
            summary:
              x-field-uid: 1
            data_chunk:
              x-field-uid: 2
            flows:
              x-field-uid: 3
            qpairs:
              x-field-uid: 4
            ports:
              x-field-uid: 5
            iterations_summary:
              x-field-uid: 6
            iteration:
              x-field-uid: 7
            packet_drop:
              x-field-uid: 8
        summary:
          $ref: './summary.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Summary.Metrics.Request'
          x-field-uid: 2
        data_chunk:
          $ref: './data_chunk.yaml#/components/schemas/CollectiveCommunications.SingleCollective.DataChunk.Metrics.Request'
          x-field-uid: 3
        flows:
          $ref: './flow.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Flow.Metrics.Request'
          x-field-uid: 4
        qpairs:
          $ref: './qp.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Qp.Metrics.Request'
          x-field-uid: 5
        ports:
          $ref: './ports.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Ports.Metrics.Request'
          x-field-uid: 6
        iterations_summary:
          $ref: './iterations_summary.yaml#/components/schemas/CollectiveCommunications.SingleCollective.IterationsSummary.Metrics.Request'
          x-field-uid: 7
        iteration:
          $ref: './iteration.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Iteration.Metrics.Request'
          x-field-uid: 8
        packet_drop:
          $ref: './packet_drop.yaml#/components/schemas/CollectiveCommunications.SingleCollective.PacketDrop.Metrics.Request'
          x-field-uid: 9
    CollectiveCommunications.SingleCollective.Metrics.Response:
      description: >-
        Response containing Single Collective metrics of the chosen type.
      type: object
      required:
        - choice
      properties:
        choice:
          description: >-
            The type of Single Collective metrics contained in the response.
          type: string
          x-field-uid: 1
          x-enum:
            summary:
              x-field-uid: 1
            data_chunk:
              x-field-uid: 2
            flows:
              x-field-uid: 3
            qpairs:
              x-field-uid: 4
            ports:
              x-field-uid: 5
            iterations_summary:
              x-field-uid: 6
            iteration:
              x-field-uid: 7
            packet_drop:
              x-field-uid: 8
        summary:
          description: >-
            The rows of summary metrics.
          type: array
          items:
            $ref: './summary.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Summary.Metric'
          x-field-uid: 2
        data_chunk:
          description: >-
            The rows of data-chunk-transfer metrics.
          type: array
          items:
            $ref: './data_chunk.yaml#/components/schemas/CollectiveCommunications.SingleCollective.DataChunk.Metric'
          x-field-uid: 3
        flows:
          description: >-
            The rows of flow metrics.
          type: array
          items:
            $ref: './flow.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Flow.Metric'
          x-field-uid: 4
        qpairs:
          description: >-
            The rows of queue-pair (QP) metrics.
          type: array
          items:
            $ref: './qp.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Qp.Metric'
          x-field-uid: 5
        ports:
          description: >-
            The rows of port metrics.
          type: array
          items:
            $ref: './ports.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Ports.Metric'
          x-field-uid: 6
        iterations_summary:
          description: >-
            The rows of iteration summary metrics.
          type: array
          items:
            $ref: './iterations_summary.yaml#/components/schemas/CollectiveCommunications.SingleCollective.IterationsSummary.Metric'
          x-field-uid: 7
        iteration:
          description: >-
            The rows of iteration metrics.
          type: array
          items:
            $ref: './iteration.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Iteration.Metric'
          x-field-uid: 8
        packet_drop:
          description: >-
            The rows of packet drop metrics.
          type: array
          items:
            $ref: './packet_drop.yaml#/components/schemas/CollectiveCommunications.SingleCollective.PacketDrop.Metric'
          x-field-uid: 9
