components:
  schemas:
    Flow.Igmpv3:
      description: >-
        Packet Header for IGMPv3 (RFC 9776, which obsoletes RFC 3376), carried
        directly in IPv4. The choice selects the Membership Query or the IGMPv3
        Membership Report. A conforming message is sent with IP protocol number
        two, TTL one, IP precedence Internetwork Control (ToS 0xc0) and the IP
        Router Alert option (RFC 2113). The model does not enforce these
        requirements, so any value the fields can encode may be configured for
        negative testing.

        The IPv4 and Ethernet destinations are set in their own headers. Use
        these values (RFC 9776 Sections 4.1.12 and 4.2.15):

        General Query:
          IPv4 dst = 224.0.0.1
        Group-Specific and Group-and-Source Specific Query:
          IPv4 dst = group_address
        IGMPv3 Membership Report:
          IPv4 dst = 224.0.0.22, IPv4 src = a unicast address or 0.0.0.0

        Ethernet dst = 01:00:5e + low 23 bits of the IPv4 dst (RFC 1112
        Section 6.4), for example 224.0.0.22 gives 01:00:5e:00:00:16.

        The flow size overrides the packet length, so set it large enough for
        the whole message. A Query is twelve octets plus four per source. A
        Report is eight octets plus, per group record, eight octets plus four
        per source plus four per aux_data_length word. Ethernet, IPv4 with
        Router Alert and the FCS add 42 octets. The default flow size of 64
        fits a Query with up to two sources or a Report with one record of up
        to one source.
      type: object
      properties:
        choice:
          description: >-
            Selects the IGMPv3 message, default is membership_query.
          type: string
          default: membership_query
          x-field-uid: 1
          x-enum:
            membership_query:
              x-field-uid: 1
            membership_report:
              x-field-uid: 2
        membership_query:
          $ref: '#/components/schemas/Flow.Igmpv3.MembershipQuery'
          x-field-uid: 2
        membership_report:
          $ref: '#/components/schemas/Flow.Igmpv3.MembershipReport'
          x-field-uid: 3
    Flow.Igmpv3.MembershipQuery:
      description: >-
        IGMPv3 Membership Query message (RFC 9776 Section 4.1).
      type: object
      properties:
        type:
          x-field-pattern:
            description: >-
              IGMP message type (RFC 9776 Section 4.1). Default 17 (0x11), Membership
              Query. This header always sends the IGMPv3 layout, the eight octet IGMPv1 and
              IGMPv2 messages use the igmpv1 and igmpv2 headers. Another value sends this
              layout with that type for negative testing, receivers silently ignore
              unrecognized types.
            format: integer
            length: 8
            default: 17
            features: [count]
          x-field-uid: 1
        max_resp_code:
          x-field-pattern:
            description: >-
              Max Resp Code (RFC 9776 Section 4.1.1), the maximum time hosts may wait
              before they report, in units of 1/10 second. Below 128 it is the time itself,
              so the default 100 is 10 seconds (Section 8.3). From 128 up it is floating
              point: the high bit is set, the next three bits are exp and the low four bits
              are mant, and the time is (mant OR 0x10) shifted left by (exp plus three), so
              128 is 12.8 seconds and 255 is 3174.4 seconds. The value is sent as
              configured. Group-Specific and Group-and-Source Specific Queries normally use
              10 (Section 8.8).
            format: integer
            length: 8
            default: 100
            features: [count]
          x-field-uid: 2
        checksum:
          x-field-pattern:
            description: >-
              Checksum (RFC 9776 Section 4.1.2), the 16-bit one's complement of the
              one's complement sum of the whole IGMP message, which is the entire IP
              payload including every source address. There is no pseudo-header.
            format: checksum
            length: 16
          x-field-uid: 3
        group_address:
          x-field-pattern:
            description: >-
              Group Address (RFC 9776 Section 4.1.3), zero for a General Query and the
              group being queried for a Group-Specific or Group-and-Source Specific Query.
            format: ipv4
            default: 0.0.0.0
            features: [count]
          x-field-uid: 4
        flags:
          x-field-pattern:
            description: >-
              Flags (RFC 9776 Section 4.1.4), four bits managed by IANA (RFC 9778
              Section 2.2). The most significant bit (value eight) is E, Extension (RFC
              9279), which is set only when an extension follows the sources, the other
              bits are unassigned. This header does not model the extension, so a
              conforming message from it has flags zero.
            format: integer
            length: 4
            default: 0
            features: [count]
          x-field-uid: 5
        s_flag:
          x-field-pattern:
            description: >-
              S flag, Suppress Router-Side Processing (RFC 9776 Section 4.1.5). When set
              to one, receiving routers skip their normal timer updates for this Query,
              Querier election and host-side processing still happen.
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 6
        qrv:
          x-field-pattern:
            description: >-
              QRV, Querier's Robustness Variable (RFC 9776 Section 4.1.6). A querier
              whose Robustness Variable is above seven sends zero, and a receiver of zero
              uses its own value. The default is the RFC default of two (Section 8.1).
            format: integer
            length: 3
            default: 2
            features: [count]
          x-field-uid: 7
        qqic:
          x-field-pattern:
            description: >-
              QQIC, Querier's Query Interval Code (RFC 9776 Section 4.1.7), in seconds.
              Below 128 it is the interval itself, so the default 125 is the RFC default
              Query Interval (Section 8.2). From 128 up it uses the floating point form of
              max_resp_code, so 255 is 31744 seconds. Zero tells receivers to use their
              own default. The value is sent as configured.
            format: integer
            length: 8
            default: 125
            features: [count]
          x-field-uid: 8
        number_of_sources:
          x-field-pattern:
            description: >-
              Number of source addresses in the query, zero for a general and a
              group-specific query. When auto, it is set to the number of entries in
              sources.
            format: integer
            length: 16
            default: 0
            features: [auto, count]
          x-field-uid: 9
        sources:
          description: >-
            List of unicast source addresses of a group-and-source-specific query.
          type: array
          items:
            $ref: '#/components/schemas/Flow.Igmpv3.Source'
          x-field-uid: 10
    Flow.Igmpv3.MembershipReport:
      description: >-
        IGMPv3 Membership Report message (RFC 9776 Section 4.2).
      type: object
      properties:
        type:
          x-field-pattern:
            description: >-
              IGMP message type (RFC 9776 Section 4.2). Default 34 (0x22), IGMPv3
              Membership Report. Another value sends this layout with that type for
              negative testing, receivers silently ignore unrecognized types.
            format: integer
            length: 8
            default: 34
            features: [count]
          x-field-uid: 1
        reserved:
          x-field-pattern:
            description: >-
              Reserved field, set to zero by the sender and ignored by the receiver.
            format: integer
            length: 8
            default: 0
            features: [count]
          x-field-uid: 2
        checksum:
          x-field-pattern:
            description: >-
              Checksum (RFC 9776 Section 4.2.2), the 16-bit one's complement of the
              one's complement sum of the whole IGMP message, which is the entire IP
              payload including every group record and any aux_data. There is no
              pseudo-header.
            format: checksum
            length: 16
          x-field-uid: 3
        flags:
          x-field-pattern:
            description: >-
              Flags (RFC 9776 Section 4.2.3), sixteen bits managed by IANA (RFC 9778
              Section 2.3). The most significant bit (value 0x8000) is E, Extension (RFC
              9279), which is set only when an extension follows the last group record,
              the other bits are unassigned. This header does not model the extension, so
              a conforming message from it has flags zero.
            format: integer
            length: 16
            default: 0
            features: [count]
          x-field-uid: 4
        number_of_group_records:
          x-field-pattern:
            description: >-
              Number of group records. When auto, it is set to the number of entries
              in group_records.
            format: integer
            length: 16
            default: 0
            features: [auto, count]
          x-field-uid: 5
        group_records:
          description: >-
            List of group records, each one reports the membership state of one
            multicast group.
          type: array
          items:
            $ref: '#/components/schemas/Flow.Igmpv3.GroupRecord'
          x-field-uid: 6
    Flow.Igmpv3.GroupRecord:
      description: >-
        A group record of the Version 3 Membership Report (RFC 9776 Section 4.2.5).
      type: object
      properties:
        record_type:
          x-field-pattern:
            x-constants:
              mode_is_include: 1
              mode_is_exclude: 2
              change_to_include_mode: 3
              change_to_exclude_mode: 4
              allow_new_sources: 5
              block_old_sources: 6
            description: >-
              Record Type (RFC 9776 Section 4.2.13). Current-State records, sent in
              reply to a Query, are mode_is_include and mode_is_exclude. Filter-Mode-Change
              records are change_to_include_mode and change_to_exclude_mode.
              Source-List-Change records are allow_new_sources and block_old_sources. A
              change_to_include_mode record with no sources is how a host leaves a group.
              Receivers silently ignore other values, so any value up to 255 may be sent
              for negative testing.
            format: integer
            length: 8
            default: 1
            features: [count]
          x-field-uid: 1
        aux_data_length:
          x-field-pattern:
            description: >-
              Aux Data Len (RFC 9776 Section 4.2.7), the length of aux_data in 32-bit
              words. When auto, it is the length of aux_data in octets divided by four, so
              zero when aux_data is omitted. A conforming sender uses zero (Section
              4.2.11), set a value to make it disagree with aux_data for negative
              testing.
            format: integer
            length: 8
            default: 0
            features: [auto, count]
          x-field-uid: 2
        number_of_sources:
          x-field-pattern:
            description: >-
              Number of source addresses in this record. When auto, it is set to the
              number of entries in sources.
            format: integer
            length: 16
            default: 0
            features: [auto, count]
          x-field-uid: 3
        multicast_address:
          x-field-pattern:
            description: >-
              Multicast Address (RFC 9776 Section 4.2.9), the IPv4 multicast group this
              record reports on. Several records may name the same group.
            format: ipv4
            default: 0.0.0.0
            features: [count]
          x-field-uid: 4
        sources:
          description: >-
            List of unicast source addresses of this record.
          type: array
          items:
            $ref: '#/components/schemas/Flow.Igmpv3.Source'
          x-field-uid: 5
        aux_data:
          description: >-
            Auxiliary Data (RFC 9776 Section 4.2.11) as a hex string of whole 32-bit
            words, so a multiple of eight hex characters, up to 255 words. IGMPv3 defines
            no auxiliary data, so a conforming sender omits it and a receiver ignores
            it. Other lengths are not valid and the result is implementation
            specific.
          type: string
          format: hex
          maxLength: 2040
          x-field-uid: 6
    Flow.Igmpv3.Source:
      description: >-
        One source address entry of a Query (RFC 9776 Section 4.1.9) or of a
        group record (RFC 9776 Section 4.2.10). Each entry is one IPv4 address
        in the message, so add one entry per source to carry several sources.
      type: object
      properties:
        address:
          x-field-pattern:
            description: >-
              Unicast IPv4 source address. A counter or a values list changes
              the address from packet to packet across the flow, it does not
              add sources to the message.
            format: ipv4
            default: 0.0.0.0
            features: [count]
          x-field-uid: 1
