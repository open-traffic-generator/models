components:
  schemas:
    CollectiveCommunications.MixOfCollectives.Qp.Metrics.Request:
      description: >-
        Request for queue-pair (QP) metrics. Contains detailed message statistics for each queue-pair used in the collective.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              process_group:
                x-field-uid: 2
              data_size:
                x-field-uid: 3
              collective:
                x-field-uid: 4
              src_qp_id:
                x-field-uid: 5
              dst_qp_id:
                x-field-uid: 6
              source_rank:
                x-field-uid: 7
              destination_rank:
                x-field-uid: 8
              source_nic:
                x-field-uid: 9
              destination_nic:
                x-field-uid: 10
              messages_sent:
                x-field-uid: 11
              messages_received:
                x-field-uid: 12
              messages_failed:
                x-field-uid: 13
              bytes_tx:
                x-field-uid: 14
              bytes_rx:
                x-field-uid: 15
              frames_tx:
                x-field-uid: 16
              frames_rx:
                x-field-uid: 17
              frames_delta:
                x-field-uid: 18
              frames_seq_error:
                x-field-uid: 19
              frames_re_tx:
                x-field-uid: 20
              ack_tx:
                x-field-uid: 21
              ack_rx:
                x-field-uid: 22
              nack_tx:
                x-field-uid: 23
              nack_rx:
                x-field-uid: 24
              nack_rnr_rx:
                x-field-uid: 25
              reordered_rx:
                x-field-uid: 26
              duplicate_rx:
                x-field-uid: 27
              ecn_ce_rx:
                x-field-uid: 28
              cnp_tx:
                x-field-uid: 29
              cnp_rx:
                x-field-uid: 30
              min_latency:
                x-field-uid: 31
              avg_latency:
                x-field-uid: 32
              max_latency:
                x-field-uid: 33
          x-field-uid: 2
    CollectiveCommunications.MixOfCollectives.Qp.Metric:
      description: >-
        One row of queue-pair (QP) metrics.
      type: object
      properties:
        workload_set:
          description: The workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        process_group:
          description: The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 2
        data_size:
          description: Data size in bytes.
          type: integer
          format: uint64
          x-field-uid: 3
        collective:
          description: Identifier of the collective operation.
          type: string
          x-field-uid: 4
        src_qp_id:
          description: Source QP ID.
          type: integer
          x-field-uid: 5
        dst_qp_id:
          description: Destination QP ID.
          type: integer
          x-field-uid: 6
        source_rank:
          description: Source rank.
          type: integer
          x-field-uid: 7
        destination_rank:
          description: Destination rank.
          type: integer
          x-field-uid: 8
        source_nic:
          description: Source NIC index.
          type: integer
          x-field-uid: 9
        destination_nic:
          description: Destination NIC index.
          type: integer
          x-field-uid: 10
        messages_sent:
          description: Messages sent.
          type: integer
          format: uint64
          x-field-uid: 11
        messages_received:
          description: Messages received.
          type: integer
          format: uint64
          x-field-uid: 12
        messages_failed:
          description: Messages failed.
          type: integer
          format: uint64
          x-field-uid: 13
        bytes_tx:
          description: Total bytes Tx (this includes retransmitted bytes as well).
          type: integer
          format: uint64
          x-field-uid: 14
        bytes_rx:
          description: Total bytes Rx (this includes retransmitted bytes as well).
          type: integer
          format: uint64
          x-field-uid: 15
        frames_tx:
          description: Frames Tx.
          type: integer
          format: uint64
          x-field-uid: 16
        frames_rx:
          description: Frames Rx.
          type: integer
          format: uint64
          x-field-uid: 17
        frames_delta:
          description: Frames delta.
          type: integer
          x-field-uid: 18
        frames_seq_error:
          description: Frames sequence error.
          type: integer
          format: uint64
          x-field-uid: 19
        frames_re_tx:
          description: Frames ReTx.
          type: integer
          format: uint64
          x-field-uid: 20
        ack_tx:
          description: ACK Tx.
          type: integer
          format: uint64
          x-field-uid: 21
        ack_rx:
          description: ACK Rx.
          type: integer
          format: uint64
          x-field-uid: 22
        nack_tx:
          description: NACK Tx.
          type: integer
          format: uint64
          x-field-uid: 23
        nack_rx:
          description: NACK Rx.
          type: integer
          format: uint64
          x-field-uid: 24
        nack_rnr_rx:
          description: NACK RNR Rx.
          type: integer
          format: uint64
          x-field-uid: 25
        reordered_rx:
          description: Reordered Rx.
          type: integer
          format: uint64
          x-field-uid: 26
        duplicate_rx:
          description: Duplicate Rx.
          type: integer
          format: uint64
          x-field-uid: 27
        ecn_ce_rx:
          description: ECN-CE Rx.
          type: integer
          format: uint64
          x-field-uid: 28
        cnp_tx:
          description: CNP Tx.
          type: integer
          format: uint64
          x-field-uid: 29
        cnp_rx:
          description: CNP Rx.
          type: integer
          format: uint64
          x-field-uid: 30
        min_latency:
          description: Minimum latency in nanoseconds.
          type: integer
          format: uint64
          x-field-uid: 31
        avg_latency:
          description: Average latency in nanoseconds.
          type: integer
          format: uint64
          x-field-uid: 32
        max_latency:
          description: Maximum latency in nanoseconds.
          type: integer
          format: uint64
          x-field-uid: 33
