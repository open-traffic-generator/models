components:
  schemas:
    CollectiveCommunications.WorkloadReplay.Collectives.Metrics.Request:
      description: >-
        Request for collectives metrics. Summarizes the completion times and throughput rates per collective datasize.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              data_size_bytes:
                x-field-uid: 1
              collective:
                x-field-uid: 2
              iterations:
                x-field-uid: 3
              completion_time_ms:
                x-field-uid: 4
              algo_bw_gbps:
                x-field-uid: 5
              bus_bw_gbps:
                x-field-uid: 6
              ideal_percentage:
                x-field-uid: 7
              pfc_rx:
                x-field-uid: 8
              ecn_ce_rx:
                x-field-uid: 9
              frames_retx:
                x-field-uid: 10
              total_time_s:
                x-field-uid: 11
              duty_cycle_percentage:
                x-field-uid: 12
          x-field-uid: 2
    CollectiveCommunications.WorkloadReplay.Collectives.Metric:
      description: >-
        One row of collectives metrics.
      type: object
      properties:
        data_size_bytes:
          description: >-
            Collective operation data size (in Bytes).
          type: integer
          format: uint64
          x-field-uid: 1
        collective:
          description: >-
            Collective operation name.
          type: string
          x-field-uid: 2
        iterations:
          description: >-
            Number of benchmark runs per data size.
          type: integer
          format: uint32
          x-field-uid: 3
        completion_time_ms:
          description: >-
            Time to complete collective operation, in milliseconds.
          type: number
          x-field-uid: 4
        algo_bw_gbps:
          description: >-
            Algorithm bandwidth, calculated as Collective Size / Time (in 1e9 Bytes/sec).
          type: number
          x-field-uid: 5
        bus_bw_gbps:
          description: >-
            Bus bandwidth, calculated as `algo_bw` multiplied by a
            collective-dependent compensation factor (in GB/s).
          type: number
          x-field-uid: 6
        ideal_percentage:
          description: >-
            Bus bandwidth divided by ideal goodput (as percentage).
          type: number
          x-field-uid: 7
        pfc_rx:
          description: >-
            Total number of Priority Flow Control frames received.
          type: integer
          format: uint64
          x-field-uid: 8
        ecn_ce_rx:
          description: >-
            Total number of frames received with ECN congestion encountered.
          type: integer
          format: uint64
          x-field-uid: 9
        frames_retx:
          description: >-
            Frames Retransmitted count.
          type: integer
          format: uint64
          x-field-uid: 10
        total_time_s:
          description: >-
            Time to complete all iterations, in seconds.
          type: number
          x-field-uid: 11
        duty_cycle_percentage:
          description: >-
            Ratio of total execution time utilized for actual collective
            operation (as percentage).
          type: number
          x-field-uid: 12
