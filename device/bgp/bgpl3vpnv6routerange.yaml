components:
  schemas:
    Bgp.L3vpn.V6RouteRange:
      description: >-
        Emulated VPN-IPv6 customer route range belonging to a Bgp.L3vpn.Vrf
        (RFC 4659, 6VPE). Same shape as the plain Bgp.V6RouteRange, except the
        dataplane binding is selected via service_binding, so a VPN-IPv6
        route range can advertise either a VPN MPLS label (RFC 4364 Section 3)
        or an SRv6 Service SID (RFC 9252).
      type: object
      required: [name]
      properties:
        addresses:
          x-include: ./bgpv6routerange.yaml#/components/schemas/Bgp.V6RouteRange/properties/addresses
          x-field-uid: 1
        next_hop_mode:
          x-include: ./bgpv6routerange.yaml#/components/schemas/Bgp.V6RouteRange/properties/next_hop_mode
          x-field-uid: 2
        next_hop_address_type:
          x-include: ./bgpv6routerange.yaml#/components/schemas/Bgp.V6RouteRange/properties/next_hop_address_type
          x-field-uid: 3
        next_hop_ipv4_address:
          x-include: ./bgpv6routerange.yaml#/components/schemas/Bgp.V6RouteRange/properties/next_hop_ipv4_address
          x-field-uid: 4
        next_hop_ipv6_address:
          x-include: ./bgpv6routerange.yaml#/components/schemas/Bgp.V6RouteRange/properties/next_hop_ipv6_address
          x-field-uid: 5
        advanced:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/advanced
          x-field-uid: 6
        communities:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/communities
          x-field-uid: 7
        as_path:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/as_path
          x-field-uid: 8
        add_path:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/add_path
          x-field-uid: 9
        name:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/name
          x-field-uid: 10
        extended_communities:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/extended_communities
          x-field-uid: 11
        service_binding:
          description: >-
            Selects and configures this route range's VPN dataplane binding -
            VPN MPLS label (default, RFC 4364 Section 3) or SRv6 Service SID
            (RFC 9252).
          $ref: '#/components/schemas/Bgp.L3vpn.V6ServiceBinding'
          x-field-uid: 12

    Bgp.L3vpn.V6ServiceBinding:
      description: >-
        Selects how a VPN-IPv6 route range's dataplane binding is advertised -
        either the traditional VPN MPLS label (RFC 4364 Section 3) or an SRv6
        Service SID (RFC 9252). Exactly one choice applies per route range.
      type: object
      properties:
        choice:
          description: >-
            The VPN dataplane encoding advertised for this route range's
            routes.
          type: string
          default: mpls_labels
          x-enum:
            mpls_labels:
              x-field-uid: 1
            srv6_sid:
              x-field-uid: 2
          x-field-uid: 1
        mpls_labels:
          description: >-
            Optional configuration for a BGP speaker to bind an address
            prefix to one or more MPLS labels (RFC 3107/8277, RFC 4364
            Section 3).
          $ref: './bgpmplslabelbindings.yaml#/components/schemas/Bgp.MplsLabelBindings'
          x-field-uid: 2
        srv6_sid:
          description: >-
            SRv6 Service SID binding advertised for this route range in
            place of an MPLS label (RFC 9252).
          $ref: './bgpl3vpnsrv6.yaml#/components/schemas/Bgp.L3vpn.Srv6Sid'
          x-field-uid: 3
