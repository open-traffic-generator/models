openapi: 3.0.3
info:
  title: BGP Control models
  description: >-
    All BGP control schemas
  version: ^0.0.0
components:
  schemas:
    Action.Protocol.Bgp:
      description: >-
        Actions associated with BGP on configured resources.
      type: object
      required:
        - choice
      properties:
        choice:
          type: string
          x-enum:
            notification:
              x-field-uid: 1
            initiate_graceful_restart:
              x-field-uid: 2
            peer:
              x-field-uid: 3
            route:
              x-field-uid: 4
          x-field-uid: 1
        notification:
          $ref: "#/components/schemas/Action.Protocol.Bgp.Notification"
          x-field-uid: 2
        initiate_graceful_restart:
          $ref: "#/components/schemas/Action.Protocol.Bgp.InitiateGracefulRestart"
          x-field-uid: 3
        peer:
          x-status:
            status: under_review
            information: This is subject to change.
          $ref: "#/components/schemas/Action.Protocol.Bgp.Peer"
          x-field-uid: 4
        route:
          x-status:
            status: under_review
            information: This is subject to change.
          $ref: "#/components/schemas/Action.Protocol.Bgp.Route"
          x-field-uid: 5

    Action.Protocol.Bgp.Peer:
      description: >-
        Actions associated with configured BGP peers.
      type: object
      required:
        - choice
      properties:
        choice:
          type: string
          x-enum:
            flap:
              x-field-uid: 1
          x-field-uid: 1
        flap:
          $ref: "#/components/schemas/Action.Protocol.Bgp.Peer.Flap"
          x-field-uid: 2

    Action.Protocol.Bgp.Peer.Flap:
      description: >-
        Flaps the selected BGP peer sessions on the fly by continuously bringing them down and up.
      type: object
      required:
        - enable
      properties:
        peer_names:
          description: >-
            The names of BGP peers to flap.
            An empty or null list will flap all configured BGP peers.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Bgp.V4Peer/properties/name"
          - "/components/schemas/Bgp.V6Peer/properties/name"
          x-field-uid: 1
        enable:
          description: >-
            Enables or disables flapping of the selected BGP peer sessions.
          type: boolean
          x-field-uid: 2
        up_time:
          description: >-
            The duration (in seconds) for which each BGP session stays up in a flap cycle.
          type: integer
          format: uint32
          x-field-uid: 3
        down_time:
          description: >-
            The duration (in seconds) for which each BGP session stays down in a flap cycle.
          type: integer
          format: uint32
          x-field-uid: 4

    Action.Protocol.Bgp.Route:
      description: >-
        Actions associated with configured BGP routes.
      type: object
      required:
        - choice
      properties:
        choice:
          type: string
          x-enum:
            flap:
              x-field-uid: 1
          x-field-uid: 1
        flap:
          $ref: "#/components/schemas/Action.Protocol.Bgp.Route.Flap"
          x-field-uid: 2

    Action.Protocol.Bgp.Route.Flap:
      description: >-
        Flaps the selected BGP route ranges on the fly by continuously withdrawing and re-advertising them.
      type: object
      required:
        - enable
      properties:
        route_names:
          description: >-
            The names of BGP route ranges to flap.
            An empty or null list will flap all configured BGP route ranges.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Bgp.V4RouteRange/properties/name"
          - "/components/schemas/Bgp.V6RouteRange/properties/name"
          x-field-uid: 1
        enable:
          description: >-
            Enables or disables flapping of the selected BGP route ranges.
          type: boolean
          x-field-uid: 2
        up_time:
          description: >-
            The duration (in seconds) for which each route stays advertised in a flap cycle.
          type: integer
          format: uint32
          x-field-uid: 3
        down_time:
          description: >-
            The duration (in seconds) for which each route stays withdrawn in a flap cycle.
          type: integer
          format: uint32
          x-field-uid: 4
        delay:
          description: >-
            The delay (in seconds) before flapping begins after it is enabled.
          type: integer
          format: uint32
          x-field-uid: 5
        partial_flap:
          description: >-
            Enables flapping of only a subset of the routes within each selected route range,
            bounded by flap_from_route_index and flap_to_route_index.
            When disabled, all routes in the range are flapped.
          type: boolean
          x-field-uid: 6
        flap_from_route_index:
          description: >-
            The starting route index (inclusive) of the subset to flap when partial_flap is enabled.
          type: integer
          format: uint32
          x-field-uid: 7
        flap_to_route_index:
          description: >-
            The ending route index (inclusive) of the subset to flap when partial_flap is enabled.
          type: integer
          format: uint32
          x-field-uid: 8

    Action.Protocol.Bgp.Notification:
      description: >-
        A NOTIFICATION message is sent when an error is detected with the BGP session, such as hold timer expiring, misconfigured AS number 
        or a BGP session reset is requested. This causes the BGP connection to close. Send explicit NOTIFICATIONs for list of specified 
        BGP peers. If a user wants to send custom Error Code and Error Subcode the custom object should be configured.
        A user can send IANA defined BGP NOTIFICATIONs according to https://www.iana.org/assignments/bgp-parameters/bgp-parameters.xhtml. 
      type: object
      properties:
        names:
          description: >-
            The names of BGP Peers to send NOTIFICATION to. If no name is specified then NOTIFICATION will be sent to all configured BGP peers.
          type: array
          items:
            type: string
          x-constraint:
          - /components/schemas/Bgp.V4Peer/properties/name
          - /components/schemas/Bgp.V6Peer/properties/name
          x-field-uid: 1
        choice:
          description: >-
            Each BGP NOTIFICATION message includes an Error Code field indicating what type of problem occurred. For certain Error Codes, an Error 
            Subcode field provides additional details about the specific nature of the problem. 
            The choice value will provide the Error Code used in NOTIFICATION message. 
            The Subcode can be set for each of the corresponding errors except for Hold Timer Expired error and BGP Finite State Machine error. 
            In both of these cases Subcode 0 will be sent. If a user wants to use non zero Sub Code then custom choice can be used.
          type: string
          x-field-uid: 2
          default: cease
          x-enum:
            cease:
              x-field-uid: 1
            message_header_error:
              x-field-uid: 2
            open_message_error:
              x-field-uid: 3
            update_message_error:
              x-field-uid: 4
            hold_timer_expired:
              x-field-uid: 5
            finite_state_machine_error:
              x-field-uid: 6
            custom:
              x-field-uid: 7

        cease:
          $ref: '#/components/schemas/Device.Bgp.CeaseError'
          x-field-uid: 3 
        message_header_error:
          $ref: '#/components/schemas/Device.Bgp.MessageHeaderError'
          x-field-uid: 4 
        open_message_error:
          $ref: '#/components/schemas/Device.Bgp.OpenMessageError'
          x-field-uid: 5 
        update_message_error:
          $ref: '#/components/schemas/Device.Bgp.UpdateMessageError'
          x-field-uid: 6 
        hold_timer_expired:
          $ref: '#/components/schemas/Device.Bgp.HoldTimerExpired'
          x-field-uid: 7
        finite_state_machine_error:
          $ref: '#/components/schemas/Device.Bgp.FiniteStateMachineError'
          x-field-uid: 8
        custom:
          $ref: '#/components/schemas/Device.Bgp.CustomError'
          x-field-uid: 9
        fin_delay:
          description: |-
            Delay (in milliseconds) between generation of the Notification and transmission of FIN to close the 
            TCP socket by the implementation. This is useful to ensure that the remote end has received and processed
            the Notification before closing the BGP session.            
          type: integer
          format: uint32
          maximum: 10000
          default: 0
          x-field-uid: 10

    Action.Protocol.Bgp.InitiateGracefulRestart:
      description: >-
        Initiates BGP Graceful Restart process for the selected BGP peers.
        If no name is specified then Graceful Restart will be sent to all configured BGP peers.
        To emulate scenarios where a peer sends a Notification and stops the session, an optional
        Notification object is included. If the remote peer and the local peer are both configured
        to perform Graceful Restart for Notification triggered session , this will result in 
        Graceful Restart scenario to be triggered as per RFC8538.
      type: object
      properties:
        peer_names:
          description: >-
            The names of device BGP peers objects to control.
          type: array
          items:
            type: string
          x-constraint:
          - /components/schemas/Bgp.V4Peer/properties/name
          - /components/schemas/Bgp.V6Peer/properties/name
          x-field-uid: 1
        restart_delay:
          description: |-
            Duration (in seconds) after which selected BGP peers will initiate 
            Graceful restart by sending the Open Message with Restart State bit set in the Graceful Restart capability.
          type: integer
          format: uint32
          maximum: 3600
          default: 30
          x-field-uid: 2
        notification: 
          description: |-
            Send a Notification to the peer as per configured parameters when initially bringing down a session as per
            configured parameters.
          $ref: "#/components/schemas/Action.Protocol.BgpGracefulRestart.Notification"
          x-field-uid: 3

    Action.Protocol.BgpGracefulRestart.Notification:
      description: >-
        Defines the explicit contents of the NOTIFICATION message to be sent when executing InitiateGracefulRestart trigger. 
        This causes the BGP connection to close.If a user wants to send custom Error Code and Error Subcode the custom object should be configured.
        A user can send IANA defined BGP NOTIFICATIONs according to https://www.iana.org/assignments/bgp-parameters/bgp-parameters.xhtml. 
      type: object
      properties:       
        choice:
          description: >-
            Each BGP NOTIFICATION message includes an Error Code field indicating what type of problem occurred. For certain Error Codes, an Error 
            Subcode field provides additional details about the specific nature of the problem. 
            The choice value will provide the Error Code used in NOTIFICATION message. 
            The Subcode can be set for each of the corresponding errors except for Hold Timer Expired error and BGP Finite State Machine error. 
            In both of these cases Subcode 0 will be sent. If a user wants to use non zero Sub Code then custom choice can be used.
          type: string
          x-field-uid: 2
          default: cease
          x-enum:
            cease:
              x-field-uid: 1
            message_header_error:
              x-field-uid: 2
            open_message_error:
              x-field-uid: 3
            update_message_error:
              x-field-uid: 4
            hold_timer_expired:
              x-field-uid: 5
            finite_state_machine_error:
              x-field-uid: 6
            custom:
              x-field-uid: 7

        cease:
          $ref: '#/components/schemas/Device.Bgp.CeaseError'
          x-field-uid: 3 
        message_header_error:
          $ref: '#/components/schemas/Device.Bgp.MessageHeaderError'
          x-field-uid: 4 
        open_message_error:
          $ref: '#/components/schemas/Device.Bgp.OpenMessageError'
          x-field-uid: 5 
        update_message_error:
          $ref: '#/components/schemas/Device.Bgp.UpdateMessageError'
          x-field-uid: 6 
        hold_timer_expired:
          $ref: '#/components/schemas/Device.Bgp.HoldTimerExpired'
          x-field-uid: 7
        finite_state_machine_error:
          $ref: '#/components/schemas/Device.Bgp.FiniteStateMachineError'
          x-field-uid: 8
        custom:
          $ref: '#/components/schemas/Device.Bgp.CustomError'
          x-field-uid: 9