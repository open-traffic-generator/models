components:
  schemas:
    CollectiveCommunications.WorkloadReplay.Summary.Metrics.Request:
      description: >-
        Request for Workload Replay summary metrics. Contains JCT and fabric usage statistics for the entire workload.
      type: object
      properties:
        workload:
          description: >-
            Filter results by workload name. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              ranks:
                x-field-uid: 1
              iterations:
                x-field-uid: 2
              job_completion_time_ms:
                x-field-uid: 3
              computation_time_ms:
                x-field-uid: 4
              communication_time_ms:
                x-field-uid: 5
              exposed_time_ms:
                x-field-uid: 6
              overlap_ms:
                x-field-uid: 7
              overlap_percentage:
                x-field-uid: 8
              peak_fabric_utilization_percentage:
                x-field-uid: 9
          x-field-uid: 2
    CollectiveCommunications.WorkloadReplay.Summary.Metric:
      description: >-
        One row of summary metrics.
      type: object
      properties:
        workload:
          description: >-
            Name of the replayed workload.
          type: string
          x-field-uid: 1
        ranks:
          description: >-
            The total number of parallel nodes participating in the RDMA
            emulation job.
          type: integer
          format: uint32
          x-field-uid: 2
        iterations:
          description: >-
            How many times the communication and computation cycle is repeated
            during a simulation job.
          type: integer
          format: uint32
          x-field-uid: 3
        job_completion_time_ms:
          description: >-
            The total elapsed time (ms) from the start to the end of an emulation
            job, encompassing all iterations and all ranks.
          type: number
          x-field-uid: 4
        computation_time_ms:
          description: >-
            The total time (ms) spent on computation across all iterations and
            ranks, excluding time spent on communication or waiting for data.
          type: number
          x-field-uid: 5
        communication_time_ms:
          description: >-
            The cumulative time (ms) spent on data exchange between ranks during
            all iterations of the job.
          type: number
          x-field-uid: 6
        exposed_time_ms:
          description: >-
            The total time (ms) during which communication occurs without
            overlapping with computation, across all iterations and ranks.
          type: number
          x-field-uid: 7
        overlap_ms:
          description: >-
            The total time (ms) during which communication overlaps with
            computation.
          type: number
          x-field-uid: 8
        overlap_percentage:
          description: >-
            The percentage of communication time that is overlapped with
            computation time.
          type: number
          x-field-uid: 9
        peak_fabric_utilization_percentage:
          description: >-
            Measures how effectively the underlying network (or 'fabric') is
            being used during communication phases (as percentage).
          type: number
          x-field-uid: 10
