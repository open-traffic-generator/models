components:
  schemas:
    CollectiveCommunications.MixOfCollectives.WorkloadSetIteration.Metrics.Request:
      description: >-
        Request for workload set iteration metrics. Contains details timing and throughput statistics for each collective in each workload set iteration.
      type: object
      properties:
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              operation:
                x-field-uid: 2
              process_group:
                x-field-uid: 3
              data_size_bytes:
                x-field-uid: 4
              collective:
                x-field-uid: 5
              workload_set_iteration:
                x-field-uid: 6
              workload_iterations:
                x-field-uid: 7
              operation_iterations:
                x-field-uid: 8
              min_collective_time_ms:
                x-field-uid: 9
              avg_collective_time_ms:
                x-field-uid: 10
              max_collective_time_ms:
                x-field-uid: 11
              min_algo_bw_gbps:
                x-field-uid: 12
              avg_algo_bw_gbps:
                x-field-uid: 13
              max_algo_bw_gbps:
                x-field-uid: 14
              min_bus_bw_gbps:
                x-field-uid: 15
              avg_bus_bw_gbps:
                x-field-uid: 16
              max_bus_bw_gbps:
                x-field-uid: 17
              min_ideal_percentage:
                x-field-uid: 18
              avg_ideal_percentage:
                x-field-uid: 19
              max_ideal_percentage:
                x-field-uid: 20
              workload_set_iteration_start_time_ms:
                x-field-uid: 21
              workload_set_iteration_end_time_ms:
                x-field-uid: 22
              total_time_s:
                x-field-uid: 23
              duty_cycle_percentage:
                x-field-uid: 24
          x-field-uid: 1
    CollectiveCommunications.MixOfCollectives.WorkloadSetIteration.Metric:
      description: >-
        One row of workload set iteration metrics.
      type: object
      properties:
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        operation:
          description: >-
            The name of the operation aggregated in this row.
          type: string
          x-field-uid: 2
        process_group:
          description: >-
            The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 3
        data_size_bytes:
          description: >-
            Total data size in bytes of the collective across ranks.
          type: integer
          format: uint64
          x-field-uid: 4
        collective:
          description: >-
            The collective algorithm type of the operation aggregated in this row.
          type: string
          x-field-uid: 5
        workload_set_iteration:
          description: >-
            The workload set iteration aggregated in this row.
          type: integer
          format: uint32
          x-field-uid: 6
        workload_iterations:
          description: >-
            Number of iterations of each workload within this workload set
            iteration.
          type: integer
          format: uint32
          x-field-uid: 7
        operation_iterations:
          description: >-
            Number of iterations of each operation within each workload
            iteration.
          type: integer
          format: uint32
          x-field-uid: 8
        min_collective_time_ms:
          description: >-
            Minimum collective completion time (ms) observed across operation
            iterations of this workload set iteration.
          type: number
          x-field-uid: 9
        avg_collective_time_ms:
          description: >-
            Average collective completion time (ms) across operation iterations
            of this workload set iteration.
          type: number
          x-field-uid: 10
        max_collective_time_ms:
          description: >-
            Maximum collective completion time (ms) observed across operation
            iterations of this workload set iteration.
          type: number
          x-field-uid: 11
        min_algo_bw_gbps:
          description: >-
            Minimum algorithmic bandwidth (GB/s) observed across operation
            iterations of this workload set iteration.
          type: number
          x-field-uid: 12
        avg_algo_bw_gbps:
          description: >-
            Average algorithmic bandwidth (GB/s) across operation iterations of
            this workload set iteration.
          type: number
          x-field-uid: 13
        max_algo_bw_gbps:
          description: >-
            Maximum algorithmic bandwidth (GB/s) observed across operation
            iterations of this workload set iteration.
          type: number
          x-field-uid: 14
        min_bus_bw_gbps:
          description: >-
            Minimum bus bandwidth in GB/s. Equals min_algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 15
        avg_bus_bw_gbps:
          description: >-
            Average bus bandwidth in GB/s. Equals avg_algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 16
        max_bus_bw_gbps:
          description: >-
            Maximum bus bandwidth in GB/s. Equals max_algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 17
        min_ideal_percentage:
          description: >-
            Minimum achieved bus bandwidth as a percentage of the ideal goodput,
            across operation iterations of this workload set iteration.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 18
        avg_ideal_percentage:
          description: >-
            Average achieved bus bandwidth as a percentage of the ideal goodput,
            across operation iterations of this workload set iteration.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 19
        max_ideal_percentage:
          description: >-
            Maximum achieved bus bandwidth as a percentage of the ideal goodput,
            across operation iterations of this workload set iteration.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 20
        workload_set_iteration_start_time_ms:
          description: >-
            Start time of the workload set iteration expressed in ms.
            The time is expressed relative to the moment when test traffic starts
            (the earliest send/receive, which has a time of 0).
          type: number
          x-field-uid: 21
        workload_set_iteration_end_time_ms:
          description: >-
            End time of the workload set iteration expressed in ms.
            The time is expressed relative to the moment when test traffic starts
            (the earliest send/receive, which has a time of 0).
          type: number
          x-field-uid: 22
        total_time_s:
          description: >-
            Wall-clock time (s) the collective was active during this workload
            set iteration.
          type: number
          x-field-uid: 23
        duty_cycle_percentage:
          description: >-
            Fraction of workload set iteration time the collective was actively
            transferring data (as percentage).
          type: number
          x-field-uid: 24
