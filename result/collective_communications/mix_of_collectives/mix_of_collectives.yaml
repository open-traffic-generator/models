components:
  schemas:
    CollectiveCommunications.MixOfCollectives.Metrics.Request:
      description: >-
        Request for metrics from a Collective Communication Benchmark run with a mix of collectives.
      type: object
      required:
        - choice
      properties:
        choice:
          description: >-
            The type of Mix of Collectives metrics to fetch.
          type: string
          x-field-uid: 1
          x-enum:
            summary:
              x-field-uid: 1
            workload_set_iteration:
              x-field-uid: 2
            qpairs:
              x-field-uid: 3
            operation_iteration:
              x-field-uid: 4
            ports:
              x-field-uid: 5
            flows:
              x-field-uid: 6
            chunks:
              x-field-uid: 7
        summary:
          $ref: './summary.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Summary.Metrics.Request'
          x-field-uid: 2
        workload_set_iteration:
          $ref: './workload_set_iteration.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.WorkloadSetIteration.Metrics.Request'
          x-field-uid: 3
        qpairs:
          $ref: './qpairs.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Qp.Metrics.Request'
          x-field-uid: 4
        operation_iteration:
          $ref: './operation_iteration.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.OperationIteration.Metrics.Request'
          x-field-uid: 5
        ports:
          $ref: './ports.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Ports.Metrics.Request'
          x-field-uid: 6
        flows:
          $ref: './flow.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Flow.Metrics.Request'
          x-field-uid: 7
        chunks:
          $ref: './data_chunk.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.DataChunk.Metrics.Request'
          x-field-uid: 8
    CollectiveCommunications.MixOfCollectives.Metrics.Response:
      description: >-
        Response containing Mix of Collectives metrics of the chosen
        type.
      type: object
      required:
        - choice
      properties:
        choice:
          description: >-
            The type of Mix of Collectives metrics contained in the response.
          type: string
          x-field-uid: 1
          x-enum:
            summary:
              x-field-uid: 1
            workload_set_iteration:
              x-field-uid: 2
            qpairs:
              x-field-uid: 3
            operation_iteration:
              x-field-uid: 4
            ports:
              x-field-uid: 5
            flows:
              x-field-uid: 6
            chunks:
              x-field-uid: 7
        summary:
          description: >-
            The rows of summary metrics.
          type: array
          items:
            $ref: './summary.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Summary.Metric'
          x-field-uid: 2
        workload_set_iteration:
          description: >-
            The rows of workload set iteration metrics.
          type: array
          items:
            $ref: './workload_set_iteration.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.WorkloadSetIteration.Metric'
          x-field-uid: 3
        qpairs:
          description: >-
            The rows of queue-pair (QP) metrics.
          type: array
          items:
            $ref: './qpairs.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Qp.Metric'
          x-field-uid: 4
        operation_iteration:
          description: >-
            The rows of operation iteration metrics.
          type: array
          items:
            $ref: './operation_iteration.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.OperationIteration.Metric'
          x-field-uid: 5
        ports:
          description: >-
            The rows of port metrics.
          type: array
          items:
            $ref: './ports.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Ports.Metric'
          x-field-uid: 6
        flows:
          description: >-
            The rows of flow metrics.
          type: array
          items:
            $ref: './flow.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Flow.Metric'
          x-field-uid: 7
        chunks:
          description: >-
            The rows of data-chunk-transfer metrics.
          type: array
          items:
            $ref: './data_chunk.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.DataChunk.Metric'
          x-field-uid: 8
