components:
  schemas:
    CollectiveCommunications.PlatformConfig:
      description: >-
        Platform configuration for a collective benchmark run. Specifies per-platform typed settings.
      type: object
      properties:
        name:
          x-include: '../common/common.yaml#/components/schemas/Named.Object/properties/name'
          description: >-
            The name of this platform
          x-field-uid: 1
        platform_type:
          # platform_type cannot be named "choice" — openapiart reserves "type" for enum-backed choice properties.
          type: string
          default: "unspecified"
          description: |-
            The platform type to use for this collective benchmark run.
            To avoid requiring a schema update to support new types of platform, the value is
            just a string, not an enum. The implementation must validate.
            If the platform is "unspecified", the server should apply its default.
          x-field-uid: 2
        custom_settings:
          $ref: '../common/common.yaml#/components/schemas/StringMap'
          description: >-
            Generic properties. Arbitrary value platform settings.
            Assign all vendor-specific properties here.
          x-field-uid: 3
