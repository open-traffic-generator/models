components:
  schemas:
    Bgp.L3vpn.V4RouteRange:
      description: >-
        Emulated VPN-IPv4 customer route range belonging to a Bgp.L3vpn.Vrf
        (RFC 4364). Same shape as the plain Bgp.V4RouteRange, plus a per route
        range route_distinguisher. The Route Distinguisher (RFC 4364 Section
        4.1) is carried here, on the route range, rather than once on the parent
        VRF - matching RFC 4364's per-NLRI RD semantics. This lets different
        route ranges in the same VRF advertise
        different RDs (RFC 4364 Section 4.1 / 4.3.5, e.g. a multihomed CE whose
        prefix must stay distinct per PE). The VPN dataplane label is the
        existing mpls_labels field (RFC 4364 Section 3). The route range is kept
        independent of the shared Bgp.V4RouteRange so the VPN-only
        route_distinguisher does not leak into plain (non-VPN) BGP route ranges.
      type: object
      required: [name, route_distinguisher, mpls_labels]
      properties:
        addresses:
          x-include: ./bgpv4routerange.yaml#/components/schemas/Bgp.V4RouteRange/properties/addresses
          x-field-uid: 1
        next_hop_mode:
          x-include: ./bgpv4routerange.yaml#/components/schemas/Bgp.V4RouteRange/properties/next_hop_mode
          x-field-uid: 2
        next_hop_address_type:
          x-include: ./bgpv4routerange.yaml#/components/schemas/Bgp.V4RouteRange/properties/next_hop_address_type
          x-field-uid: 3
        next_hop_ipv4_address:
          x-include: ./bgpv4routerange.yaml#/components/schemas/Bgp.V4RouteRange/properties/next_hop_ipv4_address
          x-field-uid: 4
        next_hop_ipv6_address:
          x-include: ./bgpv4routerange.yaml#/components/schemas/Bgp.V4RouteRange/properties/next_hop_ipv6_address
          x-field-uid: 5
        advanced:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/advanced
          x-field-uid: 6
        communities:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/communities
          x-field-uid: 7
        as_path:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/as_path
          x-field-uid: 8
        add_path:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/add_path
          x-field-uid: 9
        name:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/name
          x-field-uid: 10
        extended_communities:
          x-include: ./bgprouterange.yaml#/components/schemas/Bgp.RouteRange/properties/extended_communities
          x-field-uid: 11
        mpls_labels:
          description: >-
            The single VPN dataplane MPLS label (RFC 4364 Section 3) bound to
            every IPv4 prefix in this route range. RFC 4364 assigns exactly
            one label per route - Section 4.3.2 only discusses whether that
            value is shared across routes in a VRF or attachment circuit, not
            stacking multiple labels per route.
          $ref: '../routes/routeaddresses.yaml#/components/schemas/RouteMplsLabelValue'
          x-field-uid: 12
        route_distinguisher:
          description: >-
            The Route Distinguisher (RFC 4364 Section 4.1) prepended to every
            IPv4 prefix in this route range, forming the VPN-IPv4 NLRI (AFI 1,
            SAFI 128). Carried per route range to match RFC 4364's per-NLRI
            RD semantics; route ranges in the same VRF may use different RDs.
          $ref: './bgproutedistinguisher.yaml#/components/schemas/Bgp.RouteDistinguisher'
          x-field-uid: 13
