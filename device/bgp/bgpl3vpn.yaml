components:
  schemas:
    Bgp.L3vpn.Vrf:
      description: |-
        A BGP/MPLS Layer 3 VPN VRF (RFC 4364). Binds a Route Distinguisher and
        Route Target import/export policy to a set of customer (PE-CE learned
        or locally originated) IPv4 route ranges, so that they are advertised
        as VPN-IPv4 NLRI (AFI 1, SAFI 128) instead of plain IPv4 unicast NLRI.

        The BGP capability device.bgp.capability.ipv4_mpls_vpn must be enabled
        on the peer for VPN-IPv4 NLRI to be negotiated and advertised.
      type: object
      required: [name, route_distinguisher]
      properties:
        name:
          x-include: '../../common/common.yaml#/components/schemas/Named.Object/properties/name'
          x-field-uid: 1
        route_distinguisher:
          description: >-
            The Route Distinguisher (RFC 4364 Section 4.1) prepended to every
            IPv4 prefix advertised from this VRF's v4_routes, forming the
            VPN-IPv4 NLRI. All routes in this VRF share the same RD.
          $ref: './bgproutedistinguisher.yaml#/components/schemas/Bgp.RouteDistinguisher'
          x-field-uid: 2
        route_target_export:
          description: >-
            List of Route Targets (RFC 4364 Section 4.3.1) attached as BGP
            Extended Communities to every route advertised from this VRF.
            A remote VRF imports the route only if one of its
            route_target_import values matches one of these.
          type: array
          items:
            $ref: './bgproutetarget.yaml#/components/schemas/Bgp.RouteTarget'
          x-field-uid: 3
        route_target_import:
          description: >-
            List of Route Targets (RFC 4364 Section 4.3.1) used to filter
            which received VPN-IPv4 routes are imported into this VRF.
            A received route is imported if any of its Route Target
            Extended Communities matches one of these.
          type: array
          items:
            $ref: './bgproutetarget.yaml#/components/schemas/Bgp.RouteTarget'
          x-field-uid: 4
        v4_routes:
          description: >-
            Emulated IPv4 customer route ranges belonging to this VRF.
            Each is advertised as VPN-IPv4 NLRI using this VRF's
            route_distinguisher and route_target_export.
          type: array
          items:
            $ref: './bgpv4routerange.yaml#/components/schemas/Bgp.V4RouteRange'
          x-field-uid: 5
