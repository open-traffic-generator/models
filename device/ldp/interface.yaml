components:
  schemas:
    Ldp.Ipv4Interface:
      description: >-
        An IPv4 interface on which LDP basic discovery runs: Hellos are sent to
        the all-routers multicast group 224.0.0.2, UDP port 646
        (RFC 5036 Section 2.4.1).
      type: object
      required: [name, ipv4_name]
      properties:
        name:
          x-include: ../../common/common.yaml#/components/schemas/Named.Object/properties/name
          x-field-uid: 1
        ipv4_name:
          description: >-
            The globally unique name of the IPv4 interface on top of which this
            LDP interface is configured. It must match the "name" field of an
            entry in "ipv4_addresses". The LSR ID is derived from this address.
          type: string
          x-constraint:
          - '/components/schemas/Device.Ipv4/properties/name'
          x-field-uid: 2
        hello_interval:
          description: >-
            Interval in seconds between link Hello messages. This is a local
            timer; RFC 5036 specifies only the Hold Time (Section 3.5.2).
            Implementations commonly use one third of hello_hold_time.
          type: integer
          format: uint32
          default: 5
          minimum: 1
          maximum: 65535
          x-field-uid: 3
        hello_hold_time:
          description: >-
            Hold Time in seconds carried in the Common Hello Parameters TLV
            (RFC 5036 Section 3.5.2). A value of 0 on the wire selects the
            protocol default of 15 seconds for link Hellos.
          type: integer
          format: uint32
          default: 15
          minimum: 1
          maximum: 65534
          x-field-uid: 4
        label_space_id:
          description: >-
            The 2-octet label space identifier that, with the LSR ID, forms the
            LDP Identifier (RFC 5036 Section 2.2.2). 0 selects the platform-wide
            label space, the only value valid for interfaces that share one.
          type: integer
          format: uint32
          default: 0
          maximum: 65535
          x-field-uid: 5
        label_advertisement_mode:
          description: >-
            Label advertisement discipline proposed in the Initialization
            message A bit (RFC 5036 Sections 2.6.3 and 3.5.3).
          type: string
          default: downstream_unsolicited
          x-enum:
            downstream_unsolicited:
              x-field-uid: 1
            downstream_on_demand:
              x-field-uid: 2
          x-field-uid: 6
        authentication:
          description: >-
            When present, the session is authenticated. Omit for no
            authentication.
          $ref: './authentication.yaml#/components/schemas/Ldp.Authentication'
          x-field-uid: 7
