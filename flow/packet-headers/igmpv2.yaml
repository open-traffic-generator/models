components:
  schemas:
    Flow.Igmpv2:
      description: IGMPv2 packet header (RFC 2236)
      type: object
      properties:
        type:
          x-field-pattern:
            x-constants:
              membership_query: 17
              v1_membership_report: 18
              v2_membership_report: 22
              leave_group: 23
            description: >-
              IGMPv2 message type
            format: integer
            length: 8
            default: 17
            features: [count]
          x-field-uid: 1
        max_response_time:
          x-field-pattern:
            description: >-
              Maximum response time in units of 1/10 second. Meaningful only in
              Membership Query messages; ignored in Reports and Leave Group
              (RFC 2236 Section 2.2).
            format: integer
            length: 8
            default: 100
            features: [count]
          x-field-uid: 2
        checksum:
          x-field-pattern:
            description: >-
              Checksum
            format: checksum
            length: 16
          x-field-uid: 3
        group_address:
          x-field-pattern:
            description: >-
              Group address is zero in a general Membership Query. It is set to
              the group being reported/left in Reports and Leave Group messages
              (RFC 2236 Section 2.4).
            format: ipv4
            default: 0.0.0.0
            features: [count]
          x-field-uid: 4
