components:
  schemas:

    CollectiveCommunications.Infrastructure:
      description: >-
        The declaration of the system testbed.
      type: object
      properties:
        choice:
          type: string
          description: |-
            Selects how the infrastructure is specified.
          x-enum:
            simple_implicit:
              description: |-
                A simple infrastructure consisting of a number of generic hosts, each with a number of XPUs, each XPU
                connected 1:1 to a NIC. The user needs only define the hosts as OTG devices, associated NICs as OTG
                ethernets, and the test ports as OTG ports, with the rest of the connections and rank mapping being
                implicitly derived by the implementation as per the rules and parameters defined here.
              x-field-uid: 1
          default: simple_implicit
          x-field-uid: 1
        simple_implicit:
          $ref: '#/components/schemas/CollectiveCommunications.SimpleImplicitInfrastructure'
          description: |-
            A simple infrastructure consisting of a number of generic hosts, each with a number of XPUs, each XPU
            connected 1:1 to a NIC. The user needs only define the hosts as OTG devices, associated NICs as OTG
            ethernets, and the test ports as OTG ports, with the rest of the connections and rank mapping being
            implicitly derived by the implementation as per the rules and parameters defined here.
          x-field-uid: 2

    CollectiveCommunications.SimpleImplicitInfrastructure:
      description: |-
        A simple infrastructure consisting of a number of generic hosts, each with a number of XPUs, each XPU
        connected 1:1 to a NIC.
        
        To set up a number of hosts, the user will declare as many devices as there are hosts. For each host, they
        will add as many ethernets as there are XPUs in that host, with the understanding that one NIC maps to
        one XPU. The ethernets can then be connected to declared test ports.

        Ranks are automatically mapped to the implicitly defined XPUs as per the order of definition of devices and
        their ethernets: for each device in the order of definition, we go over each ethernet in the device, in their
        order of definition, and assign the next rank in order (0, 1, 2 etc.) to the XPU corresponding to the ethernet.

        With this simple mapping option, the user may not declare devices for any other purpose, as they will be
        taken to be a host.

        Specific implementations may introduce extra restrictions, such as requiring that all hosts define the same
        number of XPUs.
      type: object
      properties:
        xpu_interconnect_bandwidth_gbps:
          type: integer
          format: uint32
          default: 1600
          minimum: 0
          description: >-
            If non-zero, XPUs within the same host will be linked with a generic
            interconnect of the specified bandwidth, in gigabits per second. If 0,
            XPU interconnect will be disabled and XPUs within the same host will
            only communicate via the network.
          x-field-uid: 1
