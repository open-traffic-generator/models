components:
  schemas:
    CollectiveCommunications.Transport:
      description: >-
        Selects the network transport used to carry the workload's traffic and
        provides additional settings for that transport, if any.
      type: object
      properties:
        choice:
          type: string
          default: rocev2
          description: >-
            Selects the network transport.
          x-field-uid: 1
          x-enum:
            rocev2:
              description: >-
                RoCEv2 transport.
              x-field-uid: 1
        rocev2:
          $ref: '#/components/schemas/CollectiveCommunications.Rocev2TransportSettings'
          description: >-
            RoCEv2 transport settings.
          x-field-uid: 2

    CollectiveCommunications.Rocev2TransportSettings:
      description: >-
        Workload-level RoCEv2 transport settings, applied uniformly across
        every rank pair using this transport.
      type: object
      properties:
        rdma_message_size:
          type: integer
          format: uint32
          default: 131072
          minimum: 1
          description: >-
            (Maximum) RDMA message size in bytes.
          x-field-uid: 1
        qps_per_rankpair:
          type: integer
          format: uint32
          default: 1
          minimum: 1
          maximum: 128
          description: >-
            Number of Queue Pairs per rank pair.
          x-field-uid: 2
        verb:
          type: string
          default: write
          description: >-
            RDMA verb used for data transfers in collective communication
            operations. Default is write.
          x-field-uid: 3
          x-enum:
            write:
              description: >-
                RDMA Write.
              x-field-uid: 1
            send:
              description: >-
                RDMA Send.
              x-field-uid: 2
        reuse_qps:
          type: boolean
          default: true
          description: >-
            Enable reuse of Queue Pairs (QPs) for RDMA messages between a rank
            pair, rather than opening a new QP per message.
          x-field-uid: 4
        qp_negotiation:
          $ref: '#/components/schemas/CollectiveCommunications.QpNegotiation'
          description: >-
            Queue Pair negotiation method.
          x-field-uid: 5

    CollectiveCommunications.QpNegotiation:
      description: >-
        Selects the method used to negotiate Queue Pairs across ranks.
      type: object
      properties:
        choice:
          type: string
          default: automatic
          description: >-
            Selects the QP negotiation method.
          x-field-uid: 1
          x-enum:
            automatic:
              description: >-
                Use the default negotiation method for the selected platform.
              x-field-uid: 1
            custom:
              description: >-
                Use a custom queue pair negotiation method.
              x-field-uid: 2
            tcp_store:
              description: >-
                Negotiate queue pairs using a TCP-based store implementation.
              x-field-uid: 3
            rdma_cm:
              description: >-
                Negotiate queue pairs using RDMA Connection Manager.
              x-field-uid: 4
        custom:
          $ref: '#/components/schemas/CollectiveCommunications.CustomQpNegotiation'
          description: >-
            Vendor/Implementation-specific queue pair negotiation method.
          x-field-uid: 2
        tcp_store:
          $ref: '#/components/schemas/CollectiveCommunications.TcpStore'
          description: >-
            TCP store rendezvous endpoint.
          x-field-uid: 3

    CollectiveCommunications.CustomQpNegotiation:
      description: >-
        Vendor/Implementation-specific queue pair negotiation method.
      type: object
      required: [negotiation_type]
      properties:
        negotiation_type:
          type: string
          description: >-
            Name of the custom QP negotiation method. Used by the implementation to determine
            which custom_settings apply.
          x-field-uid: 1
        custom_settings:
          $ref: '../common/common.yaml#/components/schemas/CustomSettings'
          description: >-
            Custom properties for the specified Vendor/Implementation and negotiation_type to control qp negotiations,
            keyed as described under CustomSettings
          x-field-uid: 2

    CollectiveCommunications.TcpStore:
      description: >-
        Rendezvous endpoint for TCP-store-based Queue Pair negotiation. Shared
        by every rank in the scope to which the transport applies (e.g. workload, operation etc)
      type: object
      properties:
        address:
          type: string
          default: localhost
          description: >-
            TCP store hostname or IP address.
          x-field-uid: 1
        port:
          type: integer
          format: uint32
          default: 12345
          minimum: 1024
          maximum: 65535
          description: >-
            TCP store port number.
          x-field-uid: 2
