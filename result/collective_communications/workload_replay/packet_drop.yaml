components:
  schemas:
    CollectiveCommunications.WorkloadReplay.PacketDrop.Metrics.Request:
      description: >-
        Request for packet drop metrics. Contains details about dropped frames and response times.
      type: object
      properties:
        impairment_location:
          description: >-
            Filter results by the location where the impairment is applied
            (Source or Destination). An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              tx_drop_count:
                x-field-uid: 1
              rx_drop_count:
                x-field-uid: 2
              nack_timer_ns:
                x-field-uid: 3
              flow_index:
                x-field-uid: 4
              flow_source_nic:
                x-field-uid: 5
              flow_destination_nic:
                x-field-uid: 6
              impairment_location:
                x-field-uid: 7
              opcode:
                x-field-uid: 8
          x-field-uid: 2
    CollectiveCommunications.WorkloadReplay.PacketDrop.Metric:
      description: >-
        One row of packet drop metrics.
      type: object
      properties:
        flow_index:
          description: >-
            Index of the flow being impaired.
          type: integer
          x-field-uid: 1
        flow_source_nic:
          description: >-
            Source NIC used in the impairment.
          type: string
          x-field-uid: 2
        flow_destination_nic:
          description: >-
            Destination NIC used in the impairment.
          type: string
          x-field-uid: 3
        impairment_location:
          description: >-
            Location where the impairment is applied (Source or Destination).
          type: string
          x-field-uid: 4
        opcode:
          description: >-
            RDMA opcode associated with the impairment.
          type: string
          x-field-uid: 5
        tx_drop_count:
          description: >-
            Number of transmitted packets dropped.
          type: integer
          format: uint64
          x-field-uid: 6
        rx_drop_count:
          description: >-
            Number of received packets dropped.
          type: integer
          format: uint64
          x-field-uid: 7
        nack_timer_ns:
          description: >-
            NACK timer value in nanoseconds.
          type: number
          x-field-uid: 8
