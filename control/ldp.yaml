openapi: 3.0.3
info:
  title: LDP Control models
  description: >-
    All LDP control schemas
  version: ^0.0.0
components:
  schemas:
    Action.Protocol.Ldp:
      description: >-
        Actions associated with LDP on configured resources.
      type: object
      required:
        - choice
      properties:
        choice:
          type: string
          x-enum:
            initiate_graceful_restart:
              x-field-uid: 1
          x-field-uid: 1
        initiate_graceful_restart:
          description: >-
            Configuration for the initiation of LDP graceful restart.
          $ref: "#/components/schemas/Action.Protocol.Ldp.InitiateGracefulRestart"
          x-field-uid: 2

    Action.Protocol.Ldp.InitiateGracefulRestart:
      description: >-
        Initiates an LDP graceful restart (RFC 3478) on the selected routers.
        Expected to require graceful_restart in the router configuration.
        If no name is specified the action applies to all configured LDP routers.
      type: object
      properties:
        router_names:
          description: >-
            The names of LDP routers to restart.
          type: array
          items:
            type: string
          x-constraint:
          - /components/schemas/Device.Ldp/properties/name
          x-field-uid: 1
        restart_delay:
          description: >-
            Delay in seconds before the sessions are re-established after the
            simulated restart.
          type: integer
          format: uint32
          default: 10
          maximum: 4096
          x-field-uid: 2
