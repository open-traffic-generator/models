          type: string
          default: only
          x-field-uid: 1
          x-enum:
            first:
              x-field-uid: 1
            middle:
              x-field-uid: 2
            last:
              x-field-uid: 3
            only:
              x-field-uid: 4
        solicited_event:
          x-field-pattern:
            description: >-
              Requests that the responder generate an event on receipt
              (IBTA Volume 1, Section 6.6.3).
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 2
        migration_request:
          x-field-pattern:
            description: >-
              Automatic Path Migration request bit (IBTA Volume 1, Section
