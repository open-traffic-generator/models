components:
  schemas:
    CollectiveCommunications.SingleCollective.Ports.Metrics.Request:
      description: >-
        Request for port metrics. Contains byte, frame, and congestion packet counts for each port device.
      type: object
      properties:
        port_name:
          description: >-
            Filter results by port name. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              device:
                x-field-uid: 1
              port:
                x-field-uid: 2
              ranks:
                x-field-uid: 3
              link_speed:
                x-field-uid: 4
              frames_tx:
                x-field-uid: 5
              frames_rx:
                x-field-uid: 6
              bytes_tx:
                x-field-uid: 7
              bytes_rx:
                x-field-uid: 8
              pause_frames_rx:
                x-field-uid: 9
              ecn_ce_rx:
                x-field-uid: 10
              cnp_tx:
                x-field-uid: 11
              cnp_rx:
                x-field-uid: 12
              crc_errors:
                x-field-uid: 13
              roce_v2_qps_configured:
                x-field-uid: 14
              roce_v2_qps_ready:
                x-field-uid: 15
              roce_v2_data_frames_tx:
                x-field-uid: 16
              roce_v2_data_frames_rx:
                x-field-uid: 17
              roce_v2_ack_tx:
                x-field-uid: 18
              roce_v2_ack_rx:
                x-field-uid: 19
              roce_v2_nack_tx:
                x-field-uid: 20
              roce_v2_nack_rx:
                x-field-uid: 21
              roce_v2_frame_sequence_errors:
                x-field-uid: 22
              frames_retx:
                x-field-uid: 23
          x-field-uid: 2
    CollectiveCommunications.SingleCollective.Ports.Metric:
      description: >-
        One row of port metrics.
      type: object
      properties:
        device:
          description: >-
            Chassis FQDN or IP address.
          type: string
          x-field-uid: 1
        port:
          description: >-
            Chassis test port ID.
          type: string
          x-field-uid: 2
        ranks:
          description: >-
            IDs of the ranks associated with this port. A single physical test
            port can carry several ranks; the list is empty when the port
            carries none.
          type: array
          items:
            type: integer
            format: uint32
          x-field-uid: 3
        link_speed:
          description: >-
            Physical link speed.
          type: string
          x-field-uid: 4
        frames_tx:
          description: >-
            Total frames transmitted.
          type: integer
          format: uint64
          x-field-uid: 5
        frames_rx:
          description: >-
            Total frames received.
          type: integer
          format: uint64
          x-field-uid: 6
        bytes_tx:
          description: >-
            Total bytes transmitted.
          type: integer
          format: uint64
          x-field-uid: 7
        bytes_rx:
          description: >-
            Total bytes received.
          type: integer
          format: uint64
          x-field-uid: 8
        pause_frames_rx:
          description: >-
            Priority Pause Frames received.
          type: integer
          format: uint64
          x-field-uid: 9
        ecn_ce_rx:
          description: >-
            Frames received with ECN congestion encountered (Explicit
            Congestion Notification - Congestion Experienced).
          type: integer
          format: uint64
          x-field-uid: 10
        cnp_tx:
          description: >-
            Congestion notification packets transmitted.
          type: integer
          format: uint64
          x-field-uid: 11
        cnp_rx:
          description: >-
            Congestion notification packets received.
          type: integer
          format: uint64
          x-field-uid: 12
        crc_errors:
          description: >-
            Number of CRC errors detected.
          type: integer
          format: uint64
          x-field-uid: 13
        roce_v2_qps_configured:
          description: >-
            RoCEv2 Queue Pairs configured.
          type: integer
          format: uint32
          x-field-uid: 14
        roce_v2_qps_ready:
          description: >-
            RoCEv2 Queue Pairs ready.
          type: integer
          format: uint32
          x-field-uid: 15
        roce_v2_data_frames_tx:
          description: >-
            RoCEv2 frames transmitted.
          type: integer
          format: uint64
          x-field-uid: 16
        roce_v2_data_frames_rx:
          description: >-
            RoCEv2 frames received.
          type: integer
          format: uint64
          x-field-uid: 17
        roce_v2_ack_tx:
          description: >-
            RoCEv2 Acknowledgement frames transmitted.
          type: integer
          format: uint64
          x-field-uid: 18
        roce_v2_ack_rx:
          description: >-
            RoCEv2 Acknowledgement frames received.
          type: integer
          format: uint64
          x-field-uid: 19
        roce_v2_nack_tx:
          description: >-
            RoCEv2 Negative Acknowledgement frames transmitted.
          type: integer
          format: uint64
          x-field-uid: 20
        roce_v2_nack_rx:
          description: >-
            RoCEv2 Negative Acknowledgement frames received.
          type: integer
          format: uint64
          x-field-uid: 21
        roce_v2_frame_sequence_errors:
          description: >-
            RoCEv2 Sequence Error Frames.
          type: integer
          format: uint64
          x-field-uid: 22
        frames_retx:
          description: >-
            Frames Retransmitted count.
          type: integer
          format: uint64
          x-field-uid: 23
