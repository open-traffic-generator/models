components:
  schemas:
    CollectiveCommunications.SingleCollective.Iteration.Metrics.Request:
      description: >-
        Request for detailed iteration metrics. Contains completion time and throughput details for each iteration of each collective datasize.
      type: object
      properties:
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              data_size_bytes:
                x-field-uid: 1
              collective:
                x-field-uid: 2
              iteration:
                x-field-uid: 3
              collective_start_time_ms:
                x-field-uid: 4
              collective_end_time_ms:
                x-field-uid: 5
              collective_completion_time_ms:
                x-field-uid: 6
              algo_bw_gbps:
                x-field-uid: 7
              bus_bw_gbps:
                x-field-uid: 8
              ideal_percentage:
                x-field-uid: 9
              min_fct_ms:
                x-field-uid: 10
              p50_fct_ms:
                x-field-uid: 11
              p95_fct_ms:
                x-field-uid: 12
              p99_fct_ms:
                x-field-uid: 13
              p99_99_fct_ms:
                x-field-uid: 14
              max_fct_ms:
                x-field-uid: 15
          x-field-uid: 1
    CollectiveCommunications.SingleCollective.Iteration.Metric:
      description: >-
        One row of iteration metrics.
      type: object
      properties:
        data_size_bytes:
          description: >-
            Total data size in bytes of the collective across ranks.
          type: integer
          format: uint64
          x-field-uid: 1
        collective:
          description: >-
            Collective operation name.
          type: string
          x-field-uid: 2
        iteration:
          description: >-
            Iteration number.
          type: integer
          format: uint32
          x-field-uid: 3
        collective_start_time_ms:
          description: >-
            Start time of the collective of the current iteration in
            milliseconds.
          type: number
          x-field-uid: 4
        collective_end_time_ms:
          description: >-
            End time of the collective of the current iteration in milliseconds.
          type: number
          x-field-uid: 5
        collective_completion_time_ms:
          description: >-
            Collective completion time of the current iteration in milliseconds.
          type: number
          x-field-uid: 6
        algo_bw_gbps:
          description: >-
            Algorithm bandwidth, calculated as Collective Size / Time (in 1e9
            Bytes/sec).
          type: number
          x-field-uid: 7
        bus_bw_gbps:
          description: >-
            Bus bandwidth in GB/s. Equals algo_bw_gbps multiplied by the bus factor
            of the corresponding nccl-tests collective, for
            example 2(n-1)/n for all-reduce and (n-1)/n for all-gather,
            reduce-scatter and all-to-all, where n is the number of ranks in the
            process group.
          type: number
          x-field-uid: 8
        ideal_percentage:
          description: >-
            Achieved bus bandwidth as a percentage of the ideal goodput.

            Goodput is defined as the rate of transfer of useful application data,
            excluding protocol headers, retransmissions etc.
          type: number
          x-field-uid: 9
        min_fct_ms:
          description: >-
            Smallest Flow Completion Time of any of the flows, in milliseconds.
          type: number
          x-field-uid: 10
        p50_fct_ms:
          description: >-
            50th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 11
        p95_fct_ms:
          description: >-
            95th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 12
        p99_fct_ms:
          description: >-
            99th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 13
        p99_99_fct_ms:
          description: >-
            99.99th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 14
        max_fct_ms:
          description: >-
            Largest Flow Completion Time of all flows, in milliseconds.
          type: number
          x-field-uid: 15
