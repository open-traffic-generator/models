components:
  schemas:
    Ospfv2Lsas.State.Request:
      description: >-
        The request to retrieve OSPFv2 Link State Advertisements (LSA) information learned by the
        routers.
      type: object
      properties:
        router_names:
          description: >-
            The names of OSPFv2 routers for which learned information is requested.
            An empty list will return results for all OSPFv2 routers.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Device.Ospfv2Router/properties/name"
          x-field-uid: 1
    Ospfv2Lsa.State:
      description: >-
        The result of OSPFv2 LSA information that are retrieved.
      type: object
      properties:
        router_name:
          description: >-
           The name of the OSPFv2 Router that learned the LSA information.
          type: string
          x-field-uid: 1
        router_lsas:
          description: >-
            One or more OSPFv2 Router-LSA - Type 1.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.RouterLsa'
          x-field-uid: 2
        network_lsas:
          description: >-
            One or more OSPFv2 Network-LSA - Type 2.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.NetworkLsa'
          x-field-uid: 3
        network_summary_lsas:
          description: >-
            One or more OSPFv2 Network summary LSA - Type 3.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.NetworkSummaryLsa'
          x-field-uid: 4
        summary_as_lsas:
          description: >-
            One or more OSPFv2 Autonomous System Boundary Router (ASBR) summary LSA - Type 4.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.SummaryAsLsa'
          x-field-uid: 5
        external_as_lsas:
          description: >-
            OSPFv2 AS-External-LSA - Type 5.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.ExternalAsLsa'
          x-field-uid: 6
        nssa_lsas:
          description: >-
            One or more OSPFv2 NSSA-LSA - Type 7.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.NssaLsa'
          x-field-uid: 7
        opaque_lsas:
          description: >-
            One or more OSPFv2 Link-Scope Opaque-LSA - Type 9.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.OpaqueLsa'
          x-field-uid: 8
    Ospfv2.RouterLsa:
      description: >-
        Contents of the router LSA.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        links:
          description: >-
            Links that are described within the LSA.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.Link'
          x-field-uid: 2
        sr_capability:
          description: |-
            The Segment Routing capability learned for this router, decoded from the Router
            Information (RI) Opaque LSA: the SR-Algorithm TLV, SID/Label Range (SRGB) TLV and
            SR Local Block (SRLB) TLV (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.SrCapability'
          x-field-uid: 3
        prefix_sid:
          description: |-
            The Node/Prefix-SID learned for this router, decoded from the Prefix-SID sub-TLV of
            the OSPFv2 Extended Prefix Opaque LSA advertised for the router's own prefix (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSid'
          x-field-uid: 4
    Ospfv2.NetworkLsa:
      description: >-
        Contents of the Network LSA.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        neighbor_router_ids:
          description: >-
            Neighbor router ids that are described within the LSA.
          type: array
          items:
            type: string
            format: ipv4
          x-field-uid: 3

    Ospfv2.NetworkSummaryLsa:
      description: |-
        Contents of the Network Summary LSA - Type 3.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        prefix_sid:
          description: |-
            The Prefix-SID learned for this prefix, decoded from the Prefix-SID sub-TLV of the
            OSPFv2 Extended Prefix Opaque LSA whose Extended Prefix TLV references this prefix
            (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSid'
          x-field-uid: 4
    Ospfv2.SummaryAsLsa:
      description: >-
        Contents of OSPFv2 Autonomous System Boundary Router (ASBR) summary LSA - Type 4.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
    Ospfv2.ExternalAsLsa:
      description: |-
        Contents of OSPFv2 AS-External-LSA - Type 5.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        metric_type:
          description: >-
            The type of metric associated with the route range.
          type: integer
          format: uint32
          x-field-uid: 4
        prefix_sid:
          description: |-
            The Prefix-SID learned for this prefix, decoded from the Prefix-SID sub-TLV of the
            OSPFv2 Extended Prefix Opaque LSA whose Extended Prefix TLV references this prefix
            (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSid'
          x-field-uid: 5
    Ospfv2.NssaLsa:
      description: |-
        Contents of OSPFv2 NSSA LSA - Type 7.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        metric_type:
          description: >-
            The type of metric associated with the route range.
          type: integer
          format: uint32
          x-field-uid: 4
        forwarding_address:
          description: >-
            IPv4 Forwarding address.
          type: string
          format: ipv4
          x-field-uid: 5
        prefix_sid:
          description: |-
            The Prefix-SID learned for this prefix, decoded from the Prefix-SID sub-TLV of the
            OSPFv2 Extended Prefix Opaque LSA whose Extended Prefix TLV references this prefix
            (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSid'
          x-field-uid: 6
    Ospfv2.OpaqueLsa:
      description: >-
        Contents of OSPFv2 Opaque LSA - Type 9/10/11.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        type:
          description: >-
            The scope of the Opaque LSA.
          type: string
          x-field-uid: 2
          x-enum:
            local:
              x-field-uid: 1
            area:
              x-field-uid: 2
            domain:
              x-field-uid: 3
    Ospfv2.LsaHeader:
      description: >-
        Attributes in LSA Header.
      type: object
      properties:
        lsa_id:
          description: >-
            LSA ID in the IPv4 format. The Link State ID for the specified LSA type.
          type: string
          format: ipv4
          x-field-uid: 1
        advertising_router_id :
          description: >-
            The router ID (in the IPv4 format) of the router that originated the LSA.
          type: string
          format: ipv4
          x-field-uid: 2
        sequence_number:
          description: >-
            Sequence number to detect old and duplicate
            LSAs. The greater the sequence number the more recent the LSA.
          type: integer
          format: uint32
          x-field-uid: 3
        age:
          description: >-
            The time since the LSA's generation in seconds.
          type: integer
          format: uint32
          x-field-uid: 4
        option_bits:
          description: >-
            The optional bits.
          type: integer
          format: uint32
          x-field-uid: 5
    Ospfv2.Link:
      description: >-
        Generic attributes used to identify links within OSPFv2.
      type: object
      properties:
        type:
          description: >-
            The data associated with the link type. The value is
            dependent upon the subtype of the LSA.
            - point_to_point: The LSA represents a point-to-point connection to another router.
            - transit: The LSA represents a connection to a transit network.
            - stub: The LSA represents a connection to a stub network.
            - virtual: The LSA represents a virtual link connection.
          type: string
          x-enum:
            point_to_point:
              x-field-uid: 1
            transit:
              x-field-uid: 2
            stub:
              x-field-uid: 3
            virtual:
              x-field-uid: 4
          x-field-uid: 1
        id:
          description: |-
           The identifier for the link specified. The value of the link
           identifier is dependent upon the type of the LSA.
          type: string
          format: ipv4
          x-field-uid: 2
        data:
          description: |-
            The data associated with the link type. The value is
            dependent upon the subtype of the LSA. When the connection is
            to a stub network it represents the mask; for p2p connections
            that are unnumbered it represents the ifIndex value of the
            router's interface; for all other connections it represents
            the local system's IP address.
          type: string
          format: ipv4
          x-field-uid: 3
        metric:
          description: |-
            The data associated with the link type. The value is
            dependent upon the subtype of the LSA. When the connection is
            to a stub network it represents the mask; for p2p connections
            that are unnumbered it represents the ifIndex value of the
            router's interface; for all other connections it represents
            the local system's IP address.
          type: integer
          format: uint32
          x-field-uid: 4
        adjacency_sid:
          description: |-
            The Adjacency-SID learned for this link, decoded from the Adj-SID / LAN Adj-SID sub-TLV
            of the OSPFv2 Extended Link Opaque LSA whose Extended Link TLV references this link
            (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.AdjacencySid'
          x-field-uid: 5

    Ospfv2Lsa.SrCapability:
      description: |-
        The Segment Routing capability learned from the Router Information (RI) Opaque LSA:
        the SR-Algorithm TLV, SID/Label Range (SRGB) TLV and SR Local Block (SRLB) TLV.
        Reference: https://datatracker.ietf.org/doc/html/rfc8665.
      type: object
      properties:
        algorithms:
          description: >-
            The Segment Routing algorithms advertised in the SR-Algorithm TLV (0 = SPF,
            1 = Strict SPF).
          type: array
          items:
            type: integer
            format: uint32
          x-field-uid: 1
        srgb_ranges:
          description: >-
            The learned Segment Routing Global Block (SRGB) ranges from the SID/Label Range TLV.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2Lsa.Srgb'
          x-field-uid: 2
        srlb_ranges:
          description: >-
            The learned SR Local Block (SRLB) ranges from the SR Local Block TLV.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2Lsa.Srlb'
          x-field-uid: 3

    Ospfv2Lsa.Srgb:
      description: >-
        A learned Segment Routing Global Block (SRGB) range.
      type: object
      properties:
        starting_sid:
          description: >-
            The first value (base SID/label) of the SRGB range.
          type: integer
          format: uint32
          x-field-uid: 1
        range:
          description: >-
            The number of SIDs in this SRGB range.
          type: integer
          format: uint32
          x-field-uid: 2

    Ospfv2Lsa.Srlb:
      description: >-
        A learned SR Local Block (SRLB) range.
      type: object
      properties:
        starting_sid:
          description: >-
            The first value (base SID/label) of the SRLB range.
          type: integer
          format: uint32
          x-field-uid: 1
        range:
          description: >-
            The number of SIDs in this SRLB range.
          type: integer
          format: uint32
          x-field-uid: 2

    Ospfv2Lsa.PrefixSid:
      description: |-
        The learned OSPFv2 Prefix-SID and its attributes, decoded from the Prefix-SID sub-TLV of
        the Extended Prefix Opaque LSA (RFC 8665).
      type: object
      properties:
        sids:
          description: >-
            One or more SID/Label values or indices associated with the IGP Prefix segment
            attached to the prefix.
          type: array
          items:
            type: integer
            format: uint32
          x-field-uid: 1
        flags:
          description: >-
            Flags associated with the Prefix-SID.
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSidFlags'
          x-field-uid: 2
        algorithm:
          description: >-
            The Segment Routing algorithm the Prefix-SID is associated with.
          type: integer
          format: uint32
          minimum: 0
          maximum: 255
          x-field-uid: 3

    Ospfv2Lsa.PrefixSidFlags:
      description: >-
        One-octet flags of the OSPFv2 Prefix-SID sub-TLV (RFC 8665).
      type: object
      properties:
        np_flag:
          description: >-
            NP-Flag (No-PHP): if set, the penultimate hop MUST NOT pop the Prefix-SID before
            delivering the packet to the advertising node.
          type: boolean
          x-field-uid: 1
        m_flag:
          description: >-
            M-Flag (Mapping Server): if set, the SID was advertised by an SR Mapping Server.
          type: boolean
          x-field-uid: 2
        e_flag:
          description: >-
            E-Flag (Explicit-Null): if set, the upstream neighbor MUST replace the Prefix-SID with
            the Explicit-NULL label before forwarding.
          type: boolean
          x-field-uid: 3
        v_flag:
          description: >-
            V-Flag (Value): if set, the Prefix-SID carries an absolute value (label); if clear, an
            index.
          type: boolean
          x-field-uid: 4
        l_flag:
          description: >-
            L-Flag (Local): if set, the value/index carried by the Prefix-SID has local
            significance.
          type: boolean
          x-field-uid: 5

    Ospfv2Lsa.AdjacencySid:
      description: |-
        The learned OSPFv2 Adjacency-SID and its attributes, decoded from the Adj-SID / LAN Adj-SID
        sub-TLV of the Extended Link Opaque LSA (RFC 8665).
      type: object
      properties:
        type:
          description: >-
            Adjacency-SID type: Adjacency-SID (Extended Link sub-TLV Type 2) or LAN Adjacency-SID
            (Type 3).
          type: string
          x-field-uid: 1
          x-enum:
            adj_sid:
              x-field-uid: 1
            lan_adj_sid:
              x-field-uid: 2
        sids:
          description: >-
            One or more SID/Label values or indices associated with the adjacency.
          type: array
          items:
            type: integer
            format: uint32
          x-field-uid: 2
        flags:
          description: >-
            Flags associated with the Adjacency-SID.
          $ref: '#/components/schemas/Ospfv2Lsa.AdjSidFlags'
          x-field-uid: 3
        weight:
          description: >-
            The weight of the Adjacency-SID for the purpose of load balancing.
          type: integer
          format: uint32
          x-field-uid: 4

    Ospfv2Lsa.AdjSidFlags:
      description: >-
        One-octet flags of the OSPFv2 Adjacency-SID sub-TLV (RFC 8665).
      type: object
      properties:
        b_flag:
          description: >-
            B-Flag (Backup): the Adjacency-SID is eligible for protection.
          type: boolean
          x-field-uid: 1
        g_flag:
          description: >-
            G-Flag (Group): the Adjacency-SID refers to a group of adjacencies.
          type: boolean
          x-field-uid: 2
        p_flag:
          description: >-
            P-Flag (Persistent): the Adjacency-SID is persistently allocated.
          type: boolean
          x-field-uid: 3
        v_flag:
          description: >-
            V-Flag (Value): if set, the Adj-SID carries an absolute value (label); if clear, an
            index.
          type: boolean
          x-field-uid: 4
        l_flag:
          description: >-
            L-Flag (Local): if set, the value/index carried by the Adj-SID has local significance.
          type: boolean
          x-field-uid: 5
