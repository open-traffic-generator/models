openapi: 3.0.3
info:
  title: Control Ultra Ethernet models
  description: >-
    All control state schemas for Ultra Ethernet link layer features.
  version: ^0.0.0
components:
  schemas:
    State.UltraEthernet:
      description: >-
        States associated with Ultra Ethernet link layer features on configured
        resources.
      type: object
      required:
        - choice
      properties:
        choice:
          type: string
          x-enum:
            llr:
              x-field-uid: 1
            cbfc:
              x-field-uid: 2
            impairment:
              x-field-uid: 3
          x-field-uid: 1
        llr:
          $ref: '#/components/schemas/State.UltraEthernet.Llr'
          x-field-uid: 2
        cbfc:
          $ref: '#/components/schemas/State.UltraEthernet.Cbfc'
          x-field-uid: 3
        impairment:
          $ref: '#/components/schemas/State.UltraEthernet.Impairment'
          x-field-uid: 4

    State.UltraEthernet.Llr:
      description: >-
        Sets the Link Layer Retry (LLR) mode state of configured Ultra Ethernet
        instances.
      type: object
      required:
        - state
      properties:
        ultra_ethernet_names:
          description: >-
            The names of target Ultra Ethernet instances.
            An empty or null list will target all Ultra Ethernet instances.
          type: array
          items:
            type: string
          x-constraint:
          - '/components/schemas/UltraEthernet/properties/name'
          x-field-uid: 1
        state:
          description: >-
            The LLR mode state to apply.

            - local_enable / local_disable: enable or disable LLR reception
              (llr_mode_local).
            - remote_enable / remote_disable: enable or disable LLR transmission
              (llr_mode_remote).
            - enable_all / disable_all: enable or disable both directions.
          type: string
          x-field-uid: 2
          x-enum:
            local_enable:
              x-field-uid: 1
            local_disable:
              x-field-uid: 2
            remote_enable:
              x-field-uid: 3
            remote_disable:
              x-field-uid: 4
            enable_all:
              x-field-uid: 5
            disable_all:
              x-field-uid: 6

    State.UltraEthernet.Cbfc:
      description: >-
        Sets the Credit-based Flow Control (CBFC) state of configured Ultra Ethernet
        instances.
      type: object
      required:
        - state
      properties:
        ultra_ethernet_names:
          description: >-
            The names of target Ultra Ethernet instances.
            An empty or null list will target all Ultra Ethernet instances.
          type: array
          items:
            type: string
          x-constraint:
          - '/components/schemas/UltraEthernet/properties/name'
          x-field-uid: 1
        state:
          description: >-
            The CBFC state to apply.

            - sender_enable / sender_disable: enable or disable the CBFC sender.
            - receiver_enable / receiver_disable: enable or disable the CBFC receiver.
            - enable_all / disable_all: enable or disable both sender and receiver.
          type: string
          x-field-uid: 2
          x-enum:
            sender_enable:
              x-field-uid: 1
            sender_disable:
              x-field-uid: 2
            receiver_enable:
              x-field-uid: 3
            receiver_disable:
              x-field-uid: 4
            enable_all:
              x-field-uid: 5
            disable_all:
              x-field-uid: 6

    State.UltraEthernet.Impairment:
      description: >-
        Starts or stops a Ultra Ethernet impairment "test" on configured Ultra
        Ethernet instances. The impairment parameters are taken from the matching
        impairment configuration applied via set_config.
      type: object
      required:
        - impairment
        - state
      properties:
        ultra_ethernet_names:
          description: >-
            The names of target Ultra Ethernet instances.
            An empty or null list will target all Ultra Ethernet instances.
          type: array
          items:
            type: string
          x-constraint:
          - '/components/schemas/UltraEthernet/properties/name'
          x-field-uid: 1
        impairment:
          description: >-
            The impairment test to start or stop. Each value corresponds to an
            impairment configured under the Ultra Ethernet impairment settings.
          type: string
          x-field-uid: 2
          x-enum:
            llr_frame_sequence_jump:
              x-field-uid: 1
            llr_frame_crc_error:
              x-field-uid: 2
            llr_poisoned_crc_error:
              x-field-uid: 3
            llr_init_echo_incorrect_content:
              x-field-uid: 4
            llr_generate_nack:
              x-field-uid: 5
            llr_ack_nack_incorrect_sequence_number:
              x-field-uid: 6
            llr_ack_sequence_freeze:
              x-field-uid: 7
            llr_tx_force_replay:
              x-field-uid: 8
            tx_ctl_os_drop:
              x-field-uid: 9
            rx_ctl_os_drop:
              x-field-uid: 10
            tx_ctl_os_delay:
              x-field-uid: 11
        state:
          description: >-
            The impairment state to apply.

            - start: begin injecting the impairment using its configured parameters.
            - stop: stop injecting the impairment (traffic passes unimpaired).
          type: string
          x-field-uid: 3
          x-enum:
            start:
              x-field-uid: 1
            stop:
              x-field-uid: 2
