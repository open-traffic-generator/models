components:
  schemas:
    Ldp.Sessions.State.Request:
      description: >-
        The request to retrieve LDP session information.
      type: object
      properties:
        ldp_router_names:
          description: >-
            The names of LDP routers for which session information is
            requested. An empty list returns all LDP routers.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Device.Ldp/properties/name"
          x-field-uid: 1

    Ldp.Sessions.State:
      description: >-
        The LDP sessions of one LDP router.
      type: object
      properties:
        ldp_router_name:
          description: >-
            The name of the LDP router.
          type: string
          x-field-uid: 1
        sessions:
          description: >-
            The state of each LDP session of the router.
          type: array
          items:
            $ref: '#/components/schemas/Ldp.Session'
          x-field-uid: 2

    Ldp.Session:
      description: >-
        State of one LDP session (RFC 5036 Section 2.5.4 session state machine).
      type: object
      properties:
        interface_name:
          description: >-
            Name of the Ldp.Ipv4Interface the session runs on. Present for
            link-discovery sessions.
          type: string
          x-field-uid: 1
        peer_name:
          description: >-
            Name of the Ldp.TargetedPeer the session runs to. Present for
            targeted sessions.
          type: string
          x-field-uid: 2
        session_state:
          description: >-
            LDP session state (RFC 5036 Section 2.5.4).
          type: string
          x-enum:
            non_existent:
              x-field-uid: 1
            initialized:
              x-field-uid: 2
            open_received:
              x-field-uid: 3
            open_sent:
              x-field-uid: 4
            operational:
              x-field-uid: 5
          x-field-uid: 3
