components:
  schemas:
    Ldp.Ipv4FecRange:
      description: >-
        A range of IPv4 prefix FECs (FEC element type 2, RFC 5036
        Section 3.4.1) advertised in Label Mapping messages. Each prefix is
        bound to a label taken from label_start according to label_mode.
      type: object
      required: [name]
      properties:
        name:
          x-include: ../../common/common.yaml#/components/schemas/Named.Object/properties/name
          x-field-uid: 1
        addresses:
          description: >-
            A list of groups of IPv4 prefixes.
          type: array
          items:
            $ref: '../routes/routeaddresses.yaml#/components/schemas/V4RouteAddress'
          x-field-uid: 2
        label_start:
          description: >-
            The label bound to the first prefix (Generic Label TLV, RFC 5036
            Section 3.4.2). Labels 0 to 15 are reserved (RFC 3032).
          type: integer
          format: uint32
          default: 16
          minimum: 16
          maximum: 1048575
          x-field-uid: 3
        label_mode:
          description: >-
            How the label changes from one prefix to the next. increment binds
            label_start, label_start + 1, ...; fixed binds label_start to every
            prefix.
          type: string
          default: increment
          x-enum:
            increment:
              x-field-uid: 1
            fixed:
              x-field-uid: 2
          x-field-uid: 4
