openapi: 3.0.3
info:
  title: CCL generation parameters models
  version: ^0.0.0
components:
  schemas:
    Ccl.Generation:
      description: >-
        Traffic generation parameters for a CCL communicator.
        Controls data volume, iteration pacing, and QP scheduling behavior.
        Transport-level settings (ib_mtu, chunk_size_kb, qps_per_peer,
        encapsulation, connection type) are configured separately in
        Ccl.Rocev2Policy.
      type: object
      properties:
        data_size:
          description: Total gradient/data size per iteration.
          type: integer
          format: uint64
          default: 160
          minimum: 1
          x-field-uid: 1
        data_size_unit:
          description: >-
            Unit for data_size. gigabit/megabit/kilobyte are bit-based;
            gigabyte/megabyte are byte-based (1 gigabyte = 8 gigabit).
            Use gigabit to match typical AI fabric bandwidth benchmarks
            (e.g. 400 Gb/s line rate); use gigabyte to match GPU memory
            transfer conventions (e.g. model weights in GB).
          type: string
          default: gigabit
          x-field-uid: 2
          x-enum:
            gigabit:
              x-field-uid: 1
            gigabyte:
              x-field-uid: 2
            megabit:
              x-field-uid: 3
            megabyte:
              x-field-uid: 4
            kilobyte:
              x-field-uid: 5
        compute_gap:
          description: >-
            GPU compute (reduce) gap inserted between successive collective
            iterations. Simulates time ranks spend on local computation between
            communication phases. When omitted, no gap is inserted (equivalent
            to back-to-back stress test with fixed.ms = 0).
            Mirrors the Flow.Duration discriminated union pattern.
          $ref: '#/components/schemas/Ccl.Generation.ComputeGap'
          x-field-uid: 15
        qp_scheduling:
          description: >-
            Controls how the traffic generator interleaves multiple QP flows
            on a shared port: how much each QP transmits in one scheduling
            turn before the next QP gets its turn. Affects per-ECMP-path
            burst size and how readily ECN or PFC is triggered on the DUT.
            Mirrors the Flow.Duration discriminated union pattern.
          $ref: '#/components/schemas/Ccl.Generation.QpScheduling'
          x-field-uid: 10

    Ccl.Generation.ComputeGap:
      description: >-
        Discriminated union for the GPU compute (reduce) gap between iterations.
        fixed: constant gap of fixed.ms milliseconds each iteration.
        random: gap sampled uniformly from [min_ms, max_ms] per iteration,
        simulating natural variance in GPU compute time across iterations.
        Omit this field entirely for back-to-back stress testing (no gap).
      type: object
      properties:
        choice:
          type: string
          default: fixed
          x-field-uid: 1
          x-enum:
            fixed:
              x-field-uid: 1
            random:
              x-field-uid: 2
        fixed:
          $ref: '#/components/schemas/Ccl.Generation.ComputeGap.Fixed'
          x-field-uid: 2
        random:
          $ref: '#/components/schemas/Ccl.Generation.ComputeGap.Random'
          x-field-uid: 3

    Ccl.Generation.ComputeGap.Fixed:
      description: >-
        Constant compute gap applied at every iteration.
        Set ms = 0 for back-to-back stress testing with no compute phase.
      type: object
      properties:
        ms:
          description: Compute gap duration in milliseconds.
          type: integer
          format: uint32
          default: 200
          minimum: 0
          x-field-uid: 1

    Ccl.Generation.ComputeGap.Random:
      description: >-
        Compute gap sampled uniformly from [min_ms, max_ms] at each iteration.
        Use this to model natural variance in GPU compute time, producing more
        realistic jitter in the collective communication pattern.
      type: object
      properties:
        min_ms:
          description: Minimum compute gap in milliseconds.
          type: integer
          format: uint32
          default: 10
          minimum: 0
          x-field-uid: 1
        max_ms:
          description: Maximum compute gap in milliseconds.
          type: integer
          format: uint32
          default: 200
          minimum: 0
          x-field-uid: 2

    Ccl.Generation.QpScheduling:
      description: >-
        Discriminated union for per-QP transmission scheduling.
        continuous: each QP completes one full RDMA Write before yielding;
        no interruption mid-message (default; closest to real GPU behavior).
        data_size: each QP sends a fixed byte volume per turn then yields.
        frame_count: each QP sends a fixed number of frames per turn then yields.
      type: object
      properties:
        choice:
          type: string
          default: continuous
          x-field-uid: 1
          x-enum:
            continuous:
              x-field-uid: 1
            data_size:
              x-field-uid: 2
            frame_count:
              x-field-uid: 3
        continuous:
          $ref: '#/components/schemas/Ccl.Generation.QpScheduling.Continuous'
          x-field-uid: 2
        data_size:
          $ref: '#/components/schemas/Ccl.Generation.QpScheduling.DataSize'
          x-field-uid: 3
        frame_count:
          $ref: '#/components/schemas/Ccl.Generation.QpScheduling.FrameCount'
          x-field-uid: 4

    Ccl.Generation.QpScheduling.Continuous:
      description: >-
        Each QP completes one full RDMA Write operation before yielding to
        the next QP; no other QP is interleaved within a single RDMA Write.
        This is the default mode and most closely approximates real GPU
        behavior: GPUDirect RDMA issues data in complete message-sized chunks
        without mid-message interleaving from other QPs.
      type: object

    Ccl.Generation.QpScheduling.DataSize:
      description: >-
        Each QP sends a fixed volume of data per scheduling turn before
        yielding. Larger values produce bigger per-ECMP-path bursts, more
        likely to trigger ECN marking; smaller values distribute load more
        finely across paths and reduce per-path congestion risk.
      type: object
      properties:
        size_kb:
          description: Data volume per QP per scheduling turn in KB.
          type: integer
          format: uint32
          default: 128
          minimum: 1
          x-field-uid: 1

    Ccl.Generation.QpScheduling.FrameCount:
      description: >-
        Each QP sends a fixed number of frames per scheduling turn before
        yielding. Packet-fair across QPs; useful for testing fine-grained
        ECMP load distribution where each path receives equal packet count.
      type: object
      properties:
        count:
          description: Number of frames per QP per scheduling turn.
          type: integer
          format: uint32
          default: 1
          minimum: 1
          x-field-uid: 1
