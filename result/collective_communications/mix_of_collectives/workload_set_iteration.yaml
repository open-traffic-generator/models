components:
  schemas:
    CollectiveCommunications.MixOfCollectives.WorkloadSetIteration.Metrics.Request:
      description: >-
        Request for workload set iteration metrics. Contains details timing and throughput statistics for each collective in each workload set iteration.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              process_group:
                x-field-uid: 2
              data_size_bytes:
                x-field-uid: 3
              collective:
                x-field-uid: 4
              workload_set_iteration:
                x-field-uid: 5
              workload_iterations:
                x-field-uid: 6
              operation_iterations:
                x-field-uid: 7
              min_collective_time_ms:
                x-field-uid: 8
              avg_collective_time_ms:
                x-field-uid: 9
              max_collective_time_ms:
                x-field-uid: 10
              min_algbw_gbps:
                x-field-uid: 11
              avg_algbw_gbps:
                x-field-uid: 12
              max_algbw_gbps:
                x-field-uid: 13
              min_busbw_gbps:
                x-field-uid: 14
              avg_busbw_gbps:
                x-field-uid: 15
              max_busbw_gbps:
                x-field-uid: 16
              min_ideal_percentage:
                x-field-uid: 17
              avg_ideal_percentage:
                x-field-uid: 18
              max_ideal_percentage:
                x-field-uid: 19
              workload_set_iteration_start_time_ms:
                x-field-uid: 20
              workload_set_iteration_end_time_ms:
                x-field-uid: 21
              total_time_s:
                x-field-uid: 22
              duty_cycle_percentage:
                x-field-uid: 23
          x-field-uid: 2
    CollectiveCommunications.MixOfCollectives.WorkloadSetIteration.Metric:
      description: >-
        One row of workload set iteration metrics.
      type: object
      properties:
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        process_group:
          description: >-
            The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 2
        data_size_bytes:
          description: >-
            The payload size of the collective in bytes.
          type: integer
          format: uint64
          x-field-uid: 3
        collective:
          description: >-
            Identifier of the collective operation aggregated in this row.
          type: string
          x-field-uid: 4
        workload_set_iteration:
          description: >-
            The workload set iteration aggregated in this row.
          type: integer
          format: uint32
          x-field-uid: 5
        workload_iterations:
          description: >-
            Number of iterations of each workload within this workload set
            iteration.
          type: integer
          format: uint32
          x-field-uid: 6
        operation_iterations:
          description: >-
            Number of iterations of each operation within each workload
            iteration.
          type: integer
          format: uint32
          x-field-uid: 7
        min_collective_time_ms:
          description: >-
            Minimum collective completion time (ms) observed across operation
            iterations of this workload set iteration.
          type: number
          x-field-uid: 8
        avg_collective_time_ms:
          description: >-
            Average collective completion time (ms) across operation iterations
            of this workload set iteration.
          type: number
          x-field-uid: 9
        max_collective_time_ms:
          description: >-
            Maximum collective completion time (ms) observed across operation
            iterations of this workload set iteration.
          type: number
          x-field-uid: 10
        min_algbw_gbps:
          description: >-
            Minimum algorithmic bandwidth (GB/s) observed across operation
            iterations of this workload set iteration.
          type: number
          x-field-uid: 11
        avg_algbw_gbps:
          description: >-
            Average algorithmic bandwidth (GB/s) across operation iterations of
            this workload set iteration.
          type: number
          x-field-uid: 12
        max_algbw_gbps:
          description: >-
            Maximum algorithmic bandwidth (GB/s) observed across operation
            iterations of this workload set iteration.
          type: number
          x-field-uid: 13
        min_busbw_gbps:
          description: >-
            Minimum bus bandwidth (GB/s) observed across operation iterations of
            this workload set iteration.
          type: number
          x-field-uid: 14
        avg_busbw_gbps:
          description: >-
            Average bus bandwidth (GB/s) across operation iterations of this
            workload set iteration.
          type: number
          x-field-uid: 15
        max_busbw_gbps:
          description: >-
            Maximum bus bandwidth (GB/s) observed across operation iterations of
            this workload set iteration.
          type: number
          x-field-uid: 16
        min_ideal_percentage:
          description: >-
            Minimum achieved fraction of ideal link bandwidth (as percentage)
            across operation iterations of this workload set iteration.
          type: number
          x-field-uid: 17
        avg_ideal_percentage:
          description: >-
            Average achieved fraction of ideal link bandwidth (as percentage)
            across operation iterations of this workload set iteration.
          type: number
          x-field-uid: 18
        max_ideal_percentage:
          description: >-
            Maximum achieved fraction of ideal link bandwidth (as percentage)
            across operation iterations of this workload set iteration.
          type: number
          x-field-uid: 19
        workload_set_iteration_start_time_ms:
          description: >-
            Start time of the workload set iteration measured in milliseconds since the start of execution.
          type: number
          x-field-uid: 20
        workload_set_iteration_end_time_ms:
          description: >-
            End time of the workload set iteration measured in milliseconds since the start of execution.
          type: number
          x-field-uid: 21
        total_time_s:
          description: >-
            Wall-clock time (s) the collective was active during this workload
            set iteration.
          type: number
          x-field-uid: 22
        duty_cycle_percentage:
          description: >-
            Fraction of workload set iteration time the collective was actively
            transferring data (as percentage).
          type: number
          x-field-uid: 23
