            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 8
        reserved0:
          x-field-pattern:
            description: Reserved, transmitted as zero.
            format: integer
            length: 6
            default: 0
            features: [count]
          x-field-uid: 9
        dest_qp:
          x-field-pattern:
            description: Destination queue pair number.
            format: integer
            length: 24
            default: 0
            features: [count, metric_tags]
          x-field-uid: 10
        ack_req:
          x-field-pattern:
            description: Requests an ACKNOWLEDGE packet for this packet.
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 11
        reserved1:
          x-field-pattern:
            description: Reserved, transmitted as zero.
            format: integer
            length: 7
            default: 0
            features: [count]
          x-field-uid: 12
        psn:
          x-field-pattern:
            description: Packet sequence number.
            format: integer
            length: 24
            default: 0
            features: [count]
          x-field-uid: 13
        reth:
          $ref: '#/components/schemas/Flow.Ibth.Reth'
          description: >-
            Only meaningful when sequence is first or only - RETH is not
            carried on middle/last WRITE packets. Omit on middle/last.
          x-field-uid: 14
        immediate_data:
          $ref: '#/components/schemas/Flow.Ibth.ImmDt'
          description: >-
            When present, selects the RDMA WRITE "...with Immediate" OpCode
            variant. Only valid when sequence is last or only.
          x-field-uid: 15

    Flow.Ibth.Rc.ReadRequest:
      description: >-
        RC RDMA READ Request (IBTA Volume 1, Section 9.7, Table 41, OpCode
        0x0C). Always a single packet; always carries RETH.
      type: object
      properties:
        solicited_event:
          x-field-pattern:
