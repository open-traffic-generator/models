            Application Identifier bit (RFC 9479), or the type of a nested link-attribute
            sub-TLV reusing the OSPFv2 Extended Link TLV Sub-TLV type space (RFC 9492).
          type: string
          x-field-uid: 1
          x-enum:
            rsvp_te:
              description: >-
                RSVP-TE Application Identifier bit (R-bit), bit 0 (RFC 9479).
              x-field-uid: 1
            segment_routing_policy:
              description: >-
                Segment Routing Policy Application Identifier bit (S-bit), bit 1
                (RFC 9479).
              x-field-uid: 2
            loop_free_alternate:
              description: >-
                Loop-Free Alternate Application Identifier bit (F-bit), bit 2
                (RFC 9479).
              x-field-uid: 3
            flexible_algorithm:
              description: >-
                Flexible Algorithm Application Identifier bit (X-bit), bit 3
                (RFC 9350 Section 12).
              x-field-uid: 4
            shared_risk_link_group:
              description: >-
