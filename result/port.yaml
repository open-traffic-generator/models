components:
  schemas:
    Port.Metrics.Request:
      description: >-
        The port result request to the traffic generator
      type: object
      properties:
        port_names:
          description: >-
            The names of objects to return results for.
            An empty list will return all port row results.
          type: array
          items:
            type: string
          x-constraint:
          - '/components/schemas/Port/properties/name'
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
            The name of the port cannot be excluded.
          type: array
          items:
            type: string
            x-enum:
              transmit:
                x-field-uid: 1
              location:
                x-field-uid: 2
              link:
                x-field-uid: 3
              capture:
                x-field-uid: 4
              frames_tx:
                x-field-uid: 5
              frames_rx:
                x-field-uid: 6
              bytes_tx:
                x-field-uid: 7
              bytes_rx:
                x-field-uid: 8
              frames_tx_rate:
                x-field-uid: 9
              frames_rx_rate:
                x-field-uid: 10
              bytes_tx_rate:
                x-field-uid: 11
              bytes_rx_rate:
                x-field-uid: 12
              last_change:
                x-field-uid: 13
              speed:
                x-field-uid: 14
              pfc_class_0_frames_rx:
                x-field-uid: 15
              pfc_class_1_frames_rx:
                x-field-uid: 16
              pfc_class_2_frames_rx:
                x-field-uid: 17
              pfc_class_3_frames_rx:
                x-field-uid: 18
              pfc_class_4_frames_rx:
                x-field-uid: 19
              pfc_class_5_frames_rx:
                x-field-uid: 20
              pfc_class_6_frames_rx:
                x-field-uid: 21
              pfc_class_7_frames_rx:
                x-field-uid: 22
          x-field-uid: 2
    Port.Metric:
      description: >-
        The per-port result metrics. The pfc_class_[0-7]_frames_rx metrics count received
        Priority Flow Control (PFC) pause frames per priority, as defined by IEEE 802.1Qbb.
      type: object
      properties:
        name:
          description: >-
            The name of a configured port
          type: string
          x-constraint:
          - '/components/schemas/Port/properties/name'
          x-field-uid: 1
        location:
          description: >-
            The state of the connection to the test port location.
            The format should be the configured port location along with  any custom
            connection state message.
          type: string
          x-field-uid: 2
        link:
          description: >-
            The state of the test port link
            The string can be up, down or a custom error message.
          type: string
          x-field-uid: 3
          x-enum:
            up:
              x-field-uid: 1
            down:
              x-field-uid: 2
        capture:
          description: >-
            The state of the test port capture infrastructure.
            The string can be started, stopped or a custom error message.
          type: string
          x-field-uid: 4
          x-enum:
            started:
              x-field-uid: 1
            stopped:
              x-field-uid: 2
        frames_tx:
          description: >-
            The current total number of frames transmitted
          type: integer
          format: uint64
          x-field-uid: 5
        frames_rx:
          description: >-
            The current total number of valid frames received
          type: integer
          format: uint64
          x-field-uid: 6
        bytes_tx:
          description: >-
            The current total number of bytes transmitted
          type: integer
          format: uint64
          x-field-uid: 7
        bytes_rx:
          description: >-
            The current total number of valid bytes received
          type: integer
          format: uint64
          x-field-uid: 8
        frames_tx_rate:
          description: >-
            The current rate of frames transmitted
          type: number
          x-field-uid: 9
        frames_rx_rate:
          description: >-
            The current rate of valid frames received
          type: number
          x-field-uid: 10
        bytes_tx_rate:
          description: >-
            The current rate of bytes transmitted
          type: number
          x-field-uid: 11
        bytes_rx_rate:
          description: >-
            The current rate of bytes received
          type: number
          x-field-uid: 12
        transmit:
          description: >-
            The transmit state of the flow.
          type: string
          x-field-uid: 13
          x-enum:
            started:
              x-field-uid: 1
            stopped:
              x-field-uid: 2
        last_change:
          description: |-
            The timestamp indicates the absolute time of the last 
            link state change of the test port (e.g., up-to-down transition).
      
            The value is the timestamp in nanoseconds relative to
            the Unix Epoch (Jan 1, 1970 00:00:00 UTC).
          type: integer
          format: uint64
          x-field-uid: 14
        data_integrity:
          $ref: '#/components/schemas/Metric.DataIntegrity'
          x-field-uid: 15
        speed:
          description: >-
            The speed in KBps the frames are transmitted. The calculated speed for 
            a negotiated line speed of
            (i) 100 Gbps is 100 * 1000 * 1000 / 8 = 12500000 KBps,
            (ii) 1.6 Tbps (high performance devices) is 1.6 * 1000 * 1000 * 1000 / 8 = 200000000 KBps,
            (iii) 10 Mbps (legacy devices) is 10 * 1000 / 8 = 1250 KBps
          type: integer
          format: uint64
          x-field-uid: 16
        pfc_class_0_frames_rx:
          description: >-
            The number of PFC pause frames received on this port with bit 0 set in the 
            class-enable vector, requesting the peer to pause transmission of priority 0 traffic.
          type: integer
          format: uint64
          x-field-uid: 17
        pfc_class_1_frames_rx:
          description: >-
            The number of PFC pause frames received on this port with bit 1 set in the 
            class-enable vector, requesting the peer to pause transmission of priority 1 traffic.
          type: integer
          format: uint64
          x-field-uid: 18
        pfc_class_2_frames_rx:
          description: >-
            The number of PFC pause frames received on this port with bit 2 set in the 
            class-enable vector, requesting the peer to pause transmission of priority 2 traffic.
          type: integer
          format: uint64
          x-field-uid: 19
        pfc_class_3_frames_rx:
          description: >-
            The number of PFC pause frames received on this port with bit 3 set in the 
            class-enable vector, requesting the peer to pause transmission of priority 3 traffic.
          type: integer
          format: uint64
          x-field-uid: 20
        pfc_class_4_frames_rx:
          description: >-
            The number of PFC pause frames received on this port with bit 4 set in the 
            class-enable vector, requesting the peer to pause transmission of priority 4 traffic.
          type: integer
          format: uint64
          x-field-uid: 21
        pfc_class_5_frames_rx:
          description: >-
            The number of PFC pause frames received on this port with bit 5 set in the 
            class-enable vector, requesting the peer to pause transmission of priority 5 traffic.
          type: integer
          format: uint64
          x-field-uid: 22
        pfc_class_6_frames_rx:
          description: >-
            The number of PFC pause frames received on this port with bit 6 set in the 
            class-enable vector, requesting the peer to pause transmission of priority 6 traffic.
          type: integer
          format: uint64
          x-field-uid: 23
        pfc_class_7_frames_rx:
          description: >-
            The number of PFC pause frames received on this port with bit 7 set in the 
            class-enable vector, requesting the peer to pause transmission of priority 7 traffic.
          type: integer
          format: uint64
          x-field-uid: 24
    Metric.DataIntegrity:
      description: |-
        The container for data integrity metrics. The container will be empty if 
        options.port_options.data_integrity has not been enabled during set_config.
      type: object
      properties:
        total_frames_rx:
          description: |-
            The total number of data integrity enabled frames received
          type: integer
          format: uint64
          x-field-uid: 1
        error_frames_rx:
          description: |-
            The total number of data integrity enabled frames received with payload modified
          type: integer
          format: uint64
          x-field-uid: 2
