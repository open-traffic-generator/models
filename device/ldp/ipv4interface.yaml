components:
  schemas:
    Ldp.Ipv4Interface:
      description: >-
        LDP Basic Discovery on an IPv4 interface (RFC 5036 Section 2.4.1). The
        emulated LSR sends LDP Link Hellos (UDP port 646, destination
        224.0.0.2) on the referenced IPv4 interface and forms a session with
        each LSR discovered on the link.
      type: object
      required: [name, ipv4_name]
      properties:
        name:
          x-include: ../../common/common.yaml#/components/schemas/Named.Object/properties/name
          x-field-uid: 1
        ipv4_name:
          description: >-
            The globally unique name of the IPv4 interface on which Link Hellos
            are sent. It must match the "name" field of an entry in
            "ipv4_addresses". A loopback cannot be used, because Link Hellos
            are sent on a link.
          type: string
          x-constraint:
          - '/components/schemas/Device.Ipv4/properties/name'
          x-field-uid: 2
        hello_interval:
          description: >-
            The interval in seconds between Link Hello messages. RFC 5036
            Section 3.5.2.1 asks that Hellos are sent well within the hold time;
            hello_interval should be at most one third of hello_hold_time.
          type: integer
          format: uint32
          minimum: 1
          maximum: 65535
          default: 5
          x-field-uid: 3
        hello_hold_time:
          description: >-
            The Hold Time in seconds advertised in the Common Hello Parameters
            TLV of Link Hellos (RFC 5036 Section 3.5.2). The hello adjacency is
            removed when no Hello is received within the negotiated hold time,
            which is the smaller of the two advertised values. The value 65535
            means infinite.
          type: integer
          format: uint32
          minimum: 1
          maximum: 65535
          default: 15
          x-field-uid: 4
        authentication:
          description: >-
            When present, the TCP MD5 Signature Option is used on the session
            TCP connection of every session discovered on this interface
            (RFC 5036 Section 2.9). Omit to disable authentication. A session
            is a single TCP connection, so all adjacencies that lead to the same
            peer LSR must use the same key.
          $ref: './authentication.yaml#/components/schemas/Ldp.Authentication'
          x-field-uid: 5
