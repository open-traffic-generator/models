      properties:
        starting_sid:
          description: >-
            The first value (base SID/label) of the SRGB range.
          type: integer
          format: uint32
          x-field-uid: 1
        range:
          description: >-
            The number of SIDs in this SRGB range.
          type: integer
          format: uint32
          x-field-uid: 2

    Ospfv2Lsa.Srlb:
      description: >-
        A learned SR Local Block (SRLB) range.
      type: object
      properties:
        starting_sid:
          description: >-
            The first value (base SID/label) of the SRLB range.
          type: integer
          format: uint32
          x-field-uid: 1
        range:
          description: >-
            The number of SIDs in this SRLB range.
          type: integer
          format: uint32
          x-field-uid: 2

    Ospfv2Lsa.PrefixSid:
      description: |-
        The learned OSPFv2 Prefix-SID and its attributes, decoded from the Prefix-SID sub-TLV of
        the Extended Prefix Opaque LSA (RFC 8665).
      type: object
      properties:
        sids:
          description: >-
            One or more SID/Label values or indices associated with the IGP Prefix segment
            attached to the prefix.
          type: array
          items:
            type: integer
            format: uint32
          x-field-uid: 1
        flags:
          description: >-
            Flags associated with the Prefix-SID.
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSidFlags'
          x-field-uid: 2
        algorithm:
          description: >-
            The Segment Routing algorithm the Prefix-SID is associated with.
          type: integer
          format: uint32
          maximum: 255
          x-field-uid: 3

    Ospfv2Lsa.PrefixSidFlags:
      description: >-
        One-octet flags of the OSPFv2 Prefix-SID sub-TLV (RFC 8665).
      type: object
      properties:
        np_flag:
          description: >-
            NP-Flag (No-PHP): if set, the penultimate hop MUST NOT pop the Prefix-SID before
            delivering the packet to the advertising node.
          type: boolean
          x-field-uid: 1
        m_flag:
          description: >-
            M-Flag (Mapping Server): if set, the SID was advertised by an SR Mapping Server.
          type: boolean
          x-field-uid: 2
        e_flag:
          description: >-
            E-Flag (Explicit-Null): if set, the upstream neighbor MUST replace the Prefix-SID with
            the Explicit-NULL label before forwarding.
          type: boolean
          x-field-uid: 3
        v_flag:
          description: >-
            V-Flag (Value): if set, the Prefix-SID carries an absolute value (label); if clear, an
            index.
          type: boolean
          x-field-uid: 4
        l_flag:
          description: >-
            L-Flag (Local): if set, the value/index carried by the Prefix-SID has local
            significance.
          type: boolean
          x-field-uid: 5

    Ospfv2Lsa.AdjacencySid:
      description: |-
        The learned OSPFv2 Adjacency-SID and its attributes, decoded from the Adj-SID / LAN Adj-SID
        sub-TLV of the Extended Link Opaque LSA (RFC 8665).
      type: object
      properties:
        type:
          description: >-
            Adjacency-SID type: Adjacency-SID (Extended Link sub-TLV Type 2) or LAN Adjacency-SID
            (Type 3).
          type: string
          x-field-uid: 1
          x-enum:
            adj_sid:
              x-field-uid: 1
            lan_adj_sid:
              x-field-uid: 2
        sids:
          description: >-
            One or more SID/Label values or indices associated with the adjacency.
          type: array
          items:
            type: integer
            format: uint32
          x-field-uid: 2
        flags:
          description: >-
            Flags associated with the Adjacency-SID.
          $ref: '#/components/schemas/Ospfv2Lsa.AdjSidFlags'
          x-field-uid: 3
        weight:
          description: >-
            The weight of the Adjacency-SID for the purpose of load balancing.
          type: integer
          format: uint32
          x-field-uid: 4

    Ospfv2Lsa.AdjSidFlags:
      description: >-
        One-octet flags of the OSPFv2 Adjacency-SID sub-TLV (RFC 8665).
      type: object
      properties:
        b_flag:
          description: >-
            B-Flag (Backup): the Adjacency-SID is eligible for protection.
          type: boolean
          x-field-uid: 1
        g_flag:
          description: >-
            G-Flag (Group): the Adjacency-SID refers to a group of adjacencies.
          type: boolean
          x-field-uid: 2
        p_flag:
          description: >-
            P-Flag (Persistent): the Adjacency-SID is persistently allocated.
          type: boolean
          x-field-uid: 3
        v_flag:
          description: >-
            V-Flag (Value): if set, the Adj-SID carries an absolute value (label); if clear, an
            index.
          type: boolean
          x-field-uid: 4
        l_flag:
          description: >-
            L-Flag (Local): if set, the value/index carried by the Adj-SID has local significance.
          type: boolean
          x-field-uid: 5

    Ospfv2Lsa.RiCapabilities:
      description: |-
        The Router Informational Capabilities (TLV type 1) and Router Functional Capabilities
        (TLV type 2) learned from the Router Information (RI) Opaque LSA (RFC 7770 Sections 2.5,
        2.6).
      type: object
      properties:
        graceful_restart:
          description: >-
            Informational Capabilities bit 0: the router is Graceful Restart capable
            (RFC 7770 Section 2.5).
          type: boolean
          x-field-uid: 1
        graceful_restart_helper:
          description: >-
            Informational Capabilities bit 1: the router is Graceful Restart Helper capable
            (RFC 7770 Section 2.5).
          type: boolean
          x-field-uid: 2
        stub_router_support:
          description: >-
            Informational Capabilities bit 2: the router supports OSPF Stub Router functionality
            (RFC 7770 Section 2.5).
          type: boolean
          x-field-uid: 3
        traffic_engineering_support:
          description: >-
            Informational Capabilities bit 3: the router supports OSPF Traffic Engineering
            (RFC 7770 Section 2.5).
          type: boolean
          x-field-uid: 4
        point_to_point_over_lan:
          description: >-
            Informational Capabilities bit 4: the router supports point-to-point operation over
            LAN (RFC 7770 Section 2.5).
          type: boolean
          x-field-uid: 5
        experimental_te:
          description: >-
            Informational Capabilities bit 5: the router supports Experimental Traffic
            Engineering (RFC 7770 Section 2.5).
          type: boolean
          x-field-uid: 6
        functional_capabilities:
          description: |-
            The raw 32-bit Router Functional Capabilities bitmask (RFC 7770 Section 2.6). No
            capability bits are assigned in this registry as of RFC 7770; returned raw since there
            are no named bits to decode.
          type: integer
          format: uint32
          x-field-uid: 7

    Ospfv2Lsa.Msd:
      description: >-
        A single (MSD-Type, MSD-Value) pair from a Node MSD or Link MSD TLV/sub-TLV
        (RFC 8476 Sections 2, 3).
      type: object
      properties:
        msd_type:
          description: >-
            The MSD-Type, identifying the kind of Maximum SID Depth being advertised (IGP
            MSD-Types registry, RFC 8491).
          type: integer
          format: uint32
          maximum: 255
          x-field-uid: 1
        msd_value:
          description: |-
            The MSD-Value: the maximum number of SIDs the router or link supports in the SID
            stack. A value of 0 indicates no capability to impose any stack depth.
          type: integer
          format: uint32
          maximum: 255
          x-field-uid: 2

    Ospfv2Lsa.LinkTrafficEngineering:
      description: |-
        Traffic engineering attributes for a link, decoded from the Link TLV sub-TLVs of the
        Traffic Engineering Opaque LSA (RFC 3630 Section 2.5) and the corresponding sub-TLVs of
        the Extended Link TLV of the OSPFv2 Extended Link Opaque LSA (RFC 9492).
      type: object
      properties:
        link_type:
          description: >-
            The Link Type sub-TLV, sub-type 1 (RFC 3630 Section 2.5.1).
          type: string
          x-field-uid: 1
          x-enum:
            point_to_point:
              x-field-uid: 1
            multi_access:
              x-field-uid: 2
        local_interface_ip_addresses:
          description: >-
            The Local Interface IP Address sub-TLV, sub-type 3 (RFC 3630 Section 2.5.3).
          type: array
          items:
            type: string
            format: ipv4
          x-field-uid: 2
        remote_interface_ip_addresses:
          description: >-
            The Remote Interface IP Address sub-TLV, sub-type 4 (RFC 3630 Section 2.5.4).
          type: array
          items:
            type: string
            format: ipv4
          x-field-uid: 3
        te_metric:
          description: >-
            The Traffic Engineering Metric sub-TLV, sub-type 5 (RFC 3630 Section 2.5.5).
          type: integer
          format: uint32
          x-field-uid: 4
        maximum_bandwidth:
          description: |-
            The Maximum Bandwidth sub-TLV, sub-type 6, in bytes per second
            (RFC 3630 Section 2.5.6).
          type: number
          format: float
          x-field-uid: 5
        maximum_reservable_bandwidth:
          description: |-
            The Maximum Reservable Bandwidth sub-TLV, sub-type 7, in bytes per second
            (RFC 3630 Section 2.5.7).
          type: number
          format: float
          x-field-uid: 6
        unreserved_bandwidths:
          description: |-
            The Unreserved Bandwidth sub-TLV, sub-type 8: bandwidth reservable at each of the
            eight priority levels 0-7, in bytes per second (RFC 3630 Section 2.5.8).
          type: array
          items:
            type: number
            format: float
          x-field-uid: 7
        administrative_group:
          description: |-
            The Administrative Group sub-TLV bitmask, sourced from either the TE Link TLV
            sub-type 9 (RFC 3630 Section 2.5.9) or the OSPFv2 Extended Link TLV sub-type 19
            (RFC 9492 Section 6.2).
          type: integer
          format: uint32
          x-field-uid: 8
        extended_administrative_group:
          description: |-
            The Extended Administrative Group, sourced from either the TE Link TLV sub-type 26
            (RFC 7308) or the OSPFv2 Extended Link TLV sub-type 20 (RFC 9492 Section 6.3), as one
            or more additional 32-bit administrative-group words beyond administrative_group.
          type: array
          items:
            type: integer
            format: uint32
          x-field-uid: 9
        srlg:
          description: |-
            The Shared Risk Link Group (SRLG) membership of this link, sourced from either the TE
            Link TLV sub-type 16 (RFC 4203 Section 1.3) or the OSPFv2 Extended Link TLV sub-type 11
            (RFC 9492 Section 6.1).
          type: array
          items:
            type: integer
            format: uint32
          x-field-uid: 10
        link_msd:
          description: >-
            One or more Maximum SID Depth (MSD) values for this link, decoded from the Link MSD
            sub-TLV of the OSPFv2 Extended Link TLV, sub-type 6 (RFC 8476 Section 3).
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2Lsa.Msd'
          x-field-uid: 11
