components:
  schemas:
    CollectiveCommunications.WorkloadReplay.Qp.Metrics.Request:
      description: >-
        Request for queue-pair (QP) metrics. Contains detailed message statistics for each queue-pair used in the collective.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              data_size_bytes:
                x-field-uid: 1
              collective:
                x-field-uid: 2
              source_rank:
                x-field-uid: 3
              destination_rank:
                x-field-uid: 4
              source_qp_id:
                x-field-uid: 5
              destination_qp_id:
                x-field-uid: 6
              source_nic:
                x-field-uid: 7
              destination_nic:
                x-field-uid: 8
              messages_sent:
                x-field-uid: 9
              messages_received:
                x-field-uid: 10
              messages_failed:
                x-field-uid: 11
              bytes_tx:
                x-field-uid: 12
              bytes_rx:
                x-field-uid: 13
              frames_tx:
                x-field-uid: 14
              frames_rx:
                x-field-uid: 15
              frames_delta:
                x-field-uid: 16
              frames_seq_error:
                x-field-uid: 17
              frames_retx:
                x-field-uid: 18
              ack_tx:
                x-field-uid: 19
              ack_rx:
                x-field-uid: 20
              nack_tx:
                x-field-uid: 21
              nack_rx:
                x-field-uid: 22
              nack_rnr_rx:
                x-field-uid: 23
              reordered_rx:
                x-field-uid: 24
              duplicate_rx:
                x-field-uid: 25
              ecn_ce_rx:
                x-field-uid: 26
              cnp_tx:
                x-field-uid: 27
              cnp_rx:
                x-field-uid: 28
              min_latency_ns:
                x-field-uid: 29
              avg_latency_ns:
                x-field-uid: 30
              max_latency_ns:
                x-field-uid: 31
          x-field-uid: 2
    CollectiveCommunications.WorkloadReplay.Qp.Metric:
      description: >-
        One row of queue-pair (QP) metrics.
      type: object
      properties:
        data_size_bytes:
          description: >-
            Data size in Bytes.
          type: integer
          format: uint64
          x-field-uid: 1
        collective:
          description: >-
            Collective operation name.
          type: string
          x-field-uid: 2
        source_rank:
          description: >-
            Source rank.
          type: integer
          format: uint32
          x-field-uid: 3
        destination_rank:
          description: >-
            Destination rank.
          type: integer
          format: uint32
          x-field-uid: 4
        source_qp_id:
          description: >-
            Source QP ID.
          type: integer
          format: uint32
          x-field-uid: 5
        destination_qp_id:
          description: >-
            Destination QP ID.
          type: integer
          format: uint32
          x-field-uid: 6
        source_nic:
          description: >-
            Source NIC index.
          type: integer
          format: uint32
          x-field-uid: 7
        destination_nic:
          description: >-
            Destination NIC index.
          type: integer
          format: uint32
          x-field-uid: 8
        messages_sent:
          description: >-
            Messages sent.
          type: integer
          format: uint64
          x-field-uid: 9
        messages_received:
          description: >-
            Messages received.
          type: integer
          format: uint64
          x-field-uid: 10
        messages_failed:
          description: >-
            Messages failed.
          type: integer
          format: uint64
          x-field-uid: 11
        bytes_tx:
          description: >-
            Total bytes transmitted (this includes retransmitted bytes as well).
          type: integer
          format: uint64
          x-field-uid: 12
        bytes_rx:
          description: >-
            Total bytes received (this includes retransmitted bytes as well).
          type: integer
          format: uint64
          x-field-uid: 13
        frames_tx:
          description: >-
            Frames transmitted.
          type: integer
          format: uint64
          x-field-uid: 14
        frames_rx:
          description: >-
            Frames received.
          type: integer
          format: uint64
          x-field-uid: 15
        frames_delta:
          description: >-
            Frames delta.
          type: integer
          x-field-uid: 16
        frames_seq_error:
          description: >-
            Frames sequence error.
          type: integer
          format: uint64
          x-field-uid: 17
        frames_retx:
          description: >-
            Frames retransmitted.
          type: integer
          format: uint64
          x-field-uid: 18
        ack_tx:
          description: >-
            ACK transmitted.
          type: integer
          format: uint64
          x-field-uid: 19
        ack_rx:
          description: >-
            ACK received.
          type: integer
          format: uint64
          x-field-uid: 20
        nack_tx:
          description: >-
            NACK transmitted.
          type: integer
          format: uint64
          x-field-uid: 21
        nack_rx:
          description: >-
            NACK received.
          type: integer
          format: uint64
          x-field-uid: 22
        nack_rnr_rx:
          description: >-
            NACK RNR received.
          type: integer
          format: uint64
          x-field-uid: 23
        reordered_rx:
          description: >-
            Reordered frames received.
          type: integer
          format: uint64
          x-field-uid: 24
        duplicate_rx:
          description: >-
            Duplicate frames received.
          type: integer
          format: uint64
          x-field-uid: 25
        ecn_ce_rx:
          description: >-
            ECN-CE received.
          type: integer
          format: uint64
          x-field-uid: 26
        cnp_tx:
          description: >-
            CNP transmitted.
          type: integer
          format: uint64
          x-field-uid: 27
        cnp_rx:
          description: >-
            CNP received.
          type: integer
          format: uint64
          x-field-uid: 28
        min_latency_ns:
          description: >-
            Minimum latency in nanoseconds.
          type: integer
          format: uint64
          x-field-uid: 29
        avg_latency_ns:
          description: >-
            Average latency in nanoseconds.
          type: integer
          format: uint64
          x-field-uid: 30
        max_latency_ns:
          description: >-
            Maximum latency in nanoseconds.
          type: integer
          format: uint64
          x-field-uid: 31
