components:
  schemas:
    CollectiveCommunications.MixOfCollectives.Summary.Metrics.Request:
      description: >-
        Request for summary metrics. Summarizes the completion times and throughput rates per collective datasize.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              process_group:
                x-field-uid: 2
              data_size_bytes:
                x-field-uid: 3
              collective:
                x-field-uid: 4
              workload_set_iterations:
                x-field-uid: 5
              collective_time_ms:
                x-field-uid: 6
              algbw_gbps:
                x-field-uid: 7
              busbw_gbps:
                x-field-uid: 8
              ideal_percentage:
                x-field-uid: 9
              total_time_s:
                x-field-uid: 10
              duty_cycle_percentage:
                x-field-uid: 11
              pfc_rx:
                x-field-uid: 12
              ecn_ce_rx:
                x-field-uid: 13
              frames_retx:
                x-field-uid: 14
          x-field-uid: 2
    CollectiveCommunications.MixOfCollectives.Summary.Metric:
      description: >-
        One row of summary metrics.
      type: object
      properties:
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        process_group:
          description: >-
            The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 2
        data_size_bytes:
          description: >-
            The payload size of the collective in bytes.
          type: integer
          format: uint64
          x-field-uid: 3
        collective:
          description: >-
            Identifier of the collective operation aggregated in this row.
          type: string
          x-field-uid: 4
        workload_set_iterations:
          description: >-
            The number of cycles over which this collective was executed.
          type: integer
          format: uint32
          x-field-uid: 5
        collective_time_ms:
          description: >-
            Average completion time (ms) of the collective across all workload
            set iterations.
          type: number
          x-field-uid: 6
        algbw_gbps:
          description: >-
            Algorithmic bandwidth (data size divided by collective time), GB/s.
          type: number
          x-field-uid: 7
        busbw_gbps:
          description: >-
            Bus bandwidth (GB/s), accounting for the data movement pattern of the
            collective.
          type: number
          x-field-uid: 8
        ideal_percentage:
          description: >-
            Achieved bus bandwidth as a percentage of the ideal link bandwidth.
          type: number
          x-field-uid: 9
        total_time_s:
          description: >-
            Wall-clock time (s) the collective was active across all workload set iterations.
          type: number
          x-field-uid: 10
        duty_cycle_percentage:
          description: >-
            Fraction of total time the collective was actively transferring data
            (as percentage).
          type: number
          x-field-uid: 11
        pfc_rx:
          description: >-
            Total Priority Flow Control pause frames received during execution.
          type: integer
          format: uint64
          x-field-uid: 12
        ecn_ce_rx:
          description: >-
            Total ECN Congestion Experienced packets received during execution.
          type: integer
          format: uint64
          x-field-uid: 13
        frames_retx:
          description: >-
            Total frames retransmitted during execution.
          type: integer
          format: uint64
          x-field-uid: 14
