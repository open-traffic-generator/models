components:
  schemas:
    Flow.IbthMessage:
      description: >-
        Composite InfiniBand Transport Header (IBTH) / RoCEv2 message (IBTA
        Volume 1, Chapter 9 - Transport Layer). Bundles the mandatory Base
        Transport Header (BTH) with whichever extended transport header(s)
        the selected transport type and operation require. The wire-format
        BTH OpCode (IBTA Volume 1, Section 9.7, Table 41) is fully derived
        from choice plus the nested operation/sequence choices and is never
        an independently settable field.
      type: object
      properties:
        choice:
          description: >-
            InfiniBand transport service type (IBTA Volume 1, Section 9.7,
            Table 41). Sets the upper bits of the derived BTH OpCode and
            determines which operations and extended headers are valid.
          type: string
          default: reliable_connection
          x-field-uid: 1
          x-enum:
            reliable_connection:
              x-field-uid: 1
            unreliable_connection:
              x-field-uid: 2
            reliable_datagram:
              x-field-uid: 3
            unreliable_datagram:
              x-field-uid: 4
            congestion_notification:
              x-field-uid: 5
        reliable_connection:
          $ref: '#/components/schemas/Flow.Ibth.Rc'
          x-field-uid: 2
        unreliable_connection:
          $ref: '#/components/schemas/Flow.Ibth.Uc'
          x-field-uid: 3
        reliable_datagram:
          $ref: '#/components/schemas/Flow.Ibth.Rd'
          x-field-uid: 4
        unreliable_datagram:
          $ref: '#/components/schemas/Flow.Ibth.Ud'
          x-field-uid: 5
        congestion_notification:
          $ref: '#/components/schemas/Flow.Ibth.Cnp'
          x-field-uid: 6
        icrc:
          x-field-pattern:
            description: >-
              Invariant CRC (ICRC, IBTA Volume 1 Annex A17 - RoCEv2). This is
              a 32-bit trailer transmitted after the payload and pad bytes and
              immediately before the Ethernet FCS, not adjacent to the BTH.
              It is a standard Ethernet CRC-32 computed over an 8-byte
              pseudo-LRH of 0xFF followed by the packet from the IP header
              onward, with the mutable fields (IPv4 ToS, TTL and header
              checksum; IPv6 traffic class, flow label and hop limit; UDP
              checksum; BTH reserved byte 4) treated as all ones. When choice
              is auto the implementation SHOULD compute and insert the
              correct value. An implementation that cannot compute it MAY
              transmit the default value 0, which is sufficient for
              intermediate switches that do not inspect the ICRC but will be
              discarded by any receiver that validates it. Use value or
              values to transmit a specific (for example deliberately
              incorrect) ICRC.
            format: integer
            length: 32
            default: 0
            features: [auto, count]
          x-field-uid: 7

    # -----------------------------------------------------------------
    # Reusable extended transport header building blocks
    # (IBTA Volume 1, Chapter 9 - each carried after the BTH depending on
    # transport_type and operation; see the individual leaf schemas below
    # for exactly when each one is present).
    # -----------------------------------------------------------------

    Flow.Ibth.Reth:
      description: >-
        RDMA Extended Transport Header (RETH, IBTA Volume 1, Section 9.4.1).
        Carried on RDMA WRITE First/Only and RDMA READ Request packets.
      type: object
      properties:
        virtual_address:
          x-field-pattern:
            description: Start of the remote virtual address to read or write.
            format: integer
            length: 64
            default: 0
            features: [count]
          x-field-uid: 1
        r_key:
          x-field-pattern:
            description: Remote memory key authorizing access to virtual_address.
            format: integer
            length: 32
            default: 0
            features: [count]
          x-field-uid: 2
        dma_length:
          x-field-pattern:
            description: Number of bytes to transfer starting at virtual_address.
            format: integer
            length: 32
            default: 0
            features: [count]
          x-field-uid: 3

    Flow.Ibth.Aeth:
      description: >-
        ACK Extended Transport Header (AETH, IBTA Volume 1, Section 9.4.2).
        Carried on every ACKNOWLEDGE packet and on RDMA READ Response
        First/Last/Only packets.
      type: object
      properties:
        syndrome:
          x-field-pattern:
            description: >-
              ACK/NAK type (top 3 bits) and credit count or NAK code
              (bottom 5 bits).
            format: integer
            length: 8
            default: 0
            features: [count]
          x-field-uid: 1
        msn:
          x-field-pattern:
            description: Message Sequence Number of the last fully completed message.
            format: integer
            length: 24
            default: 0
            features: [count]
          x-field-uid: 2

    Flow.Ibth.AtomicEth:
      description: >-
        Atomic Extended Transport Header (AtomicETH, IBTA Volume 1, Table
        40). Carried on Compare&Swap and Fetch&Add request packets.
        Spec-accurate 4-field, 28-byte layout - operands are a fixed 8
        bytes each, with no explicit length field.
      type: object
      properties:
        virtual_address:
          x-field-pattern:
            description: Start of the remote 8-byte location to operate on.
            format: integer
            length: 64
            default: 0
            features: [count]
          x-field-uid: 1
        r_key:
          x-field-pattern:
            description: Remote memory key authorizing access to virtual_address.
            format: integer
            length: 32
            default: 0
            features: [count]
          x-field-uid: 2
        swap_or_add_data:
          x-field-pattern:
            description: >-
              Swap value for Compare&Swap, or the addend value for
              Fetch&Add.
            format: integer
            length: 64
            default: 0
            features: [count]
          x-field-uid: 3
        compare_data:
          x-field-pattern:
            description: >-
              Compare value for Compare&Swap. Ignored by the responder for
              Fetch&Add.
            format: integer
            length: 64
            default: 0
            features: [count]
          x-field-uid: 4

    Flow.Ibth.Rdeth:
      description: >-
        Reliable Datagram Extended Transport Header (RDETH, IBTA Volume 1,
        Section 9.4.3). Carried on every Reliable Datagram (RD) transport
        packet, ahead of any other extended header for that packet.
      type: object
      properties:
        reserved:
          x-field-pattern:
            description: Reserved, transmitted as zero.
            format: integer
            length: 8
            default: 0
            features: [count]
          x-field-uid: 1
        ee_context:
          x-field-pattern:
            description: End-to-End context identifying the RD channel.
            format: integer
            length: 24
            default: 0
            features: [count]
          x-field-uid: 2

    Flow.Ibth.Deth:
      description: >-
        Datagram Extended Transport Header (DETH, IBTA Volume 1, Section
        9.4.5). Carried on every Unreliable Datagram (UD) transport packet.
      type: object
      properties:
        q_key:
          x-field-pattern:
            description: Qualifier key validating the sender's right to send to dest_qp.
            format: integer
            length: 32
            default: 0
            features: [count]
          x-field-uid: 1
        reserved:
          x-field-pattern:
            description: Reserved, transmitted as zero.
            format: integer
            length: 8
            default: 0
            features: [count]
          x-field-uid: 2
        src_qp:
          x-field-pattern:
            description: Source queue pair number of the sender.
            format: integer
            length: 24
            default: 0
            features: [count, metric_tags]
          x-field-uid: 3

    Flow.Ibth.ImmDt:
      description: >-
        Immediate Data Extended Transport Header (ImmDt, IBTA Volume 1,
        Section 9.4.4). Carried on SEND and RDMA WRITE Last/Only packets
        whose OpCode selects the "...with Immediate" variant; delivered
        directly to the responder's completion queue entry.
      type: object
      properties:
        data:
          x-field-pattern:
            description: Immediate data value, opaque to the transport.
            format: integer
            length: 32
            default: 0
            features: [count]
          x-field-uid: 1

    Flow.Ibth.Ieth:
      description: >-
        Invalidate Extended Transport Header (IETH, IBTA Volume 1, Section
        9.4.6). Carried on Send Last/Only packets whose OpCode selects the
        "...with Invalidate" variant (IBTA Volume 1, Section 9.7, Table 41,
        OpCodes 0x16/0x17 - defined for Reliable Connection transport
        only). The carried r_key is invalidated by the responder on
        receipt.
      type: object
      properties:
        r_key:
          x-field-pattern:
            description: R_Key to invalidate on the responder.
            format: integer
            length: 32
            default: 0
            features: [count]
          x-field-uid: 1

    # -----------------------------------------------------------------
    # Reliable Connection (RC) transport
    # -----------------------------------------------------------------

    Flow.Ibth.Rc:
      description: >-
        Reliable Connection (RC) transport operations (IBTA Volume 1,
        Section 9.7, Table 41, OpCode prefix 000). RC is connection-
        oriented and acknowledged, and is the transport service type used
        by the large majority of real-world RoCEv2 traffic (RDMA WRITE/READ
        for AI/ML training fabrics and NVMe-oF storage).
      type: object
      properties:
        choice:
          description: >-
            Selects the RC operation, which determines the derived BTH
            OpCode and which extended header(s) follow the BTH.
          type: string
          default: send
          x-field-uid: 1
          x-enum:
            send:
              x-field-uid: 1
            write:
              x-field-uid: 2
            read_request:
              x-field-uid: 3
            read_response:
              x-field-uid: 4
            ack:
              x-field-uid: 5
            atomic:
              x-field-uid: 6
            atomic_ack:
              x-field-uid: 7
        send:
          $ref: '#/components/schemas/Flow.Ibth.Rc.Send'
          x-field-uid: 2
        write:
          $ref: '#/components/schemas/Flow.Ibth.Rc.Write'
          x-field-uid: 3
        read_request:
          $ref: '#/components/schemas/Flow.Ibth.Rc.ReadRequest'
          x-field-uid: 4
        read_response:
          $ref: '#/components/schemas/Flow.Ibth.Rc.ReadResponse'
          x-field-uid: 5
        ack:
          $ref: '#/components/schemas/Flow.Ibth.Rc.Ack'
          x-field-uid: 6
        atomic:
          $ref: '#/components/schemas/Flow.Ibth.Rc.Atomic'
          x-field-uid: 7
        atomic_ack:
          $ref: '#/components/schemas/Flow.Ibth.Rc.AtomicAck'
          x-field-uid: 8

    Flow.Ibth.Rc.Send:
      description: >-
        RC SEND First/Middle/Last/Only (IBTA Volume 1, Section 9.7, Table
        41, OpCodes 0x00-0x05). Carries BTH only, unless immediate_data or
        invalidate is set.
      type: object
      properties:
        sequence:
          description: Packet position within a multi-packet SEND message.
          type: string
          default: only
          x-field-uid: 1
          x-enum:
            first:
              x-field-uid: 1
            middle:
              x-field-uid: 2
            last:
              x-field-uid: 3
            only:
              x-field-uid: 4
        solicited_event:
          x-field-pattern:
            description: >-
              Requests that the responder generate an event on receipt
              (IBTA Volume 1, Section 6.6.3).
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 2
        migration_request:
          x-field-pattern:
            description: >-
              Automatic Path Migration request bit (IBTA Volume 1, Section
              6.6.3).
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 3
        pad_count:
          x-field-pattern:
            description: Number of padding bytes (0-3) appended after the payload.
            format: integer
            length: 2
            default: 0
            features: [count]
          x-field-uid: 4
        header_version:
          x-field-pattern:
            description: Transport header version, always 0 for this version of the spec.
            format: integer
            length: 4
            default: 0
            features: [count]
          x-field-uid: 5
        partition_key:
          x-field-pattern:
            description: Partition this packet belongs to.
            format: integer
            length: 16
            default: 65535
            features: [count, metric_tags]
          x-field-uid: 6
        fecn:
          x-field-pattern:
            description: >-
              Forward ECN marking bit (RoCEv2 Annex A17, DCQCN congestion
              control).
            format: integer
            length: 1
            default: 0
            features: [count, metric_tags]
          x-field-uid: 7
        becn:
          x-field-pattern:
            description: >-
              Backward ECN marking bit (RoCEv2 Annex A17, DCQCN congestion
              control).
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 8
        reserved0:
          x-field-pattern:
            description: Reserved, transmitted as zero.
            format: integer
            length: 6
            default: 0
            features: [count]
          x-field-uid: 9
        dest_qp:
          x-field-pattern:
            description: Destination queue pair number.
            format: integer
            length: 24
            default: 0
            features: [count, metric_tags]
          x-field-uid: 10
        ack_req:
          x-field-pattern:
            description: Requests an ACKNOWLEDGE packet for this packet.
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 11
        reserved1:
          x-field-pattern:
            description: Reserved, transmitted as zero.
            format: integer
            length: 7
            default: 0
            features: [count]
          x-field-uid: 12
        psn:
          x-field-pattern:
            description: Packet sequence number.
            format: integer
            length: 24
            default: 0
            features: [count]
          x-field-uid: 13
        immediate_data:
          $ref: '#/components/schemas/Flow.Ibth.ImmDt'
          description: >-
            When present, selects the SEND "...with Immediate" OpCode
            variant. Only valid when sequence is last or only, and mutually
            exclusive with invalidate. Omit to suppress Immediate Data.
          x-field-uid: 14
        invalidate:
          $ref: '#/components/schemas/Flow.Ibth.Ieth'
          description: >-
            When present, selects the SEND "...with Invalidate" OpCode
            variant. Only valid when sequence is last or only, and mutually
            exclusive with immediate_data. Omit to suppress Invalidate.
          x-field-uid: 15

    Flow.Ibth.Rc.Write:
      description: >-
        RC RDMA WRITE First/Middle/Last/Only (IBTA Volume 1, Section 9.7,
        Table 41, OpCodes 0x06-0x0B). RETH is only carried on first/only;
        immediate_data is only valid on last/only.
      type: object
      properties:
        sequence:
          description: Packet position within a multi-packet RDMA WRITE message.
          type: string
          default: only
          x-field-uid: 1
          x-enum:
            first:
              x-field-uid: 1
            middle:
              x-field-uid: 2
            last:
              x-field-uid: 3
            only:
              x-field-uid: 4
        solicited_event:
          x-field-pattern:
            description: >-
              Requests that the responder generate an event on receipt
              (IBTA Volume 1, Section 6.6.3).
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 2
        migration_request:
          x-field-pattern:
            description: >-
              Automatic Path Migration request bit (IBTA Volume 1, Section
              6.6.3).
            format: integer
            length: 1
            default: 0
            features: [count]
          x-field-uid: 3
        pad_count:
          x-field-pattern:
            description: Number of padding bytes (0-3) appended after the payload.
            format: integer
            length: 2
            default: 0
            features: [count]
          x-field-uid: 4
        header_version:
          x-field-pattern:
            description: Transport header version, always 0 for this version of the spec.
            format: integer
            length: 4
            default: 0
            features: [count]
          x-field-uid: 5
        partition_key:
          x-field-pattern:
            description: Partition this packet belongs to.
            format: integer
            length: 16
            default: 65535
            features: [count, metric_tags]
          x-field-uid: 6
        fecn:
          x-field-pattern:
            description: >-
