components:
  schemas:
    CollectiveCommunications.SingleCollective.DataChunk.Metrics.Request:
      description: >-
        Request for data-chunk-transfer metrics. Contains payload size and timing information for each logical transfer from rank to rank.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              data_size_bytes:
                x-field-uid: 1
              collective:
                x-field-uid: 2
              iteration:
                x-field-uid: 3
              source_rank:
                x-field-uid: 4
              destination_rank:
                x-field-uid: 5
              data_chunk_transfer_id:
                x-field-uid: 6
              buffer_offset:
                x-field-uid: 7
              chunk_count:
                x-field-uid: 8
              channel_id:
                x-field-uid: 9
              emulated_tx_component:
                x-field-uid: 10
              transmit_type:
                x-field-uid: 11
              source_nic:
                x-field-uid: 12
              destination_nic:
                x-field-uid: 13
              chunk_size_bytes:
                x-field-uid: 14
              payload_bytes:
                x-field-uid: 15
              start_ms:
                x-field-uid: 16
              end_ms:
                x-field-uid: 17
              completion_time_ms:
                x-field-uid: 18
          x-field-uid: 2
    CollectiveCommunications.SingleCollective.DataChunk.Metric:
      description: >-
        One row of data-chunk-transfer metrics.
      type: object
      properties:
        data_size_bytes:
          description: >-
            Configured collective data size in Bytes.
          type: integer
          format: uint64
          x-field-uid: 1
        collective:
          description: >-
            Collective operation name.
          type: string
          x-field-uid: 2
        iteration:
          description: >-
            Iteration number.
          type: integer
          format: uint32
          x-field-uid: 3
        source_rank:
          description: >-
            Source rank of the chunk transfer.
          type: integer
          format: uint32
          x-field-uid: 4
        destination_rank:
          description: >-
            Destination rank of the chunk transfer.
          type: integer
          format: uint32
          x-field-uid: 5
        data_chunk_transfer_id:
          description: >-
            Data Chunk Transfer ID.
          type: integer
          format: uint32
          x-field-uid: 6
        buffer_offset:
          description: >-
            Buffer offset where the chunk starts.
          type: integer
          format: uint64
          x-field-uid: 7
        chunk_count:
          description: >-
            Number of chunks being transmitted.
          type: integer
          format: uint32
          x-field-uid: 8
        channel_id:
          description: >-
            Communication channel ID.
          type: integer
          format: uint32
          x-field-uid: 9
        emulated_tx_component:
          description: >-
            Emulated infra component source of the chunk transfer.
          type: string
          x-field-uid: 10
        transmit_type:
          description: >-
            Whether via NPU interconnect or NIC network interconnects.
          type: string
          x-field-uid: 11
        source_nic:
          description: >-
            Source NIC.
          type: integer
          format: uint32
          x-field-uid: 12
        destination_nic:
          description: >-
            Destination NIC.
          type: integer
          format: uint32
          x-field-uid: 13
        chunk_size_bytes:
          description: >-
            Chunk size in Bytes.
          type: integer
          format: uint64
          x-field-uid: 14
        payload_bytes:
          description: >-
            Payload bytes.
          type: integer
          format: uint64
          x-field-uid: 15
        start_ms:
          description: >-
            Start time of the chunk transfer expressed in ms.
          type: number
          x-field-uid: 16
        end_ms:
          description: >-
            End time of the chunk transfer expressed in ms.
          type: number
          x-field-uid: 17
        completion_time_ms:
          description: >-
            Completion time of the chunk transfer expressed in ms.
          type: number
          x-field-uid: 18
