components:
  schemas:
    CollectiveCommunications.MixOfCollectives.Epoch.Metrics.Request:
      description: >-
        Request for epoch metrics. Contains details timing and throughput statistics for each collective in each scheduling round, or Epoch.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              process_group:
                x-field-uid: 2
              data_size:
                x-field-uid: 3
              collective:
                x-field-uid: 4
              epoch:
                x-field-uid: 5
              iterations:
                x-field-uid: 6
              min_collective_time:
                x-field-uid: 7
              avg_collective_time:
                x-field-uid: 8
              max_collective_time:
                x-field-uid: 9
              min_algbw:
                x-field-uid: 10
              avg_algbw:
                x-field-uid: 11
              max_algbw:
                x-field-uid: 12
              min_busbw:
                x-field-uid: 13
              avg_busbw:
                x-field-uid: 14
              max_busbw:
                x-field-uid: 15
              min_ideal_pct:
                x-field-uid: 16
              avg_ideal_pct:
                x-field-uid: 17
              max_ideal_pct:
                x-field-uid: 18
              epoch_start_time:
                x-field-uid: 19
              epoch_end_time:
                x-field-uid: 20
              total_time:
                x-field-uid: 21
              duty_cycle:
                x-field-uid: 22
              pfc_rx:
                x-field-uid: 23
              ecn_ce_rx:
                x-field-uid: 24
              frames_retx:
                x-field-uid: 25
          x-field-uid: 2
    CollectiveCommunications.MixOfCollectives.Epoch.Metric:
      description: >-
        One row of epoch metrics.
      type: object
      properties:
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        process_group:
          description: >-
            The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 2
        data_size:
          description: >-
            The payload size of the collective in bytes.
          type: integer
          format: uint64
          x-field-uid: 3
        collective:
          description: >-
            Identifier of the collective operation aggregated in this row.
          type: string
          x-field-uid: 4
        epoch:
          description: >-
            The epoch index aggregated in this row.
          type: integer
          x-field-uid: 5
        iterations:
          description: >-
            The number of iterations of the collective executed in this epoch.
          type: integer
          x-field-uid: 6
        min_collective_time:
          description: >-
            Minimum collective completion time (ms) observed across iterations of
            this epoch.
          type: number
          x-field-uid: 7
        avg_collective_time:
          description: >-
            Average collective completion time (ms) across iterations of this
            epoch.
          type: number
          x-field-uid: 8
        max_collective_time:
          description: >-
            Maximum collective completion time (ms) observed across iterations of
            this epoch.
          type: number
          x-field-uid: 9
        min_algbw:
          description: >-
            Minimum algorithmic bandwidth (GB/s) observed across iterations of
            this epoch.
          type: number
          x-field-uid: 10
        avg_algbw:
          description: >-
            Average algorithmic bandwidth (GB/s) across iterations of this epoch.
          type: number
          x-field-uid: 11
        max_algbw:
          description: >-
            Maximum algorithmic bandwidth (GB/s) observed across iterations of
            this epoch.
          type: number
          x-field-uid: 12
        min_busbw:
          description: >-
            Minimum bus bandwidth (GB/s) observed across iterations of this epoch.
          type: number
          x-field-uid: 13
        avg_busbw:
          description: >-
            Average bus bandwidth (GB/s) across iterations of this epoch.
          type: number
          x-field-uid: 14
        max_busbw:
          description: >-
            Maximum bus bandwidth (GB/s) observed across iterations of this epoch.
          type: number
          x-field-uid: 15
        min_ideal_pct:
          description: >-
            Minimum achieved fraction of ideal link bandwidth (as percentage)
            across iterations of this epoch.
          type: number
          x-field-uid: 16
        avg_ideal_pct:
          description: >-
            Average achieved fraction of ideal link bandwidth (as percentage)
            across iterations of this epoch.
          type: number
          x-field-uid: 17
        max_ideal_pct:
          description: >-
            Maximum achieved fraction of ideal link bandwidth (as percentage)
            across iterations of this epoch.
          type: number
          x-field-uid: 18
        epoch_start_time:
          description: >-
            Start time of the epoch measured in milliseconds since the start of execution.
          type: number
          x-field-uid: 19
        epoch_end_time:
          description: >-
            End time of the epoch measured in milliseconds since the start of execution.
          type: number
          x-field-uid: 20
        total_time:
          description: >-
            Wall-clock time (s) the collective was active during this epoch.
          type: number
          x-field-uid: 21
        duty_cycle:
          description: >-
            Fraction of epoch time the collective was actively transferring data
            (as percentage).
          type: number
          x-field-uid: 22
        pfc_rx:
          description: >-
            Priority Flow Control pause frames received during this epoch.
          type: number
          x-field-uid: 23
        ecn_ce_rx:
          description: >-
            ECN Congestion Experienced packets received during this epoch.
          type: number
          x-field-uid: 24
        frames_retx:
          description: >-
            Frames retransmitted during this epoch.
          type: number
          x-field-uid: 25
