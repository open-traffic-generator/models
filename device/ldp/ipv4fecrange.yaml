components:
  schemas:
    Ldp.Ipv4FecRange:
      description: >-
        A range of IPv4 Prefix FEC elements (FEC element type 0x02, RFC 5036
        Section 3.4.1) that the emulated LSR advertises to all its peers in
        Label Mapping messages (RFC 5036 Section 3.5.7), each bound to a Generic
        Label (RFC 5036 Section 3.4.2.1).
        A DUT normally installs a label for a FEC only when it has a matching
        route (RFC 5036 Section 2.6.1), so the same prefixes are usually also
        advertised through an IGP, for example an Isis.V4RouteRange on the same
        device.
      type: object
      required: [name]
      properties:
        name:
          x-include: ../../common/common.yaml#/components/schemas/Named.Object/properties/name
          x-field-uid: 1
        addresses:
          description: >-
            A list of groups of IPv4 prefixes. Each generated prefix is one
            Prefix FEC element.
          type: array
          items:
            $ref: '../routes/routeaddresses.yaml#/components/schemas/V4RouteAddress'
          x-field-uid: 2
        label:
          description: >-
            The labels bound to the prefixes of this range.
          $ref: '#/components/schemas/Ldp.FecLabel'
          x-field-uid: 3

    Ldp.FecLabel:
      description: >-
        The Generic Label (RFC 5036 Section 3.4.2.1) bound to each Prefix FEC of
        a Ldp.Ipv4FecRange.
        increment - the n-th prefix generated by addresses (counting across all
        entries, in order, from 0) gets label start + n.
        fixed - every prefix of the range gets the same label. Use 3 (Implicit
        NULL) or 0 (IPv4 Explicit NULL) to emulate an egress LSR
        (RFC 3032 Section 2.1).
      type: object
      properties:
        choice:
          description: >-
            How labels are assigned to the prefixes of the range.
          type: string
          default: increment
          x-enum:
            increment:
              x-field-uid: 1
            fixed:
              x-field-uid: 2
          x-field-uid: 1
        increment:
          description: >-
            Labels that increase by 1 from one prefix to the next.
          $ref: '#/components/schemas/Ldp.FecLabel.Increment'
          x-field-uid: 2
        fixed:
          description: >-
            The label bound to every prefix of the range. Meaningful values are
            3 (Implicit NULL), 0 (IPv4 Explicit NULL) and 16 to 1048575. Values
            1, 2 and 4 to 15 are reserved (RFC 3032 Section 2.1).
          type: integer
          format: uint32
          maximum: 1048575
          default: 3
          x-field-uid: 3

    Ldp.FecLabel.Increment:
      description: >-
        Labels that increase by 1 from one prefix to the next.
      type: object
      properties:
        start:
          description: >-
            The label bound to the first prefix of the range. Labels 0 to 15 are
            reserved (RFC 3032 Section 2.1). start plus the number of prefixes
            in the range minus 1 must not exceed 1048575; the implementation
            rejects a configuration that does.
          type: integer
          format: uint32
          minimum: 16
          maximum: 1048575
          default: 16
          x-field-uid: 1
