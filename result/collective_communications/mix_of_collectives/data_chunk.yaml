components:
  schemas:
    CollectiveCommunications.MixOfCollectives.DataChunk.Metrics.Request:
      description: >-
        Request for data-chunk-transfer metrics. Contains payload size and timing information for each logical transfer from rank to rank.
      type: object
      properties:
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              workload:
                x-field-uid: 2
              operation:
                x-field-uid: 3
              process_group:
                x-field-uid: 4
              collective:
                x-field-uid: 5
              operation_iteration:
                x-field-uid: 6
              data_chunk_transfer_id:
                x-field-uid: 7
              channel_id:
                x-field-uid: 8
              buffer_offset:
                x-field-uid: 9
              chunk_count:
                x-field-uid: 10
              data_size_bytes:
                x-field-uid: 11
              chunk_size_bytes:
                x-field-uid: 12
              start_ms:
                x-field-uid: 13
              end_ms:
                x-field-uid: 14
              completion_time_ms:
                x-field-uid: 15
              transmit_type:
                x-field-uid: 16
              emulated_tx_component:
                x-field-uid: 17
              payload_bytes:
                x-field-uid: 18
              source_rank:
                x-field-uid: 19
              destination_rank:
                x-field-uid: 20
              workload_set_iteration:
                x-field-uid: 21
              workload_iteration:
                x-field-uid: 22
          x-field-uid: 1
    CollectiveCommunications.MixOfCollectives.DataChunk.Metric:
      description: >-
        One row of data-chunk-transfer metrics.
      type: object
      properties:
        source_rank:
          description: >-
            Source rank of the chunk transfer.
          type: integer
          format: uint32
          x-field-uid: 1
        destination_rank:
          description: >-
            Destination rank of the chunk transfer.
          type: integer
          format: uint32
          x-field-uid: 2
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this chunk transfer.
          type: string
          x-field-uid: 3
        workload:
          description: >-
            The name of the workload, within the workload set, that owns this chunk transfer.
          type: string
          x-field-uid: 4
        operation:
          description: >-
            The name of the operation that owns this chunk transfer.
          type: string
          x-field-uid: 5
        process_group:
          description: >-
            The process group whose NPUs executed this chunk transfer.
          type: string
          x-field-uid: 6
        collective:
          description: >-
            The collective algorithm type of the operation that owns this chunk transfer.
          type: string
          x-field-uid: 7
        operation_iteration:
          description: >-
            Operation iteration number.
          type: integer
          format: uint32
          x-field-uid: 8
        data_chunk_transfer_id:
          description: >-
            Data Chunk Transfer ID.
          type: integer
          format: uint32
          x-field-uid: 9
        channel_id:
          description: >-
            Communication channel ID.
          type: integer
          format: uint32
          x-field-uid: 10
        buffer_offset:
          description: >-
            Buffer offset where the chunk starts.
          type: integer
          format: uint64
          x-field-uid: 11
        chunk_count:
          description: >-
            Number of chunks being transmitted.
          type: integer
          format: uint32
          x-field-uid: 12
        data_size_bytes:
          description: >-
            Total data size in bytes of the collective across ranks.
          type: integer
          format: uint64
          x-field-uid: 13
        chunk_size_bytes:
          description: >-
            Chunk size in Bytes.
          type: integer
          format: uint64
          x-field-uid: 14
        start_ms:
          description: >-
            Start time of the chunk transfer expressed in ms.
            
            The time is expressed relative to the moment when test traffic starts
            (the earliest send/receive, which has a time of 0).
          type: number
          x-field-uid: 15
        end_ms:
          description: >-
            End time of the chunk transfer expressed in ms.

            The time is expressed relative to the moment when test traffic starts
            (the earliest send/receive, which has a time of 0).
          type: number
          x-field-uid: 16
        completion_time_ms:
          description: >-
            Completion time of the chunk transfer expressed in ms.
          type: number
          x-field-uid: 17
        transmit_type:
          description: >-
            Whether via NPU interconnect or NIC network interconnects.
          type: string
          x-field-uid: 18
        emulated_tx_component:
          description: >-
            Emulated infra component source of the chunk transfer.
          type: string
          x-field-uid: 19
        payload_bytes:
          description: >-
            Payload bytes.
          type: integer
          format: uint64
          x-field-uid: 20
        workload_set_iteration:
          description: >-
            Workload Set iteration number.
          type: integer
          format: uint32
          x-field-uid: 21
        workload_iteration:
          description: >-
            Workload iteration number.
          type: integer
          format: uint32
          x-field-uid: 22
