components:
  schemas:
    LdpBindings.State.Request:
      description: >-
        The request to retrieve the FEC-label bindings received by LDP routers.
      type: object
      properties:
        ldp_router_names:
          description: >-
            The names of LDP routers for which received label bindings are
            requested. An empty list will return results for all LDP routers.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Device.LdpRouter/properties/name"
          x-field-uid: 1

    LdpBindings.State:
      description: >-
        The FEC-label bindings received by one LDP router from its peers.
      type: object
      properties:
        ldp_router_name:
          description: >-
            The name of the LDP router.
          type: string
          x-field-uid: 1
        ipv4_bindings:
          description: >-
            The IPv4 Prefix FEC-label bindings received in Label Mapping
            messages (RFC 5036 Section 3.5.7).
          type: array
          items:
            $ref: '#/components/schemas/LdpIpv4Binding.State'
          x-field-uid: 2

    LdpIpv4Binding.State:
      description: >-
        One IPv4 Prefix FEC element (RFC 5036 Section 3.4.1) and the label bound
        to it by a peer (RFC 5036 Section 3.4.2.1).
      type: object
      properties:
        prefix:
          description: >-
            The IPv4 prefix of the FEC element.
          type: string
          format: ipv4
          x-field-uid: 1
        prefix_length:
          description: >-
            The prefix length of the FEC element.
          type: integer
          format: uint32
          maximum: 32
          x-field-uid: 2
        label:
          description: >-
            The label bound to the FEC by the peer. 3 is Implicit NULL and 0 is
            IPv4 Explicit NULL (RFC 3032 Section 2.1).
          type: integer
          format: uint32
          maximum: 1048575
          x-field-uid: 3
        peer_lsr_id:
          description: >-
            The LSR ID of the peer that advertised the binding (RFC 5036
            Section 2.2.2).
          type: string
          format: ipv4
          x-field-uid: 4
        peer_label_space_id:
          description: >-
            The label space identifier of the peer that advertised the binding
            (RFC 5036 Section 2.2.2).
          type: integer
          format: uint32
          maximum: 65535
          x-field-uid: 5
