components:
  schemas:
    CollectiveCommunications.Metrics.Request:
      description: >-
        Request to the traffic generator for Collective Communications metrics of a chosen
        type.
      type: object
      required:
        - choice
      properties:
        choice:
          description: >-
            The Collective Communications type to fetch metrics for.
          type: string
          x-field-uid: 1
          x-enum:
            single_collective:
              x-field-uid: 1
            workload_replay:
              x-field-uid: 2
            mix_of_collectives:
              x-field-uid: 3
        single_collective:
          $ref: './single_collective/single_collective.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Metrics.Request'
          x-field-uid: 2
        workload_replay:
          $ref: './workload_replay/workload_replay.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Metrics.Request'
          x-field-uid: 3
        mix_of_collectives:
          $ref: './mix_of_collectives/mix_of_collectives.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Metrics.Request'
          x-field-uid: 4
    CollectiveCommunications.Metrics.Response:
      description: >-
        Response containing Collective Communications metrics of the chosen type.
      type: object
      required:
        - choice
      properties:
        choice:
          description: >-
            The Collective Communications type the metrics in the response belong to.
          type: string
          x-field-uid: 1
          x-enum:
            single_collective:
              x-field-uid: 1
            workload_replay:
              x-field-uid: 2
            mix_of_collectives:
              x-field-uid: 3
        single_collective:
          $ref: './single_collective/single_collective.yaml#/components/schemas/CollectiveCommunications.SingleCollective.Metrics.Response'
          x-field-uid: 2
        workload_replay:
          $ref: './workload_replay/workload_replay.yaml#/components/schemas/CollectiveCommunications.WorkloadReplay.Metrics.Response'
          x-field-uid: 3
        mix_of_collectives:
          $ref: './mix_of_collectives/mix_of_collectives.yaml#/components/schemas/CollectiveCommunications.MixOfCollectives.Metrics.Response'
          x-field-uid: 4
