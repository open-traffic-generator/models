components:
  schemas:
    CollectiveCommunications.ProcessGroup:
      description: >-
        Description of a process group over which collective communications are run.
      type: object
      required: [name, ranks]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 35
          description: >-
            A unique name for this process group.
          x-field-uid: 1
        ranks:
          $ref: '#/components/schemas/CollectiveCommunications.RankSet'
          description: >-
            The ranks that form this process group. A rank may participate in
            multiple process groups at different points in time.
          x-field-uid: 2

    CollectiveCommunications.RankSet:
      description: >-
        A set of ranks that form a communication group.
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          description: >-
            Selects the representation of the rank set.
          x-field-uid: 1
          x-enum:
            list:
              description: >-
                The ranks are represented as an explicit list.
              x-field-uid: 1
            ranges:
              description: >-
                The ranks are represented as a collection of ranges.
              x-field-uid: 2
        list:
          type: array
          items:
            type: integer
            format: uint32
          minItems: 1
          description: >-
            A list of distinct ranks.
          x-field-uid: 2
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/CollectiveCommunications.RankRange'
          minItems: 1
          description: >-
            A collection of non-overlapping rank ranges.
          x-field-uid: 3

    CollectiveCommunications.RankRange:
      description: >-
        A contiguous range of ranks, starting at `start` and advancing by `step`.
        The extent of the range is given by specifying any one of `length`,
        `end` or `end_exclusive`, whichever is more convenient. At least one
        of these must be provided; if more than one is provided, the values must
        agree.
      type: object
      required: [start]
      properties:
        start:
          type: integer
          format: uint32
          description: >-
            The first rank in the range.
          x-field-uid: 1
        step:
          type: integer
          format: uint32
          default: 1
          description: >-
            The increment between successive ranks in the range.
          x-field-uid: 2
        length:
          type: integer
          format: uint32
          minimum: 1
          description: >-
            The number of ranks in the range. Alternatively, the extent of the range can be set
            by specifying either the `end` or `end_exclusive` properties.
          x-field-uid: 3
        end:
          type: integer
          format: uint32
          description: >-
            The last rank in the range, inclusive. Alternatively, the extent of the range
            can be set by specifying either the `length` or `end_exclusive` properties.
          x-field-uid: 4
        end_exclusive:
          type: integer
          format: uint32
          description: >-
            The rank just past the end of the range, exclusive. Alternatively, the extent
            of the range can be set by specifying either the `length` or `end` properties.
          x-field-uid: 5
