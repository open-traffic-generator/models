openapi: 3.0.3

info:
  title: LDP metric results model.
  version: ^0.0.0

components:
  schemas:
    Ldp.Metrics.Request:
      description: >-
        The request to retrieve LDP per Router metrics/statistics.
      type: object
      properties:
        router_names:
          description: >-
            The names of LDP routers to return results for.
            An empty list as input will return results for all LDP routers.
          type: array
          items:
            type: string
          x-constraint:
            - "/components/schemas/Device.Ldp/properties/name"
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the input list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              basic_sessions_up:
                x-field-uid: 1
              targeted_sessions_configured:
                x-field-uid: 2
              targeted_sessions_up:
                x-field-uid: 3
              session_flap_count:
                x-field-uid: 4
              sessions_non_existent:
                x-field-uid: 5
              sessions_initialized:
                x-field-uid: 6
              sessions_open_received:
                x-field-uid: 7
              sessions_open_sent:
                x-field-uid: 8
              sessions_operational:
                x-field-uid: 9
              label_mapping_tx:
                x-field-uid: 10
              label_mapping_rx:
                x-field-uid: 11
              label_request_tx:
                x-field-uid: 12
              label_request_rx:
                x-field-uid: 13
              label_withdraw_tx:
                x-field-uid: 14
              label_withdraw_rx:
                x-field-uid: 15
              label_release_tx:
                x-field-uid: 16
              label_release_rx:
                x-field-uid: 17
              label_abort_request_tx:
                x-field-uid: 18
              label_abort_request_rx:
                x-field-uid: 19
              notification_tx:
                x-field-uid: 20
              notification_rx:
                x-field-uid: 21
              established_lsps_ingress:
                x-field-uid: 22
              established_lsps_egress:
                x-field-uid: 23
          x-field-uid: 2
    Ldp.Metric:
      description: >-
        LDP per Router metrics. Each counter is a value reported by the
        underlying implementation; a column not requested is not returned.
      type: object
      properties:
        name:
          description: >-
            The name of the LDP router.
          type: string
          x-field-uid: 1
        basic_sessions_up:
          description: >-
            The number of LDP sessions established through basic (link)
            discovery that are currently in the operational state.
          type: integer
          format: uint64
          x-field-uid: 2
        targeted_sessions_configured:
          description: >-
            The number of LDP sessions configured through extended (targeted)
            discovery.
          type: integer
          format: uint64
          x-field-uid: 3
        targeted_sessions_up:
          description: >-
            The number of LDP sessions established through extended (targeted)
            discovery that are currently in the operational state.
          type: integer
          format: uint64
          x-field-uid: 4
        session_flap_count:
          description: >-
            The number of times an LDP session left the operational state
            (RFC 5036 Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 5
        sessions_non_existent:
          description: >-
            The number of LDP sessions currently in the NON EXISTENT state
            (RFC 5036 Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 6
        sessions_initialized:
          description: >-
            The number of LDP sessions currently in the INITIALIZED state
            (RFC 5036 Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 7
        sessions_open_received:
          description: >-
            The number of LDP sessions currently in the OPENREC state
            (RFC 5036 Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 8
        sessions_open_sent:
          description: >-
            The number of LDP sessions currently in the OPENSENT state
            (RFC 5036 Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 9
        sessions_operational:
          description: >-
            The number of LDP sessions currently in the OPERATIONAL state
            (RFC 5036 Section 2.5.4).
          type: integer
          format: uint64
          x-field-uid: 10
        label_mapping_tx:
          description: >-
            The number of Label Mapping messages sent by this LDP router
            (RFC 5036 Section 3.5.7).
          type: integer
          format: uint64
          x-field-uid: 11
        label_mapping_rx:
          description: >-
            The number of Label Mapping messages received by this LDP router
            (RFC 5036 Section 3.5.7).
          type: integer
          format: uint64
          x-field-uid: 12
        label_request_tx:
          description: >-
            The number of Label Request messages sent by this LDP router
            (RFC 5036 Section 3.5.8).
          type: integer
          format: uint64
          x-field-uid: 13
        label_request_rx:
          description: >-
            The number of Label Request messages received by this LDP router
            (RFC 5036 Section 3.5.8).
          type: integer
          format: uint64
          x-field-uid: 14
        label_withdraw_tx:
          description: >-
            The number of Label Withdraw messages sent by this LDP router
            (RFC 5036 Section 3.5.10).
          type: integer
          format: uint64
          x-field-uid: 15
        label_withdraw_rx:
          description: >-
            The number of Label Withdraw messages received by this LDP router
            (RFC 5036 Section 3.5.10).
          type: integer
          format: uint64
          x-field-uid: 16
        label_release_tx:
          description: >-
            The number of Label Release messages sent by this LDP router
            (RFC 5036 Section 3.5.11).
          type: integer
          format: uint64
          x-field-uid: 17
        label_release_rx:
          description: >-
            The number of Label Release messages received by this LDP router
            (RFC 5036 Section 3.5.11).
          type: integer
          format: uint64
          x-field-uid: 18
        label_abort_request_tx:
          description: >-
            The number of Label Abort Request messages sent by this LDP router
            (RFC 5036 Section 3.5.9).
          type: integer
          format: uint64
          x-field-uid: 19
        label_abort_request_rx:
          description: >-
            The number of Label Abort Request messages received by this LDP
            router (RFC 5036 Section 3.5.9).
          type: integer
          format: uint64
          x-field-uid: 20
        notification_tx:
          description: >-
            The number of Notification messages sent by this LDP router
            (RFC 5036 Section 3.5.1).
          type: integer
          format: uint64
          x-field-uid: 21
        notification_rx:
          description: >-
            The number of Notification messages received by this LDP router
            (RFC 5036 Section 3.5.1).
          type: integer
          format: uint64
          x-field-uid: 22
        established_lsps_ingress:
          description: >-
            The number of established LSPs for which this LDP router is the
            ingress, as reported by the implementation.
          type: integer
          format: uint64
          x-field-uid: 23
        established_lsps_egress:
          description: >-
            The number of established LSPs for which this LDP router is the
            egress, as reported by the implementation.
          type: integer
          format: uint64
          x-field-uid: 24
