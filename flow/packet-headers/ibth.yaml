            default: 0
            features: [count]
          x-field-uid: 10
        reserved1:
          x-field-pattern:
            description: Reserved, transmitted as zero.
            format: integer
            length: 7
            default: 0
            features: [count]
          x-field-uid: 11
        psn:
          x-field-pattern:
            description: Packet sequence number.
            format: integer
