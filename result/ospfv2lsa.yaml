components:
  schemas:
    Ospfv2Lsas.State.Request:
      description: >-
        The request to retrieve OSPFv2 Link State Advertisements (LSA) information learned by the
        routers.
      type: object
      properties:
        router_names:
          description: >-
            The names of OSPFv2 routers for which learned information is requested.
            An empty list will return results for all OSPFv2 routers.
          type: array
          items:
            type: string
          x-constraint:
          - "/components/schemas/Device.Ospfv2Router/properties/name"
          x-field-uid: 1
    Ospfv2Lsa.State:
      description: >-
        The result of OSPFv2 LSA information that are retrieved.
      type: object
      properties:
        router_name:
          description: >-
           The name of the OSPFv2 Router that learned the LSA information.
          type: string
          x-field-uid: 1
        router_lsas:
          description: >-
            One or more OSPFv2 Router-LSA - Type 1.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.RouterLsa'
          x-field-uid: 2
        network_lsas:
          description: >-
            One or more OSPFv2 Network-LSA - Type 2.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.NetworkLsa'
          x-field-uid: 3
        network_summary_lsas:
          description: >-
            One or more OSPFv2 Network summary LSA - Type 3.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.NetworkSummaryLsa'
          x-field-uid: 4
        summary_as_lsas:
          description: >-
            One or more OSPFv2 Autonomous System Boundary Router (ASBR) summary LSA - Type 4.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.SummaryAsLsa'
          x-field-uid: 5
        external_as_lsas:
          description: >-
            OSPFv2 AS-External-LSA - Type 5.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.ExternalAsLsa'
          x-field-uid: 6
        nssa_lsas:
          description: >-
            One or more OSPFv2 NSSA-LSA - Type 7.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.NssaLsa'
          x-field-uid: 7
        opaque_lsas:
          description: >-
            One or more OSPFv2 Link-Scope Opaque-LSA - Type 9.
          type: array
          items:
            $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.OpaqueLsa'
          x-field-uid: 8
    Ospfv2.RouterLsa:
      description: >-
        Contents of the router LSA.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        links:
          description: >-
            Links that are described within the LSA.
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.Link'
          x-field-uid: 2
        sr_capability:
          description: |-
            The Segment Routing capability learned for this router, decoded from the Router
            Information (RI) Opaque LSA: the SR-Algorithm TLV, SID/Label Range (SRGB) TLV and
            SR Local Block (SRLB) TLV (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.SrCapability'
          x-field-uid: 3
        prefix_sid:
          description: |-
            The Node/Prefix-SID learned for this router, decoded from the Prefix-SID sub-TLV of
            the OSPFv2 Extended Prefix Opaque LSA advertised for the router's own prefix (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSid'
          x-field-uid: 4
    Ospfv2.NetworkLsa:
      description: >-
        Contents of the Network LSA.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        neighbor_router_ids:
          description: >-
            Neighbor router ids that are described within the LSA.
          type: array
          items:
            type: string
            format: ipv4
          x-field-uid: 3

    Ospfv2.NetworkSummaryLsa:
      description: |-
        Contents of the Network Summary LSA - Type 3.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        prefix_sid:
          description: |-
            The Prefix-SID learned for this prefix, decoded from the Prefix-SID sub-TLV of the
            OSPFv2 Extended Prefix Opaque LSA whose Extended Prefix TLV references this prefix
            (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSid'
          x-field-uid: 4
    Ospfv2.SummaryAsLsa:
      description: >-
        Contents of OSPFv2 Autonomous System Boundary Router (ASBR) summary LSA - Type 4.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
    Ospfv2.ExternalAsLsa:
      description: |-
        Contents of OSPFv2 AS-External-LSA - Type 5.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        metric_type:
          description: >-
            The type of metric associated with the route range.
          type: integer
          format: uint32
          x-field-uid: 4
        prefix_sid:
          description: |-
            The Prefix-SID learned for this prefix, decoded from the Prefix-SID sub-TLV of the
            OSPFv2 Extended Prefix Opaque LSA whose Extended Prefix TLV references this prefix
            (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSid'
          x-field-uid: 5
    Ospfv2.NssaLsa:
      description: |-
        Contents of OSPFv2 NSSA LSA - Type 7.
        The value of the IPv4 prefix that was received is present in header.lsa_id.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        network_mask:
          description: >-
            The IPv4 address mask for the network.
          type: string
          format: ipv4
          x-field-uid: 2
        metric:
          description: >-
            The cost of the summary route TOS level 0 and all unspecified levels.
          type: integer
          format: uint32
          x-field-uid: 3
        metric_type:
          description: >-
            The type of metric associated with the route range.
          type: integer
          format: uint32
          x-field-uid: 4
        forwarding_address:
          description: >-
            IPv4 Forwarding address.
          type: string
          format: ipv4
          x-field-uid: 5
        prefix_sid:
          description: |-
            The Prefix-SID learned for this prefix, decoded from the Prefix-SID sub-TLV of the
            OSPFv2 Extended Prefix Opaque LSA whose Extended Prefix TLV references this prefix
            (RFC 8665).
          $ref: '#/components/schemas/Ospfv2Lsa.PrefixSid'
          x-field-uid: 6
    Ospfv2.OpaqueLsa:
      description: |-
        Contents of OSPFv2 Opaque LSA - Type 9/10/11 (RFC 5250).
        The Link State ID of an Opaque LSA is not a plain IPv4 address; it is split into
        an Opaque Type (most significant octet) and an Opaque ID (remaining three octets),
        decoded here as tlv_information and id (RFC 5250 Section 3). header.lsa_id carries
        the raw, undecoded Link State ID value.
      type: object
      properties:
        header:
          description: >-
            Contents of the LSA header.
          $ref: './ospfv2lsa.yaml#/components/schemas/Ospfv2.LsaHeader'
          x-field-uid: 1
        type:
          description: |-
            The flooding scope of the Opaque LSA, determined by the LSA's LS Type
            (RFC 5250 Section 4): local (Type 9, not flooded beyond the local link),
            area (Type 10, flooded throughout the area) or domain (Type 11, flooded
            throughout the Autonomous System, excluding stub areas).
          type: string
          x-field-uid: 2
          x-enum:
            local:
              x-field-uid: 1
            area:
              x-field-uid: 2
            domain:
              x-field-uid: 3
        tlv_information:
          description: |-
            The Opaque Type, decoded from the most significant octet of the LSA's Link
            State ID (RFC 5250 Section 3). Identifies the type of information carried in
            the tlvs (IANA Opaque LSA Option Types registry).
          type: string
          x-field-uid: 3
          x-enum:
            traffic_engineering:
              description: >-
                Traffic Engineering LSA, Opaque Type 1 (RFC 3630).
              x-field-uid: 1
            sycamore_optical_topology:
              description: >-
                Sycamore Optical Topology Descriptions, Opaque Type 2.
              x-field-uid: 2
            grace:
              description: >-
                grace-LSA, Opaque Type 3 (RFC 3623).
              x-field-uid: 3
            router_information:
              description: >-
                Router Information (RI) Opaque LSA, Opaque Type 4 (RFC 7770).
              x-field-uid: 4
            l1vpn:
              description: >-
                L1VPN LSA, Opaque Type 5 (RFC 5252).
              x-field-uid: 5
            inter_as_te_v2:
              description: >-
                Inter-AS-TE-v2 LSA, Opaque Type 6 (RFC 5392).
              x-field-uid: 6
            extended_prefix:
              description: >-
                OSPFv2 Extended Prefix Opaque LSA, Opaque Type 7 (RFC 7684).
              x-field-uid: 7
            extended_link:
              description: >-
                OSPFv2 Extended Link Opaque LSA, Opaque Type 8 (RFC 7684).
              x-field-uid: 8
            ttz:
              description: >-
                TTZ LSA, Opaque Type 9 (RFC 8099).
              x-field-uid: 9
            dynamic_flooding:
              description: >-
                OSPFv2 Dynamic Flooding Opaque LSA, Opaque Type 10 (RFC 9667).
              x-field-uid: 10
            extended_inter_area_asbr:
              description: >-
                OSPFv2 Extended Inter-Area ASBR (EIA-ASBR) LSA, Opaque Type 11
                (RFC 9350 Section 10.1).
              x-field-uid: 11
        id:
          description: >-
            The Opaque ID, decoded from the least significant three octets of the LSA's
            Link State ID (RFC 5250 Section 3). Used to further distinguish LSAs of the
            same Opaque Type originated by the same router.
          type: integer
          format: uint32
          x-field-uid: 4
        tlvs:
          description: |-
            The raw, undecoded TLVs carried in the body of the Opaque LSA, in the generic
            type/length/value TLV format used by all OSPFv2 Opaque LSAs (RFC 7770 Section 2,
            RFC 8665, RFC 9492).
          type: array
          items:
            $ref: '#/components/schemas/Ospfv2.OpaqueLsa.Tlv'
          x-field-uid: 5
    Ospfv2.OpaqueLsa.Tlv:
      description: >-
        A top-level TLV carried in the body of an OSPFv2 Opaque LSA (RFC 7770 Section 2).
      type: object
      properties:
        type:
          description: |-
            The TLV Type field. Its meaning is scoped by the parent LSA's
            tlv_information (IANA OSPFv2 TLV registries).
          type: string
          x-field-uid: 1
          x-enum:
            te_router_address:
              description: >-
                Router Address, TE LSA (tlv_information traffic_engineering) TLV type 1
                (RFC 3630).
              x-field-uid: 1
            te_link:
              description: >-
                Link, TE LSA TLV type 2 (RFC 3630).
              x-field-uid: 2
            te_router_ipv6_address:
              description: >-
                Router IPv6 Address, TE LSA TLV type 3 (RFC 5329).
              x-field-uid: 3
            te_link_local:
              description: >-
                Link Local, TE LSA TLV type 4 (RFC 4203).
              x-field-uid: 4
            te_node_attribute:
