components:
  schemas:
    Ldp.Authentication:
      description: >-
        Session authentication. Presence enables it; omit for none. LDP
        sessions are authenticated with the TCP MD5 signature option
        (RFC 5036 Section 2.9, RFC 2385).
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          x-enum:
            md5:
              x-field-uid: 1
          x-field-uid: 1
        md5:
          description: >-
            The shared secret used for the TCP MD5 signature option.
          type: string
          minLength: 1
          maxLength: 80
          x-field-uid: 2
