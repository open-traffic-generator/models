components:
  schemas:
    CollectiveCommunications.MixOfCollectives.Iteration.Metrics.Request:
      description: >-
        Request for iteration metrics. Contains completion time and throughput details for each iteration of each collective datasize.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              workload_set:
                x-field-uid: 1
              process_group:
                x-field-uid: 2
              data_size:
                x-field-uid: 3
              collective:
                x-field-uid: 4
              epoch:
                x-field-uid: 5
              iteration:
                x-field-uid: 6
              collective_start_time:
                x-field-uid: 7
              collective_end_time:
                x-field-uid: 8
              collective_completion_time:
                x-field-uid: 9
              algbw:
                x-field-uid: 10
              busbw:
                x-field-uid: 11
              ideal_pct:
                x-field-uid: 12
              min_fct:
                x-field-uid: 13
              p50_fct:
                x-field-uid: 14
              p95_fct:
                x-field-uid: 15
              max_fct:
                x-field-uid: 16
              p99_fct:
                x-field-uid: 17
              p99_99_fct:
                x-field-uid: 18
          x-field-uid: 2
    CollectiveCommunications.MixOfCollectives.Iteration.Metric:
      description: >-
        One row of iteration metrics.
      type: object
      properties:
        workload_set:
          description: >-
            The name of the workload set (tenant) that owns this collective.
          type: string
          x-field-uid: 1
        process_group:
          description: >-
            The process group whose NPUs executed the collective.
          type: string
          x-field-uid: 2
        data_size:
          description: >-
            The payload size of the collective in bytes.
          type: integer
          format: uint64
          x-field-uid: 3
        collective:
          description: >-
            Identifier of the collective operation executed in this row.
          type: string
          x-field-uid: 4
        epoch:
          description: >-
            The epoch index in which this iteration was executed.
          type: integer
          x-field-uid: 5
        iteration:
          description: >-
            The iteration index within the epoch for this collective.
          type: integer
          x-field-uid: 6
        collective_start_time:
          description: >-
            Start time of the collective iteration measured in milliseconds since
            the start of execution.
          type: number
          x-field-uid: 7
        collective_end_time:
          description: >-
            End time of the collective iteration measured in milliseconds since
            the start of execution.
          type: number
          x-field-uid: 8
        collective_completion_time:
          description: >-
            Completion time of the collective iteration (end minus start), in ms.
          type: number
          x-field-uid: 9
        algbw:
          description: >-
            Algorithmic bandwidth (GB/s) achieved during this iteration.
          type: number
          x-field-uid: 10
        busbw:
          description: >-
            Bus bandwidth (GB/s) achieved during this iteration.
          type: number
          x-field-uid: 11
        ideal_pct:
          description: >-
            Achieved bus bandwidth as a percentage of the ideal link bandwidth.
          type: number
          x-field-uid: 12
        min_fct:
          description: >-
            Minimum per-flow completion time (ms) observed in this iteration.
          type: number
          x-field-uid: 13
        p50_fct:
          description: >-
            50th percentile (median) per-flow completion time (ms) in this
            iteration.
          type: number
          x-field-uid: 14
        p95_fct:
          description: >-
            95th percentile per-flow completion time (ms) in this iteration.
          type: number
          x-field-uid: 15
        max_fct:
          description: >-
            Maximum per-flow completion time (ms) observed in this iteration.
          type: number
          x-field-uid: 16
        p99_fct:
          description: >-
            99th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 17
        p99_99_fct:
          description: >-
            99.99th percentile of Flow Completion Times, in milliseconds.
          type: number
          x-field-uid: 18
