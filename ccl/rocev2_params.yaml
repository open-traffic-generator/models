openapi: 3.0.3
info:
  title: CCL RoCEv2 parameters models
  version: ^0.0.0
components:
  schemas:
    Ccl.Rocev2Policy:
      description: >-
        RoCEv2 transport policy enforced uniformly across all ports in a communicator.
        Only applicable when Ccl.Config.transport = rocev2; ignored for transport = uet.

        All QPs auto-generated by the CCL engine for a communicator share the same
        encapsulation, connection type, DSCP, and ECN settings. Per-port variation is
        intentionally not supported for two reasons:

        Connection type (RC/UD) must be identical across all communicator ports because
        QP endpoints on both sides must agree on the transport service type; mixing RC
        and UD within one communicator is a protocol violation.

        DSCP and ECN must be identical across all communicator ports because PFC pause
        operates at port + priority-queue granularity. If QPs within one communicator
        used different DSCP values, a pause on one queue would stall some QPs while
        others continued, breaking the synchronized progress that Ring AllReduce requires.
        DSCP uniformity within a communicator is a physical correctness constraint, not
        merely a design simplification.

        Follows the same discriminated-union pattern as Device.Rocev2.ConnectionType:
        connection-type-specific fields (dscp, ecn) are nested
        under the reliable_connection sub-object; encapsulation applies to both
        and sits at the top level.

        Why not reuse Device.Rocev2Peer? Three reasons.
        Scale: CCL generates O(N x qps_per_peer) QPs for Ring algorithms and
        O(N^2 x qps_per_peer) for AllToAll, where N is the rank count.
        Topology: QP connectivity is determined by the algorithm's communication
        pattern and cannot be expressed as a static peer list.
        Lifecycle: RC QP connections are established and torn down dynamically;
        Device.Rocev2Peer models static, persistent QP configurations.

        Do not configure Device.Rocev2Peer on devices referenced by
        Ccl.Communicator.device_names; CCL manages QP lifecycle internally.
      type: object
      properties:
        encapsulation:
          description: >-
            IP encapsulation type for all auto-generated QP data packets.
            ipv4: standard RoCEv2 over IPv4 (most common deployment).
            ipv6: RoCEv2 over IPv6 with Global Routing Header (GRH);
            requires IPv6 addresses configured on the communicator devices.
            Applies to both reliable_connection and unreliable_datagram.
          type: string
          default: ipv4
          x-field-uid: 1
          x-enum:
            ipv4:
              x-field-uid: 1
            ipv6:
              x-field-uid: 2
        connection_type:
          description: >-
            QP connection type and associated parameters. Follows the same
            discriminated-union pattern as Device.Rocev2.ConnectionType.
          $ref: '#/components/schemas/Ccl.Rocev2Policy.ConnectionType'
          x-field-uid: 2
        ib_mtu:
          description: >-
            InfiniBand MTU in bytes — the RDMA payload size per packet.
            Standard values: 256, 512, 1024, 2048, 4096.
            Use 4096 for large transfers (AllReduce, AllToAll) to maximise
            link efficiency; use 1024 for MTU sensitivity testing.
            The implementation derives L1 frame size internally:
            frame_size = ib_mtu + 90B (14B ETH + 20B IP + 8B UDP + 12B BTH +
            4B ICRC + 4B FCS + 28B preamble/IFG).
            Aligns with Device.Rocev2.ib_mtu.
          type: integer
          format: uint32
          default: 4096
          minimum: 256
          maximum: 4096
          x-field-uid: 5
        qps_per_peer:
          description: >-
            Number of QPs established between each communicating rank pair.
            Each QP uses a distinct UDP source port, producing a unique 5-tuple
            that hashes to a different ECMP path. Set to the number of parallel
            fabric paths available between ranks to fully utilize fabric bandwidth.
          type: integer
          format: uint32
          default: 1
          minimum: 1
          maximum: 65535
          x-field-uid: 6
        chunk_size_kb:
          description: >-
            RDMA WRITE message size in KB (RC mode only).
            Defines the granularity of each individual RDMA WRITE operation.
            The total data_size is divided into messages of this size; each
            message is sent as one RDMA WRITE and fragmented into ib_mtu-sized
            network packets internally.
            Small values (e.g. 64 KB) generate many short writes with frequent
            ACKs; large values (e.g. 2 MB) generate fewer but larger bursts.
            Omit to let the implementation auto-compute (equivalent to no limit).
          type: integer
          format: uint32
          default: 4194304
          minimum: 1
          maximum: 4194304
          x-field-uid: 7

    Ccl.Rocev2Policy.ConnectionType:
      description: >-
        Discriminated union for QP connection type, following the same pattern
        as Device.Rocev2.ConnectionType.
        reliable_connection (RC): ACK-based in-order delivery; per-QP rate
        control via DCQCN; used for Ring AllReduce.
        unreliable_datagram (UD): reserved placeholder; no parameters defined.
        Depends on OTG RoCEv2 (Device.Rocev2Peer) adding UD support first.
      type: object
      properties:
        choice:
          type: string
          default: reliable_connection
          x-field-uid: 1
          x-enum:
            reliable_connection:
              x-field-uid: 1
            unreliable_datagram:
              x-field-uid: 2
        reliable_connection:
          $ref: '#/components/schemas/Ccl.Rocev2Policy.ReliableConnection'
          x-field-uid: 2
        unreliable_datagram:
          $ref: '#/components/schemas/Ccl.Rocev2Policy.UnreliableDatagram'
          x-field-uid: 3

    Ccl.Rocev2Policy.ReliableConnection:
      description: >-
        Parameters for Reliable Connection (RC) QPs auto-generated by the CCL
        engine. Applies as a shared policy across all RC QPs in the communicator.
        Mirrors Device.Rocev2.QPParameters (source_qp_number, dscp, ecn,
        udp_source_port) but as a shared policy rather than a per-QP static
        configuration. All four fields are placed here following the same
        convention as Device.Rocev2.QPParameters, which also sits under
        reliable_connection.
        CNP/enable_ecn_cnp is intentionally absent: CNP generation is a per-port
        setting controlled via Rocev2.PerPortSettings.dcqcn_settings.enable_dcqcn.
      type: object
      properties:
        dscp:
          description: >-
            IP DSCP value applied to all auto-generated RC QP data packets.
            All ranks in the communicator use the same DSCP value to ensure
            consistent mapping to the DUT lossless priority queue.
            Typical value: 24 (CS3) for RoCEv2 traffic.
            Corresponds to Device.Rocev2.QPParameters.dscp, which sets DSCP
            for one individually-configured QP; here it is a shared policy.
          type: integer
          format: uint32
          default: 24
          minimum: 0
          maximum: 63
          x-field-uid: 1
        ecn:
          description: >-
            ECN codepoint in the IP header for all auto-generated RC QP data
            packets. ect_1 (01) or ect_0 (10) marks packets as ECN-capable,
            enabling DCQCN congestion signals from the DUT when its buffers fill.
            DCQCN is an RC-specific mechanism: the receiver detects CE-marked
            packets and sends CNP back to the sender QP to trigger rate reduction.
            Corresponds to Device.Rocev2.QPParameters.ecn.
          type: string
          default: ect_1
          x-field-uid: 2
          x-enum:
            non_ect:
              x-field-uid: 1
            ect_1:
              x-field-uid: 2
            ect_0:
              x-field-uid: 3
            ce:
              x-field-uid: 4
        start_qp_number:
          description: >-
            Starting QP number for the first auto-generated RC QP in this
            communicator. Subsequent QPs are allocated contiguously from this
            base. Defaults to 0 (implementation assigns the base).
            Mirrors Device.Rocev2.QPParameters.source_qp_number (per-QP);
            here it is the allocation base for all CCL-generated RC QPs.
          type: integer
          format: uint32
          default: 0
          minimum: 0
          x-field-uid: 3
        start_udp_src_port:
          description: >-
            Starting UDP source port for RC QP packets generated by this
            communicator. The well-known RoCEv2 destination port is 4791;
            the source port is flow-steered for ECMP hashing.
            Setting a fixed base allows reproducible 5-tuple hashing on the DUT.
            Mirrors Device.Rocev2.QPParameters.udp_source_port (per-QP);
            here it is the allocation base for all CCL-generated RC QPs.
          type: integer
          format: uint32
          default: 49152
          minimum: 1
          maximum: 65535
          x-field-uid: 4

    Ccl.Rocev2Policy.UnreliableDatagram:
      description: >-
        Parameters for Unreliable Datagram (UD) QPs auto-generated by the CCL
        engine. Reserved placeholder; no sub-fields defined at this time.
        Depends on OTG existing RoCEv2 API (Device.Rocev2Peer) adding UD mode
        support first. UD-specific parameters (O(N) QP topology, connectionless
        delivery semantics) will be defined in a future revision once the
        underlying OTG RoCEv2 UD capability is available.
      type: object
