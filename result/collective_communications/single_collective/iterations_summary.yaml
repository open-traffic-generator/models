components:
  schemas:
    CollectiveCommunications.SingleCollective.IterationsSummary.Metrics.Request:
      description: >-
        Request for iteration summary metrics. Each row summarizes the iterations per collective datasize.
      type: object
      properties:
        collective:
          description: >-
            Filter results by collective. An empty list returns all rows.
          type: array
          items:
            type: string
          x-field-uid: 1
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            If the list is empty then all columns will be returned.
          type: array
          items:
            type: string
            x-enum:
              data_size:
                x-field-uid: 1
              collective:
                x-field-uid: 2
              iterations:
                x-field-uid: 3
              min_cct:
                x-field-uid: 4
              avg_cct:
                x-field-uid: 5
              max_cct:
                x-field-uid: 6
              min_algo_bw:
                x-field-uid: 7
              avg_algo_bw:
                x-field-uid: 8
              max_algo_bw:
                x-field-uid: 9
              min_bus_bw:
                x-field-uid: 10
              avg_bus_bw:
                x-field-uid: 11
              max_bus_bw:
                x-field-uid: 12
              min_ideal:
                x-field-uid: 13
              avg_ideal:
                x-field-uid: 14
              max_ideal:
                x-field-uid: 15
              pfc_rx:
                x-field-uid: 16
              ecn_ce_rx:
                x-field-uid: 17
              frames_retx:
                x-field-uid: 18
              total_time:
                x-field-uid: 19
              duty_cycle:
                x-field-uid: 20
          x-field-uid: 2
    CollectiveCommunications.SingleCollective.IterationsSummary.Metric:
      description: >-
        One row of iteration summary metrics.
      type: object
      properties:
        data_size:
          description: >-
            Collective operation data size (in Bytes).
          type: integer
          format: uint64
          x-field-uid: 2
        collective:
          description: >-
            Collective operation name.
          type: string
          x-field-uid: 3
        iterations:
          description: >-
            Number of benchmark runs per data size.
          type: integer
          format: uint64
          x-field-uid: 4
        min_cct:
          description: >-
            Minimum collective time in milliseconds.
          type: number
          x-field-uid: 5
        avg_cct:
          description: >-
            Average collective time in milliseconds.
          type: number
          x-field-uid: 6
        max_cct:
          description: >-
            Maximum collective time in milliseconds.
          type: number
          x-field-uid: 7
        min_algo_bw:
          description: >-
            Minimum algorithm bandwidth (GB/s).
          type: number
          x-field-uid: 8
        avg_algo_bw:
          description: >-
            Average algorithm bandwidth (GB/s).
          type: number
          x-field-uid: 9
        max_algo_bw:
          description: >-
            Maximum algorithm bandwidth (GB/s).
          type: number
          x-field-uid: 10
        min_bus_bw:
          description: >-
            Minimum bus bandwidth (GB/s).
          type: number
          x-field-uid: 11
        avg_bus_bw:
          description: >-
            Average bus bandwidth (GB/s).
          type: number
          x-field-uid: 12
        max_bus_bw:
          description: >-
            Maximum bus bandwidth (GB/s).
          type: number
          x-field-uid: 13
        min_ideal:
          description: >-
            Minimum bus bandwidth divided by ideal goodput (as percentage).
          type: number
          x-field-uid: 14
        avg_ideal:
          description: >-
            Average bus bandwidth divided by ideal goodput (as percentage).
          type: number
          x-field-uid: 15
        max_ideal:
          description: >-
            Maximum bus bandwidth divided by ideal goodput (as percentage).
          type: number
          x-field-uid: 16
        pfc_rx:
          description: >-
            Number of Priority Flow Control frames received.
          type: integer
          format: uint64
          x-field-uid: 17
        ecn_ce_rx:
          description: >-
            Number of frames received with ECN congestion encountered.
          type: integer
          format: uint64
          x-field-uid: 18
        frames_retx:
          description: >-
            Frames Retransmitted count.
          type: integer
          format: uint64
          x-field-uid: 19
        total_time:
          description: >-
            Time to complete all iterations, in seconds.
          type: number
          x-field-uid: 20
        duty_cycle:
          description: >-
            Ratio of total execution time utilized for actual collective
            operation (as percentage).
          type: number
          x-field-uid: 21
