components:
  schemas:

    CollectiveCommunications.Infrastructure:
      description: >-
        The declaration of the system testbed
      type: object
      properties:
        choice:
          type: string
          x-enum:
            high_level:
              x-field-uid: 1
            low_level:
              x-field-uid: 2
          x-field-uid: 1
        high_level:
          $ref: '#/components/schemas/CollectiveCommunications.HighLevelInfrastructure'
          x-field-uid: 2
        low_level:
          $ref: '#/components/schemas/CollectiveCommunications.InfraGraph'
          x-field-uid: 3

    CollectiveCommunications.InfraGraph:
      description: >-
        A low-level graph of the testbed.
      type: object
      x-status:
        status: under_review
        information: >-
          Low-level infrastructure graph

    CollectiveCommunications.HighLevelInfrastructure:
      description: |-
        Infrastructure configuration comprising hosts and the network fabric.
      type: object
      properties:
        name:
          type: string
          description: |-
            Logical infrastructure name.
          x-field-uid: 1
        config:
          $ref: '#/components/schemas/CollectiveCommunications.InfrastructureConfig'
          description: |-
            The configuration for this high-level infrastructure.
          x-field-uid: 2

    CollectiveCommunications.InfrastructureConfig:
      description: >-
        Description of the system testbed: its hosts and the fabric that connects them.
      type: object
      required: [hosts, fabric]
      properties:
        hosts:
          $ref: '#/components/schemas/CollectiveCommunications.InfrastructureHosts'
          description: >-
            Host collection specification for the infrastructure.
          x-field-uid: 1
        fabric:
          $ref: '#/components/schemas/CollectiveCommunications.InfrastructureFabric'
          description: >-
            Fabric topology for the infrastructure.
          x-field-uid: 2

    CollectiveCommunications.InfrastructureHosts:
      description: >-
        Host collection specification.
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          description: >-
            Selects how the collection of hosts is described.
          x-field-uid: 1
          x-enum:
            uniform:
              description: >-
                A collection of identical hosts, described by a single host specification and a repeat count.
              x-field-uid: 1
        uniform:
          $ref: '#/components/schemas/CollectiveCommunications.InfrastructureUniformHostCollection'
          description: >-
            A collection of identical hosts, described by a single host specification and a repeat count.
          x-field-uid: 2

    CollectiveCommunications.InfrastructureUniformHostCollection:
      description: >-
        A collection of identical hosts, described by a single host specification and a repeat count.
      type: object
      required: [host]
      properties:
        count:
          type: integer
          format: uint32
          default: 4
          minimum: 1
          maximum: 8192
          description: >-
            Number of hosts in the collection.
          x-field-uid: 1
        host:
          $ref: '#/components/schemas/CollectiveCommunications.InfrastructureHostSpecification'
          description: >-
            A host specification that is instantiated multiple times to form the collection of hosts.
          x-field-uid: 2

    CollectiveCommunications.InfrastructureHostSpecification:
      description: >-
        High-level host specification.
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          description: >-
            Selects the type of host that the specification describes.
          x-field-uid: 1
          x-enum:
            generic:
              description: >-
                A generic host with a 1:1 ratio of NICs to XPUs.
              x-field-uid: 1
        generic:
          $ref: '#/components/schemas/CollectiveCommunications.GenericHost'
          description: >-
            Generic host configuration.
          x-field-uid: 2

    CollectiveCommunications.GenericHost:
      description: >-
        A generic host with a 1:1 ratio of NICs to XPUs.
      type: object
      properties:
        name:
          type: string
          description: >-
            The name of this host instance.
          x-field-uid: 1
        xpu_count:
          type: integer
          format: uint32
          default: 1
          minimum: 1
          description: >-
            Number of XPUs in the host.
          x-field-uid: 2
        xpu_interconnect_bandwidth_gbps:
          type: integer
          format: uint32
          default: 1600
          minimum: 0
          description: >-
            The XPU interconnect bandwidth, in Gbps. If 0, the XPU interconnect
            will be disabled and XPUs within the same host will only communicate
            via the network.
          x-field-uid: 3

    CollectiveCommunications.InfrastructureFabric:
      description: >-
        Describes the overall fabric topology.
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          description: >-
            Selects the fabric topology connecting the hosts.
          x-field-uid: 1
          x-enum:
            blackbox:
              description: >-
                A fabric whose internal topology is not modeled.
              x-field-uid: 1
        blackbox:
          $ref: '#/components/schemas/CollectiveCommunications.BlackboxFabric'
          description: >-
            Blackbox fabric configuration.
          x-field-uid: 2

    CollectiveCommunications.BlackboxFabric:
      description: >-
        A fabric where the internal topology is not modeled.
      type: object
      properties:
        name:
          type: string
          description: >-
            Fabric name.
          x-field-uid: 1
